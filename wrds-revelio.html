salary", "type": "double precision", "definition_en": "Predicted salary", "definition_verified_zh": "該月群組內的模型年薪總和，單位為 USD／年；不是月薪或平均薪資。按官方口徑，salary ÷ count 才是群組平均年薪。", "definition_verified_en": "Sum of modeled annual salaries for the group in that month, in USD/year; neither monthly pay nor an average. The documented group average is salary divided by count.", "analysis_use": {"dv": "conditional", "iv": "conditional", "control": "conditional", "note": "先核對總和／平均、聚合單位、模型性質、幣別與權重；語義未確認前不直接比較或作控制，須保留時間順序。", "dv_reason": "人力薪酬彙總非營收／市場績效；有行銷連結才作間接 DV。", "iv_reason": "可作人力成本／資源代理，不能僅因公司層級就視為 B2B IV。"}}, {"name": "duration", "type": "double precision", "definition_en": "Employee tenure", "definition_verified_zh": "群組員工的平均任期，單位為年；不是任期總和，也不是單一員工的完整任期。", "definition_verified_en": "Average employee tenure within the group, in years; neither a sum of tenure nor one employee's complete tenure.", "analysis_use": {"dv": "conditional", "iv": "conditional", "control": "conditional", "note": "先核對平均／總和、單位與權重，不能當單人的完整任期；控制須在結果前。", "dv_reason": "任期彙總不是客戶關係長度；有行銷連結才作間接 DV。", "iv_reason": "通常作人力經驗背景代理，核心 IV 須另驗證構念。"}}, {"name": "remote_suitability", "type": "double precision", "definition_en": "Remote Suitability Proportion", "definition_verified_zh": "群組的遠距適合度比例欄，不是實際遠距工作占比。現行註解未說明群組聚合與加權公式，也未列正式上下界或特殊值。", "definition_verified_en": "A group-level remote-suitability proportion, not an observed remote-work share. The current comment does not specify aggregation, weighting, formal bounds or special values.", "analysis_use": {"dv": "not_direct", "iv": "conditional", "control": "conditional", "note": "核對生成方法、聚合層級、時序及與職務變數的重疊；不是實際遠距工作比例。", "dv_reason": "職務遠距適合度不是實際遠距行為或行銷結果。", "iv_reason": "通常作工作特徵／異質性代理，核心 IV 須另有構念連結。"}}, {"name": "datemonth", "type": "date", "definition_en": "Year and Month", "definition_verified_zh": "月度觀察期間；現表以 date 儲存，日部分不是人員異動的實際日期。", "definition_verified_en": "Monthly observation period stored as a date; its day component is not an actual employee-transition date.", "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "可建構期間、季節、事件窗口與時間控制；外接結果時須區分日曆與會計期間。", "dv_reason": "時間索引本身不是行銷結果。", "iv_reason": "日期本身不定義行銷處置；事件須有額外實質依據。"}}]}], "papers": [{"id": "mojir_anbil_2025_professional_ties", "title": "The Value of Professional Ties in B2B Markets", "authors": "Navid Mojir; Sriya Anbil", "year": 2025, "journal": "Marketing Science", "doi": "10.1287/mksc.2022.0320", "status": "已核查：相似資料類型", "relationship": "LinkedIn 職涯資料的 B2B 先例；不同來源，未確認使用 Revelio，更不是本機 workforce 擷取樣本。", "question": "買賣雙方決策者的過去僱用關係，如何影響 B2B 價格與供應可靠性？", "design": "將 repo 交易、財務揭露中的決策者身分與 LinkedIn 職涯史串接；作者以決策者進出職位的變動識別關係效果。識別假設仍需精讀全文。", "replication_scope": "本機公司年度 workforce 資料沒有個人職涯連結或 repo 交易價格，適合作研究設計比較；目前不能重現本文。", "dataset_ids": ["wrds-revelio"], "url": "https://doi.org/10.1287/mksc.2022.0320", "source_url": "https://pubsonline.informs.org/doi/10.1287/mksc.2022.0320"}, {"id": "baker_etal_2024_diversity_washing", "title": "Diversity Washing", "authors": "Andrew C. Baker; David F. Larcker; Charles G. McClure; Durgesh Saraph; Edward M. Watts", "year": 2024, "journal": "Journal of Accounting Research", "doi": "10.1111/1475-679X.12542", "status": "已核查：同供應商／資料產品", "relationship": "使用 Revelio Workforce Dynamics 的公司人力組成；與本機資料同供應商及產品家族，樣本、版本與分組欄位不同。", "question": "企業公開的多元承諾，與實際人力組成有多大落差？此落差與外部評價及後續結果有何關聯？", "design": "結合人力組成與 SEC 文件文字，建構公司年度落差指標並檢驗外部效度；作者將主要證據定位為描述性研究。", "replication_scope": "本機 workforce 擷取檔沒有多元組成或 SEC 揭露文字。可練習構念、測量與效度分析；重現研究需要追加資料。", "dataset_ids": ["wrds-revelio"], "url": "https://doi.org/10.1111/1475-679X.12542", "source_url": "https://andrewchbaker.github.io/research/articles/diversity_washing/diversity_washing.pdf"}, {"id": "li_etal_2022_employee_turnover", "title": "Employee Turnover and Firm Performance: Large-Sample Archival Evidence", "authors": "Qin Li; Ben Lourie; Alexander Nekrasov; Terry Shevlin", "year": 2022, "journal": "Management Science", "doi": "10.1287/mnsc.2021.4199", "status": "供應商確認；全文設計待精讀", "relationship": "Revelio 官方直接確認供應資料；同供應商，尚未核對原文擷取版本、樣本與變數建構。", "question": "員工離職率是否包含關於企業下一季績效與不確定性的資訊？", "design": "期刊摘要描述以線上履歷建構離職面板，檢視與未來 ROA、營收成長及股價報酬的關聯。不能直接解讀為離職的因果效果。", "replication_scope": "本機公司年度 stock/flow 可用來練習離職率分母與時間對齊；原文是季度績效設計，尚不具完整重現條件。", "dataset_ids": ["wrds-revelio"], "url": "https://doi.org/10.1287/mnsc.2021.4199", "source_url": "https://www.reveliolabs.com/news/business/employee-turnover-and-firm-performance"}, {"id": "he_mostrom_sufi_customer_capital", "title": "Investing in Customer Capital", "authors": "Bianca He; Lauren I. Mostrom; Amir Sufi", "year": 2024, "journal": "NBER Working Paper 33171", "doi": "10.3386/w33171", "status": "已核查：同供應商；作者稿", "relationship": "使用 Revelio 公司年度業務行銷薪資資料。與本機資料同供應商，但目前本機擷取檔只有人數與流量，沒有薪資總額。", "question": "如何衡量顧客資本投資？不同產業的業務與行銷投入如何對應無形資本價值？", "design": "以財報業務行銷費用、Revelio 薪資與 SEC 文字建立互相對照的測量，分析跨產業差異；主要適合練習構念操作化與測量比較。", "replication_scope": "先練習區分人力占比、薪資投入與顧客資本構念。若要重現薪資／營收測量，需要薪資資料、會計期間與公司範圍對齊。", "publication_note": "NBER 2024 初稿；本輪核對作者網站所連的 202605 檔案。作者出版清單列 Journal of Finance forthcoming 2026，未指定卷期或期刊 DOI。", "dataset_ids": ["wrds-revelio"], "url": "https://www.nber.org/papers/w33171", "source_url": "https://faculty.chicagobooth.edu/-/media/faculty/amir-sufi/research/he_mostrom_sufi_customercapital_202605.pdf"}], "i18n": {"en": {"strings": {"職涯、人力、職缺與員工評論資料": "Career, workforce, job posting and employee review data", "由 Revelio Labs 整理 LinkedIn 等公開來源的全球職涯、招聘與員工評論資料，並提供 2008-01 至 2026-08 的公司月度人力動態資料。": "Global career, recruitment and employee review data compiled by Revelio Labs from public sources including LinkedIn, with monthly company workforce dynamics data from 2008-01 to 2026-08.", "職涯、人力、招聘廣告與員工評論資料；字典提供各表觀察單位、欄位定義、真實例子與行銷／B2B 的 DV／IV／控制變數適用性。": "Career, workforce, recruitment advertisement and employee review data; the dictionary provides each table's observation unit, field definitions, real examples and DV / IV / control suitability for marketing and B2B research.", "公司對照表": "Company crosswalk", "一筆公司識別對照紀錄；RCID 與外部代碼的唯一性及關聯基數須另行檢查": "One company identifier crosswalk record; RCID and external code uniqueness and join cardinality require separate checks", "公司名稱、Revelio RCID、外部識別碼、總部、產業與母公司資訊的對照表。不可預設 RCID、GVKEY 或其對應關係是一對一。": "A crosswalk of company names, Revelio RCIDs, external identifiers, headquarters, industries and parent companies. Do not assume RCID, GVKEY or their mappings are one-to-one.", "月份表": "Months", "一個月份": "One month", "2008-01 到 2029-12 的月份清單與下一個月，方便把起訖日期展開成月度面板。": "A list of months from 2008-01 to 2029-12 and their following months, supporting expansion of start and end dates into monthly panels.", "地區與國家對照": "Region and country crosswalk", "一個國家": "One country", "Revelio 的地區（region）與國家的對應。": "Revelio's mapping between regions and countries.", "學校對照表": "School crosswalk", "一所學校（一個 RSID）": "One school (one RSID)", "Revelio 學校代碼 RSID 的名稱、WHED 代碼、地點與母機構；教育經歷表以 rsid 串到這裡。WRDS 標示更新日 2026-09-21。": "Names, WHED codes, locations and parent institutions for Revelio school identifiers (RSIDs); education records link here through rsid. WRDS lists an update date of 2026-09-21.", "個人職位（標準化）": "Individual positions (standardized)", "某個人的一段職位": "One position spell for an individual", "LinkedIn 等公開履歷中的每一段工作經歷，已對照公司（rcid）、職務分類、職級、地點，並附 Revelio 推估的薪資與抽樣權重。這是人員流動、職涯與公司人力研究的主表。原文欄位（公司原文、職稱、自述）在 individual_positions_raw，以 position_id 串接。": "Each work experience listed in public profiles such as LinkedIn, mapped to company (rcid), role classification, seniority and location, with Revelio-estimated pay and sampling weights. This is the main table for employee mobility, career and company workforce research. Original text fields (company name, job title and self-description) are in individual_positions_raw, linked by position_id.", "個人職位（原文）": "Individual positions (original text)", "職位的原文欄位：公司名稱、地點、職稱與職位自述，都是本人在個人頁上填寫的文字。以 position_id 串回 individual_positions。WRDS 標示更新日 2026-09-22。": "Original text fields for positions: company name, location, job title and position description, all entered by individuals on their profiles. Links back to individual_positions through position_id. WRDS lists an update date of 2026-09-22.", "職務分類對照（第 2 版）": "Role classification crosswalk (version 2)", "一個 k=1500 的第 2 版職務類別": "One version 2 role category at k=1500", "第 2 版職務分類的階層：從約 1,500 類往上合併到 1,000、500、300、150、50 類與 7 大類。以 role_k1500_v2 串接。": "The version 2 role classification hierarchy: approximately 1,500 categories aggregated into 1,000, 500, 300, 150, 50 and 7 broad categories. Link through role_k1500_v2.", "職務分類對照（第 3 版）": "Role classification crosswalk (version 3)", "一個最細層（k=17000）的第 3 版職務類別": "One finest-level (k=17000) version 3 role category", "第 3 版職務分類的完整階層：從約 17,000 個細類往上合併到 10,000、5,000、1,500、1,000、500、150、50 與 10 大類，並對應 O*NET 職業。以 role_k17000_v3 串接。": "The full version 3 role classification hierarchy: approximately 17,000 detailed categories aggregated into 10,000, 5,000, 1,500, 1,000, 500, 150, 50 and 10 broad categories, with O*NET occupation mappings. Link through role_k17000_v3.", "個人基本資料（標準化）": "Individual profiles (standardized)", "一個人（一份公開個人頁）": "One individual (one public profile)", "每個人的姓名、LinkedIn 個人頁網址、所在地、最高學歷、連結數，以及 Revelio 由姓名與地點推估的性別與族裔機率、聲望分數。這是可辨識個人的資料，使用前須倫理審查。": "Each individual's name, LinkedIn profile URL, location, highest education level and connection count, plus Revelio's gender and ethnicity probabilities inferred from names and locations, and prestige scores. These data can identify individuals and require ethics review before use.", "教育經歷（標準化）": "Education history (standardized)", "某個人的一筆教育紀錄": "One education record for an individual", "每筆教育紀錄對照後的學校（rsid）、學位、領域與起訖日期。原文在 individual_user_education_raw。": "The mapped school (rsid), degree, field and start/end dates for each education record. Original text is in individual_user_education_raw.", "教育經歷（原文）": "Education history (original text)", "教育紀錄的原文：學校、學位、領域與描述，都是本人填寫的文字。以 user_id 加 education_number 串回標準化表。WRDS 標示更新日 2026-09-22。": "Original text for education records: school, degree, field and description, all entered by the individual. Links back to the standardized table using user_id and education_number. WRDS lists an update date of 2026-09-22.", "個人頁原文": "Original profile text", "一個人": "One individual", "個人頁的標題（headline）與自我介紹全文。WRDS 標示更新日 2026-09-22。": "The profile headline and full self-introduction text. WRDS lists an update date of 2026-09-22.", "技能分類對照": "Skill classification crosswalk", "一個最細層（k=35000）的技能類別": "One finest-level (k=35000) skill category", "技能分類的階層：從約 35,000 個細類往上合併到 15,000、5,000、1,500、500、150、50 與 15 大類。以 skill_k35000 串接。": "The skill classification hierarchy: approximately 35,000 detailed categories aggregated into 15,000, 5,000, 1,500, 500, 150, 50 and 15 broad categories. Link through skill_k35000.", "個人技能": "Individual skills", "某個人的一項技能": "One skill for an individual", "個人頁上列出的每一項技能，附英文翻譯、首次出現日期、來源（本人填報或模型推估）與對照後的細分類。筆數約 118 億，是 Revelio 最大的表。": "Each skill listed on a profile, with an English translation, first appearance date, source (self-reported or model-inferred) and mapped detailed category. At approximately 11.8 billion rows, this is Revelio's largest table.", "職缺（COSMOS，標準化）": "Job postings (COSMOS, standardized)", "一則職缺": "One job posting", "Revelio 把公司官網、LinkedIn、Indeed、各地求職網站的職缺去重後整合成 COSMOS。每則職缺有公司、職務分類、地點、職級、薪資、刊登與下架日期、遠距類型、預期雇用人數與各來源旗標。職缺文字在 postings_cosmos_raw，以 job_id 串接。": "Revelio deduplicates and integrates job postings from company websites, LinkedIn, Indeed and local job boards into COSMOS. Each posting includes the company, role classification, location, seniority, pay, posting and removal dates, remote-work type, expected hires and source flags. Posting text is in postings_cosmos_raw, linked by job_id.", "職缺原文（COSMOS）": "Job posting text (COSMOS)", "職缺的原文欄位：職稱、翻譯後職稱、地點與職缺描述全文。這張表只在 WRDS 的 PostgreSQL 上（網頁查詢沒有），分成 10 個分割表（p0 到 p9）；本文的樣本來自 p0。": "Original text fields for job postings: job title, translated title, location and full job description. This table is available only through WRDS PostgreSQL (not the web query interface) and has 10 partitions (p0 to p9); the sample used here comes from p0.", "觀察單位待核查": "Observation unit pending verification", "待補中文說明；WRDS 標籤：未提供": "Chinese description pending; WRDS label: not provided", "職缺職務分類對照（第 2 版）": "Job posting role crosswalk (version 2)", "職缺用的第 2 版職務分類階層（1,500、150、50 類與 7 大類）。": "The version 2 role classification hierarchy for job postings (1,500, 150, 50 and 7 broad categories).", "職缺職務分類對照（第 3 版）": "Job posting role crosswalk (version 3)", "職缺用的第 3 版職務分類階層，結構與 individual_role_lookup_v3 相同。": "The version 3 role classification hierarchy for job postings, with the same structure as individual_role_lookup_v3.", "WARN 裁員通知": "WARN layoff notices", "一則裁員通知": "One layoff notice", "美國各州依 WARN 法案公布的大量裁員與關廠通知：公司、地點、通知日、裁員日、類型與人數，已對照到 rcid。WRDS 標示更新日 2026-09-23。": "Mass layoff and plant closure notices published by US states under the WARN Act: company, location, notice date, layoff date, type and affected headcount, mapped to rcid. WRDS lists an update date of 2026-09-23.", "員工評論": "Employee reviews", "一則員工評論": "One employee review", "員工對公司的匿名評論（WRDS 標籤註明公司代碼來自 Glassdoor）：評分、評論者職稱與地點、在職狀態，以及標題、優點、缺點、給管理層建議的全文。": "Anonymous employee reviews of companies (WRDS labels identify Glassdoor as the source of company codes): ratings, reviewer job titles and locations, employment status, and full text for headlines, pros, cons and advice to management.", "評論職務分類對照": "Review role crosswalk", "一個最細層（k=17000）的職務類別": "One finest-level (k=17000) role category", "員工評論用的職務分類階層（17,000 到 10 類）與 O*NET 對應。以 role_k17000 串接。WRDS 標示更新日 2026-09-23。": "The role classification hierarchy for employee reviews (17,000 to 10 categories), with O*NET mappings. Link through role_k17000. WRDS lists an update date of 2026-09-23.", "公司情緒分數": "Company sentiment scores", "一家公司": "One company", "Revelio 用 NLP 模型從評論文字算出的公司層級主題情緒分數（管理、薪酬、文化等 13 個主題）。依 Revelio 說明，分數經標準化，單位是距平均值幾個標準差。": "Company-level thematic sentiment scores calculated by Revelio's NLP models from review text (13 themes including management, compensation and culture). According to Revelio, scores are standardized and expressed in standard deviations from the mean.", "員工流動（Workforce Dynamics）": "Employee mobility (Workforce Dynamics)", "一家公司 × 國家 × 州 × 都會區 × 職級 × 職務大類 × 月份": "One company × country × state × metropolitan area × seniority × broad role category × month", "公司層級的月度人力統計：在職人數、流入、流出（含與不含公司內部移動），並分成調整後與未調整的版本，另有薪資、平均年資與可遠距比例。不含個人資料，是做公司層級人力研究的主表。一格切得很細（公司 × 國家 × 州 × 都會區 × 職級 × 職務大類 × 月），所以多數格的人數小於 1；研究時通常先加總到公司 × 月，再算招募率、離職率或平均薪資（平均薪資 = salary 加總 ÷ count 加總）。": "Monthly company workforce statistics: headcount, inflows and outflows (including and excluding internal transfers), with adjusted and unadjusted versions, plus pay, average tenure and the remote-work share. This is the main table for company-level workforce research and contains no individual records. Cells are very granular (company × country × state × metropolitan area × seniority × broad role category × month), so most cell counts are below 1. Research usually first aggregates to company × month, then calculates hiring rates, departure rates or average pay (average pay = sum of salary ÷ sum of count).", "已核查：相似資料類型": "Verified: similar data type", "LinkedIn 職涯資料的 B2B 先例；不同來源，未確認使用 Revelio，更不是本機 workforce 擷取樣本。": "A B2B precedent using LinkedIn career data; the source differs, Revelio use is unconfirmed, and it is not the local workforce extract.", "買賣雙方決策者的過去僱用關係，如何影響 B2B 價格與供應可靠性？": "How do prior employment ties between buyer and seller decision-makers affect B2B prices and supply reliability?", "將 repo 交易、財務揭露中的決策者身分與 LinkedIn 職涯史串接；作者以決策者進出職位的變動識別關係效果。識別假設仍需精讀全文。": "Links repo transactions, decision-maker identities from financial disclosures and LinkedIn career histories; the authors use changes as decision-makers enter and leave positions to identify relationship effects. The identification assumptions still require a close reading of the full text.", "本機公司年度 workforce 資料沒有個人職涯連結或 repo 交易價格，適合作研究設計比較；目前不能重現本文。": "The local company-year workforce data contain neither individual career ties nor repo transaction prices. They support research-design comparisons, but cannot currently replicate this paper.", "已核查：同供應商／資料產品": "Verified: same vendor / data product", "使用 Revelio Workforce Dynamics 的公司人力組成；與本機資料同供應商及產品家族，樣本、版本與分組欄位不同。": "Uses company workforce composition from Revelio Workforce Dynamics. It shares the local data's vendor and product family, but the sample, version and grouping fields differ.", "企業公開的多元承諾，與實際人力組成有多大落差？此落差與外部評價及後續結果有何關聯？": "How large is the gap between companies' public diversity commitments and their actual workforce composition? How is this gap associated with external evaluations and subsequent outcomes?", "結合人力組成與 SEC 文件文字，建構公司年度落差指標並檢驗外部效度；作者將主要證據定位為描述性研究。": "Combines workforce composition with SEC filing text to construct a company-year gap measure and examine external validity; the authors position the main evidence as descriptive research.", "本機 workforce 擷取檔沒有多元組成或 SEC 揭露文字。可練習構念、測量與效度分析；重現研究需要追加資料。": "The local workforce extract lacks diversity composition and SEC disclosure text. It can support practice with constructs, measurement and validity analysis; replication requires additional data.", "供應商確認；全文設計待精讀": "Vendor confirmed; full-text design review pending", "Revelio 官方直接確認供應資料；同供應商，尚未核對原文擷取版本、樣本與變數建構。": "Revelio directly confirms supplying the data. The vendor is the same, but the paper's extract version, sample and variable construction have not yet been checked.", "員工離職率是否包含關於企業下一季績效與不確定性的資訊？": "Does employee turnover contain information about firms' next-quarter performance and uncertainty?", "期刊摘要描述以線上履歷建構離職面板，檢視與未來 ROA、營收成長及股價報酬的關聯。不能直接解讀為離職的因果效果。": "The journal abstract describes constructing a turnover panel from online resumes and examining associations with future ROA, revenue growth and stock returns. These cannot be directly interpreted as causal effects of turnover.", "本機公司年度 stock/flow 可用來練習離職率分母與時間對齊；原文是季度績效設計，尚不具完整重現條件。": "The local company-year stocks/flows support practice with turnover-rate denominators and temporal alignment. The paper uses quarterly performance, so the requirements for full replication are not yet met.", "已核查：同供應商；作者稿": "Verified: same vendor; author manuscript", "使用 Revelio 公司年度業務行銷薪資資料。與本機資料同供應商，但目前本機擷取檔只有人數與流量，沒有薪資總額。": "Uses Revelio company-year sales and marketing payroll data. The vendor is the same, but the current local extract contains only headcounts and flows, not payroll totals.", "如何衡量顧客資本投資？不同產業的業務與行銷投入如何對應無形資本價值？": "How can investment in customer capital be measured? How do sales and marketing inputs across industries relate to intangible capital value?", "以財報業務行銷費用、Revelio 薪資與 SEC 文字建立互相對照的測量，分析跨產業差異；主要適合練習構念操作化與測量比較。": "Builds comparable measures from financial-statement sales and marketing expenses, Revelio payroll and SEC text to analyze cross-industry differences; particularly useful for practicing construct operationalization and measurement comparisons.", "NBER 2024 初稿；本輪核對作者網站所連的 202605 檔案。作者出版清單列 Journal of Finance forthcoming 2026，未指定卷期或期刊 DOI。": "Initial NBER draft in 2024; this review checked the 202605 file linked from the author's website. The author's publication list states Journal of Finance forthcoming 2026 without a volume, issue or journal DOI.", "先練習區分人力占比、薪資投入與顧客資本構念。若要重現薪資／營收測量，需要薪資資料、會計期間與公司範圍對齊。": "First practice distinguishing workforce shares, payroll inputs and the customer-capital construct. Replicating payroll / revenue measures requires payroll data and alignment of accounting periods and company boundaries.", "Compustat Segment 客戶—供應商關係與客戶銷售額": "Compustat Segment customer–supplier relationships and sales to customers", "以公司識別串接客戶—供應商關係、客戶銷售額及外部財務資料。": "Use company identifiers to link customer–supplier relationships, sales to customers and external financial data.", "WRDS 提供的 FactSet Revere 企業供應、客戶與合作關係預覽；本機資料的關係版本起始日涵蓋 2003-04-03 至 2015-05-11。": "A WRDS preview of FactSet Revere company supplier, customer and partnership relationships; relationship-version start dates in the local data span 2003-04-03 to 2015-05-11.", "WRDS 提供的 InfraClear 基礎建設合約、當事人角色、專案與條款抽取預覽；本機合約簽署日期涵蓋 1965-02-02 至 2025-03-24。": "A WRDS preview of InfraClear infrastructure contracts, party roles, projects and extracted clauses; contract signing dates in the local data span 1965-02-02 to 2025-03-24.", "WRDS 提供的 RoyaltyStat 授權合約、權利金與交易條件預覽；本機合約生效日期涵蓋 1997-05-28 至 2016-07-01。": "A WRDS preview of RoyaltyStat licensing agreements, royalties and transaction terms; agreement effective dates in the local data span 1997-05-28 to 2016-07-01.", "由 WRDS 串接 Compustat Segment 的客戶揭露與公司識別資料，已核對主表涵蓋 1976-06-30 至 2026-07-31 的供應商—客戶關係與客戶銷售資訊。": "WRDS links Compustat Segment customer disclosures with company identifiers; the verified main table covers supplier-customer relationships and sales-to-customer information from 1976-06-30 to 2026-07-31.", "串接鍵本身不測量行銷成效；外接結果須另驗證行銷關聯。": "The linkage key itself does not measure marketing performance; externally linked outcomes require separate validation of their marketing relevance.", "公司鍵及母子關係不等於 B2B 契約條款／治理安排。": "Company keys and parent–subsidiary relationships do not represent B2B contract terms or governance arrangements.", "可建構公司分組／固定效果；先核對公司邊界、期間與串接基數，不把 ID 大小當數值測量。": "Can be used to define company groups or fixed effects; first verify company boundaries, periods and join cardinality. Do not treat the magnitude of an ID as a numerical measure.", "公司／學校名稱不是行銷結果或品牌認知測量。": "Company or school names are not measures of marketing outcomes or brand perceptions.", "名稱本身不測量實質解釋構念或 B2B 治理。": "The name itself does not measure a substantive explanatory construct or B2B governance.", "供辨識與 mapping，宜對照穩定 ID；可作分組／固定效果，外接指標須另驗證構念、期間與串接基數。": "Used for identification and mapping, preferably against a stable ID; can define groups or fixed effects. Externally linked indicators require separate validation of constructs, periods and join cardinality.", "識別碼不測量實質解釋構念，可供串接／分組。": "Identifiers do not measure substantive explanatory constructs; they can be used for linkage or grouping.", "外部識別／實體對照用；類別控制或 mapping 須核對實體層級、期間與串接基數。": "Used for external identification or entity matching; categorical controls or mapping require verification of entity level, periods and join cardinality.", "成立年／公司年齡不是行銷績效。": "Founding year or company age is not marketing performance.", "可作公司背景／異質性代理，但不測量契約／治理。": "Can serve as a proxy for company background or heterogeneity, but does not measure contracts or governance.", "依觀察年建構公司年齡／世代；核對缺失、前身與公司邊界，控制須對應觀察期間。": "Construct company age or cohorts relative to the observation year; check missingness, predecessor entities and company boundaries. Controls must correspond to the observation period.", "產業／市場分類通常是公司背景，不是行銷結果。": "Industry or market classifications usually describe company background, rather than marketing outcomes.", "公司層級不保證 B2B 意義；分類不測量契約／治理。": "Company-level measurement does not guarantee B2B relevance; classifications do not measure contracts or governance.", "可編碼背景／異質性／控制；代碼非連續值，須核對分類口徑與測量時序。": "Can be encoded as background, heterogeneity or control variables; codes are not continuous values. Verify classification conventions and measurement timing.", "姓名、網址或電話不測量行銷結果。": "Names, URLs and telephone numbers do not measure marketing outcomes.", "識別資訊不測量實質解釋構念。": "Identifying information does not measure substantive explanatory constructs.", "供辨識、來源核對與 mapping；LinkedIn 網址不代表已取得個人貼文或廣告資料。": "Used for identification, source verification and mapping; a LinkedIn URL does not mean that personal posts or advertising data have been obtained.", "可接 SEC 財務／揭露資料，但本欄沒有績效值；核對法人範圍、串接基數與日曆／會計期間。": "Can link to SEC financial or disclosure data, but this column contains no performance values; verify legal-entity scope, join cardinality, and calendar versus fiscal periods.", "可接 Compustat 財報結果，但本欄沒有績效值；合併前檢查時間、缺失、一對多與日曆／會計期間。": "Can link to Compustat financial-statement outcomes, but this column contains no performance values; before merging, check timing, missingness, one-to-many relationships, and calendar versus fiscal periods.", "地理位置通常是背景／異質性，不是行銷結果。": "Geographic location usually describes background or heterogeneity, rather than marketing outcomes.", "編碼或外接地區特徵後仍須驗證核心 IV；公司所在地不等於市場通路。": "A core IV still requires validation after coding or linking regional characteristics; company location does not represent a market channel.", "核對實際地點、時點與分組層級；控制不能使用結果後位置。": "Verify the actual location, timing and grouping level; controls must not use locations measured after the outcome.", "公司簡介／標語不是行銷成效。": "Company descriptions or slogans are not marketing performance.", "可編碼公司呈現代理，但不是已觀察到的 B2B 契約／治理。": "Can be coded as proxies for company presentation, but are not observed B2B contracts or governance.", "須驗證文本指標的行銷／B2B 構念效度，保留來源、語言、快照與控制時序。": "Validate the marketing or B2B construct validity of text-based indicators, and retain the source, language, snapshot and timing of controls.", "時間索引本身不是行銷結果。": "A time index itself is not a marketing outcome.", "日期本身不定義行銷處置；事件須有額外實質依據。": "A date itself does not define a marketing treatment; events require additional substantive evidence.", "可建構期間、季節、事件窗口與時間控制；外接結果時須區分日曆與會計期間。": "Can define periods, seasonality, event windows and time controls; distinguish calendar from fiscal periods when linking external outcomes.", "地理對照表不提供行銷結果。": "A geographic crosswalk does not provide marketing outcomes.", "對照表屬性須先串回觀察資料，才可建構背景變數。": "Crosswalk attributes must first be linked back to the observational data before background variables can be constructed.", "可建構地區背景／控制；不能把對照表列當成個人或公司事件。": "Can be used to construct regional background or control variables; do not treat crosswalk rows as individual or company events.", "可建構群組／固定效果；先確認紀錄鍵的層級、重複與串接基數，不把 ID 大小當數值測量。": "Can define groups or fixed effects; first verify the level of the record key, duplicates and join cardinality. Do not treat the magnitude of an ID as a numerical measure.", "任期／轉職僅在行銷機制明確時作間接 DV。": "Tenure or job transitions can serve as indirect DVs only when the marketing mechanism is explicit.", "職涯事件／經驗代理須另界定構念，不能假定外生。": "Career-event or experience proxies require a separately defined construct and cannot be assumed exogenous.", "不提供面試／offer 數；缺失 enddate 不保證仍在職，須處理精度與設限，控制須在結果前測量。": "Does not provide interview or offer counts; a missing enddate does not guarantee continued employment. Address precision and censoring, and measure controls before the outcome.", "職務分類通常是背景，不是行銷結果。": "Job classifications usually describe background, rather than marketing outcomes.", "可編碼角色／人力組成代理，不得由職稱直接推定契約／治理。": "Can be coded as proxies for roles or workforce composition; do not infer contracts or governance directly from job titles.", "核心 IV 須驗證構念；分類碼非連續值，避免處置後控制。": "A core IV requires construct validation; classification codes are not continuous values. Avoid post-treatment controls.", "職務遠距適合度不是實際遠距行為或行銷結果。": "A job's suitability for remote work is not actual remote-work behavior or a marketing outcome.", "通常作工作特徵／異質性代理，核心 IV 須另有構念連結。": "Usually serves as a proxy for job characteristics or heterogeneity; a core IV requires a separate construct linkage.", "核對生成方法、聚合層級、時序及與職務變數的重疊；不是實際遠距工作比例。": "Check the generation method, aggregation level, timing and overlap with job variables; this is not the actual share of remote work.", "抽樣權重不是行銷結果。": "Sampling weights are not marketing outcomes.", "權重不是實質解釋構念或一般控制變數。": "Weights are neither substantive explanatory constructs nor ordinary control variables.", "用於加權估計／代表性調整，須保留適用母體與加權口徑。": "Used for weighted estimation or representativeness adjustment; retain the target population and weighting conventions.", "薪酬是職涯結果；有明確行銷連結才可作間接 DV，非直接市場績效。": "Compensation is a career outcome; it can serve as an indirect DV only with an explicit marketing connection, and is not direct market performance.", "薪酬可作資源／誘因代理，須驗證構念，非自動成立的行銷 IV。": "Compensation can proxy for resources or incentives, subject to construct validation; it is not automatically a valid marketing IV.", "模型推估、非實領值；若 X 與薪資模型輸入重疊，關係可能由模型帶入。核對幣別、期間，控制須確認時序。": "Model-estimated, not actual compensation received; if X overlaps with inputs to the salary model, the relationship may be introduced by the model. Check currency and period, and verify the timing of controls.", "推估職級僅在行銷機制明確時作職涯間接 DV。": "Estimated seniority can serve as an indirect career DV only when the marketing mechanism is explicit.", "通常作經驗背景代理，核心行銷 IV 須另驗證構念。": "Usually serves as a proxy for experience background; a core marketing IV requires separate construct validation.", "按有序類別編碼，不能假定級距相等；避免處置後控制與模型輸入重疊。": "Encode as ordered categories without assuming equal intervals; avoid post-treatment controls and overlap with model inputs.", "履歷職位排序不測量行銷結果。": "The ordering of positions on a resume does not measure marketing outcomes.", "排序本身不是年資、實際工作次數或解釋構念。": "The ordering itself is not seniority, the actual number of jobs held or an explanatory construct.", "主要供跨職位整理／品質檢查；若作排序控制須核對重疊任職與缺漏。": "Primarily used to organize positions across records or check quality; if used as an ordering control, check overlapping employment and omissions.", "履歷職稱／職務說明不是行銷成效。": "Resume job titles or job descriptions are not marketing performance.", "可編碼工作背景，不能由描述直接推定 B2B 契約／治理。": "Can be coded as job background; do not infer B2B contracts or governance directly from descriptions.", "不是個人貼文時間序列；須驗證核心行銷構念，核對來源、修改時間與控制時序。": "Not a time series of personal posts; validate the core marketing construct, and check the source, modification time and timing of controls.", "分類對照表本身不提供行銷結果。": "A classification crosswalk itself does not provide marketing outcomes.", "對照碼不是實質解釋構念；須串回觀察資料再建構。": "Crosswalk codes are not substantive explanatory constructs; link them back to the observational data before constructing variables.", "先串回個人／職位／評論，再編碼背景或構成變數；代碼大小不代表構念強度。": "First link back to individuals, positions or reviews, then encode background or composition variables; code magnitude does not indicate construct intensity.", "人口特徵推估不是行銷結果。": "Estimated demographic characteristics are not marketing outcomes.", "通常供背景分組／異質性，非自動成立的核心行銷 IV。": "Usually used for background grouping or heterogeneity; not automatically a valid core marketing IV.", "不是本人確認資料；保留機率含義，評估誤分類、測量時間與作控制的必要性。": "Not self-confirmed information; preserve the probabilistic interpretation, and assess misclassification, measurement timing and the need for use as a control.", "個人模型聲望不直接測量消費者品牌認知或行銷結果。": "A model-based personal reputation measure does not directly measure consumer brand perceptions or marketing outcomes.", "可作經驗背景代理，核心 IV 須另證明構念效度。": "Can proxy for experience background; a core IV requires separate evidence of construct validity.", "核對尺度、快照與生成資訊；不能當直接觀察的能力，避免結果後資訊作控制。": "Check the scale, snapshot and generation information; do not treat it as directly observed ability, and avoid using post-outcome information as a control.", "教育分類通常是背景，不是行銷結果。": "Education classifications usually describe background, rather than marketing outcomes.", "可編碼教育背景／異質性，不能自動當能力或核心行銷構念。": "Can be coded as educational background or heterogeneity; do not automatically treat them as ability or a core marketing construct.", "核對完成狀態與分類口徑，不能把處置後教育當前置背景控制。": "Check completion status and classification conventions; do not use post-treatment education as a pre-treatment background control.", "資料更新時間不是行銷結果。": "The data update time is not a marketing outcome.", "不是個人發文、廣告投放或職涯事件時點。": "Not the timing of personal posts, advertising placements or career events.", "供版本／新鮮度檢查，不保證追蹤完整；可建構資料時距控制。": "Used to check versions or data freshness; does not guarantee complete tracking. Can be used to construct controls for elapsed time since data updates.", "網絡存量不是貼文觸及、點擊或廣告成效 DV。": "Network stock is not a DV measuring post reach, clicks or advertising effectiveness.", "可作網絡背景代理，不能直接當廣告曝光量。": "Can proxy for network background; do not directly treat it as advertising exposure.", "核查顯示上限、缺失與快照；IV／控制須在結果前測量，避免反向因果。": "Check display caps, missingness and snapshots; measure IVs and controls before the outcome to avoid reverse causality.", "教育時間通常是背景，不是行銷結果。": "Education timing usually describes background, rather than marketing outcomes.", "就讀時距可作背景代理；核心 IV 須另有構念連結。": "Time spent in education can serve as a background proxy; a core IV requires a separate construct linkage.", "可建構就讀時距／期間控制；核查缺失與完成狀態，enddate 不能單獨證明取得學位。": "Can construct education-duration or period controls; check missingness and completion status. enddate alone does not establish that a degree was obtained.", "教育原文通常是背景，不是行銷結果。": "Original education text usually describes background, rather than marketing outcomes.", "可編碼學歷／專業背景，不能直接假定能力或核心行銷構念。": "Can be coded as educational qualifications or professional background; do not directly assume it measures ability or a core marketing construct.", "核查完成狀態、來源語言與時間；控制不能使用處置後教育資料。": "Check completion status, source language and timing; controls must not use post-treatment education data.", "個人檔案標題／摘要不直接提供行銷成效。": "Personal profile headlines or summaries do not directly provide marketing performance measures.", "可編碼自我呈現代理，但須驗證行銷構念與測量時間。": "Can be coded as self-presentation proxies, but require validation of the marketing construct and measurement timing.", "不是個人貼文內容時間序列；核對快照，避免結果後修改或反向因果。": "Not a time series of personal post content; check snapshots, and avoid post-outcome modifications or reverse causality.", "技能文字通常是背景，不是行銷結果。": "Skill text usually describes background, rather than marketing outcomes.", "可建構技能代理，不能僅憑技能名稱推定實際能力。": "Can be used to construct skill proxies; do not infer actual ability from skill names alone.", "須驗證構念，保留回報／推估及翻譯來源；IV／控制核查測量時間。": "Validate the construct, retain reported versus estimated status and translation sources, and check measurement timing for IVs and controls.", "技能首次記錄時間不是行銷結果。": "The first recorded time of a skill is not a marketing outcome.", "不等於學會技能或首次發文時間，不能直接作處置。": "Does not indicate when a skill was learned or a first post was made, and cannot directly serve as ary source or estimation flags are neither salary amounts nor marketing outcomes.", "資料來源不是薪酬處置或外生 IV。": "The data source is not a compensation treatment or an exogenous IV.", "先確認編碼，再作來源分層、篩選或測量品質控制。": "First verify the coding, then use for source stratification, filtering or measurement-quality controls.", "刊登時長僅在行銷機制明確時作間接 DV；不直接測量廣告成效。": "Posting duration can serve as an indirect DV only when the marketing mechanism is explicit; it does not directly measure advertising effectiveness.", "職缺刊登／下架時點不是個人貼文或廣告曝光。": "Job posting or removal times are not personal posts or advertising exposure.", "下架不等於成功錄用，也不提供面試／offer 數；建構時距須處理觀察窗口與設限。": "Removal does not mean a successful hire and does not provide interview or offer counts; address the observation window and censoring when constructing durations.", "職缺遠距安排不是行銷成效。": "Remote-work arrangements in job postings are not marketing performance.", "可編碼工作條件代理，仍須建立行銷構念連結。": "Can be coded as proxies for working conditions, but still require a marketing construct linkage.", "核對未標示的預設處理與時序，不等於員工實際遠距行為。": "Check default handling of unspecified values and timing; does not represent employees' actual remote-work behavior.", "預測錄用數非實際錄用或廣告成效；有行銷連結才作間接 DV。": "Predicted hires are neither actual hires nor advertising effectiveness; they can serve as an indirect DV only with a marketing connection.", "可作招聘需求代理，須驗證構念，不能當實際人員流入。": "Can proxy for recruitment demand, subject to construct validation; do not treat them as actual employee inflows.", "不提供實際面試／offer 數；保留模型性質，檢查輸入重疊與控制時序。": "Does not provide actual interview or offer counts; retain its model-based status, and check input overlap and the timing of controls.", "職缺來源旗標不是廣告成效或個人貼文反應。": "Job posting source flags are neither advertising effectiveness nor responses to personal posts.", "不是個人發文、付費廣告處置或曝光量。": "Not personal posting, a paid advertising treatment or exposure volume.", "標示職缺廣告的資料來源；主要供來源分層、覆蓋與品質控制，不能由來源推定行銷活動。": "Indicates the data source of job advertisements; primarily used for source stratification, coverage and quality control. Do not infer marketing activity from the source.", "職缺廣告文字不是廣告成效或個人貼文反應。": "Job advertisement text is neither advertising effectiveness nor responses to personal posts.", "編碼後可作招聘溝通代理，須驗證行銷構念及文本測量。": "After coding, can proxy for recruitment communication; validate the marketing construct and text measurement.", "不是個人貼文時間序列；文字不能證明面試／offer 數，須保留語言、來源版本與控制時序。": "Not a time series of personal posts; text cannot establish interview or offer counts. Retain the language, source version and timing of controls.", "裁員公告／預定生效日期不是行銷結果。": "Layoff announcement or scheduled effective dates are not marketing outcomes.", "可建構組織事件 IV，但須連結實質構念且不能假定外生。": "Can be used to construct an organizational-event IV, but requires a substantive construct linkage and cannot be assumed exogenous.", "公告日和預定裁員日不同，不代表實際執行；事件／時間控制須明確定義時點。": "The announcement date differs from the scheduled layoff date and does not establish actual implementation; clearly define timing for event or time controls.", "裁員公告類型不是行銷結果。": "Layoff announcement types are not marketing outcomes.", "可編碼事件特徵，但須有實質機制且不能假定外生。": "Can be coded as event characteristics, but require a substantive mechanism and cannot be assumed exogenous.", "核對分類與公告涵蓋，不能把未公告當成無事件；控制須確認時序。": "Check classifications and announcement coverage; do not treat an absent announcement as no event. Verify the timing of controls.", "裁員公告人數非市場績效；有行銷機制才作間接 DV。": "Announced layoff headcounts are not market performance; they can serve as an indirect DV only with a marketing mechanism.", "可作組織事件代理，不能假定外生或代表 B2B 治理。": "Can proxy for organizational events; do not assume exogeneity or that they represent B2B governance.", "去除修訂／重複公告並核對日期；不等於最終實際離職人數，控制須確認時序。": "Deduplicate revisions and repeated announcements, and verify dates; these are not the final actual numbers of departures. Verify the timing of controls.", "評論者／評論樣本屬性不是行銷結果。": "Reviewer or review-sample attributes are not marketing outcomes.", "通常供背景、異質性或選擇控制，核心 IV 須另有構念依據。": "Usually used for background, heterogeneity or selection controls; a core IV requires a separate construct basis.", "核對字串／布林編碼、測量時間與樣本選擇機制，不把樣本屬性當外生處置。": "Check string or Boolean coding, measurement timing and the sample-selection mechanism; do not treat sample attributes as exogenous treatments.", "評論者職稱通常是背景，不是行銷結果。": "Reviewer job titles usually describe background, rather than marketing outcomes.", "可分類職務背景，不能由職稱推定實際契約／治理。": "Can be used to classify job background; do not infer actual contracts or governance from job titles.", "核心 IV 須另有構念連結，保留原文／翻譯差異與控制時序。": "A core IV requires a separate construct linkage; retain differences between original and translated text and the timing of controls.", "評論者離職年份通常是樣本背景，不是行銷結果。": "A reviewer's year of departure usually describes sample background, rather than marketing outcomes.", "可建構離職狀態／評論時距，核心 IV 須另有構念依據。": "Can define departure status or elapsed time relative to the review; a core IV requires a separate construct basis.", "可作樣本背景控制；須核查回報、缺失與時序，不把年份大小當績效。": "Can serve as a sample-background control; check reporting, missingness and timing. Do not treat a year's magnitude as performance.", "評論者任期通常是背景，不是行銷結果或客戶關係長度。": "Reviewer tenure usually describes background; it is neither a marketing outcome nor the length of a customer relationship.", "可作工作經驗代理，核心 IV 須另有行銷構念依據。": "Can proxy for work experience; a core IV requires a separate marketing construct basis.", "核查自報單位、截尾、回報缺失與時序；區分已離職任期和仍在職年資。": "Check self-reported units, truncation, missing reports and timing; distinguish tenure in completed employment from tenure in ongoing employment.", "員工對雇主的評價；作 DV 須明確連結行銷構念。": "Employees' evaluations of their employer; use as a DV requires an explicit marketing construct linkage.", "可作雇主感知代理，不能直接當顧客態度或實際公司績效。": "Can proxy for employer perceptions; do not directly treat it as customer attitudes or actual company performance.", "不是消費者評論／顧客 NPS；依有序／名目尺度編碼，評論者自選不代表全體員工，控制須核對時序。": "Not consumer reviews or customer NPS; code according to ordinal or nominal scales. Self-selected reviewers do not represent all employees. Verify the timing of controls.", "須編碼雇主觀感，且有行銷構念連結才作 DV。": "Requires coding of employer perceptions and a marketing construct linkage before use as a DV.", "可作經驗／雇主感知代理，須驗證文本測量。": "Can proxy for experience or employer perceptions; validate the text measurement.", "員工評論不是消費者評論／顧客 NPS；核對樣本選擇與評論期間，避免結果後資訊作控制。": "Employee reviews are not consumer reviews or customer NPS; check sample selection and review periods, and avoid post-outcome information as controls.", "員工評論反應可條件式作 DV，但不是個人貼文／廣告轉換。": "Responses to employee reviews can conditionally serve as a DV, but are not personal-post or advertising conversions.", "須界定資訊回應構念，票數本身不代表外生資訊品質。": "Define the information-response construct; vote counts alone do not represent exogenous information quality.", "有用／無用投票須核查曝光機會與累積期間；IV／控制避免採用結果後累積票數。": "Check exposure opportunities and accumulation periods for helpful or unhelpful votes; avoid post-outcome cumulative vote counts as IVs or controls.", "員工情緒反映雇主觀感；作 DV 須建立行銷構念連結。": "Employee sentiment reflects employer perceptions; use as a DV requires a marketing construct linkage.", "可作雇主感知代理，不能當消費者品牌認知而未驗證。": "Can proxy for employer perceptions; do not treat it as consumer brand perceptions without validation.", "這是員工評論 NLP 分數，不是消費者評論／顧客 NPS；現表無日期，不能直接作月度結果，IV／控制先核對評論期間。": "This is an NLP score from employee reviews, not consumer reviews or customer NPS; the current table has no date field and cannot directly provide monthly outcomes. Check the review period before using it as an IV or control.", "員工評論量通常是測量覆蓋，不是銷售或客戶量 DV。": "Employee review volume usually measures coverage; it is not a DV for sales or customer volume.", "通常供樣本量／精度調整，不能自動視為公司規模或行銷 IV。": "Usually used to adjust for sample size or precision; do not automatically treat it as company size or a marketing IV.", "核對樣本選擇、累積期間與覆蓋；IV／控制不能使用結果後累積量。": "Check sample selection, accumulation period and coverage; IVs and controls must not use post-outcome cumulative volume.", "人力存量非銷售／顧客結果；有行銷機制才作間接 DV。": "Workforce stock is not a sales or customer outcome; it can serve as an indirect DV only with a marketing mechanism.", "可作人力規模代理，不能代替 B2B 契約或治理。": "Can proxy for workforce size; cannot substitute for B2B contracts or governance.", "核對 raw／scaled／count 調整版本與聚合範圍，缺失不補零；控制須符合時間順序。": "Check raw, scaled and count adjustment versions and aggregation scope; do not replace missing values with zero. Controls must respect temporal ordering.", "人力流量不是顧客取得／流失；有行銷機制才作間接 DV。": "Workforce flows are not customer acquisition or churn; they can serve as indirect DVs only with a marketing mechanism.", "須界定人力機制，非公司欄位就具備實質 B2B IV 意義。": "Define the workforce mechanism; being a company-level field does not itself confer substantive B2B IV relevance.", "分清內外部移動與調整版本；流動率另定分母，核查近期回報延遲及控制時序。": "Distinguish internal from external movements and adjustment versions; define the denominator separately for turnover rates. Check recent reporting delays and the timing of controls.", "人力薪酬彙總非營收／市場績效；有行銷連結才作間接 DV。": "Aggregated workforce compensation is not revenue or market performance; it can serve as an indirect DV only with a marketing connection.", "可作人力成本／資源代理，不能僅因公司層級就視為 B2B IV。": "Can proxy for labor costs or resources; do not treat it as a B2B IV solely because it is measured at company level.", "先核對總和／平均、聚合單位、模型性質、幣別與權重；語義未確認前不直接比較或作控制，須保留時間順序。": "First check whether it is a sum or average, the aggregation unit, model-based status, currency and weights; do not directly compare or use it as a control before confirming its meaning. Preserve temporal ordering.", "任期彙總不是客戶關係長度；有行銷連結才作間接 DV。": "Aggregated tenure is not the length of a customer relationship; it can serve as an indirect DV only with a marketing connection.", "通常作人力經驗背景代理，核心 IV 須另驗證構念。": "Usually proxies for workforce experience background; a core IV requires separate construct validation.", "先核對平均／總和、單位與權重，不能當單人的完整任期；控制須在結果前。": "First check whether it is an av   <script>/* Translate presentation text without mutating research metadata or source values. */
(() => {
  'use strict';
  const STORAGE_KEY = 'research-studio-language';
  const selector = document.getElementById('language-select');
  let bundle = {};
  try { bundle = JSON.parse(document.getElementById('research-data').textContent).i18n?.en || {}; } catch (_) {}
  const strings = bundle.strings || {};
  const patterns = (bundle.patterns || []).map(rule => ({ regex: new RegExp(rule.source), replacement: rule.replacement }));
  const textSources = new WeakMap();
  const attributeSources = new WeakMap();
  const skip = 'script,style,code,pre,[data-i18n-skip],.definition-value,.observed-value:not(.missing-value),.column-name,.data-type';
  const attributes = ['aria-label', 'aria-description', 'aria-valuetext', 'title', 'placeholder', 'alt', 'content'];
  const normalize = value => value === 'en' ? 'en' : 'zh-TW';
  let stored;
  try { stored = localStorage.getItem(STORAGE_KEY); } catch (_) {}
  let language = normalize(new URL(location.href).searchParams.get('lang') || stored || 'en');

  function translate(value, depth = 0) {
    const source = String(value ?? '');
    if (language !== 'en' || !source || depth > 6) return source;
    if (Object.prototype.hasOwnProperty.call(strings, source)) return strings[source];
    const trimmed = source.trim();
    if (trimmed !== source) return source.slice(0, source.indexOf(trimmed)) + translate(trimmed, depth + 1) + source.slice(source.indexOf(trimmed) + trimmed.length);
    for (const { regex, replacement } of patterns) {
      const match = regex.exec(source);
      if (match) return replacement.replace(/\$(\d+)/g, (_, index) => translate(match[Number(index)] || '', depth + 1));
    }
    for (const separator of [' · ', '｜', '；']) {
      if (source.includes(separator)) return source.split(separator).map(part => translate(part, depth + 1)).join(separator === '｜' ? ' | ' : separator === '；' ? '; ' : separator);
    }
    return source;
  }
  function withLanguageURL(value) {
    if (typeof value !== 'string' || !/\.html(?:[?#]|$)/i.test(value) || /^(?:https?:|\/\/)/i.test(value)) return value;
    try {
      const url = new URL(value, location.href);
      url.searchParams.set('lang', language);
      return `${value.split(/[?#]/)[0]}${url.search}${url.hash}`;
    } catch (_) { return value; }
  }
  function sourceText(node) {
    if (!node) return '';
    if (node.nodeType === Node.TEXT_NODE) {
      const known = textSources.get(node);
      return known && node.data === known.last ? known.source : node.data;
    }
    return [...node.childNodes].map(sourceText).join('');
  }
  function processText(node) {
    if (!node.parentElement || node.parentElement.closest(skip)) return;
    let known = textSources.get(node);
    if (!known || node.data !== known.last) known = { source: node.data, last: node.data };
    const translated = translate(known.source);
    if (node.data !== translated) node.data = translated;
    known.last = translated;
    textSources.set(node, known);
  }
  function processElement(element) {
    let known = attributeSources.get(element);
    if (!known) { known = new Map(); attributeSources.set(element, known); }
    attributes.forEach(name => {
      if (!element.hasAttribute(name)) return;
      const current = element.getAttribute(name);
      let value = known.get(name);
      if (!value || value.last !== current) value = { source: current, last: current };
      const translated = translate(value.source);
      if (current !== translated) element.setAttribute(name, translated);
      value.last = translated;
      known.set(name, value);
    });
    if (element.tagName === 'A') {
      const href = element.getAttribute('href');
      const localized = withLanguageURL(href);
      if (href !== localized) element.setAttribute('href', localized);
    }
  }
  function walk(node) {
    if (node.nodeType === Node.TEXT_NODE) { processText(node); return; }
    if (node.nodeType === Node.ELEMENT_NODE && node.hasAttribute('data-i18n-zh')) {
      const value = language === 'en' ? node.dataset.i18nEn || translate(node.dataset.i18nZh) : node.dataset.i18nZh;
      if (node.textContent !== value) node.textContent = value;
      return;
    }
    if (node.nodeType !== Node.ELEMENT_NODE || node.matches(skip)) return;
    processElement(node);
    [...node.childNodes].forEach(walk);
  }
  const observer = new MutationObserver(changes => {
    observer.disconnect();
    const roots = new Set();
    changes.forEach(change => {
      if (change.type === 'childList') change.addedNodes.forEach(node => roots.add(node));
      else roots.add(change.target);
    });
    roots.forEach(node => {
      const parent = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
      if (node.isConnected && !parent?.closest(skip)) walk(node);
    });
    observe();
  });
  function observe() {
    observer.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: [...attributes, 'href'] });
  }
  function refresh() {
    observer.disconnect();
    walk(document.documentElement);
    observe();
  }
  function setLanguage(value) {
    language = normalize(value);
    document.documentElement.lang = language === 'en' ? 'en' : 'zh-Hant';
    if (selector) selector.value = language;
    try { localStorage.setItem(STORAGE_KEY, language); } catch (_) {}
    try {
      const url = new URL(location.href); url.searchParams.set('lang', language);
      history.replaceState(history.state, '', url.href);
    } catch (_) { /* Navigation links also carry the selected language. */ }
    refresh();
    window.dispatchEvent(new CustomEvent('research-language-change', { detail: { language } }));

    if (controls.table !== record?.table || controls.rowsSignature !== rowsSignature) {
      controls.rows = labels.map((label, index) => {
        const row = element('label', 'column-width-slider-row');
        const caption = element('span', 'column-width-caption', label);
        const value = element('output', 'column-width-value');
        const input = element('input', 'column-width-range');
        input.type = 'range'; input.min = String(MIN_WIDTH); input.max = String(MAX_WIDTH); input.step = '1';
        input.id = `column-width-range-${index}`;
        input.dataset.columnIndex = String(index);
        input.setAttribute('aria-label', `「${label}」欄寬`);
        value.htmlFor = input.id;
        row.append(caption, value, input);
        return { row, input, value };
      });
      controls.sliders.replaceChildren(...controls.rows.map(row => row.row));
      controls.table = record?.table;
      controls.rowsSignature = rowsSignature;
    }
    const usable = record && isVisible(record.table);
    setText(controls.hint, !record ? '目前沒有符合的資料表。' : usable ? '拖曳下方滑桿或表格邊界，分別調整每一欄。' : '請先展開這張資料表，再調整欄寬。');
    const widths = record ? widthsOf(record) : [];
    controls.rows.forEach(({ input, value }, index) => {
      const width = Math.round(widths[index]);
      input.disabled = !usable;
      if (input.value !== String(width)) input.value = String(width);
      input.setAttribute('aria-valuetext', `${width} 像素`);
      setText(value, usable || record.widths ? `${width} px` : '—');
    });
  }
  function widthsOf(record) {
    return record.widths ? [...record.widths] : record.headers.map(header => clamp(header.getBoundingClientRect().width));
  }
  function notifyLayout() {
    window.dispatchEvent(new CustomEvent('research-layout-change'));
    schedule();
  }
  function setWidths(record, widths, save = true) {
    record.widths = widths.map(width => Math.round(clamp(width) * 100) / 100);
    if (!record.colgroup) {
      record.colgroup = document.createElement('colgroup');
      record.colgroup.className = 'column-resize-widths';
      record.headers.forEach(() => record.colgroup.append(document.createElement('col')));
      record.table.prepend(record.colgroup);
      record.table.classList.add('column-widths-custom');
    }
    [...record.colgroup.children].forEach((col, index) => writeStyle(col, 'width', `${record.widths[index]}px`));
    writeStyle(record.table, 'width', `${record.widths.reduce((sum, width) => sum + width, 0)}px`);
    writeStyle(record.table, 'minWidth', '0px');
    record.handles.forEach((handle, index) => handle.setAttribute('aria-valuenow', String(Math.round(record.widths[index]))));
    if (save) savedWidths.set(record.key, [...record.widths]);
    notifyLayout();
  }
  function restoreLayout(record) {
    record.widths = null;
    record.colgroup?.remove();
    record.colgroup = null;
    record.table.classList.remove('column-widths-custom');
    writeStyle(record.table, 'width', record.originalWidth);
    writeStyle(record.table, 'minWidth', record.originalMinWidth);
  }
  function reset(key) {
    if (dragging && (!key || dragging.record.key === key)) finishDrag();
    records.forEach(record => {
      if (!key || record.key === key) restoreLayout(record);
    });
    if (key) savedWidths.delete(key); else savedWidths.clear();
    persist();
    notifyLayout();
  }
  function finishDrag(cancel = false) {
    if (!dragging) return;
    const current = dragging;
    dragging = null;
    current.handle.classList.remove('is-dragging');
    document.body.classList.remove('is-resizing-column');
    if (current.handle.hasPointerCapture(current.pointerId)) current.handle.releasePointerCapture(current.pointerId);
    if (cancel === true) {
      if (current.previousWidths) setWidths(current.record, current.previousWidths);
      else {
        restoreLayout(current.record);
        savedWidths.delete(current.record.key);
        notifyLayout();
      }
    }
    persist();
    schedule();
  }
  function onPointerDown(event) {
    if (event.button !== 0 || !event.isPrimary || dragging) return;
    const handle = event.currentTarget;
    const record = records.get(handle._resizeTable);
    if (!record || handle.hidden) return;
    event.preventDefault();
    handle.focus({ preventScroll: true });
    dragging = {
      record, handle, pointerId: event.pointerId, startX: event.clientX,
      index: Number(handle.dataset.columnIndex), widths: widthsOf(record),
      previousWidths: record.widths ? [...record.widths] : null
    };
    handle.classList.add('is-dragging');
    document.body.classList.add('is-resizing-column');
    handle.setPointerCapture(event.pointerId);
  }
  function onPointerMove(event) {
    if (!dragging || event.pointerId !== dragging.pointerId) return;
    const widths = [...dragging.widths];
    widths[dragging.index] = clamp(widths[dragging.index] + event.clientX - dragging.startX);
    setWidths(dragging.record, widths);
  }
  function onPointerUp(event) {
    if (dragging?.pointerId === event.pointerId) finishDrag();
  }
  function onPointerCancel(event) {
    if (dragging?.pointerId === event.pointerId) finishDrag(true);
  }
  function onKeyDown(event) {
    if (event.key === 'Escape' && dragging) { event.preventDefault(); finishDrag(true); return; }
    const handle = event.currentTarget;
    const record = records.get(handle._resizeTable);
    if (!record) return;
    const widths = widthsOf(record);
    const index = Number(handle.dataset.columnIndex);
    const step = event.shiftKey ? 48 : 16;
    if (event.key === 'ArrowLeft') widths[index] -= step;
    else if (event.key === 'ArrowRight') widths[index] += step;
    else if (event.key === 'Home') widths[index] = MIN_WIDTH;
    else if (event.key === 'End') widths[index] = MAX_WIDTH;
    else return;
    event.preventDefault();
    setWidths(record, widths);
    persist();
  }
  function onDoubleClick(event) { reset(event.currentTarget.dataset.tableId); }
  function removeRecord(record) {
    if (dragging?.record === record) finishDrag();
    record.wrapper.removeEventListener('scroll', schedule);
    record.handles.forEach(handle => {
      handle.removeEventListener('pointerdown', onPointerDown);
      handle.removeEventListener('pointermove', onPointerMove);
      handle.removeEventListener('pointerup', onPointerUp);
      handle.removeEventListener('pointercancel', onPointerCancel);
      handle.removeEventListener('lostpointercapture', onPointerUp);
      handle.removeEventListener('keydown', onKeyDown);
      handle.removeEventListener('dblclick', onDoubleClick);
      handle.remove();
    });
  }
  function reconcile() {
    const tables = new Set(content.querySelectorAll('.table-scroll > .column-table'));
    records.forEach((record, table) => {
      if (!tables.has(table)) { removeRecord(record); records.delete(table); }
    });
    tables.forEach(table => {
      if (records.has(table)) return;
      const headers = [...(table.tHead?.rows[0]?.cells || [])];
      if (!headers.length) return;
      const wrapper = table.closest('.table-scroll');
      const key = table.closest('[data-table-id]')?.dataset.tableId || `table-${records.size}`;
      if (!table.id) {
        do { table.id = `research-resizable-table-${++sequence}`; } while (document.querySelectorAll(`#${table.id}`).length > 1);
      }
      const record = { table, wrapper, key, headers, handles: [], widths: null, colgroup: null, originalWidth: table.style.width, originalMinWidth: table.style.minWidth };
      records.set(table, record);
      headers.forEach((header, index) => {
        const handle = document.createElement('div');
        handle.className = 'column-resize-handle';
        handle.hidden = true;
        handle.tabIndex = 0;
        handle.dataset.tableId = key;
        handle.dataset.columnIndex = String(index);
        handle._resizeTable = table;
        handle.setAttribute('role', 'separator');
        handle.setAttribute('aria-orientation', 'vertical');
        handle.setAttribute('aria-controls', table.id);
        handle.setAttribute('aria-label', `調整「${sourceText(header)}」欄寬`);
        handle.setAttribute('aria-valuemin', String(MIN_WIDTH));
        handle.setAttribute('aria-valuemax', String(MAX_WIDTH));
        handle.title = '拖曳調整欄寬；左右鍵微調，Home／End 最小／最大；連按兩下還原表格';
        handle.addEventListener('pointerdown', onPointerDown);
        handle.addEventListener('pointermove', onPointerMove);
        handle.addEventListener('pointerup', onPointerUp);
        handle.addEventListener('pointercancel', onPointerCancel);
        handle.addEventListener('lostpointercapture', onPointerUp);
        handle.addEventListener('keydown', onKeyDown);
        handle.addEventListener('dblclick', onDoubleClick);
        layer.append(handle);
        record.handles.push(handle);
      });
      wrapper.addEventListener('scroll', schedule, { passive: true });
      const saved = savedWidths.get(key);
      if (saved?.length === headers.length) setWidths(record, saved, false);
    });
    if (resizeObserver) {
      const targets = new Set([content, document.body]);
      const topbar = document.querySelector('.topbar');
      if (topbar) targets.add(topbar);
      records.forEach(record => { targets.add(record.table); targets.add(record.wrapper); });
      observed.forEach(element => {
        if (!targets.has(element)) { resizeObserver.unobserve(element); observed.delete(element); }
      });
      targets.forEach(element => {
        if (!observed.has(element)) { resizeObserver.observe(element); observed.add(element); }
      });
    }
    mountControls();
    needsReconcile = false;
  }
  function isVisible(table) {
    if (!table.isConnected || !table.getClientRects().length || table.closest('[hidden]')) return false;
    for (let parent = table.parentElement; parent; parent = parent.parentElement) {
      if (parent.tagName === 'DETAILS' && !parent.open) return false;
    }
    return getComputedStyle(table).visibility !== 'hidden';
  }
  function update() {
    frame = 0;
    if (destroyed) return;
    if (needsReconcile) reconcile();
    syncControls();
    const viewLeft = viewport?.offsetLeft || 0;
    const viewTop = viewport?.offsetTop || 0;
    const viewRight = Math.min(viewLeft + (viewport?.width || window.innerWidth), document.documentElement.clientWidth);
    let viewBottom = viewTop + (viewport?.height || window.innerHeight);
    const topbar = document.querySelector('.topbar')?.getBoundingClientRect();
    const visibleTop = topbar && topbar.top <= viewTop + 1 && topbar.bottom > viewTop ? topbar.bottom : viewTop;
    const dock = document.querySelector('.table-scroll-dock:not([hidden])');
    if (dock) viewBottom = Math.min(viewBottom, dock.getBoundingClientRect().top);
    records.forEach(record => {
      if (!isVisible(record.table)) {
        if (dragging?.record === record) finishDrag();
        record.handles.forEach(handle => { handle.hidden = true; });
        return;
      }
      const rect = record.table.getBoundingClientRect();
      const wrapRect = record.wrapper.getBoundingClientRect();
      const left = Math.max(viewLeft, wrapRect.left + record.wrapper.clientLeft);
      const right = Math.min(viewRight, wrapRect.left + record.wrapper.clientLeft + record.wrapper.clientWidth);
      const top = Math.max(visibleTop, rect.top, wrapRect.top);
      const bottom = Math.min(viewBottom, rect.bottom, wrapRect.top + record.wrapper.clientHeight);
      record.headers.forEach((header, index) => {
        const handle = record.handles[index];
        const headerRect = header.getBoundingClientRect();
        const active = dragging?.handle === handle;
        const inView = headerRect.right >= left + 4 && headerRect.right <= right + 1;
        handle.hidden = bottom - top < 12 || right - left < 20 || (!inView && !active);
        if (handle.hidden) return;
        const x = active ? Math.max(left + 5, Math.min(right - 5, headerRect.right)) : Math.min(right - 5, headerRect.right);
        writeStyle(handle, 'left', `${x - 5}px`);
        writeStyle(handle, 'top', `${top}px`);
        writeStyle(handle, 'height', `${bottom - top}px`);
        handle.setAttribute('aria-valuenow', String(Math.round(headerRect.width)));
      });
    });
  }
  function schedule() {
    if (!destroyed && !frame) frame = requestAnimationFrame(update);
  }
  const mutationObserver = new MutationObserver(changes => {
    if (changes.some(change => change.type === 'childList')) needsReconcile = true;
    schedule();
  });
  mutationObserver.observe(content, { childList: true, subtree: true, attributes: true, attributeFilter: ['open', 'hidden', 'class', 'style'] });
  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', schedule, { passive: true });
  window.addEventListener('hashchange', schedule);
  window.addEventListener('research-layout-change', schedule);
  window.addEventListener('blur', finishDrag);
  document.addEventListener('toggle', schedule, true);
  viewport?.addEventListener('resize', schedule, { passive: true });
  viewport?.addEventListener('scroll', schedule, { passive: true });

  window.ResearchColumnResize = {
    minWidth: MIN_WIDTH, maxWidth: MAX_WIDTH,
    refresh() { needsReconcile = true; schedule(); },
    setEditing,
    get editing() { return editing; },
    reset,
    destroy() {
      finishDrag();
      destroyed = true;
      if (frame) cancelAnimationFrame(frame);
      mutationObserver.disconnect();
      resizeObserver?.disconnect();
      removeControls();
      records.forEach(record => { removeRecord(record); restoreLayout(record); });
      records.clear(); observed.clear();
      window.removeEventListener('scroll', schedule);
      window.removeEventListener('resize', schedule);
      window.removeEventListener('hashchange', schedule);
      window.removeEventListener('research-layout-change', schedule);
      window.removeEventListener('blur', finishDrag);
      document.removeEventListener('toggle', schedule, true);
      viewport?.removeEventListener('resize', schedule);
      viewport?.removeEventListener('scroll', schedule);
      layer.remove();
      document.body.classList.remove('is-resizing-column');
    }
  };
  schedule();
})();
</script>
</body>
</html>
