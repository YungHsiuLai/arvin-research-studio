s a difference between kinds of negative-review events only under parallel-trend and timing assumptions. Text-derived event selection and unobserved differences between event types remain identification issues, not solved by predictive AUC.", "limitations_zh": "只有在平行趨勢與時點假設下，這個比較才識別不同負評事件的差異。文字衍生的事件選擇與事件類型間不可觀察差異仍是識別問題，不能靠預測AUC解決。", "source_locator_en": "Authored EN/ZH handouts, §3.2, method (9), referring to Eq. (5) and Table 3 column 2; figures are handout-reported.", "source_locator_zh": "本站作者英／中講義，§3.2 方法(9)，指向式(5)與Table 3規格2；數字僅由講義轉述。"}]}, {"id": "fixed_effects_interaction", "title_en": "Interaction regression with high-dimensional fixed effects", "title_zh": "交互作用迴歸與高維固定效果", "category_en": "Panel regression and comparative effects", "category_zh": "追蹤資料迴歸與比較效果", "purpose_en": "Compare treatment associations across outcome dimensions while absorbing shared observation-level factors and persistent entity-dimension differences.", "purpose_zh": "吸收同次觀察的共同因素及持續的實體×面向差異，再比較不同結果面向的處理關聯。", "scenario_en": "Compare restaurants with and without recent reviews. Within each inspection, does the gap between review-visible and other hygiene violations differ between these groups?", "scenario_zh": "想比較有近期評論與沒有近期評論的餐廳，看看兩組餐廳在同一次檢查中，「評論較能反映的衛生項目」與「其他項目」之間的違規差距是否不同。", "definition_en": "A dimension-specific specification can take the form \\(V_{vit}=\\rho_{it}+\\kappa_{iv}+\\gamma R_{it}I_v+\\varepsilon_{vit}\\). Observation fixed effects \\(\\rho_{it}\\) remove common factors; entity-dimension effects \\(\\kappa_{iv}\\) remove persistent dimension differences. The interaction coefficient is a relative contrast.", "definition_zh": "面向別規格可寫成 \\(V_{vit}=\\rho_{it}+\\kappa_{iv}+\\gamma R_{it}I_v+\\varepsilon_{vit}\\)。觀察固定效果 \\(\\rho_{it}\\) 吸收共同因素，實體×面向效果 \\(\\kappa_{iv}\\) 吸收持續差異；交互係數是相對比較。", "inputs_en": "Repeated entity-observation-dimension outcomes, an observation-level exposure, a dimension indicator and fixed-effect identifiers.", "inputs_zh": "重複的實體×觀察×面向結果、觀察層級暴露、面向指標及固定效果識別碼。", "outputs_en": "An interaction coefficient measuring a difference in dimension gaps, plus uncertainty and specification comparisons.", "outputs_zh": "衡量不同面向差距之差的交互係數、不確定性與規格比較。", "assumptions_en": "The interaction must retain variation after fixed effects. Fixed effects remove only the variation they span; remaining endogenous exposure or time-varying dimension-specific confounding prevents an automatic causal interpretation.", "assumptions_zh": "交互項在扣除固定效果後須仍有變異。固定效果只消除其涵蓋的變動；若暴露仍內生或存在隨時間改變的面向別混淆，不能自動作因果解讀。", "diagnostics_en": "Suggested checks: residualized variation and collinearity, which main effects are absorbed, changes across fixed-effect specifications and plausible remaining dimension-specific shocks.", "diagnostics_zh": "建議檢查：殘差化後變異與共線性、哪些主效果被吸收、不同固定效果規格的變化，以及可能殘留的面向別衝擊。", "variants": [{"id": "fz2026-supply-fe-interaction", "design_id": "fz2026", "title_en": "Recent reviews and relative hygiene-violation gaps", "title_zh": "近期評論與相對衛生違規差距", "implementation_en": "The unit is restaurant × initial inspection × violation code. \\(V_{vit}\\) indicates a detected violation, \\(R_{it}\\) indicates a review in the previous 90 days, and \\(I_v\\) marks one of the five informative violations. The handout compares no fixed effects; inspection plus violation-code effects; and inspection plus restaurant × violation effects.", "implementation_zh": "單位為餐廳×初次檢查×違規代碼。\\(V_{vit}\\)表示查出違規，\\(R_{it}\\)表示前90天有評論，\\(I_v\\)標示五項評論較能預測的違規項目（informative violations）。講義比較無固定效果、檢查＋違規代碼效果、檢查＋餐廳×違規效果。", "tuning_en": "These are specification choices rather than predictive hyperparameter tuning. The strongest specification absorbs common inspection factors and persistent restaurant-dimension differences.", "tuning_zh": "這是規格選擇，不是預測超參數調整。最嚴格規格吸收共同檢查因素及持續的餐廳×面向差異。", "interpretation_en": "The handout reports OLS interactions −0.005, −0.005 and −0.002 (SE 0.001 each), with the strictest estimate insignificant. A negative interaction means reviewed restaurants have a smaller informative-versus-other violation gap than other restaurants; it does not establish that other dimensions did not improve.", "interpretation_zh": "講義轉述OLS交互係數為−0.005、−0.005、−0.002（SE皆0.001），最嚴格估計不顯著。負交互項表示有評論餐廳的評論較能預測的項目相對其他項目違規差距較小，不能推論其他面向沒有改善。", "limitations_en": "\\(R_{it}\\) may be endogenous. Inspection fixed effects absorb its inspection-level main effect, so the estimable interaction contrast must be distinguished from a standalone review effect. Fixed effects alone do not resolve this endogeneity.", "limitations_zh": "\\(R_{it}\\)可能內生。檢查固定效果吸收其檢查層級主效果，因此可估計的交互對比須與單獨評論效果區分；固定效果本身無法解決這項內生性。", "source_locator_en": "Authored EN/ZH handouts, §1 observation-unit table and §3.2 method (10), referring to supply Eq. (6) and Table 4; not independently verified.", "source_locator_zh": "本站作者英／中講義，§1觀察單位表與§3.2方法(10)，指向供給式(6)及Table 4；尚未獨立核對。"}]}, {"id": "instrumental_variables_2sls", "title_en": "Instrumental variables and two-stage least squares", "title_zh": "工具變數與兩階段最小平方法（IV／2SLS）", "category_en": "Causal identification with endogenous regressors", "category_zh": "內生解釋變數的因果識別", "purpose_en": "Use externally induced variation to estimate a structural relationship when a regressor is endogenous.", "purpose_zh": "當解釋變數內生時，利用外生來源引發的變異估計結構關係。", "scenario_en": "Hygiene and reviews may affect each other; you seek an outside source that changes review exposure without directly changing hygiene.", "scenario_zh": "衛生與評論可能互相影響，你想找只改變評論機會的外生來源。", "definition_en": "First project the endogenous regressor on instruments and controls: \\(D=\\pi Z+\\boldsymbol W^\\top\\boldsymbol\\pi_W+u\\). The second stage uses its fitted component: \\(Y=\\theta\\widehat D+\\boldsymbol W^\\top\\boldsymbol d+\\varepsilon\\). With several endogenous terms, instruments must identify the relevant system. Here IV means instrumental variables, unlike the independent-variable label in data dictionaries.", "definition_zh": "第一階段 \\(D=\\pi Z+\\boldsymbol W^\\top\\boldsymbol\\pi_W+u\\) 將內生解釋變數投影至工具與控制，第二階段 \\(Y=\\theta\\widehat D+\\boldsymbol W^\\top\\boldsymbol d+\\varepsilon\\) 以擬合部分及相同控制解釋結果。多個內生項時，工具集合須能識別相關系統。此處IV指工具變數，與資料字典中的IV（解釋變數）不同。", "inputs_en": "Outcome, endogenous regressors, proposed instruments, controls and fixed effects, with an identification argument.", "inputs_zh": "結果、內生解釋變數、候選工具、控制與固定效果，以及識別論證。", "outputs_en": "First-stage estimates and diagnostics, and a second-stage coefficient whose causal interpretation depends on instrument validity and the structural assumptions.", "outputs_zh": "第一階段估計與診斷，以及因果解釋取決於工具有效性與結構假設的第二階段係數。", "assumptions_en": "Instruments must predict the endogenous terms after controls and satisfy the required rank condition. They must be exogenous to the structural error and affect the outcome only through the modeled endogenous channel. Strong first stages do not establish exclusion.", "assumptions_zh": "控制後工具須能預測內生項並滿足所需秩條件；工具須與結構誤差外生，且只透過模型中的內生管道影響結果。第一階段強不代表排除限制成立。", "diagnostics_en": "Suggested checks: the full first-stage system, weak-instrument diagnostics appropriate for clustering and multiple endogenous terms, the variation contributed by each instrument, and substantive threats to exclusion.", "diagnostics_zh": "建議檢查：完整第一階段系統、適合群聚與多內生項的弱工具診斷、各工具貢獻的變異，以及實質的排除限制威脅。", "variants": [{"id": "fz2026-reviewer-activity-iv", "design_id": "fz2026", "title_en": "Old reviewers' other Yelp activity as an instrument", "title_zh": "以舊評論者的其他Yelp活動作工具", "implementation_en": "The handout defines old reviewers as people who reviewed the restaurant more than 90 days before an inspection. \\(P_{it}\\) is their mean number of other Yelp reviews and \\(Z_{it}=\\log(1+P_{it})\\). Its overview lists \\(Z_{it}\\), \\(Z_{it}I_v\\), a no-prior-reviewer indicator and that indicator's interaction, for the endogenous review terms \\(R_{it}\\) and \\(R_{it}I_v\\).", "implementation_zh": "講義將舊評論者定義為檢查90天以前已評論過該餐廳的人，\\(P_{it}\\)為其平均其他Yelp評論數，\\(Z_{it}=\\log(1+P_{it})\\)。總覽列出\\(Z_{it}\\)、\\(Z_{it}I_v\\)、無舊評論者指標及其交互，對應內生評論項\\(R_{it}\\)與\\(R_{it}I_v\\)。", "tuning_en": "The \\(\\log(1+P)\\) transformation and instrument set are design choices. The example of reviewer counts 8 and 0, giving \\(P=4\\) and \\(Z\\approx1.609\\), is illustrative. Exact activity windows and the fixed-effect-residualized first-stage matrix are not fully reproduced.", "tuning_zh": "\\(\\log(1+P)\\)轉換與工具集合屬設計選擇。評論數8與0、得到\\(P=4\\)及\\(Z\\approx1.609\\)是示意例子。講義未完整重現活動時間窗與扣除固定效果後的第一階段矩陣。", "interpretation_en": "The handout reports Table 4 IV coefficients from −0.012 to −0.015: a 1.2–1.5 percentage-point smaller relative violation gap, about 7–8.5% of a 0.176 baseline. It says Appendix Table A7 supports relevance, but notes a −0.494 no-prior-reviewer coefficient and an insignificant −0.002 \\(Z_{it}I_v\\) coefficient in the strictest first stage.", "interpretation_zh": "講義轉述Table 4工具變數係數−0.012至−0.015，表示相對違規差距縮小1.2–1.5個百分點，約為0.176基準的7–8.5%。講義稱附錄Table A7支持相關性，但指出最嚴格第一階段的無舊評論者係數為−0.494，\\(Z_{it}I_v\\)係數−0.002不顯著。", "limitations_en": "The handout reports a Kleibergen–Paap statistic without reproducing its numeric value. It cautions that \\(F\u003e10\\) or Stock–Yogo comparisons are only rough guides in this clustered, multi-endogenous setting. The causal claim rests on exclusion, particularly given the role of the no-prior-reviewer indicator; significance alone does not validate it.", "limitations_zh": "講義提到Kleibergen–Paap統計量，但未列確切數值，並提醒此群聚、多內生項情境下\\(F\u003e10\\)或Stock–Yogo比較僅能作粗略參考。尤其無舊評論者指標扮演重要角色時，因果結論仍依賴排除限制，不能以顯著性驗證。", "source_locator_en": "Authored EN/ZH handouts, §1 instrument table and §3.2 method (11), referring to Table 4 and Appendix Table A7; no original-article or first-stage replication.", "source_locator_zh": "本站作者英／中講義，§1工具表與§3.2方法(11)，指向Table 4與附錄Table A7；尚未核對原論文或重現第一階段。"}]}], "designs": [{"id": "fz2026", "reference_text": "Farronato, C., \u0026 Zervas, G. (2026). Consumer Reviews and Regulation: Evidence from New York City Restaurants. Marketing Science, 45(4), 752–772.", "reference_url": "https://doi.org/10.1287/mksc.2023.0088", "title_en": "Farronato \u0026 Zervas (2026): review information and restaurant hygiene", "title_zh": "Farronato與Zervas（2026）：評論資訊與餐廳衛生", "study_type_en": "Predictive text measurement followed by separate demand-side and supply-side causal analyses", "study_type_zh": "先以文字預測建立測量，再分別進行需求端與供給端因果分析", "question_en": "When restaurants already display government hygiene grades, do Yelp reviews add information about specific violations, change demand, and encourage hygiene improvement?", "question_zh": "當餐廳已張貼官方衛生等級，Yelp評論是否仍提供特定違規的增額資訊、改變需求，並促使衛生改善？", "source_note_en": "Based only on the site author's English and Traditional Chinese methods handouts. 'Reported' numbers mean figures attributed to the article by those handouts; the original journal article and code have not been independently checked here. Pipeline examples marked illustrative are not empirical estimates. General diagnostics are proposed learning checks, not claims that the article performed them.", "source_note_zh": "僅依本站作者撰寫的英文與繁體中文方法講義建立。『報告』數字指講義歸於論文的數值，目前尚未與原文及程式逐項核對期刊原文與程式；標為示意的管線例子不是實證估計。一般診斷是建議學習檢查，不宣稱論文已執行。", "handout_en": "\u003cp\u003e\u003cspan\u003e\u003cstrong\u003eFarronato \u0026amp; Zervas (2026): Methods Summary\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch2 id=\"fz2026-en-research-question-and-structure\"\u003e1. Research question and structure\u003c/h2\u003e\n\u003cp\u003eNYC restaurants are already inspected by the Department of Health (DoH) and must post an A/B/C grade. Do Yelp reviews add hygiene information beyond that? The paper has two parts of a different nature:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePart 1 is prediction\u003c/strong\u003e: can review text predict a specific violation? The target is out-of-sample predictive power (AUC), with no causal claim. The results identify the five violations on which reviews are informative and are used to build negative hygiene events.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePart 2 is causal inference\u003c/strong\u003e: does review information lower demand (demand side), and does being monitored by reviews make restaurants improve hygiene (supply side)? Demand is identified by event timing and comparison events, and supply by fixed effects and an instrumental variable.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cdiv class=\"handout-table-scroll\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth style=\"text-align: left;\"\u003eAnalysis\u003c/th\u003e\n\u003cth style=\"text-align: left;\"\u003eType\u003c/th\u003e\n\u003cth style=\"text-align: left;\"\u003eUnit of observation\u003c/th\u003e\n\u003cth style=\"text-align: left;\"\u003eIV (independent variables)\u003c/th\u003e\n\u003cth style=\"text-align: left;\"\u003eDV (dependent variable)\u003c/th\u003e\n\u003cth style=\"text-align: left;\"\u003eInstruments\u003c/th\u003e\n\u003cth style=\"text-align: left;\"\u003eEstimation\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003eText model\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eInput to prediction\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eInitial inspection + prior-90-day reviews\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e(1) 20 violation indicators \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒗\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\boldsymbol v_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003cbr /\u003e\n(2) violation \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003e×\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\times\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e star group\u003cbr /\u003e\n(3) controls: year-month, cuisine, zip, chain\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cstrong\u003eCount\u003c/strong\u003e (non-negative integer): word \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003e×\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\times\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e star-group count \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003ec_{ij}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, e.g., “roach” twice\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eNone\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eMNIR/DMR + LASSO\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003eViolation prediction (Sec. 4)\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003ePrediction\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eInspection \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003e×\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\times\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e target violation \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ev\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e(1) posted grade (baseline)\u003cbr /\u003e\n(2) average star rating\u003cbr /\u003e\n(3) 20 SR scores ((2)(3) augmented only)\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cstrong\u003eBinary\u003c/strong\u003e (yes/no): \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003ey\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003ey_{iv}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, e.g., 04M found \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=1\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, not found \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eNone\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eGBDT + nested CV, AUC\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003eDemand (Sec. 5.1, Eqs. 4–5)\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eCausal\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eRestaurant \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003e×\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\times\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e review event \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003e×\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\times\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e relative day \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmo\u003e∈\u003c/mo\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e[\u003c/mo\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e15\u003c/mn\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmn\u003e15\u003c/mn\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e]\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003et\\in[-15,15]\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e(1) relative-day dummies\u003cbr /\u003e\n(2) DiD: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eB\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e×\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eB_{ij}\\times\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e relative day\u003cbr /\u003e\n(3) controls: weekday, avg. stars, grade\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cstrong\u003eBinary\u003c/strong\u003e (yes/no): \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi mathvariant=\"italic\"\u003e𝑠\u003c/mi\u003e\u003cmi mathvariant=\"italic\"\u003e𝑜\u003c/mi\u003e\u003cmi mathvariant=\"italic\"\u003e𝑙\u003c/mi\u003e\u003cmi mathvariant=\"italic\"\u003e𝑑\u003c/mi\u003e\u003cmi mathvariant=\"italic\"\u003e_\u003c/mi\u003e\u003cmi mathvariant=\"italic\"\u003e𝑜\u003c/mi\u003e\u003cmi mathvariant=\"italic\"\u003e𝑢\u003c/mi\u003e\u003cmi mathvariant=\"italic\"\u003e𝑡\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\mathit{sold\\_out}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, no table for two 6:30–7:30 pm, e.g., sold out \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=1\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, available \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eNone (review timing assumed exogenous)\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eLPM with restaurant \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003e×\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\times\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e event FE\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003eSupply (Sec. 5.2, Eq. 6)\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eCausal\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eRestaurant \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003e×\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\times\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e initial inspection \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003e×\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\times\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e violation code\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e(1) \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eR_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e: reviewed in prior 90 days\u003cbr /\u003e\n(2) \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eI_v\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e: informative violation\u003cbr /\u003e\n(3) \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eR_{it}I_v\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e (key coefficient \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\gamma\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e)\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cstrong\u003eBinary\u003c/strong\u003e (yes/no): \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eV\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eV_{vit}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, e.g., 02B found \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=1\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, not found \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eZ_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eZ_{it}I_v\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, no-prior-reviewer dummy and its interaction with \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eI_v\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eOLS, IV with inspection and restaurant \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003e×\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\times\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e violation FE\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"fz2026-en-data-availability\"\u003e2. Data availability\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eNYC DoH inspection records\u003c/strong\u003e: request through NYC OpenRecords under New York State FOIL (the most recent three years can be downloaded directly from NYC Open Data).\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eYelp reviews\u003c/strong\u003e: public reviews on the Yelp website.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eOpenTable availability\u003c/strong\u003e: query the OpenTable website every day and record the results yourself.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"fz2026-en-methods\"\u003e3. Methods\u003c/h2\u003e\n\u003ch3 id=\"fz2026-en-pipeline-inputs-outputs-and-order-of-each-method-each-steps-output-is-the-next-steps-input\"\u003ePipeline: inputs, outputs, and order of each method (each step’s output is the next step’s input)\u003c/h3\u003e\n\u003cdiv class=\"handout-pipeline-slot\"\u003e\u003c/div\u003e\n\u003cp\u003e\u003cspan\u003eNote: numbers marked “paper” are reported in the article, and all other numbers are illustrative examples of inputs and outputs.\u003c/span\u003e\u003c/p\u003e\n\u003ch3 id=\"fz2026-en-prediction-turning-review-text-into-violation-predictions\"\u003e3.1 Prediction: turning review text into violation predictions\u003c/h3\u003e\n\u003ch4 id=\"fz2026-en-bag-of-words\"\u003e(1) Bag-of-words\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def\"\u003eDef\u003c/h5\u003e\n\u003cp\u003eTreats text as a list of how often each word appears, ignoring word order: document \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ed\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e becomes a count vector \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒄\u003c/mi\u003e\u003cmi\u003ed\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmi\u003e…\u003c/mi\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmi\u003ep\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo\u003e∈\u003c/mo\u003e\u003cmsup\u003e\u003cmi mathvariant=\"double-struck\"\u003eℕ\u003c/mi\u003e\u003cmi\u003ep\u003c/mi\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\boldsymbol c_d=(c_{d1},\\ldots,c_{dp})\\in\\mathbb N^p\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, where \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003ec_{dj}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e counts word \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ej\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ej\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e and word order is discarded.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eLarge text corpora where content matters more than word order.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003ePool reviews from about 90 days before each initial inspection, remove punctuation and numbers, Porter-stem\u003ca href=\"#fz2026-en-fn1\" class=\"footnote-ref\" id=\"fz2026-en-fnref1\" role=\"doc-noteref\"\u003e\u003csup\u003e1\u003c/sup\u003e\u003c/a\u003e, drop stems in \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e\u0026lt;\u003c/mo\u003e\u003cmn\u003e5\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\u0026lt;5\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e or \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmn\u003e50\u003c/mn\u003e\u003cmi\u003e%\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\u0026gt;50\\%\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e of reviews, leaving 12,176 stems, and split by rating (1–2, 3, 4–5 stars): \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e12\u003c/mn\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmn\u003e176\u003c/mn\u003e\u003cmo\u003e×\u003c/mo\u003e\u003cmn\u003e3\u003c/mn\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e36\u003c/mn\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmn\u003e528\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e12{,}176\\times3=36{,}528\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e features.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e“Clean” in low- and high-star reviews are different features. As of 2016 about 40% of restaurants have no recent reviews, hence no text signal.\u003c/p\u003e\n\u003ch4 id=\"fz2026-en-mnir-multinomial-inverse-regression-and-dmr-distributed-multinomial-regression\"\u003e(2) MNIR (multinomial inverse regression) and DMR (distributed multinomial regression)\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def-mnir\"\u003eDef (MNIR)\u003c/h5\u003e\n\u003cp\u003eAsks the reverse question, how word use changes when a violation is present, with a multinomial model of word probabilities: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒄\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e∣\u003c/mo\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒗\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e∼\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eMN\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒒\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\boldsymbol c_i\\mid\\boldsymbol v_i\\sim\\operatorname{MN}(m_i,\\boldsymbol q_i)\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eq\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003ee\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/msup\u003e\u003cmi\u003e/\u003c/mi\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmsup\u003e\u003cmi\u003ee\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eq_{ij}=e^{\\eta_{ij}}/\\sum_k e^{\\eta_{ik}}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ea\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝝓\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003cmi\u003e⊤\u003c/mi\u003e\u003c/msubsup\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒗\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒃\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003cmi\u003e⊤\u003c/mi\u003e\u003c/msubsup\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒘\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\eta_{ij}=a_j+\\boldsymbol\\phi_j^{\\top}\\boldsymbol v_i+\\boldsymbol b_j^{\\top}\\boldsymbol w_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, with \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003em_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e the total word count. All words share the denominator, so all coefficients are estimated jointly.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-def-dmr\"\u003eDef (DMR)\u003c/h5\u003e\n\u003cp\u003eSplits MNIR into one Poisson regression per word so that huge vocabularies can be fit in parallel: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e∼\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003ePois\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmo minsize=\"120%\" maxsize=\"120%\" stretchy=\"true\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003ee\u003c/mi\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eμ\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003cmo minsize=\"120%\" maxsize=\"120%\" stretchy=\"true\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003ec_{ij}\\sim\\operatorname{Pois}\\big(e^{\\mu_i+\\eta_{ij}}\\big)\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, with \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eμ\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmsub\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\mu_i=\\log m_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e replacing the shared denominator. Given the total, independent Poissons are multinomial, so words are fit separately in parallel (approximating the MNIR MLE).\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use-1\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eHuge vocabularies, to learn how text shifts with a known label and build a low-dimensional signal (DMR when MNIR is too large to fit).\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use-1\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003eMNIR estimated by DMR, one Poisson regression per word. The paper’s Eq. (2) also has a rating-group main effect \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eα\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003er\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\alpha_jr_j\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e and a word offset \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eμ\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\mu_j=\\log\\sum_ic_{ij}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e. \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒗\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\boldsymbol v_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e: 20 violation indicators (interacted with star groups), controls: year-month, cuisine, zip code, chain.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read-1\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eϕ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\phi_{vj}\u0026gt;0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e: word \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ej\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ej\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e is more frequent when violation \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ev\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e occurs. This is a conditional association, and modeling text given violations implies no causality.\u003c/p\u003e\n\u003ch4 id=\"fz2026-en-lasso\"\u003e(3) LASSO\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def-1\"\u003eDef\u003c/h5\u003e\n\u003cp\u003eAdds a penalty on the sum of absolute coefficients to a regression’s loss, which prevents overfitting and sets unimportant coefficients exactly to 0: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmover\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜷\u003c/mi\u003e\u003cmo accent=\"true\"\u003ê\u003c/mo\u003e\u003c/mover\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003earg\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003emin\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜷\u003c/mi\u003e\u003c/msub\u003e\u003cmspace width=\"0.222em\"\u003e\u003c/mspace\u003e\u003cmi mathvariant=\"script\"\u003eℒ\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜷\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eλ\u003c/mi\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e|\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e|\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\widehat{\\boldsymbol\\beta}=\\arg\\min_{\\boldsymbol\\beta}\\ \\mathcal L(\\boldsymbol\\beta)+\\lambda\\sum_k\\lvert\\beta_k\\rvert\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, with a larger \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eλ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\lambda\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e meaning a heavier penalty.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use-2\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eMany more coefficients than real signals, when sparsity and protection against overfitting are needed.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use-2\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003eEq. (3) adds \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eλ\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmo stretchy=\"true\" form=\"prefix\"\u003e‖\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eα\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"true\" form=\"postfix\"\u003e‖\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmo stretchy=\"true\" form=\"prefix\"\u003e‖\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"true\" form=\"postfix\"\u003e‖\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmo stretchy=\"true\" form=\"prefix\"\u003e‖\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eϕ\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"true\" form=\"postfix\"\u003e‖\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\lambda_j(\\lVert\\alpha_j\\rVert_1+\\lVert\\beta_j\\rVert_1+\\lVert\\phi_j\\rVert_1)\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e to each word’s Poisson loss (the intercept gets only a small penalty, see the paper’s endnote 12), and each \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eλ\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\lambda_j\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e is chosen by restaurant-grouped 5-fold CV to minimize held-out loss (error on the fold not used for estimation).\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read-2\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003eZero means “not kept under this model and penalty”, not a true zero effect or a \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ep\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e-value. Nonzero coefficients are shrunk.\u003c/p\u003e\n\u003ch4 id=\"fz2026-en-sr-projection-sufficient-reduction\"\u003e(4) SR projection (sufficient reduction)\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def-2\"\u003eDef\u003c/h5\u003e\n\u003cp\u003eCompresses tens of thousands of word counts into a few scores while keeping the information relevant to the target: find low-dimensional \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003eZ\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e with \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmo\u003e⟂\u003c/mo\u003e\u003cmi\u003eX\u003c/mi\u003e\u003cmo\u003e∣\u003c/mo\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eY\\perp X\\mid Z\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e. In MNIR, \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒛\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003eΦ\u003c/mi\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒄\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\boldsymbol z_i=\\Phi\\boldsymbol c_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e is sufficient for \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒗\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\boldsymbol v_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e given document length and controls.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use-3\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eTo compress high-dimensional text into a few target-specific scores for a prediction model.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use-3\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmover\u003e\u003cmi mathvariant=\"normal\"\u003eΦ\u003c/mi\u003e\u003cmo accent=\"true\"\u003ê\u003c/mo\u003e\u003c/mover\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\widehat\\Phi\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e is \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e20\u003c/mn\u003e\u003cmo\u003e×\u003c/mo\u003e\u003cmi\u003ep\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e20\\times p\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, projecting the negative reviews from the 90 days before the inspection onto 20 scores \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ez\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmover\u003e\u003cmi\u003eϕ\u003c/mi\u003e\u003cmo accent=\"true\"\u003ê\u003c/mo\u003e\u003c/mover\u003e\u003cmrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003ez_{iv}=\\sum_j\\widehat\\phi_{vj}c_{ij}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, used as classifier features.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read-3\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003eLarger \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003ez\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003ez_{iv}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e: text looks more like reviews of places with violation \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ev\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e. It is a linear score, weights can be negative, and the direction is learned from labels (unlike PCA). The paper calls it an approximate violation probability, though it is not bounded in \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e[\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e]\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e[0,1]\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e.\u003c/p\u003e\n\u003ch4 id=\"fz2026-en-nested-cross-validation-grouped-by-restaurant\"\u003e(5) Nested cross-validation (grouped by restaurant)\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def-3\"\u003eDef\u003c/h5\u003e\n\u003cp\u003eTwo layers of cross-validation, the inner one to pick settings and the outer one to score them, so the same data are not used for both: outer \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eK\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003eK\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e folds estimate out-of-sample performance, inner \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eK\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003eK\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e folds within each outer training set choose hyperparameters \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eh\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003eh\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, and grouped CV keeps a group’s observations in one fold.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use-4\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eTuning plus honest evaluation with grouped data (many inspections per restaurant) that could leak.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use-4\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e5 outer and 5 inner folds, \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eh\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003eh\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e chosen by mean AUC, and \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmover\u003e\u003cmi mathvariant=\"normal\"\u003eΦ\u003c/mi\u003e\u003cmo accent=\"true\"\u003ê\u003c/mo\u003e\u003c/mover\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\widehat\\Phi\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e and the classifier are refit on training folds only, so test labels never enter features.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read-4\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003eAUC is out-of-sample on unseen restaurants. Algorithm 1 says “minimize AUC”, but from context it should be “maximize”.\u003c/p\u003e\n\u003ch4 id=\"fz2026-en-gradient-boosted-decision-trees-gbdt-lightgbm\"\u003e(6) Gradient-boosted decision trees (GBDT, LightGBM)\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def-4\"\u003eDef\u003c/h5\u003e\n\u003cp\u003eAdds small decision trees one at a time, each fixing what the earlier trees still get wrong: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmi\u003eM\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒙\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmsubsup\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cmi\u003eM\u003c/mi\u003e\u003c/msubsup\u003e\u003cmsub\u003e\u003cmi\u003ef\u003c/mi\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒙\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eF_M(\\boldsymbol x)=F_0+\\eta\\sum_{m=1}^{M}f_m(\\boldsymbol x)\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, where tree \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003em\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003em\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e fits the negative log-loss gradient at \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eF_{m-1}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ey\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msubsup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003ey_i-p_i^{(m-1)}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, and \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmi\u003e/\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003ee\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmi\u003eF\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003ep=1/(1+e^{-F})\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use-5\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eTabular data with nonlinearities and interactions where accuracy matters.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use-5\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003eOne classifier per violation. The baseline uses the posted grade only, augmented adds average stars and the 20 SR scores.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read-5\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003eOutput is a predicted violation probability, not a causal effect. Results are similar with penalized logistic regression (next item).\u003c/p\u003e\n\u003ch4 id=\"fz2026-en-b-penalized-logistic-regression-alternative-to-gbdt\"\u003e(6b) Penalized logistic regression (alternative to GBDT)\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def-5\"\u003eDef\u003c/h5\u003e\n\u003cp\u003eA logistic regression for a binary outcome with a penalty against overfitting: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmfrac\u003e\u003cmsub\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/mfrac\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒙\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003e⊤\u003c/mi\u003e\u003c/msubsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜷\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\log\\frac{p_i}{1-p_i}=\\beta_0+\\boldsymbol x_i^{\\top}\\boldsymbol\\beta\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, fit by \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003emin\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜷\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo minsize=\"120%\" maxsize=\"120%\" stretchy=\"true\" form=\"prefix\"\u003e[\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ey\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmsub\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ey\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo minsize=\"120%\" maxsize=\"120%\" stretchy=\"true\" form=\"postfix\"\u003e]\u003c/mo\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eλ\u003c/mi\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜷\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\min_{\\beta_0,\\boldsymbol\\beta}-\\sum_i\\big[y_i\\log p_i+(1-y_i)\\log(1-p_i)\\big]+\\lambda P(\\boldsymbol\\beta)\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, with \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e|\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e|\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eP=\\sum_k\\lvert\\beta_k\\rvert\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e (L1, LASSO) or \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmsubsup\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003ek\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msubsup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\sum_k\\beta_k^2\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e (L2, ridge).\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use-6\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eBinary outcomes needing a linear, interpretable, regularized model, or to check that nonlinear results are not an artifact.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use-6\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003eMentioned only in footnote 16 (similar results). L1 vs. L2 and the numbers are not reported.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read-6\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003eLog-odds are linear in the features, with no automatic interactions. Similar results mean Yelp’s added information does not rely on GBDT’s flexibility.\u003c/p\u003e\n\u003ch4 id=\"fz2026-en-auc-and-deltamathrmauc\"\u003e(7) AUC and \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eA\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eU\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eC\u003c/mi\u003e\u003c/mrow\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\Delta\\mathrm{AUC}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def-6\"\u003eDef\u003c/h5\u003e\n\u003cp\u003eMeasures ranking ability: draw one inspection with a violation and one without, and AUC is the chance the model ranks the violating one higher, \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eA\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eU\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eC\u003c/mi\u003e\u003c/mrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003eS\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003c/msup\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003eS\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003c/msup\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmstyle displaystyle=\"false\"\u003e\u003cmfrac\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/mfrac\u003e\u003c/mstyle\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003eS\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003c/msup\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003eS\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003c/msup\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\mathrm{AUC}=P(S^+\u0026gt;S^-)+\\tfrac12P(S^+=S^-)\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, with range 0–1.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use-7\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eComparing ranking ability across models without a threshold, or with imbalanced classes.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use-7\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eA\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eU\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eC\u003c/mi\u003e\u003c/mrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eA\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eU\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eC\u003c/mi\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eA\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eU\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eC\u003c/mi\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmn\u003e0\u003c/mn\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\Delta\\mathrm{AUC}_v=\\mathrm{AUC}_{1,v}-\\mathrm{AUC}_{0,v}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e (augmented minus baseline) measures Yelp’s informativeness about \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ev\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e. AUCs are about 0.51–0.68, baselines almost all \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e\u0026lt;\u003c/mo\u003e\u003cmn\u003e0.55\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\u0026lt;0.55\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, and most gains come from text. Informative five: 02B hot food temperature, 04H contaminated food, 04M live roaches, 04A supervisor lacks a Food Protection Certificate, 02G cold food temperature.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read-7\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e0.5 is random, and 0.68 is not “68% correct”, nor an effect size or causal evidence. Reviews inform about what customers can see or taste and little else. The paper calls certifications hard to predict, yet 04A makes the top five.\u003c/p\u003e\n\u003ch3 id=\"fz2026-en-causal-inference-demand-side-and-supply-side\"\u003e3.2 Causal inference: demand side and supply side\u003c/h3\u003e\n\u003ch4 id=\"fz2026-en-event-study\"\u003e(8) Event study\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def-7\"\u003eDef\u003c/h5\u003e\n\u003cp\u003eCompares outcomes day by day before and after an event, relative to a reference day: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eα\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmrow\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cmo\u003e≠\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003c/msub\u003e\u003cmn mathvariant=\"bold\"\u003e𝟏\u003c/mn\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e{\u003c/mo\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eE\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e}\u003c/mo\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝑿\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003cmi\u003e⊤\u003c/mi\u003e\u003c/msubsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜽\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eε\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eY_{it}=\\alpha_i+\\sum_{\\tau\\neq\\tau_0}\\beta_\\tau\\mathbf 1\\{t-E_i=\\tau\\}+\\boldsymbol X_{it}^{\\top}\\boldsymbol\\theta+\\varepsilon_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, where \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eE\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eE_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e is the event date and \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\beta_\\tau\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e compares relative time \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\tau\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e with reference \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\tau_0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use-8\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eTo trace an effect before and after an event and check pre-event trends.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use-8\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003eEq. (4). Event: a 1–3 star review day whose hygiene signal \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eH\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ed\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003er\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cmo\u003e∈\u003c/mo\u003e\u003cmsub\u003e\u003cmi mathvariant=\"script\"\u003e𝒱\u003c/mi\u003e\u003cmn\u003e5\u003c/mn\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003ez\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003er\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eH_{id}=\\sum_r\\sum_{v\\in\\mathcal V_5}z_{rv}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e is among the worst 20% of all low-star reviews. Window \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e±\u003c/mi\u003e\u003cmn\u003e15\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\pm15\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e days, event day as reference (\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\beta_0=0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e). Controls: restaurant \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003e×\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\times\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e event FE, day of week, average stars, grade.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read-8\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\beta_\\tau\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e: sell-out probability on day \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\tau\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e vs. the event day. Figure 6 shows a gradual decline, lowest around one week. Pooled After (Table 3, col. 1): \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e0.005\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.005\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e (SE 0.0009), N = 534,459, i.e., 0.5 percentage points, not 0.5%, or about 2.6% of the 0.19 base. With no control group, it assumes review timing is exogenous given controls.\u003c/p\u003e\n\u003ch4 id=\"fz2026-en-difference-in-differences-did\"\u003e(9) Difference-in-differences (DiD)\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def-8\"\u003eDef\u003c/h5\u003e\n\u003cp\u003eCompares how much the treated group changes from before to after with how much the control group changes, removing the shared trend: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003ea\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eb\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eδ\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eε\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eY_{it}=a+bT_i+cP_t+\\delta T_iP_t+\\varepsilon_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eδ\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmover\u003e
