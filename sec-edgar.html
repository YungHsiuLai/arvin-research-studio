利轉換的條款引用仍不清楚。"}, {"text_en": "The contract requires marketing and development efforts but lists no specific research tasks, roles or timetable. Such general duties do not establish a defined R\u0026D project.", "text_zh": "合約要求推廣技術並努力開發，但未列出具體研究工作、分工或時程。不能把這類一般義務直接當成明確研發專案。"}], "source_ids": ["case12"]}, {"id": "case13", "cells": [{"text_en": "UT-Battelle–MesoCoat (2009)", "text_zh": "UT-Battelle–MesoCoat (2009)"}, {"text_en": "UT-Battelle, LLC and MesoCoat Inc.: a license for thermal/infrared surface processing and protective coatings. The initial rights permit limited research and development. Conversion to U.S. commercial rights or an election of nonexclusive rights is not confirmed. Government and noncommercial rights are reserved.", "text_zh": "UT-Battelle 與 MesoCoat的授權合約，標的是利用熱／紅外線處理表面、塗層及防腐蝕的技術。目前條款先給有限研發權。之後能否轉為美國商業授權或選擇非專屬安排，尚未確認；政府及非商業用途另有保留。"}, {"text_en": "An attached commercialization plan identifies agreed tasks. Promised work hours are not a count of people and do not reveal total project staffing.", "text_zh": "合約附商業化計畫，可辨認約定要做的工作。承諾提供多少工作時數不等於總共多少人，不能據此算出完整專案人數。"}], "source_ids": ["case13"]}, {"id": "case14", "cells": [{"text_en": "NetReport–Aladdin (undated signatures)", "text_zh": "NetReport–Aladdin (簽署日期未載)"}, {"text_en": "NET REPORT S.A.S and Aladdin Knowledge Systems Ltd.: a license for software for analyzing and presenting eSafe security logs. The worldwide nonexclusive license allows the reporting software to be supplied with eSafe. The initial term is three years, followed by possible annual renewals; visible signatures do not establish the start date.", "text_zh": "NetReport 與 Aladdin的授權合約，標的是分析及呈現 eSafe 安全紀錄的軟體。全球非專屬授權，可將報表軟體搭配eSafe提供。初期三年、之後可按年續約，但簽署欄不足以確定起算日。"}, {"text_en": "Files, reports and documentation are due within 30 days, with four training days also required. These identify delivery tasks but do not prove delivery or training was completed.", "text_zh": "合約要求30天內交付檔案、報表及說明文件，另提供四天訓練，因此能辨認一組交付任務。這些是期限及承諾，不是已完成交付或訓練的證明。"}], "source_ids": ["case14"]}, {"id": "case15", "cells": [{"text_en": "Powdermet–MesoCoat (2008)", "text_zh": "Powdermet–MesoCoat (2008)"}, {"text_en": "Powdermet Inc. and MesoCoat Inc.: a license for nanocomposite/cermet powders and coating technology. Worldwide rights cover patents and know-how, subject to retained uses. Patents expire country by country; know-how rights are perpetual. The licensor’s rights to the licensee’s improvements depend on conditions.", "text_zh": "Powdermet 與 MesoCoat的授權合約，標的是奈米複合材料、金屬陶瓷粉末及塗層技術。全球授權同時涉及專利及專門技術，授權人仍保留部分使用權。專利依各國到期日結束，專門技術可永久使用；改良成果回授權另有條件。"}, {"text_en": "Technology transfer, installation and limited support identify agreed tasks. Partial support staffing or time allowances do not reveal the full project duration or total staff.", "text_zh": "合約列出技術移轉、安裝及一定範圍的支援，能辨認具體任務。只揭露部分支援人力或服務時間，仍不足以知道整個專案做多久、共有多少人。"}], "source_ids": ["case15"]}, {"id": "case16", "cells": [{"text_en": "ESPRE–Global IP Sound (2006)", "text_zh": "ESPRE–Global IP Sound (2006)"}, {"text_en": "ESPRE Solutions Inc. and Global IP Sound Inc.: a license for video-codec software for interactive communications. Worldwide nonexclusive video-codec rights begin on technology receipt, which is not confirmed. Restrictions for named customers do not make the whole license exclusive.", "text_zh": "ESPRE 與 Global IP Sound的授權合約，標的是互動通訊使用的視訊編解碼軟體。全球非專屬視訊編解碼權要在收到技術後開始，文件不足以確認已收到。特定客戶限制不代表整份授權都是專屬。"}, {"text_en": "Specified delivery and engineering support for integration identify concrete tasks. One support engineer is only a staffing subset, not the total project team, and does not prove completion.", "text_zh": "合約要求技術交付，並提供工程師協助整合，可辨認具體交付與支援工作。提到一名工程師只代表部分配置，不等於整個專案只有一人，也未證明工作已完成。"}], "source_ids": ["case16"]}, {"id": "case17", "cells": [{"text_en": "Bakhir–PuriCore (2014; 2016 amendments)", "text_zh": "Bakhir–PuriCore (2014; 2016 修約)"}, {"text_en": "Vitold Mikhailovich Bakhir (individual) and PuriCore Inc.: a license for electrochemical oxidation equipment and disinfection technology. The patent rights are exclusive, with later amendments expanding sublicensing. Patent life and service duration are different periods; version labels and signature dates differ.", "text_zh": "Bakhir 與 PuriCore的授權合約，標的是電化學氧化設備及消毒技術。專利授權為專屬，後續修訂擴大再授權範圍。專利可用多久與服務做多久是不同期間；文件標示與簽署日期也有差異。"}, {"text_en": "The services framework anticipates development, but a separate signed work assignment is required and is missing. No specific commissioned project can therefore be confirmed.", "text_zh": "服務合約預計會有開發工作，但具體任務必須另有已簽署的工作指派，現有文件沒有該份內容。因此無法確認某個具體專案已被委託。"}], "source_ids": ["case17"]}, {"id": "case18", "cells": [{"text_en": "Keigler–All Wet (1999)", "text_zh": "Keigler–All Wet (1999)"}, {"text_en": "Arthur Keigler (individual inventor) and All Wet Technology, Inc.: a license for Active Wafer technology for handling thin, flat workpieces. The individual inventor grants worldwide exclusive patent rights while retaining ownership and rights not granted. The pending-application term must be read as written, not replaced with an assumed fixed number of years.", "text_zh": "Keigler 與 All Wet的授權合約，標的是處理薄片工件的 Active Wafer 技術。個人發明人給全球專屬專利權，但保留所有權及未授予的權利。待審專利申請相關期間須依原條款理解，不能自行補固定年數。"}, {"text_en": "Technology-use rights and possible consulting do not supply a complete task plan or timetable. An inventor signing both personally and for a company does not create an additional participant.", "text_zh": "合約給予技術使用權，也提到可能提供顧問服務，但沒有完整任務或時程，無法確認明確專案。同一人以發明人及公司代表身分簽字，不代表多一個參與者。"}], "source_ids": ["case18"]}, {"id": "case19", "cells": [{"text_en": "KGI–Alder (2004)", "text_zh": "KGI–Alder (2004)"}, {"text_en": "Keck Graduate Institute of Applied Life Sciences and Alder BioPharmaceutical, Inc.: a license for yeast-based antibody/protein production and optimization. Exclusive patent rights and know-how rights for defined yeast-antibody uses are separate, with educational, research and publication rights reserved.", "text_zh": "Keck Graduate Institute 與 Alder的授權合約，標的是利用酵母製造及優化抗體／蛋白質的技術。專利專屬權與限酵母抗體用途的專門技術權分開授予，並保留教育、研究及發表用途。"}, {"text_en": "A Research Program and service payments are referenced, but missing Exhibit B leaves current versus historical work unresolved. The institute’s corporate legal form does not make it a commercial firm or tell us who works on the project.", "text_zh": "文件提到研究計畫及服務費用，但缺少附件B，無法分清是當前要做的工作還是過去的研究。機構採公司形式，也不代表它是商業公司或可據此算專案團隊。"}], "source_ids": ["case19"]}, {"id": "case20", "cells": [{"text_en": "TSMC–Ambiq (2011)", "text_zh": "TSMC–Ambiq (2011)"}, {"text_en": "Taiwan Semiconductor Manufacturing Co., Ltd. and Ambiq Micro: a license for semiconductor design libraries, bit-cells and embedded-flash technology. Nonexclusive technology releases require requests and approval; actual releases are not confirmed. TSMC-only fabrication is a separate duty. The framework starts with three years; subsequent annual renewals are not confirmed.", "text_zh": "TSMC 與 Ambiq的授權合約，標的是半導體設計元件庫、記憶單元及嵌入式快閃記憶體等技術。非專屬技術須先申請並獲核准才會提供，尚未確認實際提供哪些項目。產品另須由TSMC製造；合約框架初期三年，後續是否按年續約仍不知道。"}, {"text_en": "Design-use permissions and TSMC fabrication requirements do not specify full development tasks. They do not by themselves establish a defined R\u0026D project.", "text_zh": "合約允許使用設計技術，並要求由TSMC製造，卻未約定完整開發任務。這些授權與製造要求不足以確認一個具體研發專案。"}], "source_ids": ["case20"]}, {"id": "case21", "cells": [{"text_en": "Symbid Foundation–Holding (2013)", "text_zh": "Symbid Foundation–Holding (2013)"}, {"text_en": "Stichting Symbid IP Foundation and Symbid Holding B.V.: a license for crowdfunding platform technology and associated intellectual property. The foundation grants worldwide exclusive rights to the holding company. Later asset transfers depend on conditions. The holding-to-operating-company sublicense is a separate agreement.", "text_zh": "Symbid Foundation 與 Symbid Holding的授權合約，標的是線上群眾募資平台及相關智慧財產。基金會給控股公司全球專屬權，後續資產移轉要另符合條件。控股公司再授給營運公司的合約是另一份主約。"}, {"text_en": "Platform development, maintenance and future-IP transfers are permitted, but specific project tasks are not given. Missing Annex A also prevents a complete inventory of the licensed assets.", "text_zh": "文件允許平台開發、維護及移轉未來智慧財產，但沒有具體專案內容。缺少附件A，也無法列出完整的授權標的。"}], "source_ids": ["case21"]}, {"id": "case22", "cells": [{"text_en": "Data Domain–Quantum (2007)", "text_zh": "Data Domain–Quantum (2007)"}, {"text_en": "Data Domain, Inc. and Quantum Corporation: a license for data-storage and transmission patents. The reciprocal nonexclusive patent grants depend on share delivery, which is not confirmed. The 2012 cutoff determines which patents are included, not when the license expires.", "text_zh": "Data Domain 與 Quantum的授權合約，標的是資料儲存及傳輸專利。雙方的非專屬專利授權要等股份交付後生效，尚未確認已交付。2012年只是可納入哪些專利的截止日，不是整份授權到期日。"}, {"text_en": "Patent-use rights do not specify commissioned development tasks. Neither share delivery nor actual technology implementation can be inferred from the agreement.", "text_zh": "合約允許使用專利，未約定具體開發任務，無法確認有受委託的研發專案。也不能由條款推定已完成股票交付或已使用技術。"}], "source_ids": ["case22"]}, {"id": "case23", "cells": [{"text_en": "Apollo–HK Battery (2015)", "text_zh": "Apollo–HK Battery (2015)"}, {"text_en": "Apollo Acquisition Corporation and HK Battery Technology, Inc.: a license for lithium-titanate/nanocarbon battery-anode materials and preparation. The battery-anode technology is licensed exclusively in China, excluding even the licensor within that scope, for 20 years. The share transaction in the same document is not a second technology license.", "text_zh": "Apollo 與 HK Battery的授權合約，標的是鈦酸鋰／奈米碳電池負極材料及製備技術。電池負極技術在中國境內為專屬，連授權人也不能在該範圍自行使用，期間20年。同份文件的股份交易不另算一份技術授權。"}, {"text_en": "The contract assigns ownership and use of improvements but gives no complete tasks, roles or timetable. It establishes neither a defined project nor actual production.", "text_zh": "合約規定改良成果歸誰及如何使用，但沒有完整開發任務、分工或時程。因此不能確認有具體專案，也不能證明已實際生產。"}], "source_ids": ["case23"]}, {"id": "case24", "cells": [{"text_en": "Sanquin–Seattle Genetics (2001)", "text_zh": "Sanquin–Seattle Genetics (2001)"}, {"text_en": "Sanquin Blood Supply Foundation and Seattle Genetics, Inc.: a license for CD70 antibodies, hybridomas and related products. Worldwide nonexclusive research rights are separate from an option for exclusive commercial rights; exercise is not confirmed. Some commercial reservations and term details are redacted.", "text_zh": "Sanquin 與 Seattle Genetics的授權合約，標的是CD70 抗體、融合瘤細胞及相關產品技術。已有全球非專屬研究權，另可選擇取得專屬商業授權，但尚未確認已使用選擇權。部分商業權利及期間被刪除。"}, {"text_en": "The contract specifies antibody and hybridoma delivery, but this material handover alone does not establish a structured R\u0026D project, full research timetable or team. It is not included among the 19 defined/reported projects.", "text_zh": "合約明定要交付抗體及融合瘤細胞，可確認材料交付任務。但沒有完整研發工作、研究時程或人力資訊，單靠交付材料不足以確認明確研發專案，因此未列入19份明確／文件說已啟動的專案。"}], "source_ids": ["case24"]}, {"id": "case25", "cells": [{"text_en": "InterDigital–Samsung", "text_zh": "InterDigital–Samsung"}, {"text_en": "InterDigital Technology Corporation, Samsung Electronics Co., Ltd. and InterDigital Communications Corporation: a license for TDMA digital-wireless equipment technology. The parties exchange nonexclusive TDMA/digital-wireless rights, but Master Agreement definitions are missing and parts of the scope are redacted. InterDigital Communications Corporation (IDC) accepts only the obligations in Section 7.2 and Article 10.", "text_zh": "InterDigital 與 Samsung的授權合約，標的是TDMA 數位無線通訊設備技術。雙方互給非專屬TDMA／數位無線權利，但缺少總合約定義且部分內容刪除。InterDigital Communications Corporation（IDC）只就第7.2條及第10章承擔義務。"}, {"text_en": "Three named contracting roles do not imply equal R\u0026D participation. Possible future talks about additional patents establish neither a current project nor an additional completed license.", "text_zh": "三個具名締約角色不代表三方都以相同程度參與研發。日後可能談額外專利，也不能當成已有專案或已取得額外授權。"}], "source_ids": ["case25"]}, {"id": "case26", "cells": [{"text_en": "UT–Argus / Macrophage (1988)", "text_zh": "UT–Argus / Macrophage (1988)"}, {"text_en": "Board of Regents of the University of Texas System; University of Texas System Cancer Center; Argus Pharmaceuticals Inc. / The Macrophage Company Inc.: a license for liposomal antifungal, anthracycline and retinoid drug formulations. Worldwide exclusive drug rights depend on execution of the referenced research contract, which is not confirmed. A seventeen-year fallback and event rules do not establish a fixed seventeen-year initial term.", "text_zh": "Texas 大學與 Argus／Macrophage的授權合約，標的是以脂質體包覆抗黴菌藥、蒽環類藥物及維生素 A 酸類藥物的技術。全球專屬藥物權要先簽署合約引用的研發契約，尚未確認此條件已完成。十七年及其他事件條件共同決定期限，不等於固定十七年。"}, {"text_en": "Research funding is expressly agreed, so some research work is described. Missing Exhibit I leaves the full tasks and timetable unknown. The university board and cancer center are named roles, not independently verified separate legal persons.", "text_zh": "合約明載提供研究經費，顯示有研究工作安排；但缺少附件I，無法知道完整任務及時程。大學董事會與癌症中心是不同具名角色，不能因此當作兩個已確認的獨立法人。"}], "source_ids": ["case26"]}, {"id": "case27", "cells": [{"text_en": "Bridge Therapeutic–Bridge Oncology (2005)", "text_zh": "Bridge Therapeutic–Bridge Oncology (2005)"}, {"text_en": "Bridge Therapeutic Products Inc. and Bridge Oncology Products Inc.: a license for phenylbutyrate therapeutics and clinical drug development. The text grants exclusive sublicensed rights outside the United States and Canada. It states the agreement is binding, but PHS consent and the original chain of rights remain unverified.", "text_zh": "Bridge Therapeutic 與 Bridge Oncology的授權合約，標的是苯丁酸相關治療及臨床藥物開發技術。條款寫明給美國及加拿大以外的專屬再授權。主約說明具有拘束力，但PHS同意及原始權利是否已完整取得仍未核實。"}, {"text_en": "The agreement assigns clinical/regulatory tasks and costs by territory, identifying specific development work. Reports of earlier trials elsewhere do not prove this contractual program was carried out.", "text_zh": "主約分配不同地域的臨床及法規工作，也規定成本由誰負擔，因此可辨認具體開發安排。但其他文件提到過去做過試驗，不能證明本合約的計畫已執行。"}], "source_ids": ["case27"]}, {"id": "case28", "cells": [{"text_en": "American Power–Greenman (2009)", "text_zh": "American Power–Greenman (2009)"}, {"text_en": "American Power Group Inc. and GreenMan Technologies Inc.: a license for dual-fuel technology using hydrogen, methane and other fuels. Worldwide exclusive patent and technical-information rights end under combined patent and sales conditions, rather than a simple fixed term.", "text_zh": "American Power 與 Greenman的授權合約，標的是使用氫、甲烷等燃料的雙燃料技術。全球專屬專利及技術資訊的到期，依專利與銷售條件共同決定，不能直接填一個固定年數。"}, {"text_en": "Annual goals may be discussed if development efforts are inadequate. The document does not state complete current tasks, so a defined project cannot be confirmed.", "text_zh": "只有開發努力不足時，雙方才可能討論後續年度目標。目前文件沒有列出已確定要做的完整工作，因此無法確認明確專案。"}], "source_ids": ["case28"]}, {"id": "case29", "cells": [{"text_en": "Stanford–Alnylam–Isis (2005)", "text_zh": "Stanford–Alnylam–Isis (2005)"}, {"text_en": "Stanford University Board of Trustees, Alnylam Pharmaceuticals Inc. and Isis Pharmaceuticals Inc.: a license for microRNA-122/HCV therapeutics. Alnylam and Isis share exclusive rights in the defined HCV therapeutic field; other therapeutic uses are nonexclusive. A possible change after expiry is a future state, not an observed event.", "text_zh": "Stanford 大學、Alnylam 與 Isis的授權合約，標的是microRNA-122／C 型肝炎治療技術。Alnylam與Isis共享指定C型肝炎治療範圍的專屬權，其他病症用途另為非專屬。到期後可能改變權利，不能當成已發生。"}, {"text_en": "Each licensee has an agreed development program, but milestone actions and dates are partly redacted. Conditional joint development must not be presented as one fully observed joint project.", "text_zh": "兩家被授權人各有約定的開發計畫，但里程碑事項及日期部分刪除。共同開發另有條件，不能把不同公司的計畫合成一個已完整掌握的共同專案。"}], "source_ids": ["case29"]}, {"id": "case30", "cells": [{"text_en": "Minnesota–Celladon (2009)", "text_zh": "Minnesota–Celladon (2009)"}, {"text_en": "Regents of the University of Minnesota and Celladon Corporation: a license for pharmaceutical screening and testing patents. The university exclusively licenses only its share of jointly owned screening patents. Celladon’s rights are limited by enforceable patent claims and country-specific patent-cost choices; they do not include other co-owners’ shares.", "text_zh": "Minnesota 大學與 Celladon的授權合約，標的是藥物篩選及測試專利。大學把自己在共有專利中的權益專屬授權給Celladon。可用範圍還受專利保護內容及各國費用安排限制，不能當成取得所有人的完整權利。"}, {"text_en": "Screening and later development requirements include 24- and 60-month deadlines, identifying contracted work. These intermediate deadlines do not span the whole project.", "text_zh": "合約要求在24個月及60個月等期限內進行篩選與後續開發，因此能辨認約定工作。這些是特定進度期限，不是整個專案從開始到結束的期間。"}], "source_ids": ["case30"]}, {"id": "case31", "cells": [{"text_en": "Yale–Targacept (2007)", "text_zh": "Yale–Targacept (2007)"}, {"text_en": "Yale University and Targacept Inc.: a license for mecamylamine and related drugs for antidepressant augmentation. Worldwide exclusive human-therapeutic patent rights and nonexclusive rights to existing Yale data are separate grants. Their endpoints follow patent and royalty terms.", "text_zh": "Yale 大學與 Targacept的授權合約，標的是以 mecamylamine 等藥物輔助抗憂鬱治療的技術。全球人體治療專利為專屬，Yale既有資料為非專屬，兩者分開記。期限依專利及權利金期間決定。"}, {"text_en": "Reasonable development efforts and payments triggered by milestones do not supply complete tasks and timing. Payment milestones alone do not establish a defined development project.", "text_zh": "合約要求合理努力開發，也規定達到某些事件時付款，但沒有完整任務與時程。付款里程碑本身不足以確認一個內容明確的開發專案。"}], "source_ids": ["case31"]}, {"id": "case32", "cells": [{"text_en": "UT–Macrophage (1986)", "text_zh": "UT–Macrophage (1986)"}, {"text_en": "Board of Regents, University of Texas System; University of Texas System Cancer Center; The Macrophage Company, Inc.: a license for antitumor cytotoxins and liposomal TNF technology. The worldwide exclusive antitumor cytotoxin rights belong to the 1986 agreement, separate from the 1988 liposomal agreement. An opportunity to negotiate for new technology is not an existing license.", "text_zh": "Texas 大學與 Macrophage的授權合約，標的是抗腫瘤細胞毒素及脂質體 TNF 等技術。全球專屬抗腫瘤細胞毒素權屬1986年主約，與1988年脂質體合約不同。日後協商新技術的機會不是現有授權。"}, {"text_en": "Specified research, funding and responsibilities identify a program. Two years is the funding horizon, not necessarily the whole project; detailed tasks and total staffing are unavailable.", "text_zh": "文件明列研究內容、經費及責任分配，因此能辨認研究計畫。兩年是研究資助期間，不一定是整個專案期間；完整細部任務及總人數仍不知道。"}], "source_ids": ["case32"]}, {"id": "case33", "cells": [{"text_en": "Penn–ReGenX (2009)", "text_zh": "Penn–ReGenX (2009)"}, {"text_en": "The Trustees of the University of Pennsylvania and ReGenX LLC: a license for AAV-vector gene-therapy platform technology. Rights differ across patents and know-how: ordinary patents have exclusive rights, B-1 rights are nonexclusive, and B-2 rights are constrained by unclear GSK conditions. Reversion and sublicense events are not confirmed.", "text_zh": "Pennsylvania 大學與 ReGenX的授權合約，標的是AAV 病毒載體基因治療平台。不同專利及專門技術採不同權利：一般專利有專屬權，B-1為非專屬，B-2受GSK條件限制且範圍不明。權利收回或再授權條件尚未確認已發生。"}, {"text_en": "Required development events and task/timing plans identify agreed work, but milestone identities and dates are redacted. The option to enter a separate research agreement is not confirmed to have been exercised. Exhibit E is a blank royalty-report form, so it provides no observed sales or royalty income.", "text_zh": "合約要求產品開發、達成指定進度及訂定任務時程，可辨認具體開發安排。但里程碑內容及日期被刪除；另行簽研究合約的選擇權也未確認已使用。附件 E 是空白權利金報表範本，沒有實際銷售額或權利金收入。"}], "source_ids": ["case33"]}, {"id": "case34", "cells": [{"text_en": "Cyclone–Advent (2006; amendments through 2009)", "text_zh": "Cyclone–Advent (2006; 修訂至 2009)"}, {"text_en": "Cyclone Technologies LLLP (later Cyclone Power Technologies, Inc.) and Advent Power Systems, Inc.: a license for heat-regenerative engines and power applications. Engine rights vary by application, territory and amendment. Biomass rights replaced by later amendments are not counted in the reviewed version; continuation for postal uses, option exercise and payment remain unconfirmed.", "text_zh": "Cyclone 與 Advent的授權合約，標的是熱回收引擎及動力應用技術。不同引擎用途、地域及修訂版的權利不同。已被後續修訂取代的生質燃料權不納入目前版本；郵政用途是否延續、是否使用選擇權及付款，仍未確認。"}, {"text_en": "Amendment 10 reports a related Raytheon R\u0026D program, providing some work information. It does not set out a complete Advent–Cyclone joint project; the 2030 license endpoint is not a project end date.", "text_zh": "第10次修訂提到相關Raytheon研發計畫，顯示有部分研究活動資訊。但它未列明Advent與Cyclone共同要做的完整工作，2030年的授權期限也不是專案結束日。"}], "source_ids": ["case34"]}, {"id": "case35", "cells": [{"text_en": "Regulus–Biogen (2012)", "text_zh": "Regulus–Biogen (2012)"}, {"text_en": "Regulus Therapeutics Inc. and Biogen Idec MA Inc.: a license for miRNA and other biomarkers for multiple sclerosis. The parties exchange biomarker and research-IP rights. Multiple-sclerosis treatment rights that may arise after termination are separate; neither termination nor the resulting change is assumed to have occurred.", "text_zh": "Regulus 與 Biogen的授權合約，標的是多發性硬化症的 miRNA 等生物標記技術。雙方互授生物標記及研究成果相關權利。合約終止後才可能取得的多發性硬化症治療權另列，不能假定已終止或權利已改變。"}, {"text_en": "Defined biomarker research identifies agreed research tasks. The initial window is at most 24 months and can finish earlier, so 24 months is not the actual duration of the complete project.", "text_zh": "合約明定生物標記研究，可辨認研究任務。初期研究最多24個月，並可提早完成，因此不能把24個月直接當成完整專案的實際期間。"}], "source_ids": ["case35"]}, {"id": "case36", "cells": [{"text_en": "Rotoblock–Obvio (2006)", "text_zh": "Rotoblock–Obvio (2006)"}, {"text_en": "Rotoblock Corporation and Obvio! Automotoveiculos S.A.: a license for oscillating-piston engines and hybrid powertrains. The joint venture is expressly nonexclusive, but the contract does not state whether the technology license itself is exclusive. Permanent OPE use still requires development efforts; third-party development is separately reserved.", "text_zh": "Rotoblock 與 Obvio的授權合約，標的是振盪活塞引擎及混合動力系統技術。合資關係明寫不排他，但合約未說清楚技術授權本身是否專屬。永久使用OPE技術仍須履行開發努力義務；第三方開發另有保留。"}, {"text_en": "Joint prototype and hybrid-drive development is committed. The 18-month prototype-test checkpoint affects possible revocation; it is not the full duration or evidence of completed development.", "text_zh": "合約承諾共同開發原型與混合動力系統。18個月內通過原型測試是檢查進度及可能撤銷權利的條件，不是整個專案的期間，也不是已完成的證明。"}], "source_ids": ["case36"]}, {"id": "case37", "cells": [{"text_en": "Cassone–Medsonix (2006 replacement)", "text_zh": "Cassone–Medsonix (2006 替代版)"}, {"text_en": "Alphonse Cassone and Medsonix, Inc.: a license for acoustic-wave technology for tissue, circulation and related disorders. Exclusive commercialization rights are limited to the United States, excluding foreign rights and specified future concepts. The 2006 version fully replaces the 2004 version; together they count as one agreement.", "text_zh": "Cassone 與 Medsonix的授權合約，標的是以聲波處理組織、循環及相關疾病的專利技術。專屬權限於美國商業用途，未包含外國權利及指定未來概念。2006年版完整取代2004年版，兩者合併計一份主約。"}, {"text_en": "General sales efforts do not establish specific development tasks. Cassone’s personal and corporate signing capacities, plus a witness, do not determine the size of the project team.", "text_zh": "合約要求努力銷售，但沒有具體開發任務，無法確認研發專案。Cassone兼任個人授權人及公司簽署代表，另有見證人；這些簽名不能拿來算專案團隊人數。"}], "source_ids": ["case37"]}, {"id": "case38", "cells": [{"text_en": "NYU–Regulus (2011)", "text_zh": "NYU–Regulus (2011)"}, {"text_en": "New York University and Regulus Therapeutics Inc.: a license for microRNA33 reduction for metabolic disorders and atherosclerosis. Worldwide exclusive patent rights retain academic and government exceptions. NYU may grant rights in a specified infringement settlement, but such a settlement is not confirmed.", "text_zh": "New York University 與 Regulus的授權合約，標的是降低 microRNA33 以處理代謝疾病及動脈粥樣硬化的技術。全球專屬專利權保留學術及政府使用例外。NYU在特定侵權和解下可能給其他人授權，但尚未確認已發生。"}, {"text_en": "Development and regulatory duties identify specific work. The two-year IND/IDE deadline for a drug/device clinical-trial application is an intermediate milestone; other timing is redacted.", "text_zh": "合約要求推進開發及法規程序，可辨認具體工作。兩年內提交IND／IDE（藥物／醫材臨床試驗申請）的要求只是中途進度，其他時程仍被刪除。"}], "source_ids": ["case38"]}, {"id": "case39", "cells": [{"text_en": "Mississippi–ChromaDex (2010)", "text_zh": "Mississippi–ChromaDex (2010)"}, {"text_en": "University of Mississippi and ChromaDex, Inc.: a license for pterostilbene for health uses including foods and dietary supplements. The text expressly grants worldwide exclusive pterostilbene rights, but the required USDA approval is not reproduced. Health, food and supplement uses can place this agreement in several technology areas.", "text_zh": "Mississippi 大學與 ChromaDex的授權合約，標的是紫檀芪及其健康食品／膳食補充品等用途。合約明寫全球專屬紫檀芪權利，但沒有附上所需的USDA核准。約定用途含健康食品及補充品，所以可同時屬多個技術領域。"}, {"text_en": "An accepted commercialization plan and pre-set milestones establish development work. Missing Appendix B leaves the complete start/end dates and duration unknown.", "text_zh": "雙方已接受商業化計畫，且事先訂定開發里程碑，因此可確認有開發安排。但附件B未提供，無法知道完整起訖日及總期間。"}], "source_ids": ["case39"]}, {"id": "case40", "cells": [{"text_en": "LSI–VeriSilicon (2006)", "text_zh": "LSI–VeriSilicon (2006)"}, {"text_en": "LSI Logic Corporation, LSI Logic HK Holdings and VeriSilicon Holdings (Cayman Islands) Co., Ltd.: a license for digital-signal-processing cores, chips and related software. The parties exchange worldwide nonexclusive DSP rights and can negotiate royalties for future cores. The three named entities include an LSI subsidiary, so they are not three independent corporate groups.", "text_zh": "LSI、LSI 子公司與 VeriSilicon的授權合約，標的是數位訊號處理核心、晶片及相關軟體技術。雙方互給全球非專屬DSP技術權，另可就未來核心談權利金。三個具名實體包含LSI子公司，不是三個獨立企業集團。"}, {"text_en": "The New Design framework does not confirm a selected design project. Two-year fee rules and five-year chip tape-out requirements are not the full project or license duration.", "text_zh": "合約提供未來新設計的合作框架，卻未確認選定了哪個具體設計專案。兩年費用規則及五年內完成晶片設計送製造的要求，不等於完整專案或整份授權期間。"}], "source_ids": ["case40"]}, {"id": "case41", "cells": [{"text_en": "Pasteur–bluebird (2011; 2012 amendments)", "text_zh": "Pasteur–bluebird (2011; 2012 修訂)"}, {"text_en": "Institut Pasteur and bluebird bio, Inc.: a license for lentiviral-vector gene therapy and subsequently included CAR T-cell programs. The original lentiviral-vector patent rights and later CAR T-cell scope count as one agreement. Patent expiry and permitted early termination affect the term.", "text_zh": "Institut Pasteur 與 bluebird bio的授權合約，標的是慢病毒載體基因治療及後續加入的 CAR T 細胞計畫技術。原有慢病毒載體專利及修訂新增的CAR T細胞範圍，合併計同一份主約。專利到期或依約提前終止會影響期限。"}, {"text_en": "A 2012 amendment says a CAR T program was initiated, so this is recorded as a source-reported program. It does not establish current activity, success or total team size.", "text_zh": "2012年修訂文字說CAR T計畫已啟動，因此記錄為文件提到的研究計畫。文件沒有足夠資訊確認目前仍在進行、是否成功，或完整團隊人數。"}], "source_ids": ["case41"]}, {"id": "case42", "cells": [{"text_en": "Irvine–Aprolase (2009)", "text_zh": "Irvine–Aprolase (2009)"}, {"text_en": "Irvine Sensors Corporation and Aprolase Development Co., LLC: a patent license-back whose patent list and technology are not disclosed. It starts only after the defined closing, which is unconfirmed; past-tense sale wording elsewhere does not establish closing. Without the patent schedules, the full territory also remains unknown.", "text_zh": "Irvine Sensors與Aprolase的專利回授權合約，附件未揭露專利名稱及技術內容。專利回授權要等約定交割完成才開始，目前未確認。其他文字說曾出售資產，也不足以確認該條件；專利清單未附，技術及完整地域仍不知道。"}, {"text_en": "No defined development tasks are stated. Agreement dates, transaction obligations and payments cannot replace project start/end dates, duration or staffing.", "text_zh": "文件沒有列出明確開發工作。合約日期、交易及付款義務都不能替代專案開始日、結束日、總期間或參與人數。"}], "source_ids": ["case42"]}, {"id": "case43", "cells": [{"text_en": "PCT–Hitachi (2016)", "text_zh": "PCT–Hitachi (2016)"}, {"text_en": "PCT, LLC and Hitachi Chemical Co. Ltd.: a license for cell-therapy manufacturing, quality and service know-how. The know-how rights are exclusive within listed Asian territories. Any move to nonexclusive use after expiry is conditional. A Caladrius company filing corroborates entry into the agreement but does not resolve the March 11 versus March 22 date conflict.", "text_zh": "PCT 與 Hitachi的授權合約，標的是細胞治療製造、品質管理及服務技術。指定亞洲地域內的專門技術授權為專屬；到期後改非專屬仍有條件。另份Caladrius公司申報支持已締約，但3月11日與22日的日期差異仍未解決。"}, {"text_en": "Technology transfer, training and support identify concrete work. The ten-year agreement period differs from core rights that may continue perpetually; complete project duration and staff are not stated.", "text_zh": "合約明列技術移轉、訓練及支援，可辨認具體工作安排。十年是協議期間，部分核心權利可永久繼續；完整專案做多久及總人數仍未交代。"}], "source_ids": ["case43", "pct-parent-10q"]}, {"id": "case44", "cells": [{"text_en": "ESPRE–Blideo (2007)", "text_zh": "ESPRE–Blideo (2007)"}, {"text_en": "ESPRE Solutions, Inc. and Blideo, Inc.: a license for video compression, streaming, conferencing and multimedia software. Worldwide nonexclusive video/media rights have an initial five-year term. Later exclusive joint administration requires a separately negotiated addendum. This is separate from ESPRE–Global IP Sound. Schedule A illustrates video and codec functions; it reports no measured performance.", "text_zh": "ESPRE 與 Blideo的授權合約，標的是視訊壓縮、串流、會議及多媒體軟體技術。全球非專屬影音技術初期授權五年；日後若要採專屬共同管理，還要另談增補合約。此份與ESPRE–Global IP Sound不是同一主約。附件 A 的功能圖說明影音及編解碼用途，沒有實測效能。"}, {"text_en": "Support and software revisions describe some agreed work, but no complete task list or overall timetable is disclosed. The full project cannot be reconstructed.", "text_zh": "合約約定支援及軟體修改，顯示有部分工作安排。但沒有完整任務清單及總時程，因此仍無法還原整個專案。"}], "source_ids": ["case44"]}, {"id": "case45", "cells": [{"text_en": "BayPAT–Regulus (2010)", "text_zh": "BayPAT–Regulus (2010)"}, {"text_en": "Regulus Therapeutics Inc. and Bayerische Patentallianz GmbH: a license for miR-21 modulation for organ disease and fibrosis. Worldwide miR-21 therapeutic rights are initially exclusive; later nonexclusive use depends on conditions. Patent and first-sale rules determine the endpoint, not a uniform ten-year term.", "text_zh": "BayPAT 與 Regulus的授權合約，標的是調控 miR-21 以治療器官疾病／纖維化的技術。miR-21治療技術先授予全球專屬權，之後的非專屬使用須符合條件。到期看專利及首次銷售等條件，不能一律寫成十年。"}, {"text_en": "Development commitments are described, but redacted milestones prevent a complete timetable. BayPAT acts for the university; actual additional participants are not stated.", "text_zh": "文件有開發承諾，但里程碑被刪除，無法知道完整時程。BayPAT代表大學處理授權；實際還有哪些人員或公司參與並未交代。"}], "source_ids": ["case45"]}, {"id": "case46", "cells": [{"text_en": "MI–Regulus diagnostics (2009)", "text_zh": "MI–Regulus 診斷 (2009)"}, {"text_en": "Max-Planck-Innovation GmbH and Regulus Therapeutics Inc.: a license for microRNA-based human diagnostic products and services. Specified recipients share exclusive worldwide diagnostic rights. A maximum of four license slots does not establish four actual collaborators; this agreement is separate from the therapeutic license.", "text_zh": "Max-Planck-Innovation 與 Regulus的授權合約，標的是以 microRNA 製作人體診斷產品及服務的技術。全球診斷用途由指定對象共享專屬權。最多四個授權名額不代表已有四個合作方；本合約與治療用途授權合約分開計算。"}, {"text_en": "General commercialization duties give no full project tasks or timing. Patent expiry is not project completion, and missing project information does not mean no project exists.", "text_zh": "合約只有一般商業化義務，沒有足以還原專案的工作內容及時程。專利到期日不是專案結束日；沒有寫專案資訊也不代表沒有專案。"}], "source_ids": ["case46"]}, {"id": "case47", "cells": [{"text_en": "WDC–Sandisk (2025)", "text_zh": "WDC–Sandisk (2025)"}, {"text_en": "Western Digital Corporation and Sandisk Corporation: a license for flash memory, HDD/SSD storage and related software IP. The parties exchange nonexclusive storage and semiconductor IP rights through 17 grants with different product and use limits. Sandisk is described as WDC’s wholly owned subsidiary initially; completion of the separation is not confirmed.", "text_zh": "Western Digital 與 Sandisk的授權合約，標的是快閃記憶體、硬碟、固態硬碟及相關軟體智慧財產。雙方互授非專屬儲存及半導體智慧財產，17項授權各有自己的產品與使用範圍。文件說Sandisk起初為WDC全資子公司，不能據此確認分拆已完成。"}, {"text_en": "The company separation and future-product definitions do not establish a development project. Two named companies do not establish two independent corporate groups.", "text_zh": "企業分拆交易及未來產品的定義，不能證明另有開發專案。具名兩家公司也不等於兩個彼此獨立的企業集團。"}], "source_ids": ["case47"]}, {"id": "case48", "cells": [{"text_en": "NIH/NCI–Kyverna (2021)", "text_zh": "NIH/NCI–Kyverna (2021)"}, {"text_en": "HHS represented by NCI/NIH and Kyverna Therapeutics: a license for gene-edited allogeneic anti-CD19 CAR-T therapy for autoimmune disease. This is a filled-in, signed exclusive patent license for autoimmune CAR-T uses. HHS/NCI/NIH together form one government licensing side, not three contracting parties.", "text_zh": "HHS／NCI／NIH 與 Kyverna的授權合約，標的是用於自體免疫疾病的基因編輯異體 anti-CD19 CAR-T 細胞療法。這是已填寫並簽署的專屬自體免疫CAR-T專利授權。HHS／NCI／NIH合計是一個政府授權方，並非三個締約方。"}, {"text_en": "Development and progress requirements provide some work information, but redactions leave complete duration and staffing unresolved. The cover says there is no CRADA (Cooperative Research and Development Agreement); no separate research collaboration should be assumed.", "text_zh": "合約有開發及進度要求，但部分被刪除，只能確認部分工作安排；完整期間及人數仍不知道。封面另明寫沒有CRADA（合作研究與開發協議），不能自行補成另一份研究合作。"}], "source_ids": ["case48"]}, {"id": "case49", "cells": [{"text_en": "MI–Alnylam–Isis–Regulus (2004 family; 2011 restatement)", "text_zh": "MI–Alnylam–Isis–Regulus (2004家族；2011重述)"}, {"text_en": "Max-Planck-Innovation GmbH, Alnylam Pharmaceuticals Inc., Isis Pharmaceuticals Inc. and Regulus Therapeutics Inc.: a license for microRNA research and human therapeutic/prophylactic applications. The four-party restatement adds Regulus as a direct recipient of shared exclusive therapeutic rights. The 2004 agreement and amendments count once; the 2007/2009 three-party collaboration is a separate connected agreement.", "text_zh": "Max-Planck-Innovation、Alnylam、Isis 與 Regulus的授權合約，標的是microRNA 的研究及人體治療／預防用途。四方重述版讓Regulus直接加入共享治療用途專屬權。2004年主約與修訂只計一次；2007／2009年三方合作是另一份相關合約。"}, {"text_en": "No complete development tasks are stated. Three direct licensees, four contracting roles and actual project workers are different units. The precise restatement date also remains unclear.", "text_zh": "文件未明列一組完整開發任務。三個直接被授權人、四個締約角色，和實際研發參與者是不同數字，不能互換；重述版的確切日期也仍不清楚。"}], "source_ids": ["case49"]}, {"id": "case50", "cells": [{"text_en": "Missouri–Decibel (2019)", "text_zh": "Missouri–Decibel (2019)"}, {"text_en": "The Curators of the University of Missouri and Decibel Therapeutics Inc.: a license for therapy for hearing loss due to otoferlin or another redacted gene mutation. U.S. hearing-loss patent rights are exclusive. The contract separately addresses the university’s rights to the licensee’s improvements. Failure to meet development duties may allow the university to make the rights nonexclusive.", "text_zh": "Missouri 大學與 Decibel的授權合約，標的是 otoferlin 或另一刪節基因突變所致聽力損失的治療技術。美國聽損治療專利為專屬，另有不同範圍的改良成果回授權。未達開發要求時，大學可能將權利改成非專屬。"}, {"text_en": "A referenced commercialization plan provides some work information, but the plan is missing. Redacted gene identities and missing tasks/timing prevent complete project duration or staffing measures.", "text_zh": "合約引用商業化計畫，顯示有部分工作安排，但計畫未附。部分基因名稱被刪除，完整任務與時程也未提供，因此無法算出完整專案期間或人數。"}], "source_ids": ["case50"]}, {"id": "case51", "cells": [{"text_en": "UC Berkeley–4D Molecular Therapeutics (2013)", "text_zh": "UC Berkeley–4D Molecular Therapeutics (2013)"}, {"text_en": "The Regents of the University of California and 4D Molecular Therapeutics LLC license AAV2 gene-delivery patents and use of biological materials. Patent rights are exclusive outside eye-care applications, within covered patent countries; research uses are reserved. Rights end with the last valid claim. The separate material agreement and co-owner agreement are missing.", "text_zh": "加州大學董事會與4D Molecular Therapeutics的AAV2基因傳遞專利及生物材料使用授權。專利在眼科以外用途為專屬，限有相關專利權的國家，另保留研究使用權；期限至最後有效權利項到期。另件材料協議及共同權利人的協議未附。"}, {"text_en": "The contract refers to a commercialization plan and required development milestones. Tasks and deadlines are redacted, so only part of the planned work is identifiable. Complete project duration, start/end dates and total headcount cannot be measured. IGT is a named co-owner, not a third signatory.", "text_zh": "合約提到商業化計畫及必須達到的開發進度，但任務與期限被刪節，只能辨認部分工作安排，無法量出完整專案期間、起訖或總人數。IGT是被提及的共同權利人，不是第三個簽約方。"}], "source_ids": ["case51"]}, {"id": "case52", "cells": [{"text_en": "Yale–Rib-X (2001; amended through 2012)", "text_zh": "Yale–Rib-X（2001；含至2012年的修訂）"}, {"text_en": "Yale licenses ribosome-based antibiotic-design patents and information to Rib-X for human and veterinary medicines and diagnostics. Rights are exclusive worldwide, with government and academic research rights reserved. Patent rights last until the final patent expires; specified information rights can then continue nonexclusively.", "text_zh": "Yale與Rib-X針對核糖體抗生素設計專利及相關資訊的授權合約，用於人類與動物的藥品及診斷。全球權利為專屬，另保留政府與學術研究使用權。專利授權至最後一項專利到期；到期後，指定資訊仍可依非專屬授權繼續使用。"}, {"text_en": "Appendix C lists work for Years 1–4: antibiotic candidates, preclinical tests, clinical-trial applications and early trials. These stage targets do not give a complete project timeline. A first-year company chart includes named and unfilled roles, but no total for the project team. Sanofi is a later collaborator, not a signatory to this license.", "text_zh": "附件 C 列出第 1–4 年的候選抗生素、臨床前測試、臨床試驗申請及早期試驗工作。這些是階段目標，沒有完整專案起訖。第 1 年公司組織圖列出具名及待聘職位，但未列專案團隊總人數。Sanofi 是後續合作方，不是這份授權的簽約方。"}], "source_ids": ["case52"]}, {"id": "case53", "cells": [{"text_en": "MIT–Parasol / Visterra (2008; amended through 2014)", "text_zh": "MIT–Parasol／Visterra（2008；含至2014年的修訂）"}, {"text_en": "MIT licenses patents to Parasol, later named Visterra, for human and veterinary treatment, prevention and diagnostics. The remaining patents carry worldwide exclusive rights, subject to research, government and affordable-vaccine provisions. Rights run until the relevant patents and applications expire or are abandoned; some patent and product details are redacted.", "text_zh": "MIT與Parasol（後改名Visterra）針對人類與動物治療、預防及診斷技術的專利授權合約。修訂後保留的專利提供全球專屬權利，另有研究、政府及平價疫苗供應條款。期限至相關專利與申請到期或放棄；部分專利及產品細節被刪節。"}, {"text_en": "The company must submit a development plan, report progress and meet fundraising, research-spending and development milestones. The required plan is not provided and some deadlines are redacted, so full project timing and total staffing remain unknown.", "text_zh": "公司必須提出開發計畫、回報進度，並達到募資、研究支出與開發進度要求。應提交的計畫未附，部分期限也被刪節，因此完整專案時程與總人數仍不明。"}], "source_ids": ["case53"]}, {"id": "case54", "cells": [{"text_en": "Infineon–Nanya (2002)", "text_zh": "Infineon–Nanya（2002）"}, {"text_en": "Infineon and Nanya exchange DRAM manufacturing technology and develop 90/70 nm processes. Several cross-licenses are worldwide and nonexclusive, while parts of the 110 nm grant are redacted. That grant depends on disclosure and payment, and performance requires any necessary government approvals; fulfillment is unconfirmed.", "text_zh": "Infineon與南亞科技針對DRAM製程技術的相互授權及90／70奈米製程開發合約。多項相互授權為全球非專屬，但110奈米授權的部分內容被刪節。該授權以技術揭露及付款為條件，履行合約也須取得必要的政府核准；尚未確認這些條件已滿足。"}, {"text_en": "The companies must design processes, fabricate and test samples, and assign staff to the development work, mainly in Dresden and Munich. The schedule and staffing quantities are redacted, so complete project dates, duration and headcount cannot be recovered. License rights can continue after the cooperation agreement ends.", "text_zh": "雙方須設計製程、製造及測試樣品，並派員參與主要位於德勒斯登與慕尼黑的開發工作。時程與人力數字被刪節，無法還原完整專案起訖、期間或人數。部分授權權利可在合作協議結束後繼續。"}], "source_ids": ["case54"]}, {"id": "case55", "cells": [{"text_en": "Penn–FA212 (2020; amended through 2024)", "text_zh": "Penn–FA212（2020；含至2024年的修訂）"}, {"text_en": "Penn licenses AAV gene-therapy technology to FA212 for Friedreich’s ataxia. Product patents are exclusive worldwide; manufacturing patents and know-how are nonexclusive, with research and government rights reserved. The agreement follows country/product royalty periods, whose full lengths are partly redacted.", "text_zh": "Penn與FA212針對以AAV載體治療弗里德賴希氏共濟失調症的基因治療技術授權。產品專利為全球專屬，製造專利及技術知識為非專屬，另保留研究與政府權利。協議期間依各國、各產品的權利金期間決定，部分期間長度被刪節。"}, {"text_en": "Penn must perform preclinical work and deliver a report sufficient for a clinical-trial application; FA212 handles later development. The 2024 amendment adds application support until the first trial participant is dosed, subject to the named researcher and laboratory remaining at Penn. The detailed plan and some deadlines are unavailable, and total staffing is not stated.", "text_zh": "Penn須進行臨床前研究，交付足以申請臨床試驗的報告，後續開發由FA212負責。2024年修訂增加申請支援，至首位受試者接受給藥為止，但以指定研究者及實驗室仍留在Penn為條件。詳細計畫及部分期限無法取得，文件也未列總人數。"}], "source_ids": ["case55"]}, {"id": "case56", "cells": [{"text_en": "Regulus–Sanofi (2010; technology options and reverse patent license)", "text_zh": "Regulus–Sanofi（2010；技術授權選擇權及反向專利授權）"}, {"text_en": "Regulus offers Sanofi options to license microRNA technology for research and selected drug products; exercise is unconfirmed. Separately, Sanofi grants Regulus worldwide nonexclusive rights to certain patents that could block other microRNA collaborations. That reverse license excludes specified Sanofi programs and can continue after this agreement ends.", "text_zh": "Regulus給Sanofi日後取得microRNA研究及指定藥品技術授權的選擇權，但尚未確認Sanofi已使用。另一方面，Sanofi已在合約中授予Regulus全球非專屬專利權，讓其他microRNA合作可使用原本可能受阻的技術。這項反向授權排除指定Sanofi計畫，並可在協議結束後繼續。"}, {"text_en": "If Sanofi exercises the research option, Regulus must transfer materials and know-how, help optimize compounds and provide technical instruction. Exercise and the complete work plan are unconfirmed, while parts of the timetable are redacted. The document does not establish full project duration or total staffing.", "text_zh": "如果Sanofi使用研究授權選擇權，Regulus須提供材料與技術知識、協助改良化合物及提供技術指導。尚未確認選擇權已使用，也未取得完整工作計畫，部分時程被刪節。文件不足以確認完整專案期間或總人數。"}], "source_ids": ["case56"]}, {"id": "case57", "cells": [{"text_en": "Cisco–GlassHouse (2008)", "text_zh": "Cisco–GlassHouse（2008）"}, {"text_en": "GlassHouse licenses IT-service and data-centre tools to Cisco, including Atlas, the ITSM suite and Reflector. Core rights are worldwide, nonexclusive and perpetual, subject to software-sharing restrictions. The initial agreement lasts three years, but those rights can continue afterward; future custom work needs a separate signed work order.", "text_zh": "GlassHouse與Cisco針對IT服務及資料中心工具的授權合約，包含Atlas、ITSM工具組及Reflector。主要權利為全球非專屬且永久，但軟體對外提供另有限制。協議初期為三年，這些授權權利之後仍可繼續；未來客製開發須另簽工作單。"}, {"text_en": "GlassHouse must deliver the tools and provide four quarterly, two-day training workshops. Cisco may send up to ten employees per session, which does not reveal the number of different participants or the whole team. Future work orders are missing, so complete project duration and staffing remain unknown.", "text_zh": "GlassHouse須交付工具，並連續四季各提供一次、每次兩天的訓練。Cisco每次最多可派十人，但不能據此得知不同參與者或整個團隊的人數。未來工作單未附，因此完整專案期間與總人數仍不明。"}], "source_ids": ["case57"]}, {"id": "case58", "cells": [{"text_en": "Regulus–Glaxo (2010; SPC-3649)", "text_zh": "Regulus–Glaxo（2010；SPC-3649）"}, {"text_en": "Regulus grants Glaxo worldwide exclusive patent rights for SPC-3649 to treat or prevent hepatitis C, subject to existing third-party rights. Other rights require later negotiation or separate Santaris arrangements. The term follows payment obligations; Glaxo’s signature block names a representative acting for Wellcome, leaving signing capacity unresolved.", "text_zh": "Regulus與Glaxo針對SPC-3649治療或預防C型肝炎的全球專屬專利授權，並受既有第三方權利限制。其他權利須日後協商或另與Santaris安排。期間依付款義務決定；Glaxo簽名欄卻寫代表Wellcome簽署，代表身分仍未釐清。"}, {"text_en": "The parties must prepare a joint research plan if Glaxo obtains the specified SPC-3649 rights from Santaris. That acquisition and the actual plan are not established here. Full project dates, duration and staffing cannot be measured; broader clinical-development announcements in the attachment do not supply them.", "text_zh": "如果Glaxo從Santaris取得指定SPC-3649權利，雙方須共同擬定研究計畫。這份文件未確認權利已取得，也未提供實際計畫。完整專案起訖、期間及人數無法量出，附件中較廣的臨床開發公告也不能替代這些資料。"}], "source_ids": ["case58"]}, {"id": "case59", "cells": [{"text_en": "Seattle Genetics–Genentech (2007)", "text_zh": "Seattle Genetics–Genentech（2007）"}, {"text_en": "Seattle Genetics licenses SGN-40 and related anti-CD40 antibody patents and know-how to Genentech exclusively worldwide. Genentech grants Seattle Genetics limited, nonexclusive rights for assigned development and specified research. The grants require US antitrust (HSR) conditions to be met; this file does not confirm that happened. The agreement lasts until neither company has further payment obligations.", "text_zh": "Seattle Genetics 與 Genentech 針對 SGN-40 等抗 CD40 抗體的專利與技術資料授權合約，提供 Genentech 全球專屬權利。Genentech 另授予 Seattle Genetics 非專屬權利，用於指定開發與研究。授權須符合美國反壟斷（HSR）條件才生效；本文件未確認條件已達成。合約持續至雙方不再有付款義務。"}, {"text_en": "The two companies must follow a joint SGN-40 development plan and transfer manufacturing knowledge. The initial plan is redacted, and Seattle Genetics' six-year work period does not establish the full project duration. Total staffing is not stated.", "text_zh": "兩家公司須依共同計畫開發 SGN-40，並移轉製造技術。初期計畫被刪節；Seattle Genetics 的六年工作期間不等於整個專案的期間。文件未提供專案總人數。"}], "source_ids": ["case59"]}, {"id": "case60", "cells": [{"text_en": "Genor–TRC 2004 / Candid (2024; amended in 2025)", "text_zh": "Genor–TRC 2004／Candid（2024；2025 年修訂）"}, {"text_en": "Genor licenses GB261, a CD20/CD3 antibody, exclusively outside mainland China, Hong Kong, Macau and Taiwan. Genor receives exclusive rights to the licensee's related technology in those four areas; the licensee also has limited, nonexclusive research and manufacturing rights there. The main license becomes nonexclusive and permanent after the royalty term, which ends at the latest of patent expiry, regulatory exclusivity expiry and ten years after first sales in each country.", "text_zh": "Genor 與 TRC 2004／Candid 針對 GB261（CD20／CD3 雙特異性抗體）的授權合約，專屬範圍為中國大陸、香港、澳門及台灣以外地區。Genor 取得被授權方相關技術在上述四地的專屬權利；被授權方另可在四地依約進行有限的非專屬研究與製造。主要授權在權利金期間結束後改為永久、非專屬；期限依各國的專利到期、法規專屬保護到期與首次銷售後十年，取最晚者。"}, {"text_en": "Candid took over TRC 2004's agreement on a redacted date, replacing it as Genor's partner. The three company names describe two successive pairs, not three simultaneous partners. The 2025 amendment requires Candid to make reasonable efforts to run specified GB261 trials for autoimmune and inflammatory diseases in the four retained areas. Complete project timing and total staffing are not given.", "text_zh": "TRC 2004 已將整份合約轉讓給 Candid，轉讓日期被刪節；三個公司名稱代表前後兩組合作方，並非三方同時合作。2025 年修訂要求 Candid 盡合理努力，在上述四地進行指定的 GB261 自體免疫與發炎疾病試驗。文件未提供完整專案時程與總人數。"}], "source_ids": ["case60"]}, {"id": "case61", "cells": [{"text_en": "ACCESS–Palm / Palm Ireland (2006)", "text_zh": "ACCESS–Palm／Palm Ireland（2006）"}, {"text_en": "ACCESS Systems Americas licenses the Garnet mobile operating system and related software worldwide on a nonexclusive, permanent basis. These commercial rights begin only after acceptance and receipt of the second US$22 million payment; neither event is confirmed here. Rejection can invalidate the agreement from the start, and the text also treats a missed rejection notice as rejection.", "text_zh": "ACCESS Systems Americas 與 Palm／Palm Ireland 針對 Garnet 行動作業系統及相關軟體的授權合約，提供全球永久、非專屬權利。商業使用權須在驗收及收到第二筆 2,200 萬美元後才開始；本文件未證實這兩件事已發生。拒收可使合約自始失效；原文也規定未按時發出拒收通知會視為拒收。"}, {"text_en": "Three named companies form two commercial sides; this is not a count of three independent businesses. The signature blocks are blank, but the main text and linked patent document report execution on 5 December 2006. Required work includes software delivery, testing and 90 days of training and support from the delivery notice; full project duration and total staffing are unknown.", "text_zh": "主約列出三家公司，但商業合作分成兩方，不能當作三家獨立企業。簽名欄空白，但主約文字及連結的專利文件都記載於 2006 年 12 月 5 日締約。約定工作包括交付軟體、測試，以及從交付通知起算的 90 天訓練與支援；完整專案期間與總人數仍不明。"}], "source_ids": ["case61", "palm-companion"]}, {"id": "case62", "cells": [{"text_en": "Indevus–Novexel (2006)", "text_zh": "Indevus–Novexel（2006）"}, {"text_en": "Indevus licenses its aminocandin antifungal-drug know-how exclusively to Novexel worldwide. Novexel already owns the existing patents; this document licenses Indevus's development knowledge. Royalties last until the later of the relevant patent expiry and a redacted period after first sales; the know-how can then be used without royalties, but the clause does not say whether exclusivity continues.", "text_zh": "Indevus 與 Novexel 針對 aminocandin 抗黴菌藥物的技術資料授權合約，提供 Novexel 全球專屬權利。既有專利已由 Novexel 持有；這份合約授權的是 Indevus 累積的開發知識。權利金期限取相關專利到期與首次銷售後一段被刪節的期間，兩者較晚者；之後可免權利金繼續使用技術資料，但條文未說明是否仍為專屬。"}, {"text_en": "The two companies agree to transfer technical and regulatory records within 30 days, allow six months of records access and provide requested assistance during the first year. These overlapping periods do not give a complete project duration, and total staffing is not stated. Aventis joins a separate supply-related side agreement, not this main license.", "text_zh": "兩家公司約定在 30 天內移轉技術與法規資料，提供六個月的文件查閱，以及第一年內依要求提供的協助。這些期間可能重疊，不能據此算出完整專案長度；文件也未提供總人數。Aventis 參與另外的供應補充協議，並非這份主要授權合約的第三方。"}], "source_ids": ["case62"]}, {"id": "case63", "cells": [{"text_en": "Cyberonics–Ethicon Endo-Surgery (2007)", "text_zh": "Cyberonics–Ethicon Endo-Surgery（2007）"}, {"text_en": "Cyberonics licenses patents to Ethicon for devices that electrically stimulate three named nerves. Uses cover weight reduction, or hypertension and diabetes in patients with BMI of at least 25. Core patent rights are exclusive worldwide; qualifying future patents would be nonexclusive. The know-how schedule lists no items. The term ends with the last relevant patent, unless terminated earlier.", "text_zh": "Cyberonics與Ethicon針對電刺激三種指定神經的裝置專利授權。用途包括減重，或治療BMI至少25病人的高血壓與糖尿病。主要專利為全球專屬授權；日後若取得符合條件的專利，另採非專屬授權。技術知識清單未列項目。期限至最後相關專利到期，也可提前終止。"}, {"text_en": "The agreement requires information and patent-file transfer, but does not establish a defined current development project. Attached older licenses describe clinical studies and related payments. They do not provide this agreement’s full project duration or staffing; a 30-patient pilot describes study participants, not workers.", "text_zh": "合約要求交付資訊與專利卷宗，但未確立明確的當前開發專案。附錄中的舊授權提到臨床研究及相關付款，仍無法確認本約完整專案期間或總人數；30位病人的試驗是受試者數，不是工作人員數。"}], "source_ids": ["case63"]}, {"id": "case64", "cells": [{"text_en": "Primal–Time Warner Cable (2002; four amendments)", "text_zh": "Primal–Time Warner Cable（2002；含四份修訂）"}, {"text_en": "Primal licenses software for processing call records, calculating charges and displaying billing information to Time Warner Cable. Rights are nonexclusive at designated locations or the agreed hosted environment; subscriber use requires acceptance. The initial term is redacted, with annual renewals. The fourth amendment names Time Warner Cable LLC as the successor, but its printed date conflicts with the amendment it cites.", "text_zh": "Primal與Time Warner Cable針對通話紀錄處理、費用計算及帳單資訊呈現軟體的授權合約。軟體可在指定場所或約定代管環境非專屬使用，服務訂戶須先驗收。初期年數被刪節，其後按年續約。第四份修訂記載Time Warner Cable LLC承接合約，但其標示日期與所引用的前份修訂有矛盾。"}, {"text_en": "Primal must configure, test and install the software, then correct rejected work; the customer must prepare the site and perform acceptance tests. These are defined implementation tasks. Installation and testing deadlines use different starting events, so they cannot be added into a total project duration. Total staffing is not stated.", "text_zh": "Primal須設定、測試、安裝軟體，並修正未通過驗收的部分；客戶須準備場地及進行驗收測試。這些是明確的建置工作。安裝及測試期限各有不同起算事件，不能相加作專案總期間；文件也未列總人數。"}], "source_ids": ["case64"]}, {"id": "case65", "cells": [{"text_en": "Seattle Genetics–Agensys (2007)", "text_zh": "Seattle Genetics–Agensys（2007）"}, {"text_en": "Seattle Genetics and Agensys combine antibodies with drug-linker technology to make antibody–drug conjugates. Agensys gets exclusive worldwide research rights; Seattle gets limited nonexclusive research rights, with no territory stated. Both share exclusive worldwide rights for the initial joint product. Other commercial rights require option exercise or product-specific conditions. The agreement ends after both payment duties and joint development/commercialization end.", "text_zh": "Seattle Genetics 與 Agensys 針對抗體藥物複合體（ADC）的授權合約，將抗體與藥物連接技術結合。Agensys 取得全球專屬研究權；Seattle 取得有限的非專屬研究權，但該條文未載地區。初期共同產品由兩家公司共同享有全球專屬權利；其他商業權利須行使選擇權或符合各產品的條件。合約持續至付款義務與共同開發、銷售活動均結束。"}, {"text_en": "The two companies must conduct an ADC research program and jointly develop the initial product. Research end dates and the initial development plan are redacted; total staffing is not stated. This summary uses the 2007 terms. A later filing lists a 2009 amendment, whose terms are not included here.", "text_zh": "兩家公司須進行 ADC 研究並共同開發初期產品。研究結束時間與初期開發計畫被刪節，專案總人數未載。此處整理的是 2007 年條款；後續申報列有 2009 年修訂，但未將該修訂的內容納入此處。"}], "source_ids": ["case65", "seattle-agensys-amendment-reference"]}, {"id": "case66", "cells": [{"text_en": "Regulus–Sanofi (2010; restated in 2012)", "text_zh": "Regulus–Sanofi（2010；2012 年重訂）"}, {"text_en": "Regulus licenses patents and technical knowledge for agreed microRNA therapies and related diagnostic tests to Sanofi exclusively worldwide. miR21 is the one named target in the appendix; adding targets requires a written request, availability checks and payment. Regulus and upstream licensors retain some rights. The agreement ends when all payment duties end; the ten-year royalty minimum is not a fixed ten-year license.", "text_zh": "Regulus 與 Sanofi 針對約定的 microRNA 治療藥物及相關診斷檢測的專利與技術資料授權合約，提供 Sanofi 全球專屬權利。附錄僅具名列出 miR21；增加標的須提出書面要求、確認可授權並付款。Regulus 與上游授權人仍保留部分權利。合約持續至所有付款義務結束；至少十年的權利金期間不等於固定十年的授權。"}, {"text_en": "The two companies have a defined research program with an initial three-year phase from 21 June 2010; the 2012 restatement does not restart that clock. Six committee seats are governance roles, not total project staffing. Full project duration and total staffing remain unknown. This collaboration is separate from their technology-alliance and option agreement.", "text_zh": "兩家公司有明確研究計畫，初期研究階段自 2010 年 6 月 21 日起三年；2012 年重訂不重新起算。六個委員會席次是管理職位，不是專案總人數。完整專案期間與總人數仍不明。這份合作主約與雙方的技術聯盟／選擇權主約分開。"}], "source_ids": ["case66"]}, {"id": "case67", "cells": [{"text_en": "Regulus–AstraZeneca (2012)", "text_zh": "Regulus–AstraZeneca（2012）"}, {"text_en": "Regulus and AstraZeneca give each other limited, nonexclusive research rights. AstraZeneca's exclusive worldwide commercial rights begin only after a lead drug candidate is formally selected; this source does not establish that trigger. Its diagnostic rights are limited to tests supporting the licensed treatments. The agreement lasts until AstraZeneca's payment duties end; some rights become permanent and nonexclusive only after the relevant payments expire.", "text_zh": "Regulus 與 AstraZeneca 針對 microRNA 治療藥物的合作授權合約，雙方先互給有限的非專屬研究權。AstraZeneca 的全球專屬商業權利須在正式選定後續開發的候選藥物後才開始；此文件未證實該條件已達成。診斷權利限於支援授權療法的檢測。合約持續至 AstraZeneca 的付款義務結束；部分權利須待相關付款期限自然屆滿後，才改為永久、非專屬。"}, {"text_en": "The two companies set a four-year research phase beginning 14 August 2012. This does not cover all later clinical development and sales. The detailed plan is in a separate letter that is not included. Six committee seats describe governance, not total staffing. Complete project duration and total staffing are not given.", "text_zh": "兩家公司約定自 2012 年 8 月 14 日起進行四年的研究階段，不能以此代表後續臨床開發與銷售的完整期間。詳細計畫另載於未附上的信件。六個委員會席次是管理安排，不是全部工作人員；完整專案期間與總人數未提供。"}], "source_ids": ["case67"]}, {"id": "case68", "cells": [{"text_en": "WellPoint–Chordiant (2007)", "text_zh": "WellPoint–Chordiant（2007）"}, {"text_en": "Chordiant licenses call-centre software, servers and development tools to WellPoint for internal use on a permanent, nonexclusive basis. The license starts on delivery; the scheduled delivery date does not prove receipt. Locations may be worldwide, but the licensed customer-service scope covers the United States and Canada. User, CPU and developer limits are redacted.", "text_zh": "Chordiant 與 WellPoint 針對客服中心軟體、伺服器與開發工具的授權合約，提供內部使用的永久、非專屬權利。授權從交付時開始；約定交付日不等於已確認收到軟體。使用地點可在全球，但服務的客戶範圍限美國與加拿大。使用者、CPU 與開發者數量上限被刪節。"}, {"text_en": "The file contains software orders and general service rules, but no signed statement of work defining a particular implementation project. Its rate card lists job roles, not assigned people. The older SourceFile escrow is an attached document, not a third main licensing partner. Complete project timing and staffing cannot be determined.", "text_zh": "文件包含軟體訂單與一般服務規則，但未附上界定特定導入專案的已簽工作說明書。費率表列的是職務，不是實際派任人數。舊版 SourceFile 原始碼保管契約是附約，不是主要授權合約的第三家公司。完整專案時程與人數無法判斷。"}], "source_ids": ["case68"]}, {"id": "case69", "cells": [{"text_en": "Alnylam–Isis–Regulus (2009; amended through 2011)", "text_zh": "Alnylam–Isis–Regulus（2009；含至2011年的修訂）"}, {"text_en": "Alnylam and Isis license microRNA drug technology to Regulus worldwide. Antagonist rights are exclusive; the original approved-precursor rights and later mimic research rights are nonexclusive. Additional mimic or precursor development licenses need approval, which is unconfirmed. Regulus also grants the founders separate perpetual rights for specified single- or double-stranded technologies, with mimic-related exclusions.", "text_zh": "Alnylam與Isis將microRNA藥物技術授權給Regulus，地域為全球。抑制劑權利為專屬，原先核准的前驅物權利及後增的模擬物研究權為非專屬。額外模擬物或前驅物的開發授權須另獲核准，目前未確認已核准。Regulus也回授兩家創辦公司指定單股或雙股技術的永久權利，但保留模擬物相關例外。"}, {"text_en": "The agreement requires research reporting, technology exchange and decisions about which drug programs to continue. An attached earlier license lists development milestones, but the operating plan and current project list are missing. Full project timing and total staffing remain unknown; six working-group seats are not the team size.", "text_zh": "合約要求回報研究、交換技術，並決定哪些藥物計畫要繼續。附錄舊授權另列開發里程碑，但營運計畫與目前專案清單未附，因此完整工期及總人數仍不明；工作小組六個席次不等於團隊總人數。"}], "source_ids": ["case69", "alnylam-isis-regulus-amendment-1", "alnylam-isis-regulus-amendment-2"]}, {"id": "case70", "cells": [{"text_en": "Amgen–Celltech (2002; amended 2003)", "text_zh": "Amgen–Celltech（2002；含2003年修訂）"}, {"text_en": "Amgen and Celltech exchange worldwide rights to antibody technology for a target called BEER; the target identity and formal field are redacted. Some licenses allow the licensor and one licensee to use the technology; others are nonexclusive. Commercial responsibility differs by country. Exclusive rights in an attached replacement license require specified withdrawal or termination events, which are unconfirmed.", "text_zh": "Amgen與Celltech相互授權針對代號BEER標的的抗體技術，地域為全球；具體標的及正式用途領域被刪節。部分權利由授權人與唯一被授權人共同使用，其他權利為非專屬。商業主責按國家分配。附錄後續授權的專屬權須在指定退出或終止事件後才能啟動，目前未確認已發生。"}, {"text_en": "Celltech must supply research materials and data; Amgen must select clinical candidates, run studies and seek regulatory approval, with specified Celltech development tasks. The plan contains milestones, but its timeline and several deadlines are redacted. Full project duration and staffing are unknown; committee-seat limits and FTE workload are not total people.", "text_zh": "Celltech須提供研究材料與資料；Amgen須選擇臨床候選物、進行試驗及申請核准，Celltech另負責指定開發工作。計畫列有里程碑，但時程與多項期限被刪節，因此完整工期及總人數仍不明；委員席次上限與FTE工作量不是人數。"}], "source_ids": ["case70"]}, {"id": "case71", "cells": [{"text_en": "Alder–BMS (2009; 2011 work-plan addendum)", "text_zh": "Alder–BMS（2009；含2011年工作計畫增補）"}, {"text_en": "Two Alder companies and BMS agree to develop ALD518, an IL-6 antibody drug. AlderHoldings licenses the technology to BMS worldwide for agreed non-cancer uses. The attached announcement describes exclusive rights, while the formal grant wording is redacted. Cancer rights require a separate BMS option. The 2011 addendum says the original remains in force; completion of its antitrust conditions is still unverified.", "text_zh": "兩家Alder公司與BMS約定開發針對IL-6的抗體藥物ALD518，由AlderHoldings向BMS授權全球約定的非癌症用途。附錄公告稱這是專屬權，但正式授權用詞被刪節。癌症權利須由BMS另行行使選擇權。2011年增補稱原約繼續有效，反壟斷生效條件是否完成仍未確認。"}, {"text_en": "BMS leads clinical development. The 2011 work plan assigns production-strain development to Alder and manufacturing-process improvements to both companies, with product-quality testing. Its production goal and timeline are redacted. An earlier plan gives six months for one arthritis trial. Full program timing and total staffing remain unknown.", "text_zh": "BMS主導臨床開發。2011年工作計畫由Alder開發生產菌株，雙方共同改善製造流程並測試產品品質；生產目標數值與時程被刪節。較早計畫中一項關節炎試驗預定六個月，完整計畫的工期及總人數仍不明。"}], "source_ids": ["case71", "alder-bms-2011-addendum"]}, {"id": "case72", "cells": [{"text_en": "Royal Philips–Philips Semiconductors International (2006)", "text_zh": "Royal Philips–Philips Semiconductors International（2006）"}, {"text_en": "Royal Philips and PSI divide semiconductor intellectual property during a business separation. They retain or grant each other worldwide nonexclusive rights in specified patents, know-how and software. Some product rights require approval or proof of earlier co-funded research. Most licenses have no fixed general end. Polymer RFID rights can end on 1 January 2015 if PSI has not made and sold qualifying tags or labels before then.", "text_zh": "Royal Philips 與 PSI 針對半導體事業分拆所需的專利、技術知識及軟體授權合約。雙方保留或取得指定範圍的全球非專屬權利；部分產品須先獲核准，或證明來自先前共同出資研究。多數授權沒有共同的固定終點。若 PSI 在 2015 年 1 月 1 日前未製造並銷售符合條件的標籤，聚合物 RFID 授權就在當天終止。"}, {"text_en": "The text refers to earlier co-funded research, but the roadmaps and detailed plans are redacted. It does not establish a complete new joint research project, its total duration or its staffing. PSI has five years to meet specified phase-change memory product milestones to keep the related patents; that deadline is not the duration of the whole project. The older Cabot and Bitstream contracts concern separate work.", "text_zh": "文件提到先前共同出資研究，但路線圖和詳細計畫被刪節，無法確認完整的新共同研究專案、總期間或總人數。PSI 須在五年內達成相變記憶體的指定產品里程碑，才能保留相關專利；這個期限不是完整專案期間。附件中的舊 Cabot 與 Bitstream 合約涉及另外的工作。"}], "source_ids": ["case72"]}, {"id": "case73", "cells": [{"text_en": "Green Field–Turbine Powered Technology (2011)", "text_zh": "Green Field–Turbine Powered Technology（2011）"}, {"text_en": "Turbine Powered Technology licenses Frac Stack Pack technology and its trademark to Green Field Energy Services worldwide for turbine-driven hydraulic-fracturing equipment. The companies have a joint-venture relationship. Technical IP rights are perpetual. Initial exclusivity lasts five years and 30 days, with possible extension or early loss. The licensor retains specified use rights. Later trademark use has separate product limits.", "text_zh": "Turbine Powered Technology 向 Green Field Energy Services 授權 Frac Stack Pack 技術與商標，用於渦輪驅動水力壓裂設備，地域為全球。兩家公司有合資關係。技術權利永久，初始專屬期五年加 30 天，可能依條件延長或提早失去專屬性；授權人保留約定範圍的自用權。商標在專屬期後另有產品限制。"}, {"text_en": "The license covers making, using and servicing equipment. It does not specify a new development or implementation project. Project dates, duration and staffing are not stated. The referenced equipment purchase agreement is not included, so its broader product scope is unknown.", "text_zh": "授權涵蓋製造、使用及維修設備，未指定新的開發或導入專案，也未載專案日期、工期及人數。引用的設備採購合約未附，因此無法確認其中較廣的產品範圍。"}], "source_ids": ["case73"]}, {"id": "case74", "cells": [{"text_en": "Madison Energy Group–Real Estate Restoration and Rental (2010)", "text_zh": "Madison Energy Group–Real Estate Restoration and Rental（2010）"}, {"text_en": "Madison licenses EnerG2 commercial-cooler technology to Real Estate Restoration and Rental worldwide for an initial ten years. Madison keeps its own manufacturing rights but promises not to grant new licenses to others, despite the document also calling the license nonexclusive. Trademark rights are excluded, and the patent schedule has no filed application details.", "text_zh": "Madison 向 Real Estate Restoration and Rental 授權 EnerG2 商用冷卻設備技術，地域為全球，初始期間十年。Madison 保留自用製造權，但承諾不再授權其他公司；文件同時也使用「非專屬」一詞。商標不在授權內，專利附件尚未列出已申請案件的詳細資料。"}, {"text_en": "The licensee must use General Microcircuits to manufacture products. Possible joint improvements are covered, but no specific development plan, project timetable or total staff count is given.", "text_zh": "被授權方必須由 General Microcircuits 製造產品。合約也規定日後共同改良的權利，但未列出特定開發計畫、專案時程或總人數。"}], "source_ids": ["case74"]}, {"id": "case75", "cells": [{"text_en": "Flexpoint Sensor Systems–subVo (2019)", "text_zh": "Flexpoint Sensor Systems–subVo（2019）"}, {"text_en": "Flexpoint agrees to grant subVo exclusive worldwide Bend Sensor rights for devices that improve audio performance in speakers and loudspeakers. The license depends on a fee payment that is not confirmed in the document. The initial term is three years, followed by annual renewals unless terminated.", "text_zh": "Flexpoint 同意讓 subVo 在全球專屬使用 Bend Sensor 技術，範圍限於改善揚聲器音訊表現的設備。授權須先支付費用，文件沒有證明已付款。初始期間三年，之後按年自動續約，除非依約終止。"}, {"text_en": "The parties refer to an earlier development agreement, but it is not included. This license sets design-approval and IP-ownership rules without giving a specific work plan, project dates or total staff count.", "text_zh": "雙方提到先前的開發協議，但沒有附上內容。這份授權約定設計審核及智慧財產所有權規則，沒有列出具體工作計畫、專案日期或總人數。"}], "source_ids": ["case75"]}, {"id": "case76", "cells": [{"text_en": "eGene–SciBridge Software (2007)", "text_zh": "eGene–SciBridge Software（2007）"}, {"text_en": "SciBridge gives eGene worldwide source-code rights for instrument control and data analysis: exclusive BioCalculator rights and nonexclusive Core rights. Both licenses are perpetual, but Core rights can end if a material breach remains uncured after 30 days of notice. BioCalculator rights expressly survive agreement termination.", "text_zh": "SciBridge 將儀器控制及資料分析軟體的原始碼授權給 eGene，地域為全球：BioCalculator 部分為專屬，Core 共用元件為非專屬。兩項授權均為永久，但 Core 若重大違約且未於通知後 30 天內補救，可被終止；BioCalculator 權利則明文保留至合約終止後。"}, {"text_en": "SciBridge must deliver the existing source code and documentation within three days after receiving payment. Later maintenance or development services use a rate to be agreed. No specific project plan, full project timetable or total staff count is given.", "text_zh": "SciBridge 必須在收款後三天內交付既有原始碼及文件。日後維護或開發服務的費率須另行協議。文件沒有列出特定專案計畫、完整時程或總人數。"}], "source_ids": ["case76"]}]}, {"id": "cue-walkthrough", "title_en": "Data example: Cue Biopharma–LG Chem contract for licensing antigen-specific T-cell biologics technology", "title_zh": "資料實例：Cue Biopharma 與 LG Chem 的抗原特異性 T 細胞生物藥科技授權合約", "intro_en": "", "intro_zh": "", "columns": [{"id": "step", "label_en": "Step", "label_zh": "步驟"}, {"id": "coding", "label_en": "Coding and source location", "label_zh": "編碼與來源位置"}, {"id": "source_text", "label_zh": "文件原句", "label_en": "Original wording"}, {"id": "limit", "label_en": "What this does not tell us", "label_zh": "不能從這些資料知道什麼"}], "rows": [{"id": "step-1", "cells": [{"text_zh": "1. 先說清楚一筆資料算什麼。", "text_en": "1. Decide what one observation counts."}, {"text_en": "Count the Cue–LG main agreement once; do not add its stock-purchase appendix as another technology license. Record the effective date, 2018-11-06, separately from the filing date, 2018-12-26. — Opening and recitals; printed p. 1; Sections 2.1(a)–(f), 2.4(a)–(c); printed pp. 26–29; SEC filing, accession 0001193125-18-358131", "text_zh": "把這份Cue與LG的主約計一次，不再把附帶的股票認購合約當作另一份科技授權。生效日2018-11-06與申報日2018-12-26分開記錄。 — Opening and recitals; printed p. 1; Sections 2.1(a)–(f), 2.4(a)–(c); printed pp. 26–29; SEC filing, accession 0001193125-18-358131"}, {"text_zh": "Cue and LGC may be referred to herein individually as a “Party” or collectively as the “Parties”.\n— Opening; printed p. 1", "text_en": "Cue and LGC may be referred to herein individually as a “Party” or collectively as the “Parties”.\n— Opening; printed p. 1"}, {"text_zh": "同一個申報附件可能同時包含授權主約及股票認購合約。計算主約份數、授權項數與專案數時，不能把它們當作同一種單位。", "text_en": "An exhibit can contain both a license agreement and a stock-purchase contract. Agreement counts, individual grants and projects are different units."}], "source_ids": []}, {"id": "step-2", "cells": [{"text_zh": "2. 按授權方向與範圍分開記。", "text_en": "2. Separate rights by direction and scope."}, {"text_en": "Separate Cue-to-LG and LG-to-Cue rights, then record product, territory and permitted uses. Principal regional grants are exclusive; supporting rights are nonexclusive. Section 2.4(d) has a separate perpetual nonexclusive global grant; Section 2.11 is an option for an additional program. — Sections 2.1(a)–(f), 2.4(a)–(c); printed pp. 26–29; Sections 2.3, 2.5 and 2.9; printed pp. 28–31; Section 2.4(d); printed p. 29; Section 2.11; printed p. 32", "text_zh": "把Cue授予LG、LG授予Cue的權利分開，再分產品、地域及用途。兩個主要地域方向有專屬權，也有支援另一地域的非專屬權；第2.4(d)條另有永久非專屬全球權利，第2.11條則只是額外計畫的選擇權。 — Sections 2.1(a)–(f), 2.4(a)–(c); printed pp. 26–29; Sections 2.3, 2.5 and 2.9; printed pp. 28–31; Section 2.4(d); printed p. 29; Section 2.11; printed p. 32"}, {"text_zh": "an exclusive (even as to Cue and its Affiliates, subject to Cue’s retained rights under Section 2.3 and the [***])\n— Section 2.1(a); printed p. 26", "text_en": "an exclusive (even as to Cue and its Affiliates, subject to Cue’s retained rights under Section 2.3 and the [***])\n— Section 2.1(a); printed p. 26"}, {"text_zh": "這份合約不是所有技術都全球專屬。第2.4(d)條雖把技術內容刪除，仍明載另有授權，不能當成不存在。", "text_en": "Not every grant is globally exclusive. Section 2.4(d) states a separate grant even though the technology is redacted; redaction does not erase that grant."}], "source_ids": []}, {"id": "step-3", "cells": [{"text_zh": "3. 分清計畫、產品與地域項目。", "text_en": "3. Distinguish programs, products and territory entries."}, {"text_en": "CUE-101, 102 and 103 are three named programs, not three marketed products. The visible LG territory list has 11 top-level entries, with Hong Kong and Macao nested under China; this is not a count of sovereign countries or actual operations. — Sections 1.50–1.62, 1.113–1.124, 1.147; printed pp. 6–7, 11, 13; Sections 1.109 and 1.225; printed pp. 10, 19", "text_zh": "CUE-101、102、103是三個具名計畫，不等於三項已上市產品。LG地域定義有11個可見頂層項目，香港及澳門列在中國項下；這不是11個主權國家，也不能證明已在當地營運。 — Sections 1.50–1.62, 1.113–1.124, 1.147; printed pp. 6–7, 11, 13; Sections 1.109 and 1.225; printed pp. 10, 19"}, {"text_zh": "“Collaboration Compounds” means CUE-101 Compounds, CUE-102 Compounds, and CUE-103 Compounds each having both (a) a Collaboration Allele and (b) any epitope of a Collaboration Antigen.\n— Section 1.52; printed p. 6", "text_en": "“Collaboration Compounds” means CUE-101 Compounds, CUE-102 Compounds, and CUE-103 Compounds each having both (a) a Collaboration Allele and (b) any epitope of a Collaboration Antigen.\n— Section 1.52; printed p. 6"}, {"text_zh": "地域清單有幾個項目，不等於有幾個國家；寫進合約，也不代表實際已在那些地方開發或銷售。", "text_en": "Territory-list entries are not a country count. Contractual coverage does not show actual development or sales in those places."}], "source_ids": []}, {"id": "step-4", "cells": [{"text_zh": "4. 分開專案時程與授權期間。", "text_en": "4. Separate project timing from license duration."}, {"text_en": "Required research plans, budgets, responsibilities and approval establish contracted project work. Omitted schedules and absent actual dates leave complete project timing unknown. The main agreement instead ends according to product/country royalty conditions. — Sections 4.1–4.8; printed pp. 40–48; Sections 3.1–3.4; printed pp. 32–39; Exhibits D, E and F omission notices; Section 13.1; printed p. 97; Sections 7.6(b)–(e), 7.7(b)–(e), 7.8; printed pp. 66–69", "text_zh": "合約要求研究計畫、預算、分工及核准，所以記為有約定的專案。未公開的時程附件及欠缺實際執行日期，使完整專案起訖與期間仍無法得知；主約則按產品、國家及權利金到期條件決定期間。 — Sections 4.1–4.8; printed pp. 40–48; Sections 3.1–3.4; printed pp. 32–39; Exhibits D, E and F omission notices; Section 13.1; printed p. 97; Sections 7.6(b)–(e), 7.7(b)–(e), 7.8; printed pp. 66–69"}, {"text_zh": "The Research Plan for each Collaboration Compound shall include a budget for all Research Costs for each Party’s performance of its obligations thereunder (each, a “Research Budget”).\n— Section 4.2; printed p. 40", "text_en": "The Research Plan for each Collaboration Compound shall include a budget for all Research Costs for each Party’s performance of its obligations thereunder (each, a “Research Budget”).\n— Section 4.2; printed p. 40"}, {"text_zh": "簽約生效日、可以使用選擇權的兩年，以及決定權利金期限的十年規則，都不是完整研發專案的實際開始日、結束日或期間。", "text_en": "The effective date, two-year option window and ten-year royalty rule are not the actual start, end or full duration of the research project."}], "source_ids": []}, {"id": "step-5", "cells": [{"text_zh": "5. 委員會席次不是整個專案的人數。", "text_en": "5. Committee seats are not total project staff."}, {"text_en": "Two initial representatives from each party give four seats per committee. People may sit on more than one committee, so five committees do not imply 20 distinct people. Total project staff and LG on-site staffing remain unknown. — Section 3.2(a); printed p. 36; Sections 3.1–3.4; printed pp. 32–39; Section 3.5; printed p. 39; Section 4.13; printed p. 51", "text_zh": "每方初始派兩位代表，所以一個委員會有四個席次。但同一人可能參加多個委員會，不能把五個委員會乘成20名不同的人；整個專案總人數及LG駐點人數仍不知道。 — Section 3.2(a); printed p. 36; Sections 3.1–3.4; printed pp. 32–39; Section 3.5; printed p. 39; Section 4.13; printed p. 51"}, {"text_zh": "Each Party shall initially appoint two (2) representatives to each of the Committee, each of whom will be an officer, director, employee or consultant of such Party having sufficient authorization from the applicable Party to make decisions arising within the scope of the applicable committee’s responsibilities.\n— Section 3.2(a); printed p. 36", "text_en": "Each Party shall initially appoint two (2) representatives to each of the Committee, each of whom will be an officer, director, employee or consultant of such Party having sufficient authorization from the applicable Party to make decisions arising within the scope of the applicable committee’s responsibilities.\n— Section 3.2(a); printed p. 36"}, {"text_zh": "合約沒說同一人是否兼任多個委員會，也沒列出全部研發人員。即使約定派人，也不能證明這些人實際已到場工作。", "text_en": "The contract does not list overlapping committee members or all research staff. Promised staffing also does not establish actual attendance."}], "source_ids": []}], "source_ids": ["case2"]}]}}], "i18n": {"en": {"strings": {"職涯、人力、職缺與員工評論資料": "Career, workforce, job posting and employee review data", "由 Revelio Labs 整理 LinkedIn 等公開來源的全球職涯、招聘與員工評論資料，並提供 2008-01 至 2026-08 的公司月度人力動態資料。": "Global career, recruitment and employee review data compiled by Revelio Labs from public sources including LinkedIn, with monthly company workforce dynamics data from 2008-01 to 2026-08.", "職涯、人力、招聘廣告與員工評論資料；字典提供各表觀察單位、欄位定義、真實例子與行銷／B2B 的 DV／IV／控制變數適用性。": "Career, workforce, recruitment advertisement and employee review data; the dictionary provides each table's observation unit, field definitions, real examples and DV / IV / control suitability for marketing and B2B research.", "Compustat Segment 客戶—供應商關係與客戶銷售額": "Compustat Segment customer–supplier relationships and sales to customers", "以公司識別串接客戶—供應商關係、客戶銷售額及外部財務資料。": "Use company identifiers to link customer–supplier relationships, sales to customers and external financial data.", "WRDS 提供的 FactSet Revere 企業供應、客戶與合作關係預覽；本機資料的關係版本起始日涵蓋 2003-04-03 至 2015-05-11。": "A WRDS preview of FactSet Revere company supplier, customer and partnership relationships; relationship-version start dates in the local data span 2003-04-03 to 2015-05-11.", "WRDS 提供的 InfraClear 基礎建設合約、當事人角色、專案與條款抽取預覽；本機合約簽署日期涵蓋 1965-02-02 至 2025-03-24。": "A WRDS preview of InfraClear infrastructure contracts, party roles, projects and extracted clauses; contract signing dates in the local data span 1965-02-02 to 2025-03-24.", "WRDS 提供的 RoyaltyStat 授權合約、權利金與交易條件預覽；本機合約生效日期涵蓋 1997-05-28 至 2016-07-01。": "A WRDS preview of RoyaltyStat licensing agreements, royalties and transaction terms; agreement effective dates in the local data span 1997-05-28 to 2016-07-01.", "由 WRDS 串接 Compustat Segment 的客戶揭露與公司識別資料，已核對主表涵蓋 1976-06-30 至 2026-07-31 的供應商—客戶關係與客戶銷售資訊。": "WRDS links Compustat Segment customer disclosures with company identifiers; the verified main table covers supplier-customer relationships and sales-to-customer information from 1976-06-30 to 2026-07-31.", "RoyaltyStat 2006–2016 年淨銷售額計價授權紀錄，串接 1999–2016 年授權雙方公司財務資料。": "RoyaltyStat net-sales licensing records from 2006–2016, linked to both parties’ company financials for 1999–2016.", "從 SEC EDGAR 選取並下載申報於 2001-08-13 至 2018-12-26 的 EX-10 技術授權契約與 EX-11 每股盈餘計算附件。": "Selected EX-10 technology-license agreements and EX-11 earnings-per-share computation exhibits downloaded from SEC EDGAR, filed from 2001-08-13 to 2018-12-26.", "文件清單的識別與描述欄位本身不衡量行銷結果；契約與每股盈餘數值尚未抽取。": "Document-list identifiers/descriptions do not measure marketing outcomes; contract and EPS values have not been extracted.", "文件識別與取得資訊本身不代表行銷投入、契約或治理構念。": "Document identity/acquisition metadata do not themselves measure marketing investment, contracts or governance.", "供文件追溯、公司串接與重複檔案檢查；正式分析須另抽取內容、核對單位與期間，並決定有意義的構念。": "Use for document provenance, company linkage and duplicate checks. Analysis requires content extraction, units/period checks and substantively meaningful constructs.", "用於公開申報時間對齊；不是契約生效日、財報期間、處置或因果識別證據。": "Align public filing time; this is not a contract effective date, financial reporting period, treatment or evidence of causal identification.", "用於儲存與內容完整性檢查，不以檔案大小或雜湊值衡量公司績效或揭露品質。": "Use for storage/content integrity checks; file size and hashes do not measure firm performance or disclosure quality.", "附件文件清單": "Exhibit files", "一份已核實下載的附件；以 accession 加 filename 辨識文件": "One verified downloaded exhibit; accession plus filename identifies the document", "由公開文件整理的清單；型別是本機分析用宣告，不是 SEC 資料庫的 SQL 結構。契約條款與 EPS 數值仍在文件內，尚未抽成分析變數。": "A manifest derived from public documents. Types are local analysis declarations, not a SEC SQL schema. Contract terms and EPS values remain in the documents and have not been extracted as analysis variables.", "適用條件與限制": "Assumptions and limitations", "跳到主要內容": "Skip to main content", "展開主要導覽": "Open main navigation", "移到左邊界或點按以展開導覽": "Move to the left edge or click to open navigation", "主要導覽": "Main navigation", "收合主要導覽": "Close main navigation", "僅供學術、非商業之內部參考。未經許可，禁止存取、轉載或使用。保留所有權利。": "For internal academic, non-commercial reference only. No unauthorized access, reproduction or use. All rights reserved.", "Arvin Research Studio 資料集首頁": "Arvin Research Studio dataset home", "Arvin Research Studio 首頁": "Arvin Research Studio home", "研究工作室首頁": "Studio home", "研究收藏，逐步累積": "A growing research collection", "研究收藏概況": "Research collection at a glance", "已收錄的資料集": "Datasets catalogued", "已整理的方法": "Methods catalogued", "研究設計案例": "Research design cases", "今天從哪裡開始？": "Where will you start today?", "從資料內容、欄位實例、文獻串接與分析紀錄開始探索。": "Explore data coverage, field examples, literature connections and analysis records.", "比較方法的用途與文章實作，沿著研究設計流程閱讀。": "Compare method choices and study implementations, then follow the research design pipelines.", "探索資料集": "Explore datasets", "瀏覽方法庫": "E
