03c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.005\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e（SE 0.0009），N = 534,459：完售機率下降 0.5 個百分點，不是 0.5%，以基準完售率 0.19 換算，相對約 2.6%。沒有對照組，識別假設是「控制後負評出現的時點外生」。\u003c/p\u003e\n\u003ch4 id=\"fz2026-zh-difference-in-differencesdid\"\u003e(9) Difference-in-differences（DiD）\u003c/h4\u003e\n\u003ch5 id=\"fz2026-zh-def-8\"\u003eDef\u003c/h5\u003e\n\u003cp\u003e比較處理組和對照組「從事前到事後的變化」差多少，扣掉兩組共同的趨勢：\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003ea\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eb\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eδ\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eε\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eY_{it}=a+bT_i+cP_t+\\delta T_iP_t+\\varepsilon_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eδ\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmover\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmo accent=\"true\"\u003e‾\u003c/mo\u003e\u003c/mover\u003e\u003cmrow\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmtext mathvariant=\"normal\"\u003epost\u003c/mtext\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmover\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmo accent=\"true\"\u003e‾\u003c/mo\u003e\u003c/mover\u003e\u003cmrow\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmtext mathvariant=\"normal\"\u003epre\u003c/mtext\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmover\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmo accent=\"true\"\u003e‾\u003c/mo\u003e\u003c/mover\u003e\u003cmrow\u003e\u003cmi\u003eC\u003c/mi\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmtext mathvariant=\"normal\"\u003epost\u003c/mtext\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmover\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmo accent=\"true\"\u003e‾\u003c/mo\u003e\u003c/mover\u003e\u003cmrow\u003e\u003cmi\u003eC\u003c/mi\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmtext mathvariant=\"normal\"\u003epre\u003c/mtext\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\delta=(\\bar Y_{T,\\text{post}}-\\bar Y_{T,\\text{pre}})-(\\bar Y_{C,\\text{post}}-\\bar Y_{C,\\text{pre}})\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，核心假設是平行趨勢（如果沒有處理，處理組與對照組在事件前後原本就會有相同的變化趨勢）。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-when-to-use-9\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003e有處理組與對照組、處理前後都有觀察，且平行趨勢合理時。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-use-9\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e式（5）在式（4）加入 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmrow\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cmo\u003e≠\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eB\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmn mathvariant=\"bold\"\u003e𝟏\u003c/mn\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e{\u003c/mo\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e}\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\sum_{\\tau\\neq0}\\gamma_\\tau B_{ij}\\mathbf 1\\{t=\\tau\\}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，處理組 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eB\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eB_{ij}=1\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 是最差 20% 衛生事件，\u003cstrong\u003e對照組是其他 1–3 星評論事件\u003c/strong\u003e。Table 3 把事後各日聚合成 After（\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003et\u0026gt;0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e）。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-read-9\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\gamma\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 是「衛生內容特別差」的額外效果，不是一篇負評的總效果。Table 3 規格 2（N = 2,644,039）：After \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e0.002\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=-0.002\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e（0.0005）是一般低星事件的下降，Bad Hygiene × After \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e0.003\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=-0.003\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e（0.0009）是特別差的衛生事件再多降的 0.3 個百分點，作者以 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e0.0032\u003c/mn\u003e\u003cmi\u003e/\u003c/mi\u003e\u003cmn\u003e0.0055\u003c/mn\u003e\u003cmo\u003e≈\u003c/mo\u003e\u003cmn\u003e58\u003c/mn\u003e\u003cmi\u003e%\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e0.0032/0.0055\\approx58\\%\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 解讀為約一半的下降與衛生資訊有關。\u003c/p\u003e\n\u003ch4 id=\"fz2026-zh-交互作用迴歸與高維固定效果供給端式-6\"\u003e(10) 交互作用迴歸與高維固定效果（供給端式 6）\u003c/h4\u003e\n\u003ch5 id=\"fz2026-zh-def-9\"\u003eDef\u003c/h5\u003e\n\u003cp\u003e先用固定效果扣掉不隨某個維度變動的差異，再看處理效果在不同類型之間差多少：\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eV\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eρ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eκ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eε\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eV_{vit}=\\rho_{it}+\\kappa_{iv}+\\gamma R_{it}I_v+\\varepsilon_{vit}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\gamma\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 是兩類之間的效果差。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-when-to-use-10\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003e處理在「餐廳 × 檢查」層級變動、效果只預期出現在某些面向時，在同一次檢查內比較不同面向。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-use-10\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e三組規格：無 FE，檢查 FE＋違規代碼 FE，檢查 FE＋餐廳 × 違規 FE。\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eρ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rho_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 吸收當次檢查的共同因素（努力、檢查員、季節），\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eκ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\kappa_{iv}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 吸收餐廳在該面向的持續差異。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-read-10\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\gamma\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 是差異中的差異：\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e\u0026lt;\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\gamma\u0026lt;0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 表示有近期評論的餐廳，informative 面向\u003cstrong\u003e相對於其他面向\u003c/strong\u003e的違規差距比沒有近期評論的餐廳小，不能推論其他面向沒改善。OLS 為 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmsup\u003e\u003cmn\u003e0.005\u003c/mn\u003e\u003cmrow\u003e\u003cmi\u003e*\u003c/mi\u003e\u003cmo\u003e*\u003c/mo\u003e\u003cmi\u003e*\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.005^{***}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e、\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmsup\u003e\u003cmn\u003e0.005\u003c/mn\u003e\u003cmrow\u003e\u003cmi\u003e*\u003c/mi\u003e\u003cmo\u003e*\u003c/mo\u003e\u003cmi\u003e*\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.005^{***}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e、\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e0.002\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.002\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e（SE 均 0.001），最嚴格規格不顯著。\u003c/p\u003e\n\u003ch4 id=\"fz2026-zh-工具變數iv2sls\"\u003e(11) 工具變數（IV／2SLS）\u003c/h4\u003e\n\u003ch5 id=\"fz2026-zh-def-10\"\u003eDef\u003c/h5\u003e\n\u003cp\u003e找一個只透過內生變數影響結果的外生變數（工具），只用它帶來的變動估計因果效果：第一階段 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eD\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eπ\u003c/mi\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝑾\u003c/mi\u003e\u003cmi\u003e⊤\u003c/mi\u003e\u003c/msup\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝝅\u003c/mi\u003e\u003cmi\u003eW\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eu\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eD=\\pi Z+\\boldsymbol W^{\\top}\\boldsymbol\\pi_W+u\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，第二階段 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmover\u003e\u003cmi\u003eD\u003c/mi\u003e\u003cmo accent=\"true\"\u003ê\u003c/mo\u003e\u003c/mover\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝑾\u003c/mi\u003e\u003cmi\u003e⊤\u003c/mi\u003e\u003c/msup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒅\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eε\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eY=\\theta\\widehat D+\\boldsymbol W^{\\top}\\boldsymbol d+\\varepsilon\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，需要相關性（控制 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝑾\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\boldsymbol W\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 後仍相關）與排除限制 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eCov\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmi\u003eε\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\operatorname{Cov}(Z,\\varepsilon)=0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-when-to-use-11\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003e關鍵自變數內生（反向因果、遺漏變數、測量誤差）時。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-use-11\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eR_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 內生：廣告與整理門面會同時帶來評論與衛生改善，也可能先改善衛生才吸引評論。工具是檢查 90 天前已評論過這家店的「舊評論者」在 Yelp 的平均其他評論數 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eP_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，取 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eZ_{it}=\\log(1+P_{it})\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e（例：A 有 8 篇、B 有 0 篇，\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e4\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eP=4\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e5\u003c/mn\u003e\u003cmo\u003e≈\u003c/mo\u003e\u003cmn\u003e1.609\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eZ=\\log5\\approx1.609\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e）。內生變數為 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eR_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e、\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eR_{it}I_v\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，第一階段見附錄 Table A7，作者以 Kleibergen–Paap F\u003ca href=\"#fz2026-zh-fn2\" class=\"footnote-ref\" id=\"fz2026-zh-fnref2\" role=\"doc-noteref\"\u003e\u003csup\u003e2\u003c/sup\u003e\u003c/a\u003e支持非弱工具\u003ca href=\"#fz2026-zh-fn3\" class=\"footnote-ref\" id=\"fz2026-zh-fnref3\" role=\"doc-noteref\"\u003e\u003csup\u003e3\u003c/sup\u003e\u003c/a\u003e。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-read-11\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003eTable 4 IV 為 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmsup\u003e\u003cmn\u003e0.012\u003c/mn\u003e\u003cmrow\u003e\u003cmi\u003e*\u003c/mi\u003e\u003cmo\u003e*\u003c/mo\u003e\u003cmi\u003e*\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.012^{***}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 到 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmsup\u003e\u003cmn\u003e0.015\u003c/mn\u003e\u003cmrow\u003e\u003cmi\u003e*\u003c/mi\u003e\u003cmo\u003e*\u003c/mo\u003e\u003cmi\u003e*\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.015^{***}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e：有近期評論的餐廳，informative 面向的相對違規差距縮小 1.2 到 1.5 個百分點（約基準 0.176 的 7% 到 8.5%）。最嚴格 OLS 不顯著、IV 才顯著，所以因果結論依賴排除限制。最嚴格規格的第一階段主要靠「No Previous Reviewers」列（\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e0.494\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.494\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e）撐起，\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eZ_{it}I_v\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 本身不顯著（\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e0.002\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.002\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e）。\u003c/p\u003e\n\u003csection id=\"fz2026-zh-footnotes\" class=\"footnotes footnotes-end-of-document\" role=\"doc-endnotes\"\u003e\n\u003chr /\u003e\n\u003col\u003e\n\u003cli id=\"fz2026-zh-fn1\"\u003e\u003cp\u003ePorter stemming（Porter 1980）：以固定的去字尾規則把同一個字的不同字形併成同一個詞幹，例如 cleaned、cleaning \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmo\u003e→\u003c/mo\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\to\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e clean。\u003ca href=\"#fz2026-zh-fnref1\" class=\"footnote-back\" role=\"doc-backlink\"\u003e↩︎\u003c/a\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli id=\"fz2026-zh-fn2\"\u003e\u003cp\u003eKleibergen–Paap rk Wald F：衡量第一階段工具解釋內生變數能力的 F 統計量，允許異質變異、群聚標準誤與多個內生變數，越大越不擔心弱工具，Stock–Yogo 臨界值或 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmn\u003e10\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eF\u0026gt;10\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 在群聚、多內生變數下只是粗略參考。\u003ca href=\"#fz2026-zh-fnref2\" class=\"footnote-back\" role=\"doc-backlink\"\u003e↩︎\u003c/a\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli id=\"fz2026-zh-fn3\"\u003e\u003cp\u003e弱工具：工具和內生變數的相關很弱，2SLS 估計會偏向 OLS，標準誤和檢定也不可靠。\u003ca href=\"#fz2026-zh-fnref3\" class=\"footnote-back\" role=\"doc-backlink\"\u003e↩︎\u003c/a\u003e\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/section\u003e\n", "pipeline": {"note_en": "Arrows preserve the handout's computational dependencies and the two causal branches, not causal arrows between real-world variables. Nested CV governs training/refitting of the text model, SR and classifier, although it is shown at the classifier node; (6b) is an alternative classifier. Prediction and the bridge constructions do not establish identification: demand needs timing and comparison-trend assumptions; supply IV additionally needs relevance and exclusion. The precise quantile reference population, event overlap rules and instrument activity window require the original article/code.", "note_zh": "箭頭表示後續步驟會使用哪些前一步的結果，以及需求、供給兩條分析路徑，不是變數間的因果關係。巢狀交叉驗證（nested CV）需重新訓練文字模型、SR與分類器，不能只重估最後一個模型；(6b)是另一種分類器。做好預測或把分數轉成事件指標，仍不能證明因果關係。需求分析還要檢查事件時點及比較組趨勢；供給分析的工具變數需要相關性及排除限制。分位數用哪組資料計算、重疊事件如何處理、工具變數涵蓋哪些日期，仍待原文與程式確認。", "nodes": [{"id": "bow", "group": "prediction", "title_en": "(1) Bag-of-words", "title_zh": "(1) 詞袋表示", "inputs_en": "Reviews pooled around each inspection and their star groups.", "inputs_zh": "每次檢查對應的評論及星等組別。", "outputs_en": "36,528 term-group count features (handout-reported); \\(\\text{roach}=1,\\ \\text{cold}=1\\) is an illustrative document.", "outputs_zh": "36,528個詞×星等計數特徵（講義轉述）；\\(\\text{roach}=1,\\ \\text{cold}=1\\)為示意文件。", "method_ids": ["bag_of_words"]}, {"id": "mnir", "group": "prediction", "title_en": "(2) MNIR/DMR + (3) LASSO", "title_zh": "(2) MNIR／DMR＋(3) LASSO", "inputs_en": "Count matrix, 20 violation labels, rating groups and controls.", "inputs_zh": "詞數矩陣、20項違規標籤、星等組別與控制。", "outputs_en": "Estimated target-by-term weight matrix; \\(\\widehat\\phi_{\\mathrm{04M},\\mathrm{roach}}=1.5\\) is illustrative.", "outputs_zh": "估計的目標×詞彙權重矩陣；\\(\\widehat\\phi_{\\mathrm{04M},\\mathrm{roach}}=1.5\\)是示意值。", "method_ids": ["mnir_dmr", "lasso"]}, {"id": "sr", "group": "prediction", "title_en": "(4) SR projection", "title_zh": "(4) SR投影", "inputs_en": "Review counts and the training-fitted weight matrix.", "inputs_zh": "評論詞數與訓練資料估計的權重矩陣。", "outputs_en": "20 violation-specific scores; \\({z}_{\\mathrm{04M}}=2.5,\\ {z}_{\\mathrm{02B}}=0.9\\) are illustrative and are not probabilities.", "outputs_zh": "20個違規面向分數；\\({z}_{\\mathrm{04M}}=2.5,\\ {z}_{\\mathrm{02B}}=0.9\\)是示意值，不是機率。", "method_ids": ["sufficient_reduction"]}, {"id": "classifier", "group": "prediction", "title_en": "(6) GBDT within (5) nested CV; (6b) comparator", "title_zh": "(5) 巢狀CV內的(6) GBDT；(6b)比較模型", "inputs_en": "Baseline: posted grade. Augmented: grade, average stars and 20 SR scores. The text model and classifier are refitted inside training folds.", "inputs_zh": "基準：官方等級；增額：等級、平均星等與20個充分降維（SR）分數。文字模型與分類器皆在訓練折內重估。", "outputs_en": "Held-out violation predictions; \\(\\widehat p_{\\mathrm{04M}}=0.31\\) is illustrative. Penalized logistic regression is a reported alternative, not another sequential transformation.", "outputs_zh": "保留樣本的違規預測；\\(\\widehat p_{\\mathrm{04M}}=0.31\\)為示意。懲罰logistic是講義轉述的替代模型，不是接續的轉換步驟。", "method_ids": ["nested_grouped_cv", "gradient_boosted_trees", "penalized_logistic_regression"]}, {"id": "auc", "group": "prediction", "title_en": "(7) AUC and added predictive information", "title_zh": "(7) AUC與增額預測資訊", "inputs_en": "Held-out baseline/augmented scores and observed violation labels.", "inputs_zh": "保留樣本的基準／增額分數及已觀察違規標籤。", "outputs_en": "AUC by violation and Delta AUC; \\(0.66-0.53=0.13\\) is illustrative.", "outputs_zh": "各違規AUC與增額AUC；\\(0.66-0.53=0.13\\)為示意。", "method_ids": ["auc_delta_auc"]}, {"id": "informative", "group": "bridge", "title_en": "Select informative violation dimensions", "title_zh": "選取評論較能預測的違規項目（informative violations）面向", "inputs_en": "Incremental AUC rankings across the 20 violations.", "inputs_zh": "20項違規的增額AUC排序。", "outputs_en": "\\(I_v=1\\) for 02B, 04H, 04M, 04A and 02G, the top five according to the handout.", "outputs_zh": "依講義，前五項02B、04H、04M、04A、02G標為\\(I_v=1\\)。", "method_ids": ["auc_delta_auc"]}, {"id": "hygiene_event", "group": "bridge", "title_en": "Construct negative hygiene review events", "title_zh": "建構負面衛生評論事件", "inputs_en": "SR scores on the five informative dimensions, for all 1–3 star reviews a restaurant receives on a day.", "inputs_zh": "餐廳某日所有1–3星評論，在五項informative面向的SR分數。", "outputs_en": "Sum \\(H_{id}=\\sum_r\\sum_{v\\in\\mathcal V_5}z_{rv}\\); \\(B_{ij}=1\\) for worst-20% hygiene events and \\(B_{ij}=0\\) for other low-star events. \\(H=1.1\\) is illustrative.", "outputs_zh": "加總 \\(H_{id}=\\sum_r\\sum_{v\\in\\mathcal V_5}z_{rv}\\)；最差20%衛生事件 \\(B_{ij}=1\\)，其他低星事件 \\(B_{ij}=0\\)。\\(H=1.1\\)為示意值。", "method_ids": ["sufficient_reduction", "auc_delta_auc"]}, {"id": "event_study", "group": "demand", "title_en": "(8) Event study", "title_zh": "(8) 事件研究", "inputs_en": "Daily \\(\\mathit{sold\\_out}\\) in ±15-day windows around \\(B_{ij}=1\\) events, with event-day reference and controls.", "inputs_zh": "\\(B_{ij}=1\\)事件前後±15日的每日\\(\\mathit{sold\\_out}\\)，以事件日為基準並加入控制。", "outputs_en": "Relative-day path; pooled \\(\\widehat\\beta_{\\mathrm{After}}=-0.005\\) in the handout's report, a 0.5 percentage-point change.", "outputs_zh": "相對日路徑；講義轉述聚合\\(\\widehat\\beta_{\\mathrm{After}}=-0.005\\)，即0.5個百分點的變化。", "method_ids": ["event_study"]}, {"id": "did", "group": "demand", "title_en": "(9) Difference-in-differences", "title_zh": "(9) 差異中的差異", "inputs_en": "Treated-event windows plus comparison windows around other low-star events, \\(B_{ij}=0\\).", "inputs_zh": "處理事件窗口，加上其他低星事件\\(B_{ij}=0\\)的對照窗口。", "outputs_en": "Extra hygiene-content contrast; the handout reports interaction −0.003, an additional 0.3 percentage-point decline.", "outputs_zh": "衛生內容的額外對比；講義轉述交互係數−0.003，即額外下降0.3個百分點。", "method_ids": ["difference_in_differences"]}, {"id": "fe", "group": "supply", "title_en": "(10) Fixed-effects interaction", "title_zh": "(10) 固定效果交互作用", "inputs_en": "Restaurant-inspection-violation outcomes, recent-review indicator \\(R_{it}\\), informative indicator \\(I_v\\) and fixed effects.", "inputs_zh": "餐廳×檢查×違規結果、近期評論指標\\(R_{it}\\)、informative指標\\(I_v\\)與固定效果。", "outputs_en": "Relative dimension-gap coefficient; the handout reports strict-specification OLS −0.002, statistically insignificant.", "outputs_zh": "相對面向差距係數；講義轉述最嚴格OLS為−0.002，未達顯著。", "method_ids": ["fixed_effects_interaction"]}, {"id": "iv", "group": "supply", "title_en": "(11) Instrumental variables / 2SLS", "title_zh": "(11) 工具變數／2SLS", "inputs_en": "The supply specific /mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eq_{ij}=\\exp(\\eta_{ij})/\\sum_k\\exp(\\eta_{ik})\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e", "t\u003e0": "\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003et\u0026gt;0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e", "v": "\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ev\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e", "y_i-p_i^{(m-1)}": "\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ey\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msubsup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003ey_i-p_i^{(m-1)}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e", "z_{iv}=\\sum_j\\widehat\\phi_{vj}c_{ij}": "\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ez\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmover\u003e\u003cmi\u003eϕ\u003c/mi\u003e\u003cmo accent=\"true\"\u003ê\u003c/mo\u003e\u003c/mover\u003e\u003cmrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003ez_{iv}=\\sum_j\\widehat\\phi_{vj}c_{ij}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e", "{z}_{\\mathrm{04M}}=2.5,\\ {z}_{\\mathrm{02B}}=0.9": "\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ez\u003c/mi\u003e\u003cmrow\u003e\u003cmn mathvariant=\"normal\"\u003e04\u003c/mn\u003e\u003cmi mathvariant=\"normal\"\u003eM\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e2.5\u003c/mn\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmspace width=\"0.222em\"\u003e\u003c/mspace\u003e\u003cmsub\u003e\u003cmi\u003ez\u003c/mi\u003e\u003cmrow\u003e\u003cmn mathvariant=\"normal\"\u003e02\u003c/mn\u003e\u003cmi mathvariant=\"normal\"\u003eB\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0.9\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e{z}_{\\mathrm{04M}}=2.5,\\ {z}_{\\mathrm{02B}}=0.9\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e"}}, "question_library": {"schema_version": 1, "frameworks": {"davis": [{"id": "organization", "title_en": "Organization", "title_zh": "組織與規律", "description_en": "An apparently disordered phenomenon has a pattern, or an accepted classification fails.", "description_zh": "原本看似混亂的現象有規律，或既有分類無法解釋它。"}, {"id": "composition", "title_en": "Composition", "title_zh": "組成", "description_en": "Different phenomena share a source, or an apparently single phenomenon has distinct parts.", "description_zh": "不同現象可能有共同來源；一個看似單一的現象也可能包含不同部分。"}, {"id": "abstraction", "title_en": "Abstraction", "title_zh": "分析層級", "description_en": "An explanation belongs at a different level, such as the group rather than the individual, or vice versa.", "description_zh": "原本歸因於個人的現象，可能來自群體；也可能相反。"}, {"id": "generalization", "title_en": "Generalization", "title_zh": "適用範圍", "description_en": "A supposedly local relationship holds more widely, or a supposedly universal one has limits.", "description_zh": "原本只在某處成立的關係更普遍，或原本以為普遍的關係有適用限制。"}, {"id": "stabilization", "title_en": "Stabilization", "title_zh": "穩定與變動", "description_en": "Something apparently stable changes, or something expected to collapse persists.", "description_zh": "看似穩定的現象正在改變，或看似難以持續的現象反而長期存在。"}, {"id": "function", "title_en": "Function", "title_zh": "實際作用", "description_en": "A practice thought to help a goal hinders it, or an apparently useless practice helps.", "description_zh": "被認為有助於目標的做法可能妨礙它，或看似無用的做法其實有幫助。"}, {"id": "evaluation", "title_en": "Evaluation", "title_zh": "評價標準", "description_en": "A justified change in the measure or comparison changes how a phenomenon is evaluated.", "description_zh": "換一個有理由的評價指標或比較對象，可能改變對同一現象的好壞判斷。"}, {"id": "co-relation", "title_en": "Co-relation", "title_zh": "是否有關聯", "description_en": "A relationship exists where none was expected, or an expected relationship does not hold.", "description_zh": "原本認為無關的現象有關聯，或原本預期的關聯並不存在。"}, {"id": "co-existence", "title_en": "Co-existence", "title_zh": "能否共存", "description_en": "Apparently incompatible states coexist, or apparently compatible states cannot coexist.", "description_zh": "原本認為互相排斥的狀態可以同時存在，或原本認為能共存的狀態其實衝突。"}, {"id": "co-variation", "title_en": "Co-variation", "title_zh": "變動方向與形狀", "description_en": "The direction, continuity or shape of a relationship differs from expectations.", "description_zh": "關係的方向、是否連續，或曲線形狀與原本預期不同。"}, {"id": "opposition", "title_en": "Opposition", "title_zh": "相似與相反", "description_en": "Apparently similar phenomena differ, or apparent opposites share important features.", "description_zh": "看似相似的現象有重要差異；看似對立的現象可能共享重要特徵。"}, {"id": "causation", "title_en": "Causation", "title_zh": "因果方向", "description_en": "The assumed causal direction is reversed, or influence runs both ways.", "description_zh": "原本認為的原因與結果可能相反，或其實是雙向影響。"}], "canvas": [{"id": "audience", "title_en": "Audience \u0026 prior research", "title_zh": "讀者與既有研究", "description_en": "Who cares about this question? What does prior research explain, and what remains unresolved?", "description_zh": "哪些讀者關心這個問題？既有研究怎麼解釋，還有什麼沒說清楚？"}, {"id": "question", "title_en": "Research question", "title_zh": "具體研究問題", "description_en": "What specific question does the study answer, and why is it worth answering?", "description_zh": "這篇研究確切回答什麼？為什麼值得回答？"}, {"id": "constructs", "title_en": "Theoretical constructs \u0026 relationships", "title_zh": "構念、關係及理由", "description_en": "What are the key concepts, how are they related, and why?", "description_zh": "研究哪些概念？它們如何相關，為什麼會有這些關係？"}, {"id": "boundaries", "title_en": "Boundary conditions \u0026 limitations", "title_zh": "適用條件與限制", "description_en": "Where might the findings apply? What conditions, data or measurement limits constrain them?", "description_zh": "結論可能適用到哪裡？哪些條件、資料或量測限制了它？"}, {"id": "puzzle", "title_en": "The puzzle", "title_zh": "值得解釋的現象", "description_en": "What broader unresolved problem does this study help explain?", "description_zh": "這篇研究想解釋哪個更廣泛、仍未解決的問題？"}, {"id": "setting", "title_en": "Research setting", "title_zh": "研究背景", "description_en": "What market, organization or setting is studied, and why does it fit the question?", "description_zh": "研究在哪種市場、組織或情境進行？為什麼適合回答問題？"}, {"id": "contribution", "title_en": "Contributions", "title_zh": "貢獻", "description_en": "How do the findings change or deepen our understanding of the broader problem?", "description_zh": "結果讓我們對原問題多理解了什麼，或改變了哪個既有看法？"}, {"id": "findings", "title_en": "Empirical findings", "title_zh": "研究結果", "description_en": "What patterns appear in the data, and which answer the research question?", "description_zh": "資料顯示什麼現象？哪些結果直接回答研究問題？"}, {"id": "design", "title_en": "Research design \u0026 analysis", "title_zh": "資料、設計與分析", "description_en": "What data and analysis are used, and why can this evidence answer the question?", "description_zh": "用了什麼資料與分析？這種比較或證據為何能回答問題？"}], "contributions": [{"id": "theory-development", "title_en": "Theory development", "title_zh": "提出理論", "description_en": "Develop concepts, relationships or processes that explain why something happens.", "description_zh": "提出新的概念、關係或作用過程，說明現象為什麼發生。"}, {"id": "theory-testing", "title_en": "Theory testing", "title_zh": "檢驗理論", "description_en": "Turn an existing theory into predictions and assess them with evidence.", "description_zh": "把既有理論轉成可區分的預測，檢查資料是否支持。"}, {"id": "theory-refinement", "title_en": "Theory refinement", "title_zh": "修正理論與適用條件", "description_en": "Revise an explanation or identify when it holds, weakens or fails.", "description_zh": "修正原解釋，或說明它在什麼條件下成立、減弱或失效。"}, {"id": "theory-synthesis", "title_en": "Theory synthesis", "title_zh": "整合理論", "description_en": "Connect explanations and show how they complement one another or appear to conflict.", "description_zh": "連結不同解釋，指出它們如何互補或為何看似矛盾。"}], "publishing": [{"id": "product", "title_en": "Product: research value", "title_zh": "Product：研究價值", "description_en": "Ask an intriguing question that matters to people affected by the problem.", "description_zh": "提出讓人想理解、也與實際利害關係人有關的重要問題。"}, {"id": "price", "title_en": "Price: reader effort", "title_zh": "Price：閱讀成本", "description_en": "Explain the argument, methods and findings clearly, so readers can follow them with less effort.", "description_zh": "用清楚、精簡的文字交代理由、方法與發現，降低讀者理解的負擔。"}, {"id": "place", "title_en": "Place: immersion in context", "title_zh": "Place：理解研究背景", "description_en": "Understand the people and setting well enough to explain mechanisms and where they may stop working.", "description_zh": "深入了解研究對象與實務情境，用它說明機制及適用條件。"}, {"id": "promotion", "title_en": "Promotion: future research", "title_zh": "Promotion：帶出後續研究", "description_en": "Make the contribution and open questions clear, so others can test, revise or extend the work.", "description_zh": "說清楚貢獻與尚未解答的問題，讓別人能接著檢驗、修正或延伸。"}], "question_prompts": [{"id": "phenomenon", "title_en": "Start with the phenomenon", "title_zh": "先說明現象與重要性", "description_en": "Who faces what problem or trade-off, and why does it matter?", "description_zh": "誰面對什麼問題或取捨？為什麼值得理解？"}, {"id": "prior", "title_en": "Establish the current view", "title_zh": "確認既有理解", "description_en": "How do prior research and practitioners explain it, and on what basis?", "description_zh": "相關文獻與實務工作者目前怎麼解釋？依據是什麼？"}, {"id": "change", "title_en": "Identify what could change", "title_zh": "指出想改變的理解", "description_en": "What cause, mechanism or boundary condition might change that explanation?", "description_zh": "我們可能補上哪個原因、機制或適用條件？"}, {"id": "evidence", "title_en": "Check what the evidence can show", "title_zh": "檢查能否回答", "description_en": "What evidence would distinguish the explanations, and what can we observe?", "description_zh": "哪些資料或論證能區分不同解釋？目前能觀察到什麼？"}, {"id": "value", "title_en": "State the contribution and use", "title_zh": "說清楚貢獻與用途", "description_en": "Whose understanding or decisions could change? What does the work add to theory, measurement, methods or knowledge of the phenomenon?", "description_zh": "結果會改變誰的理解或決策？是理論、量測、方法還是實質發現的進展？"}, {"id": "next", "title_en": "Choose the next useful step", "title_zh": "選一個有用的下一步", "description_en": "What is most uncertain, and what reading or small check would help resolve it?", "description_zh": "目前最不確定的是什麼？先讀哪篇文獻或做哪個小檢查能幫助判斷？"}]}, "papers": [{"id": "davis-1971", "title": "That's Interesting!: Towards a Phenomenology of Sociology and a Sociology of Phenomenology", "authors": ["Murray S. Davis"], "year": 1971, "journal": "Philosophy of the Social Sciences, 1(2), 309–344", "doi": "10.1177/004839317100100211", "url": "https://doi.org/10.1177/004839317100100211", "kind": "framework", "dataset_ids": [], "method_ids": [], "contribution_ids": [], "davis": [], "canvas": [], "sections": [{"id": "core", "title_en": "Three starting points", "title_zh": "先掌握三個重點", "points": [{"text_en": "Interest depends on the audience. Establish what readers actually believe before challenging it.", "text_zh": "有趣與讀者有關：先找出讀者真的持有的看法，不替他們假設一個容易推翻的立場。", "locator": "pp. 309–312, 327–328"}, {"text_en": "A change can concern categories, mechanisms, levels or scope; it need not reverse an effect.", "text_zh": "改變可以是新的分類、機制、層級或適用範圍，不必每次都追求效果方向反轉。", "locator": "pp. 313–326"}, {"text_en": "A study can lose its audience by merely confirming assumptions, ignoring their concerns, or rejecting all their assumptions at once.", "text_zh": "確認常識、與讀者關切無關，或全盤否定讀者所有前提，都可能讓研究失去吸引力。", "locator": "p. 327"}]}, {"id": "four-questions", "title_en": "Four sentences for a topic", "title_zh": "每個題目先寫四句", "points": [{"text_en": "Current view: what do readers believe, and which paper supports that account?", "text_zh": "既有理解：讀者原本怎麼想，哪篇文獻支持這個判斷？", "locator": "Authored handout, Four sentences"}, {"text_en": "Change: which part of that view might we revise?", "text_zh": "可能改變：我們想修正其中哪一部分？", "locator": "Authored handout, Four sentences"}, {"text_en": "Evidence: what result would distinguish the current and proposed explanations?", "text_zh": "區分證據：什麼結果能區分原解釋與新解釋？", "locator": "Authored handout, Four sentences"}, {"text_en": "Importance: whose understanding or decisions would change if the result holds?", "text_zh": "重要性：如果結果成立，誰的理解或決策會改變？", "locator": "Authored handout, Four sentences"}]}], "framework_ids": ["davis"], "summary_en": "Identify what readers currently believe, then explain which part the research could change. Twelve patterns help describe that change.", "summary_zh": "先確認讀者原本相信什麼，再說明研究會改變其中哪一部分。十二種類型幫助辨認這種改變。", "scope_en": "Based on the relevant passages of the article and the existing one-page handout. This helps assess interest; evidence and sound methods are still needed.", "scope_zh": "依原論文相關段落及既有一頁講義整理。這是研究趣味性的閱讀工具，不能代替資料與方法的證據。"}, {"id": "dorobantu-2024", "title": "The AMJ Management Research Canvas: A Tool for Conducting and Reporting Empirical Research", "authors": ["Sinziana Dorobantu", "Marc Gruber", "Davide Ravasi", "Ned Wellman"], "year": 2024, "journal": "Academy of Management Journal, 67(5), 1163–1174", "doi": "10.5465/amj.2024.4005", "url": "https://doi.org/10.5465/amj.2024.4005", "kind": "framework", "dataset_ids": [], "method_ids": [], "contribution_ids": [], "davis": [], "canvas": [], "sections": [{"id": "using-canvas", "title_en": "How to use the canvas", "title_zh": "怎麼使用九宮格", "points": [{"text_en": "The central puzzle is the broader problem. The research question specifies the part this study addresses.", "text_zh": "中央是更廣泛的問題；具體研究問題則說明這一篇確切回答哪一部分。", "locator": "pp. 1164–1166; Figure 1"}, {"text_en": "The nine parts should fit together. Revisit them as the study develops; there is no required order.", "text_zh": "九格要彼此連接，可以反覆修改，不必照固定順序完成。", "locator": "p. 1164; p. 1173"}, {"text_en": "Findings are patterns in the evidence. Contributions explain how those patterns change understanding. Leave findings open while a project is still a proposal.", "text_zh": "研究結果是資料呈現的模式；貢獻是這些結果如何改變理解。提案階段不要預填尚未得到的結果。", "locator": "pp. 1172–1173"}, {"text_en": "The setting should let us observe the relevant concepts. Boundaries and limitations explain how far the conclusions may extend.", "text_zh": "研究背景需要能觀察到理論構念；適用條件與限制則交代結論能延伸到哪裡。", "locator": "pp. 1171–1173"}]}], "framework_ids": ["canvas"], "summary_en": "Map a study into nine connected parts and check that its question, theory, evidence and contribution fit together.", "summary_zh": "把研究放進九個互相連接的部分，檢查問題、理論、資料與貢獻是否彼此一致。", "scope_en": "Based on the article, Figure 1 and Supplementary Material 01. The grid below uses plain-language prompts rather than reproducing the original artwork.", "scope_zh": "依原論文、Figure 1及Supplementary Material 01整理；下方九格為白話閱讀版，非原圖複製。"}, {"id": "develop-a-question", "title": "How to develop a research question", "authors": ["Arvin"], "year": 2026, "journal": "Studio reading guide", "kind": "guide", "dataset_ids": [], "method_ids": [], "contribution_ids": [], "davis": [], "canvas": [], "sections": [{"id": "principles", "title_en": "Core principles", "title_zh": "保留的核心原則", "points": [{"text_en": "Develop the question and data together: use data to notice patterns, and the question to identify missing evidence.", "text_zh": "資料與問題一起推進：從資料發現現象，也用問題判斷還缺什麼資料。", "locator": "Condensed guide, Core principles"}, {"text_en": "Explain what a new dataset, variable or model helps us understand.", "text_zh": "新資料、新變數或新模型的價值，在於它讓我們多理解什麼。", "locator": "Condensed guide, Core principles"}, {"text_en": "Choose methods to fit the question. For a methods contribution, identify what current approaches cannot do and assess whether the proposed approach improves it.", "text_zh": "方法要配合問題。若以方法貢獻為目標，先指出現有方法做不到什麼，再檢查新方法是否改善。", "locator": "Condensed guide, Core principles"}, {"text_en": "Use a small check to resolve the main uncertainty before expanding the study.", "text_zh": "先用小範圍檢查減少關鍵不確定性，再決定是否擴大研究。", "locator": "Condensed guide, Core principles"}, {"text_en": "Distinguish description, prediction, causation and decision advice. Keep claims within what the evidence supports.", "text_zh": "分清描述、預測、因果與決策建議；結論只說到證據支持的範圍。", "locator": "Condensed guide, Core principles"}, {"text_en": "Use justified comparisons to assess explanations. Do not select results because they are significant or have the expected sign.", "text_zh": "用有理由的比較檢查解釋，不以顯著或預期方向作為挑選結果的標準。", "locator": "Condensed guide, Core principles"}]}], "framework_ids": ["question_prompts", "contributions"], "title_en": "How to develop a research question", "title_zh": "如何想題目：精簡版", "summary_en": "Start with an important phenomenon, current explanations and available evidence. Use short questions to assess both value and feasibility.", "summary_zh": "從重要現象、既有理解和可用證據出發，用幾個短問題整理值得做、也能回答的研究。", "scope_en": "Condensed from the existing research-question notes. Case examples, discussion history, repeated requirements and detailed procedures are omitted. This is a personal research guide.", "scope_zh": "精簡自原有《如何想題目》。已移除實際案例、歷史討論、重複要求及過細操作內容；這是個人研究指引。"}, {"id": "pauwels-2026-publishing", "title": "How to publish in a top marketing journal", "authors": ["Koen Pauwels", "Eric Arnould", "Sharon Ng", "Stefan Wuyts"], "year": 2026, "journal": "International Journal of Research in Marketing, 43, 1–7", "doi": "10.1016/j.ijresmar.2026.01.002", "url": "https://doi.org/10.1016/j.ijresmar.2026.01.002", "kind": "framework", "dataset_ids": [], "method_ids": [], "contribution_ids": [], "davis": [], "canvas": [], "sections": [{"id": "five-qualities", "title_en": "Five shared qualities", "title_zh": "五個共通重點", "points": [{"text_en": "Make the question interesting: state what readers will learn, beyond one more analysis that has not been done before.", "text_zh": "問題有意思：清楚說明研究會增加什麼理解，不只多做一項別人沒做過的分析。", "locator": "pp. 1–2"}, {"text_en": "Make the argument and methods credible: explain why the data and method fit, and document choices that affect validity.", "text_zh": "論證與方法可靠：說明資料及方法為何適合，並交代影響結果可信度的重要選擇。", "locator": "p. 2"}, {"text_en": "Identify who benefits: specify which scholars, managers, consumers or policymakers may need to change their views or actions.", "text_zh": "對具體對象有用：指出哪些學者、管理者、消費者或政策制定者需要改變看法或做法。", "locator": "p. 2"}, {"text_en": "Open paths for further research by identifying unresolved questions and possible boundary conditions.", "text_zh": "能帶出後續研究：說清楚還有哪些適用條件與未解問題。", "locator": "p. 2; p. 6"}, {"text_en": "Write clearly and concisely. Build the argument step by step without assuming readers know every method or prior study.", "text_zh": "寫得清楚精簡：一步一步解釋論點，不假設讀者已熟悉所有技術與文獻。", "locator": "p. 2; p. 6"}]}, {"id": "subfields", "title_en": "Emphasis across research areas", "title_zh": "不同領域的側重", "points": [{"text_en": "Quantitative marketing: position the question clearly, justify the data and model choices, and connect findings to relevant decisions.", "text_zh": "量化行銷：問題定位要清楚；資料、方法及模型設定要能回答問題，結果也要對相關決策有意義。", "locator": "Section 1, pp. 1–2"}, {"text_en": "Inductive research: understand the setting deeply, ground theoretical claims in evidence, and assess interpretations using different sources or perspectives.", "text_zh": "歸納研究：深入理解情境，讓理論主張有資料支持，並用不同來源或觀點檢查解釋。", "locator": "Section 2, pp. 2–3"}, {"text_en": "Consumer behavior: define concepts and mechanisms clearly. Each study should advance the same question, rather than fill a standard study package.", "text_zh": "消費者行為：構念與機制要清楚，各項研究應一起推進同一個問題，不能只湊固定的實驗組合。", "locator": "Section 3, p. 4"}, {"text_en": "Marketing strategy and B2B: begin with an important marketing phenomenon, understand the setting and behavior, and develop advice for a specific audience.", "text_zh": "行銷策略與B2B：從重要的行銷現象出發，深入理解實務背景與行為，提出對明確對象有用的建議。", "locator": "Section 4, pp. 4–5"}]}, {"id": "implications", "title_en": "What to take into your own reading", "title_zh": "閱讀與選題時怎麼用", "points": [{"text_en": "A strong question does not always need a new theory or the most advanced method. The method still needs adequate rigor and a clear justification.", "text_zh": "好問題不一定需要全新理論或最複雜的方法；方法仍須足夠可靠，也要說明選擇理由。", "locator": "Section 1, point 2, p. 2"}, {"text_en": "A new setting alone is not a contribution. Explain what mechanism or limit of an existing explanation it reveals.", "text_zh": "換一個背景本身不是貢獻。要說明這個背景讓我們看見哪個新機制或原解釋的限制。", "locator": "Sections 2–4, pp. 3–5"}, {"text_en": "Start with an important phenomenon and let theory and evidence inform one another. Neither theory-first nor empirics-first is the only valid starting point.", "text_zh": "先找到重要現象，再讓理論與資料互相修正；不用把theory-first或empirics-first當成唯一正確起點。", "locator": "Section 4, pp. 4–5"}]}], "framework_ids": ["publishing"], "summary_en": "IJRM editors use four Ps to connect research value, clear writing, understanding the setting and opening paths for future work.", "summary_zh": "IJRM編輯用發表的4P整理問題價值、清楚寫作、深入理解背景，以及帶出後續研究的方式。", "scope_en": "Based on the supplied seven-page editorial. These notes summarize editorial advice, not fixed acceptance rules for every journal.", "scope_zh": "依使用者提供的7頁社論全文整理。這是編輯經驗與建議，不是所有期刊的固定錄取條件。"}]}, "analyses": [{"id": "edgar-license-076-agreements-20261027-v1", "dataset_id": "sec-edgar", "title_en": "Technology licensing: terms in 76 SEC-filed agreements", "title_zh": "技術授權：76份SEC申報合約的條款比較", "type_en": "Descriptive contract analysis", "type_zh": "合約敘述分析", "objective_en": "Compare license terms and the work described in 76 SEC-filed technology-license agreements.", "objective_zh": "比較76份SEC申報技術授權合約的條款，以及其中約定要做的工作。", "unit_en": "Main agreements: 76; amendments, restatements and repeated filings of the same agreement count once.\nNamed contracting companies: 114 distinct company identities, including technology-transfer companies; affiliates remain separate.\nOther contracting organizations: 19 named academic, government, nonprofit, foundation or cooperative roles; not a verified count of independent legal persons.\nIndividual licensors: 3 named people.\nSEC filing sources: 57 distinct filers, counted by CIK.\nLinked source files: 82 (76 main-agreement representative files and 6 supporting filings).\nScope: named main-contract parties only, excluding companies merely mentioned. Source-defined aliases are grouped; filer and contracting-company counts can overlap and must not be added.", "unit_zh": "主約：76份；同一主約的修訂、重述及重複申報只計一次。\n具名締約公司：去重後114家，包含技轉公司；關係企業分開計。\n其他締約組織：19個具名學術、政府、非營利、基金會或合作社角色，不代表19個獨立法人。\n個人授權人：3位。\nSEC申報來源：57個不同申報者，依CIK去重。\n來源文件：82份（76份主約代表文件＋6份補充申報文件）。\n計數範圍：只數主約具名當事人，不含所有被提及公司；依文件明示的同一方別名去重。申報者與締約公司可能重疊，不能相加。", "variables_en": "Exclusivity, products, geography, contracting parties, license duration, technology area; project presence, duration, start/end and headcount.", "variables_zh": "專屬性、產品、地域、締約方、授權期間、技術領域；專案有無、期間、起訖及人數。", "specification_en": "The sample follows the existing review order, without selecting on outcomes. Count each main agreement once, without weights; one agreement may contain several grant types or technology areas. There is no initial date restriction. Amendments and repeated filings do not add agreements. Count worldwide rights only when the relevant grant expressly says worldwide or global. The collection target is 450; this release contains 76 completed agreements.", "specification_zh": "樣本沿用既有閱讀順序，不依結果挑選。每份主約計一次，不加權；同一份可包含多種授權及技術領域。最初未限定年份，修訂及重複申報不另增加份數。只有相關授權明寫worldwide或global才計為全球授權。收集目標是450份，本次呈現已完成的76份。", "summary_en": "The sample contains 76 distinct main agreements. 43 contain an exclusive grant, 31 a nonexclusive grant and 4 shared exclusive rights; categories overlap. 34 identify defined projects or report an initiated program, 12 give only some work information and 30 do not establish whether a defined project exists. 8 comparable initial license terms have a median of 4 years and range from 3 to 20 years. Complete project duration and total staffing remain unknown.", "summary_zh": "樣本有76份不同主約。43份至少有一項專屬權利、31份有非專屬權利、4份有指定幾方共享的專屬權利，類別可重疊。34份可確認有明確專案或文件提到計畫已啟動，12份只提供部分工作資訊，30份不足以判斷有無明確專案。8份可比較的固定初始授權期間中位數4年，最短3年、最長20年。完整專案期間及總人數仍無法取得。", "limitations_en": "A contractual grant does not establish actual delivery, performance or current legal validity. Count conditional rights, options to obtain future rights and rights to negotiate separately. An initial license term is not actual relationship length or complete project duration; missing or redacted text is not evidence of absence. Contracting roles, companies, independent legal persons and actual workers are different units. Related-company agreements cannot be described as transactions between independent firms. A nonexclusive collaboration does not make every technology grant nonexclusive. A supporting company filing can corroborate entry into an agreement, but cannot supply original signatures or resolve conflicting dates. PCT’s ten-year initial agreement period is excluded from comparable fixed license terms because core rights can continue perpetually.", "limitations_zh": "合約寫明授予權利，不代表已核實實際交付、履行或目前的法律效力。要先符合條件才能取得的權利、可以日後選擇取得的權利，以及只約定日後協商的機會，分開計算。初始授權期間不是實際合作長度或完整專案期間；沒寫或刪除的內容不當成「沒有」。締約角色、公司、獨立法人及實際參與人員不能互相替代；有關係企業的合約也不能稱為彼此獨立公司的交易。「合作不排他」不等於所有技術授權都非專屬。另附的公司申報可以支持已簽約的說明，但不能補出原始簽名或解決衝突日期。PCT雖有十年初始協議期，核心權利卻可永久繼續，因此不混入可比較固定授權期間的統計。", "run_date": "2026-10-27", "executed_by": "assistant", "status": "completed", "method_ids": [], "reviewed_report": {"schema_version": 1, "reviewed_at": "2026-10-27", "sources": [{"id": "case1", "label": "Sun–Borland (1995) — form10q_063001ex10-2.htm", "url": "https://www.sec.gov/Archives/edgar/data/853273/000085327301500022/form10q_063001ex10-2.htm"}, {"id": "case2", "label": "Cue–LG (2018) — d677625dex101.htm", "url": "https://www.sec.gov/Archives/edgar/data/1645460/000119312518358131/d677625dex101.htm"}, {"id": "case3", "label": "Symbid–Coöperatie (2011) — f8k121013_ex10z17.htm", "url": "https://www.sec.gov/Archives/edgar/data/1532595/000107878213002424/f8k121013_ex10z17.htm"}, {"id": "case4", "label": "Arkansas–Cyto Wave (2012) — ex10_2license.htm", "url": "https://www.sec.gov/Archives/edgar/data/1562107/000146970913000124/ex10_2license.htm"}, {"id": "case5", "label": "UT–AEMase (2013) — d50169dex1013.htm", "url": "https://www.sec.gov/Archives/edgar/data/1636282/000119312515318935/d50169dex1013.htm"}, {"id": "case6", "label": "ARM–AMCC (2009/2010) — d431089dex1069.htm", "url": "https://www.sec.gov/Archives/edgar/data/711065/000119312512449811/d431089dex1069.htm"}, {"id": "case7", "label": "Somantis–ACD (2004) — dex109.htm", "url": "https://www.sec.gov/Archives/edgar/data/888671/000119312506149040/dex109.htm"}, {"id": "case8", "label": "Timeline / WorkWise–Global (2005) — exhibit1.htm", "url": "https://www.sec.gov/Archives/edgar/data/909736/00012999330 el": "Alder–BMS addendum (2011) — d657876dex109.htm", "url": "https://www.sec.gov/Archives/edgar/data/1423824/000119312514104868/d657876dex109.htm"}, {"id": "case72", "label": "Royal Philips–Philips Semiconductors International (2006) — dex101.htm", "url": "https://www.sec.gov/Archives/edgar/data/1413447/000119312510177120/dex101.htm"}, {"id": "case73", "label": "Green Field–Turbine Powered Technology (2011) — d349756dex1024.htm", "url": "https://www.sec.gov/Archives/edgar/data/1542387/000119312512228720/d349756dex1024.htm"}, {"id": "case74", "label": "Madison Energy Group–Real Estate Restoration and Rental (2010) — fs1a2ex10i_realestate.htm", "url": "https://www.sec.gov/Archives/edgar/data/1497253/000121390011000538/fs1a2ex10i_realestate.htm"}, {"id": "case75", "label": "Flexpoint Sensor Systems–subVo (2019) — ex10-2.htm", "url": "https://www.sec.gov/Archives/edgar/data/925660/000154812319000175/ex10-2.htm"}, {"id": "case76", "label": "eGene–SciBridge Software (2007) — exhibit106.htm", "url": "https://www.sec.gov/Archives/edgar/data/1105409/000101041207000067/exhibit106.htm"}], "sections": [{"id": "license_summary", "title_en": "Descriptive snapshot", "title_zh": "敘述統計", "intro_en": "These counts use 76 distinct main agreements. An agreement can contain different grants, so category counts cannot be added to obtain the sample size. A promise to grant rights or perform work is not proof of performance. Document links show the basis for the counts; the documents need not state these aggregate totals.", "intro_zh": "下列數字以76份不同主約為基礎。同一份合約可能同時包含不同授權，不可把各類相加當成總樣本數。約定授予權利或執行工作，不代表已確認實際履行。文件連結用來回看計數依據；原文未必直接寫出這裡的彙總數字。", "columns": [{"id": "measure", "label_en": "Measure", "label_zh": "項目"}, {"id": "value", "label_en": "Result", "label_zh": "結果"}, {"id": "meaning", "label_en": "How to read it", "label_zh": "解讀"}], "rows": [{"id": "completed", "cells": [{"text_zh": "主約份數", "text_en": "Main agreements"}, {"text_en": "76", "text_zh": "76"}, {"text_en": "76 counts distinct main agreements, not companies. Amendments and repeated filings of the same agreement count once.", "text_zh": "76代表不同主約，不是76家公司。同一主約的修訂或重複申報合併計一次。"}], "source_ids": ["case1", "case2", "case3", "case4", "case5", "case6", "case7", "case8", "case9", "case10", "case11", "case12", "case13", "case14", "case15", "case16", "case17", "case18", "case19", "case20", "case21", "case22", "case23", "case24", "case25", "case26", "case27", "case28", "case29", "case30", "case31", "case32", "case33", "case34", "case35", "case36", "case37", "case38", "case39", "case40", "case41", "case42", "case43", "case44", "case45", "case46", "case47", "case48", "case49", "case50", "case51", "case52", "case53", "case54", "case55", "case56", "case57", "case58", "case59", "case60", "case61", "case62", "case63", "case64", "case65", "case66", "case67", "case68", "case69", "case70", "case71", "case72", "case73", "case74", "case75", "case76"]}, {"id": "exclusive", "cells": [{"text_zh": "合約寫明已授予專屬權利", "text_en": "Agreements whose text grants exclusive rights"}, {"text_en": "43 / 76", "text_zh": "43 / 76"}, {"text_zh": "這些合約至少有一項條款寫明已授予專屬權利。但權利只適用於指定產品、地域及用途；授權人保留的使用權或仍待確認的其他核准，須另看條款。", "text_en": "Each has at least one clause granting exclusive rights in the reviewed text. Product, territory, use, retained rights and any unresolved approval still limit what the recipient can do."}], "source_ids": ["case2", "case4", "case5", "case7", "case9", "case11", "case12", "case13", "case15", "case17", "case18", "case19", "case21", "case23", "case27", "case28", "case30", "case31", "case32", "case33", "case34", "case35", "case37", "case38", "case39", "case41", "case43", "case45", "case48", "case50", "case51", "case52", "case53", "case55", "case58", "case60", "case62", "case63", "case65", "case66", "case69", "case73", "case76"]}, {"id": "nonexclusive", "cells": [{"text_zh": "合約寫明已授予非專屬權利", "text_en": "Agreements whose text grants nonexclusive rights"}, {"text_en": "31 / 76", "text_zh": "31 / 76"}, {"text_zh": "同一合約可以同時有非專屬及專屬授權，例如不同產品採不同安排。Rotoblock只說合資合作不排他，不能因此認定所有技術授權都非專屬。", "text_en": "One agreement can grant nonexclusive rights for one product and exclusive rights for another. Rotoblock calls the joint venture nonexclusive; that does not classify every technology grant."}], "source_ids": ["case1", "case2", "case6", "case7", "case8", "case10", "case14", "case24", "case25", "case29", "case31", "case33", "case34", "case35", "case40", "case41", "case44", "case47", "case50", "case54", "case55", "case56", "case57", "case60", "case64", "case65", "case67", "case69", "case70", "case72", "case76"]}, {"id": "coexclusive", "cells": [{"text_zh": "合約寫明由指定幾方共享專屬權利", "text_en": "Agreements stating shared exclusive rights"}, {"text_en": "4 / 76", "text_zh": "4 / 76"}, {"text_zh": "Stanford合約的HCV治療範圍由指定對象共享，另外兩份Max-Planck-Innovation合約分別涉及治療及診斷。這種由指定幾方共享的安排，不是只授權一個外部對象的sole授權。", "text_en": "The Stanford HCV field and two Max-Planck-Innovation therapeutic/diagnostic agreements share rights among designated recipients. This differs from sole licensing to one outside recipient."}], "source_ids": ["case29", "case46", "case49", "case65"]}, {"id": "conditional", "cells": [{"text_zh": "有須先達成條件的未來權利", "text_en": "Agreements with conditional future rights"}, {"text_en": "43 / 76", "text_zh": "43 / 76"}, {"text_zh": "這些權利要等約定事件發生，或之後才可能授予、改變。例如PCT合約寫期滿後可改成非專屬，不能因此認定合約現在已期滿。", "text_en": "These rights depend on an event or may be granted or change later. PCT’s possible nonexclusive rights after expiry do not show that expiry has already occurred."}], "source_ids": ["case2", "case6", "case9", "case10", "case12", "case13", "case15", "case16", "case20", "case21", "case22", "case26", "case29", "case33", "case35", "case38", "case42", "case43", "case45", "case47", "case50", "case51", "case52", "case53", "case54", "case57", "case59", "case60", "case61", "case62", "case63", "case64", "case65", "case66", "case67", "case68", "case69", "case70", "case71", "case72", "case73", "case74", "case75"]}, {"id": "worldwide", "cells": [{"text_zh": "至少一項權利明寫全球適用", "text_en": "At least one grant in the text explicitly says worldwide"}, {"text_en": "53 / 76", "text_zh": "53 / 76"}, {"text_zh": "至少一項已授予的權利明寫worldwide或global，才列入全球授權。若只限特定國家、客戶或用途，仍須保留該限制。", "text_en": "At least one present grant explicitly says worldwide or global. Country, customer and use restrictions still apply and cannot be expanded to worldwide rights."}], "source_ids": ["case1", "case2", "case4", "case5", "case6", "case7", "case8", "case9", "case10", "case11", "case12", "case14", "case15", "case17", "case18", "case19", "case21", "case24", "case25", "case28", "case29", "case31", "case32", "case33", "case34", "case35", "case38", "case39", "case40", "case41", "case44", "case45", "case46", "case47", "case48", "case49", "case52", "case53", "case54", "case55", "case56", "case57", "case58", "case62", "case63", "case65", "case66", "case69", "case70", "case72", "case73", "case74", "case76"]}, {"id": "parties", "cells": [{"text_zh": "合約列出的締約／簽署角色數", "text_en": "Named contracting or signature roles"}, {"text_en": "2: 66 / 76; 3: 9 / 76; 4: 1 / 76", "text_zh": "2：66 / 76；3：9 / 76；4：1 / 76"}, {"text_zh": "數字是文件列出的締約／簽署角色，不是互相獨立的企業集團。PCT文件的兩個具名角色不代表已確認兩份簽名；Western Digital與Sandisk也有關係企業背景。", "text_en": "Count named contracting/signature roles, not independent corporate groups. PCT’s two named roles do not establish two verified signatures; Western Digital and Sandisk also have a related-company background."}], "source_ids": ["case1", "case2", "case3", "case4", "case5", "case6", "case7", "case8", "case9", "case10", "case11", "case12", "case13", "case14", "case15", "case16", "case17", "case18", "case19", "case20", "case21", "case22", "case23", "case24", "case25", "case26", "case27", "case28", "case29", "case30", "case31", "case32", "case33", "case34", "case35", "case36", "case37", "case38", "case39", "case40", "case41", "case42", "case43", "case44", "case45", "case46", "case47", "case48", "case49", "case50", "case51", "case52", "case53", e1", "case2", "case3", "case4", "case5", "case6", "case7", "case8", "case9", "case10", "case11", "case12", "case13", "case14", "case15", "case16", "case17", "case18", "case19", "case20", "case21", "case22", "case23", "case24", "case25", "case26", "case27", "case28", "case29", "case30", "case31", "case32", "case33", "case34", "case35", "case36", "case37", "case38", "case39", "case40", "case41", "case42", "case43", "case44", "case45", "case46", "case47", "case48", "case49", "case50", "case51", "case52", "case53", "case54", "case55", "case56", "case57", "case58", "case59", "case60", "case61", "case62", "case63", "case64", "case65", "case66", "case67", "case68", "case69", "case70", "case71", "case72", "case73", "case74", "case75", "case76"]}]}, {"id": "license_domains", "title_en": "Technology areas", "title_zh": "技術領域", "intro_en": "Classified by the licensed technology, not the filer’s industry. One agreement can fall in several areas. MRI and Irvine remain unclassified because their patent lists are missing.", "intro_zh": "依授權技術判定，不依申報公司產業。領域可重疊；MRI、Irvine 缺專利清單，仍未確定。", "columns": [{"id": "domain", "label_en": "Area", "label_zh": "領域"}, {"id": "count", "label_en": "Agreements", "label_zh": "合約數"}], "rows": [{"id": "software_or_computing", "cells": [{"text_en": "Software / computing", "text_zh": "軟體／運算"}, {"text_en": "18 / 76", "text_zh": "18 / 76"}], "source_ids": ["case1", "case3", "case6", "case8", "case10", "case14", "case16", "case21", "case22", "case40", "case44", "case47", "case57", "case61", "case64", "case68", "case72", "case76"]}, {"id": "biopharmaceutical_or_biotechnology", "cells": [{"text_en": "Biopharmaceuticals / biotechnology", "text_zh": "生物藥／生物技術"}, {"text_en": "38 / 76", "text_zh": "38 / 76"}], "source_ids": ["case2", "case5", "case7", "case12", "case19", "case24", "case26", "case27", "case29", "case30", "case31", "case32", "case33", "case35", "case38", "case39", "case41", "case43", "case45", "case46", "case48", "case49", "case50", "case51", "case52", "case53", "case55", "case56", "case58", "case59", "case60", "case62", "case65", "case66", "case67", "case69", "case70", "case71"]}, {"id": "medical_devices_or_diagnostics", "cells": [{"text_en": "Medical devices / diagnostics", "text_zh": "醫療器材／診斷"}, {"text_en": "10 / 76", "text_zh": "10 / 76"}], "source_ids": ["case4", "case7", "case35", "case37", "case46", "case52", "case53", "case63", "case66", "case67"]}, {"id": "communications_or_semiconductors", "cells": [{"text_en": "Communications / semiconductors", "text_zh": "通訊／半導體"}, {"text_en": "10 / 76", "text_zh": "10 / 76"}], "source_ids": ["case6", "case16", "case18", "case20", "case25", "case40", "case44", "case47", "case54", "case72"]}, {"id": "energy_or_environment", "cells": [{"text_en": "Energy / environment", "text_zh": "能源／環境"}, {"text_en": "7 / 76", "text_zh": "7 / 76"}], "source_ids": ["case9", "case23", "case28", "case34", "case36", "case73", "case74"]}, {"id": "industrial_processes_or_materials", "cells": [{"text_en": "Industrial processes / materials", "text_zh": "工業製程／材料"}, {"text_en": "8 / 76", "text_zh": "8 / 76"}], "source_ids": ["case9", "case13", "case15", "case17", "case23", "case34", "case36", "case73"]}, {"id": "agricultural_or_food_technology", "cells": [{"text_en": "Agricultural / food technology", "text_zh": "農業／食品技術"}, {"text_en": "1 / 76", "text_zh": "1 / 76"}], "source_ids": ["case39"]}, {"id": "unresolved", "cells": [{"text_en": "Unresolved technology", "text_zh": "技術未確定"}, {"text_en": "2 / 76", "text_zh": "2 / 76"}], "source_ids": ["case11", "case42"]}]}, {"id": "license_cases", "title_en": "Read the 76 agreements", "title_zh": "查看76份合約", "intro_en": "Each row identifies the parties, technology, agreed work and information that remains unknown. Expand Original document to open the source. The Cue–LG example below shows how to record clauses separately by product, territory and period.", "intro_zh": "每列說明哪些對象針對什麼技術授權、合約要求做哪些工作，以及哪些資訊仍不知道。文件原文可展開查看；下方Cue–LG資料實例示範如何按產品、地域及期間分開記錄條款。", "columns": [{"id": "case", "label_en": "Agreement", "label_zh": "合約"}, {"id": "license", "label_en": "License context", "label_zh": "授權內容"}, {"id": "project", "label_en": "Planned work and what remains unknown", "label_zh": "約定要做什麼，以及還不知道什麼"}], "rows": [{"id": "case1", "cells": [{"text_en": "Sun–Borland (1995)", "text_zh": "Sun–Borland (1995)"}, {"text_en": "Sun Microsystems, Inc. and Borland International, Inc.: a license for Java runtime and developer tools. The license is nonexclusive and permits product development and distribution, with limits on how products may be distributed.", "text_zh": "Sun Microsystems 與 Borland的授權合約，標的是Java 程式語言執行環境及開發工具。非專屬授權，可依合約開發及散布產品，但散布方式受限制。"}, {"text_en": "The contract specifies technology delivery and support tasks. Promised support hours or capacity do not reveal the total project staff, and the document does not show delivery was completed.", "text_zh": "合約列出要交付的技術及支援工作，可以辨認一組具體任務。支援可提供多少人力，不等於整個專案實際有多少人參與；文件也不能證明已交付完成。"}], "source_ids": ["case1"]}, {"id": "case2", "cells": [{"text_en": "Cue–LG (2018)", "text_zh": "Cue–LG (2018)"}, {"text_en": "Cue Biopharma, Inc. and LG Chem Ltd.: a license for antigen-specific T-cell biologics and associated manufacturing technology. The parties grant rights to each other for different territories. A separate perpetual nonexclusive worldwide grant and an option for another global program must not be combined into one globally exclusive license.", "text_zh": "Cue Biopharma 與 LG Chem的授權合約，標的是抗原特異性 T 細胞生物藥及相關製造技術。雙方按不同地域相互授權；另有永久非專屬全球權利，以及額外計畫的全球授權選擇權，不能合成一項全球專屬授權。"}, {"text_en": "Research and development plans, budgets, responsibilities and approval rules establish an agreed R\u0026D project. Some schedule exhibits are omitted, so complete project dates, duration and total staff remain unknown. See the detailed example below.", "text_zh": "合約要求訂定研究與開發計畫，列出預算、雙方工作及核准方式，因此可確認有約定的研發專案。部分時程附件未公開，無法取得完整起訖日、總期間或總人數；下方資料實例逐步說明。"}], "source_ids": ["case2"]}, {"id": "case3", "cells": [{"text_en": "Symbid–Coöperatie (2011)", "text_zh": "Symbid–Coöperatie (2011)"}, {"text_en": "Symbid B.V. and Symbid Coöperatie U.A.: a license for online crowdfunding platform software. The software-use permission does not state exclusivity or territory. One company and one cooperative are named as parties.", "text_zh": "Symbid 與 Symbid Coöperatie 合作社的授權合約，標的是線上群眾募資平台軟體。文件允許使用軟體，但沒有寫明是否專屬或適用哪些地域。締約者為公司與合作社兩方。"}, {"text_en": "Software use is permitted, but no specific development tasks, timetable or roles are stated, so a defined project cannot be confirmed. The named software supervisor is not the full project team.", "text_zh": "文件允許使用軟體，但未交代一組具體開發任務、時程及分工，所以無法確認有明確專案。文中提到的軟體管理方不是專案全部參與者。"}], "source_ids": ["case3"]}, {"id": "case4", "cells": [{"text_en": "Arkansas–Cyto Wave (2012)", "text_zh": "Arkansas–Cyto Wave (2012)"}, {"text_en": "Board of Trustees of the University of Arkansas, for the University of Arkansas for Medical Sciences; Cyto Wave Technologies, Inc.: a license for in-vivo blood-flow cell and clot detection technology. The patent rights are worldwide and exclusive, subject to rights retained by the university and government.", "text_zh": "Arkansas 大學與 Cyto Wave的授權合約，標的是在活體血流中偵測細胞與血栓等技術。專利授權為全球專屬，但大學及政府保留約定的使用權。"}, {"text_en": "Prototype and regulatory requirements identify specific development work. The two- and six-year milestones are deadlines for particular tasks, not the complete project duration.", "text_zh": "合約要求製作原型並處理法規要求，能辨認具體開發工作。兩年及六年的要求是特定工作應完成的期限，不代表整個專案分別做兩年或六年。"}], "source_ids": ["case4"]}, {"id": "case5", "cells": [{"text_en": "UT–AEMase (2013)", "text_zh": "UT–AEMase (2013)"}, {"text_en": "The University of Texas at Austin on behalf of the Board of Regents of The University of Texas System and AEMase Inc.: a license for engineered L-methionase for therapeutic use. The patent license is worldwide and exclusive. Royalty Term has no separate visible definition, leaving the period uncertain.", "text_zh": "Texas 大學與 AEMase的授權合約，標的是用於治療的改造 L-methionase 酵素。專利授權為全球專屬；文件使用Royalty Term（權利金期間），卻沒有單獨寫清楚它的定義，因此期間仍需確認。"}, {"text_en": "Development milestones are referenced, but key details are redacted, so full tasks and timing cannot be established. The agreement’s effective date is not necessarily the research start date.", "text_zh": "合約有開發進度要求，但關鍵事項被刪除，無法確認完整任務及時程。合約生效日不能直接當成研發開始日。"}], "source_ids": ["case5"]}, {"id": "case6", "cells": [{"text_en": "ARM–AMCC (2009; 2010 annex)", "text_zh": "ARM–AMCC (2009; 2010 附件)"}, {"text_en": "ARM Limited and Applied Micro Circuits Corporation: a license for ARMv8-A processor architecture. The architecture rights are worldwide and nonexclusive. ARM’s permission to use feedback depends on conditions and is partly unclear.", "text_zh": "ARM 與 Applied Micro Circuits的授權合約，標的是ARMv8-A 處理器架構。架構授權為全球非專屬。另一方向的技術回饋使用許可須符合條件，部分內容仍不清楚。"}, {"text_en": "Processor-development work is mentioned, but the full project cannot be reconstructed. The five-year architecture annex is a licensing period, not five years of observed development or a common end date for every right.", "text_zh": "合約提到處理器開發工作，但沒有足夠資訊還原完整專案。架構附件的五年期間是授權安排的一部分，不是研發做了五年，也不能代表所有權利同時結束。"}], "source_ids": ["case6"]}, {"id": "case7", "cells": [{"text_en": "Somantis–ACD (2004)", "text_zh": "Somantis–ACD (2004)"}, {"text_en": "Somantis Limited and Advanced Cardiovascular Devices, Inc.: a license for cardiovascular stent and drug technology. Research rights are nonexclusive, while commercial rights are exclusive. Both continue under their respective clauses and should not be reduced to one exclusivity label.", "text_zh": "Somantis 與 Advanced Cardiovascular Devices的授權合約，標的是心血管支架及相關藥物技術。研究用途為非專屬，商業用途為專屬，兩項依各自條款繼續適用，不能只用一個專屬性標籤概括。"}, {"text_en": "The planned schedule runs from signing on August 31, 2004 and covers a seven-year horizon. These are contractual plans, not verified actual start/end dates or a total staff count.", "text_zh": "文件列出自2004年8月31日簽約起算的計畫時程，涵蓋七年規劃。這是合約預定安排，不能證明實際何時開始、何時完成，或總共有多少人工作。"}], "source_ids": ["case7"]}, {"id": "case8", "cells": [{"text_en": "Timeline / WorkWise–Global (2005)", "text_zh": "Timeline / WorkWise–Global (2005)"}, {"text_en": "Timeline, Inc., WorkWise Software, Inc. and Global Software, Inc.: a license for database-retrieval and related software patents. The three-party license grants worldwide nonexclusive software-patent rights. Perpetual use wording and a patent-linked agreement term both appear and must be recorded separately.", "text_zh": "Timeline、WorkWise 與 Global Software的授權合約，標的是資料庫檢索及相關軟體專利。三方約定全球非專屬軟體專利權。條款同時寫永久使用權及依專利期限決定的合約期間，兩者須分開記錄。"}, {"text_en": "Possible future software improvements are mentioned, but no specific current work is committed. This does not establish a defined development project.", "text_zh": "文件只談到將來可能進行的軟體改進，沒有明確承諾現在要做哪些工作。不能據此確認已有一個開發專案。"}], "source_ids": ["case8"]}, {"id": "case9", "cells": [{"text_en": "SenCer–GreenCell (2010 restatement)", "text_zh": "SenCer–GreenCell (2010 重述版)"}, {"text_en": "SenCer Inc. and GreenCell, Incorporated: a license for ceramic composites for sensors, ignition and fuel cells. The August 2010 restatement gives worldwide perpetual rights, initially exclusive. A possible change after five years for specified applications has not been confirmed to have occurred.", "text_zh": "SenCer 與 GreenCell的授權合約，標的是用於感測器、點火及燃料電池等用途的陶瓷複合材料。2010年8月重述版給全球永久權利，開始時為專屬。特定應用滿五年後可能改變，但尚未確認條件已成立。"}, {"text_en": "Ceramic-composite development is permitted, but complete tasks, roles and timing are absent. The differing field definitions also need to be read separately.", "text_zh": "文件允許開發陶瓷複合材料，但沒有完整任務、分工及時程，因此無法確認具體專案。不同條款對用途範圍的定義仍需分開閱讀。"}], "source_ids": ["case9"]}, {"id": "case10", "cells": [{"text_en": "Symbid Holding–OpCo (2013)", "text_zh": "Symbid Holding–OpCo (2013)"}, {"text_en": "Symbid Holding B.V. and Symbid B.V. (OpCo): a license for crowdfunding platform software and operating know-how. The holding company grants its operating company a worldwide nonexclusive sublicense for an initial three years, renewable for three more. This is separate from the foundation-to-holding agreement.", "text_zh": "Symbid Holding 與 Symbid 營運公司的授權合約，標的是線上群眾募資平台軟體及營運技術。控股公司給營運公司全球非專屬再授權，初期三年、可再續三年。這是另一份主約，與基金會先授權給控股公司的合約分開計。"}, {"text_en": "An improvement plan is required only after performance requirements are missed. This does not establish a defined development project already agreed at signing.", "text_zh": "只有未達績效要求時，才需提出改善計畫。這不代表簽約時已有一個內容明確、正在進行的開發專案。"}], "source_ids": ["case10"]}, {"id": "case11", "cells": [{"text_en": "Boston Scientific–MRI (2014)", "text_zh": "Boston Scientific–MRI (2014)"}, {"text_en": "Boston Scientific Neuromodulation Corporation and MRI Interventions, Inc.: a license for patents whose specific technology is not disclosed in this attachment. This worldwide exclusive license-back excludes specified implantable-lead uses. The patent list is missing, so the specific technology cannot be inferred from the companies.", "text_zh": "Boston Scientific 與 MRI的授權合約，標的是附件未列明技術內容的專利。這是把專利權授回另一方的全球專屬安排，但排除特定植入式導線用途。未附專利清單，不能從公司名稱猜測具體技術。"}, {"text_en": "Development permission and patent administration do not specify committed development tasks. These rights alone do not establish a project.", "text_zh": "文件允許開發及管理專利，卻未要求完成一組具體開發任務。僅有這些權利，不能確認有開發專案。"}], "source_ids": ["case11"]}, {"id": "case12", "cells": [{"text_en": "Therapeutic Solutions–Emvolio (2017)", "text_zh": "Therapeutic Solutions–Emvolio (2017)"}, {"text_en": "Therapeutic Solutions International, Inc. and Emvolio, Inc.: a license for MemoryMune technology for reactivating dormant memory cells against cancer. The contract expressly grants worldwide exclusive MemoryMune patent rights while reserving some licensor rights. The original licensor can receive rights to the licensee’s improvements if the stated conditions apply. A cross-reference about converting these rights is unclear.", "text_zh": "Therapeutic Solutions 與 Emvolio的授權合約，標的是重新活化休眠記憶細胞以對抗癌症的 MemoryMune 技術。文件授予全球專屬MemoryMune專利權，也保留授權人的部分權利。被授權人改良成果的回授權須符合條件，且部分關於權
