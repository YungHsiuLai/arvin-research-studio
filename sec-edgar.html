ation", "title_zh": "公司設立章程", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Corporate legal structure and charter provisions.", "uses_zh": "公司法律架構及章程條款。", "source_ids": ["item601", "conformance"]}, {"code": "EX-3.(ii)", "item_number": 3, "title_en": "Bylaws", "title_zh": "公司內部規章", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Internal governance rules.", "uses_zh": "內部治理規則。", "source_ids": ["item601", "conformance"]}, {"code": "EX-4", "item_number": 4, "title_en": "Security-holder rights and indentures", "title_zh": "證券持有人權利與信託契約", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Security rights, debt covenants and instrument descriptions.", "uses_zh": "證券權利、債務約款與金融工具說明。", "source_ids": ["item601", "conformance"]}, {"code": "EX-5", "item_number": 5, "title_en": "Legal opinions", "title_zh": "合法性法律意見", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Counsel opinion on securities being issued.", "uses_zh": "律師對發行證券合法性的意見。", "source_ids": ["item601", "conformance"]}, {"code": "EX-7", "item_number": 7, "title_en": "Accountant non-reliance correspondence", "title_zh": "會計師不再信賴原報告函件", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Context for withdrawn reliance on an audit or interim review.", "uses_zh": "不再信賴既有查核或期中核閱報告的背景。", "source_ids": ["item601", "conformance"]}, {"code": "EX-8", "item_number": 8, "title_en": "Tax opinions", "title_zh": "稅務意見", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Tax treatment discussed for a transaction or offering.", "uses_zh": "交易或發行所涉稅務處理。", "source_ids": ["item601", "conformance"]}, {"code": "EX-9", "item_number": 9, "title_en": "Voting trust agreements", "title_zh": "表決權信託契約", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Contractual arrangements for voting control.", "uses_zh": "表決控制權的契約安排。", "source_ids": ["item601", "conformance"]}, {"code": "EX-10", "item_number": 10, "title_en": "Material contracts", "title_zh": "重大契約", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Read disclosed technology-license, supply, credit, employment and other material agreements. Technology licenses meeting Item 601's material-contract filing requirements generally appear as EX-10 or EX-10.x. Item 601(b)(10)(ii)(B) specifically includes licenses to patents, formulas, trade secrets, processes or trade names on which the business materially depends. They may accompany 10-K, 10-Q, 8-K or S-1 filings, or be incorporated by reference to an earlier exhibit. Not every license must be public; qualifying nonmaterial confidential terms may be redacted under (b)(10)(iv). Read the agreement before coding its terms.", "uses_zh": "閱讀已揭露的技術授權、供應、融資、聘僱等重大契約。符合 Item 601 重大契約申報要求的技術授權，通常列為 EX-10 或 EX-10.x；其中 (b)(10)(ii)(B) 明列公司業務重大依賴的專利、配方、營業秘密、製程或商號使用授權。附件可隨 10-K、10-Q、8-K 或 S-1 申報，亦可引用先前已申報的附件。並非每份授權都須公開；符合 (b)(10)(iv) 條件的非重大機密條款可能遮蔽，須核讀文件後再編碼。", "source_ids": ["item601", "conformance"]}, {"code": "EX-11", "item_number": 11, "title_en": "Historical computation of earnings per share", "title_zh": "歷史每股盈餘計算表", "status": "legacy_reserved", "status_en": "Requirement removed from 2018-11-05; number left vacant", "status_zh": "2018-11-05 起取消附件要求；編號保留空缺", "uses_en": "Reconstruct basic/diluted EPS, earnings numerators and weighted-average share denominators where disclosed. The separate Item 601(11) exhibit requirement ended on 2018-11-05, the rule's effective date; Reserved leaves the item number vacant. Historical documents remain accessible. The three registered EX-11 examples have filing dates from 2006-03-06 to 2011-01-28. The earliest and latest filings across all EDGAR EX-11 documents have not been audited: neither these sample dates nor the regulatory change establish the category's complete coverage or final filing date.", "uses_zh": "在實際揭露範圍內核對基本／稀釋 EPS、盈餘分子及加權平均股數分母。Item 601(11) 的單獨附件要求於法規生效日 2018-11-05 取消；Reserved 表示該項編號留空，歷史文件仍可取得。目前登錄的三份 EX-11 實例申報日為 2006-03-06 至 2011-01-28。全 EDGAR 此類附件的最早與最晚申報日尚未盤點；這段樣本日期與法規取消日均不代表全類別的完整涵蓋期間或最後申報日。", "source_ids": ["item601", "release-2018", "conformance"]}, {"code": "EX-12", "item_number": 12, "title_en": "Historical computation of ratios", "title_zh": "歷史比率計算表", "status": "legacy_reserved", "status_en": "Requirement removed from 2018-11-05; number left vacant", "status_zh": "2018-11-05 起取消附件要求；編號保留空缺", "uses_en": "Read historical earnings-to-fixed-charge or related ratio computations. The Item 601(12) exhibit requirement ended on 2018-11-05, the rule's effective date; Reserved leaves the item number vacant. This changes an attachment requirement, not a database column. No EX-12 examples have been collected here, and the earliest and latest filings across EDGAR have not been audited. The cancellation date is not an observed final filing date.", "uses_zh": "閱讀歷史盈餘對固定費用等比率計算。Item 601(12) 的附件要求於法規生效日 2018-11-05 取消；Reserved 表示該項編號留空。變更的是附件申報要求，不是資料庫欄位。目前尚未收集 EX-12 實例，全 EDGAR 此類附件的最早與最晚申報日也尚未盤點；取消日不是已觀察到的最後申報日。", "source_ids": ["item601", "release-2018", "conformance"]}, {"code": "EX-13", "item_number": 13, "title_en": "Security-holder annual or quarterly reports", "title_zh": "股東年度或季度報告", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Read reports incorporated into a filing.", "uses_zh": "閱讀併入申報文件的股東報告。", "source_ids": ["item601", "conformance"]}, {"code": "EX-14", "item_number": 14, "title_en": "Code of ethics", "title_zh": "道德規範", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Review disclosed ethical policies and amendments.", "uses_zh": "閱讀已揭露的道德政策及修訂。", "source_ids": ["item601", "conformance"]}, {"code": "E tle_en": "Mine-safety disclosures", "title_zh": "礦場安全揭露", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Observe reported mine-safety violations and related disclosures.", "uses_zh": "觀察已申報的礦場安全違規及相關資訊。", "source_ids": ["item601", "conformance"]}, {"code": "EX-96", "item_number": 96, "title_en": "Mining technical-report summary", "title_zh": "礦業技術報告摘要", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Read qualified-person technical summaries of mining properties.", "uses_zh": "閱讀合格專家對礦業資產的技術摘要。", "source_ids": ["item601", "conformance"]}, {"code": "EX-97", "item_number": 97, "title_en": "Erroneously awarded compensation recovery policy", "title_zh": "錯誤發放薪酬追回政策", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Review compensation recovery policies.", "uses_zh": "閱讀薪酬追回政策。", "source_ids": ["item601", "conformance"]}, {"code": "EX-98", "item_number": 98, "title_en": "De-SPAC reports, opinions and appraisals", "title_zh": "De-SPAC 報告、意見與估價", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Read transaction-related reports and valuations required for de-SPAC transactions.", "uses_zh": "閱讀 de-SPAC 交易要求揭露的報告及估值。", "source_ids": ["item601", "conformance"]}, {"code": "EX-99", "item_number": 99, "title_en": "Additional exhibits", "title_zh": "其他附件", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Inspect content before classifying: press releases, presentations and many other documents use this label.", "uses_zh": "須閱讀內容再分類，新聞稿、簡報及多種文件都可能使用此標籤。", "source_ids": ["item601", "conformance"]}, {"code": "EX-101", "item_number": 101, "title_en": "Interactive financial data", "title_zh": "互動式財務資料", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Extract XBRL financial facts, contexts, units and taxonomy links.", "uses_zh": "擷取 XBRL 財務數值、情境、單位及分類連結。", "source_ids": ["item601", "conformance"]}, {"code": "EX-102", "item_number": 102, "title_en": "Asset data file", "title_zh": "資產資料檔", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Extract asset-level securitization information where required.", "uses_zh": "擷取規定揭露的證券化資產層級資訊。", "source_ids": ["item601", "conformance"]}, {"code": "EX-103", "item_number": 103, "title_en": "Asset-related documents", "title_zh": "資產相關文件", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Read additional asset-level information and explanations.", "uses_zh": "閱讀其他資產層級資訊及說明。", "source_ids": ["item601", "conformance"]}, {"code": "EX-104", "item_number": 104, "title_en": "Cover-page interactive data", "title_zh": "封面互動式資料", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Read tagged cover-page information; presentation can be embedded in Inline XBRL.", "uses_zh": "閱讀標記後的封面資訊，可能嵌於 Inline XBRL。", "source_ids": ["item601", "conformance"]}, {"code": "EX-106", "item_number": 106, "title_en": "Static pool PDF", "title_zh": "靜態資產池 PDF", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Read applicable historical pool information in PDF form.", "uses_zh": "閱讀適用的歷史資產池 PDF 資訊。", "source_ids": ["item601", "conformance"]}, {"code": "EX-FILING FEES (Item 107)", "item_number": 107, "title_en": "Filing-fee table", "title_zh": "申報費用表", "status": "current_item601", "status_en": "Current Item 601", "status_zh": "現行 Item 601", "uses_en": "Read fee computations and related offering information; the electronic label is EX-FILING FEES.", "uses_zh": "閱讀申報費用計算及相關發行資訊；電子代碼為 EX-FILING FEES。", "source_ids": ["item601", "conformance"]}], "reserved_exhibit_ranges": ["6", "11–12", "26–30", "37–94", "100", "105"], "other_exhibit_families": [{"title_en": "Investment-company exhibits", "title_zh": "投資公司附件", "examples": ["EX-99.d ADVSR CONTR", "EX-99.CERT"], "note_en": "Form-specific EX-99 suffixes cover advisory contracts, certifications and other attachments.", "note_zh": "依表格定義的 EX-99 後綴包含投資顧問契約、認證及其他附件。", "source_id": "conformance"}, {"title_en": "Regulation A exhibits", "title_zh": "Regulation A 附件", "examples": ["EX1A-6 MAT CTRCT", "EX1A-11 CONSENT"], "note_en": "The same number can mean something different: EX1A-11 is a consent, not the EPS exhibit EX-11.", "note_zh": "相同數字可能意義不同；EX1A-11 是同意書，不是 EPS 附件 EX-11。", "source_id": "conformance"}, {"title_en": "Intermediary and infrastructure exhibits", "title_zh": "金融中介及基礎設施附件", "examples": ["EX-99.A SDR AGRMNT", "EX-99.E2 NRSRO", "EX-99.A.SBSEF"], "note_en": "Use the applicable form instructions and the complete document type.", "note_zh": "須依對應表格說明及完整文件代碼判讀。", "source_id": "conformance"}], "sizes": [{"resource_id": "edgar-entire-corpus", "label_en": "All EDGAR filing documents", "label_zh": "全部 EDGAR 申報文件", "bytes": null, "status": "not_measured", "scope": "Total bytes of all publicly available EDGAR filing documents have not been measured in this project; the reviewed SEC resources do not provide a complete total by form or exhibit type.", "scope_en": "Total bytes of all publicly available EDGAR filing documents have not been measured in this project; the reviewed SEC resources do not provide a complete total by form or exhibit type.", "scope_zh": "本專案尚未計算全部公開 EDGAR 申報文件的總容量；已查閱的 SEC 資源未提供按表格或附件類型完整加總的容量。", "checked_at": "2026-10-26", "url": "https://www.sec.gov/about/developer-resources", "method": "Reviewed official data-access documentation; no whole-corpus enumeration performed."}, {"resource_id": "submissions-zip", "label_en": "submissions.zip — compressed archive", "label_zh": "submissions.zip — 壓縮檔", "bytes": 1570993018, "status": "http_content_length", "scope": "Compressed bulk ZIP of public filing-history metadata from the Submissions API; it does not contain all filing documents.", "scope_en": "Compressed bulk ZIP of public filing-history metadata from the Submissions API; it does not contain all filing documents.", "scope_zh": "Submissions API 公開申報歷史中繼資料的壓縮 ZIP，不包含全部申報文件。", "checked_at": "2026-10-26", "url": "https://www.sec.gov/Archives/edgar/daily-index/bulkdata/submissions.zip", "method": "HTTP HEAD; status 200; Content-Length in bytes. Archive not downloaded.", "last_modified": "Fri, 23 Oct 2026 23:55:27 GMT"}, {"resource_id": "companyfacts-zip", "label_en": "companyfacts.zip — compressed archive", "label_zh": "companyfacts.zip — 壓縮檔", "bytes": 1411517904, "status": "http_content_length", "scope": "Compressed bulk ZIP of extracted XBRL company facts; it does not contain all filing documents or contract exhibits.", "scope_en": "Compressed bulk ZIP of extracted XBRL company facts; it does not contain all filing documents or contract exhibits.", "scope_zh": "擷取後 XBRL 公司財務事實的壓縮 ZIP，不包含全部申報文件或契約附件。", "checked_at": "2026-10-26", "url": "https://www.sec.gov/Archives/edgar/daily-index/xbrl/companyfacts.zip", "method": "HTTP HEAD; status 200; Content-Length in bytes. Archive not downloaded.", "last_modified": "Fri, 23 Oct 2026 23:48:08 GMT"}], "maintenance_en": "Refresh the manual and current rule separately; do not equate archival labels with active requirements. Recheck byte counts with HEAD and date each observation. Whole-corpus or category totals require a defined date range, complete index enumeration and a deduplicated document manifest.", "maintenance_zh": "分別更新手冊與現行法規，不把歷史標籤視為現行要求。用 HEAD 重查容量並記錄日期；全庫或分類容量須先界定期間、完整列舉索引及建立去重文件清單。"}, "documents": [{"cik": "80424", "company": "PROCTER \u0026 GAMBLE CO", "accession": "0001193125-11-017328", "form": "10-Q", "filed_date": "2011-01-28", "exhibit_type": "EX-11", "filename": "dex11.htm", "source_url": "https://www.sec.gov/Archives/edgar/data/80424/000119312511017328/dex11.htm", "bytes": 49122, "sha256": "ceb26b54bce81eeb5c1d699f16c1c5a8f1442fa4abb4675226aa0da2c2d3089a", "description": "COMPUTATION OF EARNINGS PER SHARE"}, {"cik": "51434", "company": "INTERNATIONAL PAPER CO /NEW/", "accession": "0001193125-06-046215", "form": "10-K", "filed_date": "2006-03-06", "exhibit_type": "EX-11", "filename": "dex11.htm", "source_url": "https://www.sec.gov/Archives/edgar/data/51434/000119312506046215/dex11.htm", "bytes": 26145, "sha256": "a4f571d0f602d4457305053bc2e11d0da08a702578ade0461f588d7c164414d3", "description": "STATEMENT OF COMPUTATION OF PER SHARE EARNINGS"}, {"cik": "320335", "company": "TORCHMARK CORP", "accession": "0001193125-06-165709", "form": "10-Q", "filed_date": "2006-08-08", "exhibit_type": "EX-11", "filename": "dex11.htm", "source_url": "https://www.sec.gov/Archives/edgar/data/320335/000119312506165709/dex11.htm", "bytes": 9870, "sha256": "cbb5373048cbb87423c43e650dd82fc0a45ef53e530a667d1bf4d00cad680206", "description": "STATEMENT RE COMPUTATION OF PER SHARE EARNINGS"}, {"cik": "853273", "company": "BORLAND SOFTWARE CORP", "accession": "0000853273-01-500022", "form": "10-Q", "filed_date": "2001-08-13", "exhibit_type": "EX-10", "filename": "form10q_063001ex10-2.htm", "source_url": "https://www.sec.gov/Archives/edgar/data/853273/000085327301500022/form10q_063001ex10-2.htm", "bytes": 125339, "sha256": "4946c955ca9ebf56cec54897f4fdb7a0141f572095a02403f2af1af4553631f7", "description": "TECHNOLOGY LICENSE AND DISTRIBUTION AGMT"}, {"cik": "1645460", "company": "Cue Biopharma, Inc.", "accession": "0001193125-18-358131", "form": "8-K/A", "filed_date": "2018-12-26", "exhibit_type": "EX-10.1", "filename": "d677625dex101.htm", "source_url": "https://www.sec.gov/Archives/edgar/data/1645460/000119312518358131/d677625dex101.htm", "bytes": 797047, "sha256": "cb5e43e64246252a6804ed00563936507c2cf7b785b577d64556a4f0a9f73d57", "description": "EX-10.1"}], "key_content": {"scope_zh": "從兩份已與SEC原始檔核對的 EX-10 合約挑選關鍵段落，呈現已揭露的契約安排；不代表完整 EDGAR 母體或已實現經營結果。刪節及未附內容仍保留未知。", "reviewed_at": "2026-10-26", "dataset_id": "sec-edgar", "scope_en": "Selected passages from two EX-10 contracts checked against the original SEC files. These examples show disclosed agreement terms, not the complete EDGAR population or realized business outcomes. Redacted and missing provisions remain unknown.", "schema_version": 1, "documents": [{"effective_date": "1995-10-31", "source_sha256": "4946c955ca9ebf56cec54897f4fdb7a0141f572095a02403f2af1af4553631f7", "scope_zh": "合約開頭明定生效日為 1995-10-31，簽署日期為 1995-11-07，申報日則為 2001-08-13。已讀取全部可見主約與附件 A–G；費用／費率金額遭刪節，附件 E 僅註明保密協議待附。", "filename": "form10q_063001ex10-2.htm", "parties_zh": "Sun Microsystems, Inc. 透過 Java Products Group 授權技術；Borland International, Inc. 為被授權人。SEC 申報公司名稱為 Borland Software Corp.。", "accession": "0000853273-01-500022", "parties_en": "Sun Microsystems, Inc., through its Java Products Group, licenses technology to Borland International, Inc. (the Licensee). The SEC filer is named Borland Software Corp.", "contract_title": "Technology License and Distribution Agreement", "scope_en": "The opening states an effective date of 1995-10-31; signatures are dated 1995-11-07, and the exhibit was filed on 2001-08-13. All visible agreement text and Exhibits A–G were read. Fee/rate amounts are redacted, and Exhibit E only says a confidentiality agreement is to be attached.", "passages": [{"category_en": "Technology grant and sublicensing", "quote": "worldwide, non-exclusive, non-transferable license", "category_zh": "技術授權與再授權", "explanation_zh": "Sun 提供全球、非專屬的原始碼授權，用於約定產品的開發與支援。原始碼再授權限於替 Borland 產品移植或在地化的第三方；二進位產品可透過經銷通路發布，技術須包含在具有附加價值的產品中。", "id": "borland_grant_and_sublicensing", "limits_en": "The source-code, binary-distribution and trademark licences have different conditions. This is not an unrestricted right to resell source code or transfer the agreement.", "explanation_en": "Sun grants a worldwide, non-exclusive source-code licence for specified product development and support. Source-code sublicensing is limited to third parties porting or localizing Borland products; binary distribution may use distributors, and the technology must be part of a value-added product.", "locator": "Sections 2.1(a), 2.1(b)(iii), 2.2(b), 2.8 and 2.11; printed pp. 2–4, 7", "limits_zh": "原始碼、二進位發布及商標授權各有不同條件；不能解讀為可任意轉售原始碼或轉讓整份契約。"}, {"category_en": "Compatibility and decision rights", "quote": "must pass the Java Test Suite", "category_zh": "相容性與決策權", "explanation_zh": "每次發布的產品版本須通過適用的相容性測試。Sun 依約提供及更新測試套件；雙方每季工程檢討可提出修改建議，但升級處理後由 Sun 指定主管作最終決定。", "id": "borland_compatibility_governance", "limits_en": "The agreement contains timing rules and an applet-related exception. These are contractual control mechanisms, not evidence of actual compliance or product quality.", "explanation_en": "Each released product revision must pass the applicable compatibility test. Sun supplies and revises the test suites subject to stated limits; quarterly engineering reviews allow Borland to propose changes, but escalation ends with Sun's designated executive.", "locator": "Sections 2.4(a)(ii)–(iii) and 5.7; printed pp. 4, 9", "limits_zh": "主約另有測試版本時點及特定 applet 例外；這些是約定的控制機制，不代表已觀察到實際遵循或產品品質。"}, {"category_en": "Fees, royalties and conditional waivers", "quote": "Net Revenue Royalties:", "category_zh": "費用、權利金與附條件減免", "explanation_zh": "契約列出原始碼費用、按份／訂閱及淨收入計算的權利金架構，約定季度申報與美元付款；部分費用減免取決於如期出貨或提供等值工程支援。附件 C 另定淨收入扣除項目及綑綁產品分攤。", "id": "borland_fees_and_royalties", "limits_en": "The fee amounts, rates and price thresholds are redacted. The visible formulas do not identify a numerical royalty rate, a zero fee, actual payments or realized sales.", "explanation_en": "The agreement specifies source fees, per-copy/subscription and net-revenue royalty structures, quarterly reporting, and USD payments. It also ties fee waivers to timely product shipment or equivalent engineering support. Exhibit C defines deductions and bundled-product allocation.", "locator": "Sections 4.1–4.3 and Exhibit C, items 1 and 3; printed pp. 8, 17–18", "limits_zh": "金額、費率與價格門檻已刪節；可見計算架構不能還原數值費率，也不能視為零費用、實際付款或已實現銷售額。"}, {"category_en": "Records and payment verification", "quote": "right to audit", "category_zh": "帳冊與付款查核", "explanation_zh": "Borland 須保留足以核對權利金的帳冊；Sun 可委託獨立稽核人，並受保密及頻率限制。經確認短付超過 5% 時，合理稽核費用由 Borland 負擔，並依約補付及計息。", "id": "borland_audit_rights", "limits_en": "The 5% figure is an audit-cost trigger, not a royalty rate. The clause does not show that an audit occurred or any underpayment was found.", "explanation_en": "Borland must keep records sufficient to verify royalties. Sun may use an independent auditor subject to confidentiality and frequency limits; a confirmed underpayment above 5% shifts reasonable audit charges to Borland and triggers the stated payment adjustment and interest.", "locator": "Sections 4.4–4.6; printed p. 8", "limits_zh": "5% 是稽核費用轉由被授權人負擔的門檻，不是權利金率；條款不表示曾實際稽核或發現短付。"}, {"category_en": "Marketing and compatibility branding", "quote": "Advertising and Promotion:", "category_zh": "行銷合作與相容性品牌", "explanation_zh": "Borland 在指定展示活動須標示 Java 技術及相容性標誌；契約另定新聞宣傳合作、Sun 對涉及技術的新聞稿內容之事前檢視，以及標誌使用與認證規則。", "id": "borland_joint_marketing", "limits_en": "The trademark annex has its own territorial and certification conditions. These are agreed marketing obligations, not observed advertising exposure, customer response or brand lift.", "explanation_en": "Borland must acknowledge Java technology and use the compatibility logo in specified demonstrations. The agreement also provides for press cooperation, Sun review of technology-related press statements, and detailed logo-use and certification requirements.", "locator": "Sections 5.5–5.6; Exhibit D, items 1–2; Exhibit G, Sections 2–5; printed pp. 9, 19, 24–26", "limits_zh": "商標附件另有地域及認證條件；這些是約定的行銷義務，不是實際廣告曝光、顧客反應或品牌效果。"}, {"category_en": "Term, cure and exit consequences", "quote": "opportunity to cure", "category_zh": "期限、補正與退出後果", "explanation_zh": "初始期限為五年，可依條件逐年續約。一般可補正違約通常有 30 天補正期；相容性違約另有 60 天程序及可能的 30 天延長。期滿後可保留特定發布／支援權利；Sun 依約終止則觸發返還或銷毀義務。", "id": "borland_term_and_cure", "limits_en": "Expiration, breach termination and the trademark annex have different effects. The filed agreement alone does not establish whether renewal, breach or termination actually occurred.", "explanation_en": "The initial term is five years, with conditional annual renewals. Ordinary curable breaches generally have a 30-day cure period; compatibility breaches have a separate 60-day process and a possible 30-day extension. Expiry preserves specified distribution/support rights, while Sun's termination triggers return or destruction duties.", "locator": "Sections 10.1–10.3 and 10.8; printed pp. 11–12", "limits_zh": "期滿、因違約終止及商標附件的效果不同；這份申報合約本身無法確認後來是否實際續約、違約或終止。"}]}, {"effective_date": "2018-11-06", "source_sha256": "cb5e43e64246252a6804ed00563936507c2cf7b785b577d64556a4f0a9f73d57", "scope_zh": "主約開頭明定生效日為 2018-11-06；SEC 申報日為 2018-12-26。已核讀主約與附件全部可見內容；多處條款及八份附件遭刪節，附件 I 僅待日後更新。附帶股權交易與授權付款分開解讀；本檔不能證明後續修約、履約結果或現行狀態。", "filename": "d677625dex101.htm", "parties_zh": "Cue Biopharma, Inc. 提供 T 細胞生物藥技術；LG Chem, Ltd. 取得指定地域權利並提供製造技術。雙方依約定產品與地域相互授權。", "accession": "0001193125-18-358131", "parties_en": "Cue Biopharma, Inc. provides T-cell biologic technology; LG Chem, Ltd. receives regional rights and contributes manufacturing technology. Both grant rights to the other for the defined products and territories.", "contract_title": "Collaboration, License and Option Agreement", "scope_en": "The opening expressly sets 2018-11-06 as the effective date; SEC filing was 2018-12-26. The complete visible main agreement and exhibits were reviewed. Numerous terms and eight exhibits are omitted; Exhibit I is an update placeholder. Attached equity terms are separate from license payments. This file does not establish later amendments, performance or current status.", "passages": [{"category_en": "Territory, exclusivity and sublicensing", "quote": "right to grant sublicenses", "category_zh": "地域、專屬範圍與再授權", "explanation_zh": "LG 在列明的亞太地域取得約定合作產品之人體用途專屬權利，並保留 Cue 的約定權利；Cue 亦取得 LG 技術的相應地域權利。可多層次書面再授權，但有通知、承接能力與遵約要求。第 2.4(d) 條另授予 Cue 永久、非專屬的全球權利，標的位於 Collaboration Compounds 之外但部分內容已刪節。額外的全球計畫授權則為另一項兩年期選擇權，須行使並另簽協議。", "id": "cue_regional_grant_and_sublicensing", "limits_en": "Code each grant separately by direction, product, field and territory. Do not collapse the regional grants, partly redacted global grant and unexercised option into one exclusivity/geography flag. Several consent and forbearance terms remain redacted.", "explanation_en": "LG receives exclusive rights to defined collaboration products for human uses in the listed Asia-Pacific territory, subject to Cue's retained rights; Cue has reciprocal regional rights under LG technology. Written sublicenses may pass through multiple tiers, with notice, capability and compliance requirements. Section 2.4(d) separately grants Cue perpetual, non-exclusive worldwide rights over partly redacted subject matter outside Collaboration Compounds. An additional worldwide program license is a separate two-year option requiring exercise and another agreement.", "locator": "Sections 1.109, 1.147, 1.225, 2.1–2.5, 2.9 and 2.11; printed pp. 10, 13, 19, 26–32", "limits_zh": "須按授權方向、產品、用途與地域分別編碼；地域授權、部分刪節的全球授權與尚未證實行使的選擇權不能合併成單一專屬性／地域旗標。多項同意條件與競爭限制仍遭刪節。"}, {"category_en": "Joint committees and decision rights", "quote": "made by unanimous vote", "category_zh": "聯合委員會與決策權", "explanation_zh": "設置統籌、研究、開發、製造與專利委員會；各委員會初始由雙方各派兩人，原則上每季開會。每方合計一票；未決事項上呈統籌委員會及高階主管，再依議題與地域分配最終決策權。特定研究與跨區計畫仍須雙方同意，聯盟經理負責資訊與爭議協調。", "id": "cue_joint_governance", "limits_en": "Equal membership does not imply equal authority over every decision. Escalation deadlines and some decision restrictions are redacted; these are promised structures, not evidence that meetings occurred or disputes were resolved.", "explanation_en": "Steering, research, development, manufacturing and patent committees coordinate the collaboration. Each initially has two representatives per party and normally meets quarterly. Each party has one collective vote; unresolved matters escalate to the steering committee and executives, followed by subject- and territory-specific final-decision rules. Certain research and multi-region plans still require both parties' consent. Alliance managers coordinate information and disputes.", "locator": "Sections 3.1–3.6; printed pp. 32–39", "limits_zh": "席次相同不表示所有議題的權力相同；升級處理期限及部分決策限制已刪節。這是約定的治理安排，不能證明實際開會或爭議已解決。"}, {"category_en": "Manufacturing alternatives and technology transfer", "quote": "to an Approved CMO", "category_zh": "替代製造安排與技術移轉", "explanation_zh": "Cue 可選擇由 LG 承接後續製造階段並議定供應契約。就符合條件的產品，未選擇特定階段、未談成供應契約或特定違約未補正時，Cue 可要求將必要製程移轉給核准的委外製造商。LG 須盡商業合理努力，使其能製造結構、品質與純度相當的產品；CMC 製程資訊僅能提供給核准製造商。", "id": "cue_manufacturing_transfer", "limits_en": "This is a conditional transfer mechanism, not unrestricted access to all know-how or proof of an actual supplier switch. Some breach triggers, cure periods, transfer fees, support periods and manufacturer restrictions are redacted.", "explanation_en": "Cue can elect later manufacturing stages from LG, with negotiated supply agreements. For covered products, declining an eligible stage, failure to agree a supply contract or specified uncured breach can trigger a requested transfer of necessary manufacturing processes to an approved contract manufacturer. LG must use commercially reasonable efforts; the transferred process must support comparable structure, quality and purity. LG's CMC information may be shared only with approved manufacturers.", "locator": "Sections 6.3–6.9; printed pp. 57–61", "limits_zh": "這是附條件的移轉機制，不是無限制取得全部專門技術，也不能證明已更換供應商；部分違約條件、補正期、移轉費、支援期間及製造商限制已刪節。"}, {"category_en": "Upfront fee, equity, milestones and royalties", "quote": "five million U.S. dollars", "category_zh": "前期款、股權、里程碑款與權利金", "explanation_zh": "LG 約定支付不可退還的 5,000,000 美元前期款。另以每股 8.86 美元認購 564,187 股，股權交易總額為 4,998,696.82 美元。合約另含成本分攤、條件式里程碑款與雙向權利金，並界定淨銷售額扣除項、組合產品分攤及調整規則；合約付款使用美元。", "id": "cue_payment_components", "limits_en": "Royalty rates, milestone amounts/events and many deadlines are redacted. Equity consideration is not a royalty or license fee. These are agreed amounts and formulas, not verified payments, equity closing or realized revenue.", "explanation_en": "LG owes a USD 5,000,000 nonrefundable upfront payment. A separate equity commitment is USD 4,998,696.82 for 564,187 shares at USD 8.86 per share. The agreement also provides cost sharing, conditional milestone payments and reciprocal royalties based on defined net sales, with deductions, combination-product allocation and adjustment rules. Contract payments are in USD.", "locator": "Sections 1.245, 7.1–7.9 and 8.2; Exhibit G Sections 2.1–2.2; printed pp. 20–21, 63–70", "limits_zh": "權利金率、里程碑金額／事件及多項期限已刪節；股權交易款不能當作權利金或授權費。此處是約定金額與計算方式，未核實實際付款、股權交割或已實現收入。"}, {"category_en": "Reporting and payment audits", "quote": "Records; Audit.", "category_zh": "報告義務與付款查核", "explanation_zh": "每季按產品及國家報告數量、總／淨銷售額、扣除項、權利金、計算方式及匯率。雙方須保存支持付款及指定成本的紀錄，並可由雙方接受的獨立會計師查核；每個受查期間及每個日曆年均最多查核一次，另須符合契約條件。", "id": "cue_reports_and_audit", "limits_en": "The contract does not include the resulting sales reports or audits. Record-retention years, audit lookback, notice, repayment timing and the discrepancy threshold for shifting audit costs are redacted.", "explanation_en": "Quarterly reports separate products and countries and detail quantities, gross/net sales, deductions, royalties, calculations and exchange rates. Both parties retain records supporting payments and specified costs. A mutually acceptable independent accountant may audit, at most once per audited period and once per calendar year, subject to the contract's conditions.", "locator": "Sections 8.1–8.4; printed pp. 70–72", "limits_zh": "本合約不含實際銷售報告或查核結果；紀錄保存年限、可追查期間、通知期、補款期限及轉移查核費用的差異門檻已刪節。"}, {"category_en": "Exit rights, cure and transition", "quote": "Termination by LGC for Convenience.", "category_zh": "退出權、補正與終止後交接", "explanation_zh": "LG 可依整份合約、計畫、產品或國家退出；首次商業銷售前須提前 60 天通知，銷售後為六個月，嚴重不良事件則為十天。重大違約通常有 60 天補正期，付款違約為 45 天，符合條件時可延長。屆期與提前終止對授權、交接義務及剩餘存貨的效果不同。", "id": "cue_termination_and_transition", "limits_en": "LG's convenience-exit right is not a reciprocal general right. Several transition triggers and conditions are redacted; no actual termination or unconditional transfer of technology is established.", "explanation_en": "LG may terminate all or part of the agreement by program, product or country: notice is 60 days before first commercial sale, six months after sale, or ten days for a serious adverse event. Material breach normally allows 60 days to cure, or 45 for payment breaches, with a conditional extension. Expiration and early termination have different effects on licenses, transition duties and remaining inventory.", "locator": "Sections 13.1–13.3; printed pp. 97–101", "limits_zh": "LG 的任意退出權不是雙方皆有的一般權利；多項交接條件已刪節。不能據此判定已終止合作，或將技術交接視為無條件義務。"}]}]}}}, "dataset_catalog": [{"id": "wrds-revelio", "title": "Revelio Labs", "subtitle": "職涯、人力、職缺與員工評論資料", "summary": "由 Revelio Labs 整理 LinkedIn 等公開來源的全球職涯、招聘與員工評論資料，並提供 2008-01 至 2026-08 的公司月度人力動態資料。", "description": "職涯、人力、招聘廣告與員工評論資料；字典提供各表觀察單位、欄位定義、真實例子與行銷／B2B 的 DV／IV／控制變數適用性。", "href": "./wrds-revelio.html"}, {"id": "royaltystat-technology-licensing", "title": "RoyaltyStat · Technology Licensing", "subtitle": "RoyaltyStat 2006–2016 年淨銷售額計價授權紀錄，串接 1999–2016 年授權雙方公司財務資料。", "summary": "RoyaltyStat 2006–2016 年淨銷售額計價授權紀錄，串接 1999–2016 年授權雙方公司財務資料。", "description": "RoyaltyStat 2006–2016 年淨銷售額計價授權紀錄，串接 1999–2016 年授權雙方公司財務資料。", "href": "./royaltystat-technology-licensing.html"}, {"id": "sec-edgar", "title": "SEC EDGAR", "subtitle": "從 SEC EDGAR 選取並下載申報於 2001-08-13 至 2018-12-26 的 EX-10 技術授權契約與 EX-11 每股盈餘計算附件。", "summary": "從 SEC EDGAR 選取並下載申報於 2001-08-13 至 2018-12-26 的 EX-10 技術授權契約與 EX-11 每股盈餘計算附件。", "description": "從 SEC EDGAR 選取並下載申報於 2001-08-13 至 2018-12-26 的 EX-10 技術授權契約與 EX-11 每股盈餘計算附件。", "href": "./sec-edgar.html"}, {"id": "wrds-supplychain", "title": "Supply Chain", "subtitle": "Compustat Segment 客戶—供應商關係與客戶銷售額", "summary": "由 WRDS 串接 Compustat Segment 的客戶揭露與公司識別資料，已核對主表涵蓋 1976-06-30 至 2026-07-31 的供應商—客戶關係與客戶銷售資訊。", "description": "以公司識別串接客戶—供應商關係、客戶銷售額及外部財務資料。", "href": "./wrds-supplychain.html"}, {"id": "wrds-revere-preview", "title": "(Preview) FactSet Revere", "subtitle": "WRDS 提供的 FactSet Revere 企業供應、客戶與合作關係預覽；本機資料的關係版本起始日涵蓋 2003-04-03 至 2015-05-11。", "summary": "WRDS 提供的 FactSet Revere 企業供應、客戶與合作關係預覽；本機資料的關係版本起始日涵蓋 2003-04-03 至 2015-05-11。", "description": "WRDS 提供的 FactSet Revere 企業供應、客戶與合作關係預覽；本機資料的關係版本起始日涵蓋 2003-04-03 至 2015-05-11。", "href": "./wrds-revere-preview.html"}, {"id": "wrds-infraclear-preview", "title": "(Preview) InfraClear", "subtitle": "WRDS 提供的 InfraClear 基礎建設合約、當事人角色、專案與條款抽取預覽；本機合約簽署日期涵蓋 1965-02-02 至 2025-03-24。", "summary": "WRDS 提供的 InfraClear 基礎建設合約、當事人角色、專案與條款抽取預覽；本機合約簽署日期涵蓋 1965-02-02 至 2025-03-24。", "description": "WRDS 提供的 InfraClear 基礎建設合約、當事人角色、專案與條款抽取預覽；本機合約簽署日期涵蓋 1965-02-02 至 2025-03-24。", "href": "./wrds-infraclear-preview.html"}, {"id": "wrds-royaltystat-preview", "title": "(Preview) RoyaltyStat", "subtitle": "WRDS 提供的 RoyaltyStat 授權合約、權利金與交易條件預覽；本機合約生效日期涵蓋 1997-05-28 至 2016-07-01。", "summary": "WRDS 提供的 RoyaltyStat 授權合約、權利金與交易條件預覽；本機合約生效日期涵蓋 1997-05-28 至 2016-07-01。", "description": "WRDS 提供的 RoyaltyStat 授權合約、權利金與交易條件預覽；本機合約生效日期涵蓋 1997-05-28 至 2016-07-01。", "href": "./wrds-royaltystat-preview.html"}], "tables": [{"id": "sec_edgar.exhibit_documents", "schema": "sec_edgar", "name": "exhibit_documents", "title_zh": "附件文件清單", "unit": "一份已核實下載的附件；以 accession 加 filename 辨識文件", "description_zh": "由公開文件整理的清單；型別是本機分析用宣告，不是 SEC 資料庫的 SQL 結構。契約條款與 EPS 數值仍在文件內，尚未抽成分析變數。", "is_preview": false, "facts": {"time_zh": "2001-08-13–2018-12-26（已下載文件的申報日，日尺度）。", "time_en": "2001-08-13–2018-12-26 (filing dates of downloaded documents, day precision).", "sample_zh": "N＝5 個不同 CIK 申報者；n＝5 份選取的 EX-10／EX-11 附件。", "sample_en": "N = 5 distinct CIK filers; n = 5 selected EX-10/EX-11 exhibits.", "size_zh": "1.007523 MB（5 份 HTML 附件，共 1,007,523 bytes；不含母申報檔）。", "size_en": "1.007523 MB (5 HTML exhibits, 1,007,523 bytes; excludes parent submissions)."}, "columns": [{"name": "cik", "type": "text", "definition_en": "(NA)", "definition_verified_zh": "母申報文件的申報者 CIK，以文字保留；清單採未補零形式，查 SEC API 時補至十位。可追溯 EDGAR／Companyfacts，但不是證券或合約識別碼；跨資料庫財務匹配尚未執行。", "definition_verified_en": "Filer CIK from the parent submission, retained as text without padding in this manifest. Pad to ten digits for SEC APIs. It can locate EDGAR/Companyfacts records but is not a security or contract ID; financial cross-database matching has not been performed.", "public_example": {"value": "80424", "kind": "observed", "note_en": "", "note_zh": ""}, "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "供文件追溯、公司串接與重複檔案檢查；正式分析須另抽取內容、核對單位與期間，並決定有意義的構念。", "dv_reason": "文件清單的識別與描述欄位本身不衡量行銷結果；契約與每股盈餘數值尚未抽取。", "iv_reason": "文件識別與取得資訊本身不代表行銷投入、契約或治理構念。"}}, {"name": "company", "type": "text", "definition_en": "(NA)", "definition_verified_zh": "母申報檔 COMPANY CONFORMED NAME 的原文；表示該次申報中的名稱，不保證是現名，也不等於唯一法律實體鍵。公司串接以 CIK 為起點再查更名與母子公司範圍。", "definition_verified_en": "Verbatim COMPANY CONFORMED NAME from the parent submission. It is the name used in that filing, not necessarily the current name or a unique legal-entity key. Start linkage from CIK and check renaming and parent/subsidiary scope.", "public_example": {"value": "INTERNATIONAL PAPER CO /NEW/", "kind": "observed", "note_en": "", "note_zh": ""}, "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "供文件追溯、公司串接與重複檔案檢查；正式分析須另抽取內容、核對單位與期間，並決定有意義的構念。", "dv_reason": "文件清單的識別與描述欄位本身不衡量行銷結果；契約與每股盈餘數值尚未抽取。", "iv_reason": "文件識別與取得資訊本身不代表行銷投入、契約或治理構念。"}}, {"name": "accession", "type": "text", "definition_en": "(NA)", "definition_verified_zh": "母申報的 accession number，保留連字號；識別整份申報，並非單一附件。文件鍵需再加 filename；其前十位可能屬提交代理人，不能替代申報者 CIK。", "definition_verified_en": "Parent filing accession number, including hyphens. It identifies a submission, not an individual exhibit: add filename for document identity. Its first ten digits may identify a filing agent and must not replace the filer's CIK.", "public_example": {"value": "0001193125-06-165709", "kind": "observed", "note_en": "", "note_zh": ""}, "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "供文件追溯、公司串接與重複檔案檢查；正式分析須另抽取內容、核對單位與期間，並決定有意義的構念。", "dv_reason": "文件清單的識別與描述欄位本身不衡量行銷結果；契約與每股盈餘數值尚未抽取。", "iv_reason": "文件識別與取得資訊本身不代表行銷投入、契約或治理構念。"}}, {"name": "form", "type": "text", "definition_en": "(NA)", "definition_verified_zh": "母申報的表單代碼，來自 CONFORMED SUBMISSION TYPE。已收錄的三種值：10-K＝年度報告；10-Q＝財政年度前三季各季的季度報告；8-K/A＝重大事項即時報告 8-K 的修訂申報，/A 表示修訂。這些是文件用途分類，不是數值等級或附件型別；三種值僅限目前收錄文件，完整申報類型另見本頁清單。", "definition_verified_en": "Parent form code from CONFORMED SUBMISSION TYPE. The three collected values mean: 10-K = annual report; 10-Q = quarterly report for each of the first three fiscal quarters; 8-K/A = amendment to a current report on specified material events (8-K), with /A marking an amendment. These are nominal filing-purpose categories, not numerical grades or exhibit types. The three values describe this collection only; see the page's registry for the full submission-type list.", "public_example": {"value": "10-Q", "kind": "observed", "note_en": "", "note_zh": ""}, "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "供文件追溯、公司串接與重複檔案檢查；正式分析須另抽取內容、核對單位與期間，並決定有意義的構念。", "dv_reason": "文件清單的識別與描述欄位本身不衡量行銷結果；契約與每股盈餘數值尚未抽取。", "iv_reason": "文件識別與取得資訊本身不代表行銷投入、契約或治理構念。"}}, {"name": "filed_date", "type": "date", "definition_en": "(NA)", "definition_verified_zh": "母申報 FILED AS OF DATE，整理為 YYYY-MM-DD、日尺度；頁首日期範圍只計已下載文件。不是合約簽署／生效日或 EPS 的會計期間，也不代表整個 EDGAR 或附件類別的完整涵蓋日期。", "definition_verified_en": "Parent FILED AS OF DATE, formatted YYYY-MM-DD at day precision. The page's range covers downloaded files only, not contract signing/effective dates, the accounting period of EPS figures or the complete coverage of EDGAR or an exhibit category.", "public_example": {"value": "2018-12-26", "kind": "observed", "note_en": "", "note_zh": ""}, "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "用於公開申報時間對齊；不是契約生效日、財報期間、處置或因果識別證據。", "dv_reason": "文件清單的識別與描述欄位本身不衡量行銷結果；契約與每股盈餘數值尚未抽取。", "iv_reason": "文件識別與取得資訊本身不代表行銷投入、契約或治理構念。"}}, {"name": "exhibit_type", "type": "text", "definition_en": "(NA)", "definition_verified_zh": "從母申報 SGML 的 DOCUMENT 區塊逐字取得 TYPE。已收錄 EX-10＝重大契約、EX-10.1＝EX-10 類的編號 10.1 附件、EX-11＝歷史每股盈餘計算附件；.1 用於區分文件，不是排他程度、百分比或重要性分數。EX-10 不限技術授權契約；EX-11 不是目前仍須提交的附件要求。以明確類型確認，不能由檔名猜定；內文尚未抽成財務或契約變項。", "definition_verified_en": "Exact TYPE from the parent submission's SGML DOCUMENT block. Collected labels mean EX-10 = material contracts; EX-10.1 = exhibit numbered 10.1 within the EX-10 family; EX-11 = historical earnings-per-share computation exhibits. The .1 distinguishes documents, not exclusivity, a percentage or an importance score. EX-10 is not limited to technology licenses; EX-11 is not a current exhibit-submission requirement. Use the explicit type, not a guessed filename; substantive financial or contract variables have not been extracted.", "public_example": {"value": "EX-11", "kind": "observed", "note_en": "", "note_zh": ""}, "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "供文件追溯、公司串接與重複檔案檢查；正式分析須另抽取內容、核對單位與期間，並決定有意義的構念。", "dv_reason": "文件清單的識別與描述欄位本身不衡量行銷結果；契約與每股盈餘數值尚未抽取。", "iv_reason": "文件識別與取得資訊本身不代表行銷投入、契約或治理構念。"}}, {"name": "filename", "type": "text", "definition_en": "(NA)", "definition_verified_zh": "母申報 DOCUMENT 區塊的 FILENAME 原文；只在同一 accession 範圍內辨識附件。不同申報可共用 dex11.htm 等檔名，不可單獨去重或推定內容類型。", "definition_verified_en": "Verbatim FILENAME from the submission's DOCUMENT block. It identifies an exhibit within an accession. Different filings can reuse names such as dex11.htm; filename alone cannot deduplicate documents or establish their type.", "public_example": {"value": "dex11.htm", "kind": "observed", "note_en": "", "note_zh": ""}, "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "供文件追溯、公司串接與重複檔案檢查；正式分析須另抽取內容、核對單位與期間，並決定有意義的構念。", "dv_reason": "文件清單的識別與描述欄位本身不衡量行銷結果；契約與每股盈餘數值尚未抽取。", "iv_reason": "文件識別與取得資訊本身不代表行銷投入、契約或治理構念。"}}, {"name": "source_url", "type": "text", "definition_en": "(NA)", "definition_verified_zh": "實際下載附件的 SEC HTTPS Archives 網址，由申報者 CIK、移除連字號的 accession 與 filename 組成。這是來源定位資訊，不是本機檔案路徑或財務結果；清單保留的是公開原始來源連結。", "definition_verified_en": "Official SEC HTTPS Archives URL used to download the exhibit, combining filer CIK, accession without hyphens and filename. It locates the public source, not a local file or financial outcome.", "public_example": {"value": "https://www.sec.gov/Archives/edgar/data/320335/000119312506165709/dex11.htm", "kind": "observed", "note_en": "", "note_zh": ""}, "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "供文件追溯、公司串接與重複檔案檢查；正式分析須另抽取內容、核對單位與期間，並決定有意義的構念。", "dv_reason": "文件清單的識別與描述欄位本身不衡量行銷結果；契約與每股盈餘數值尚未抽取。", "iv_reason": "文件識別與取得資訊本身不代表行銷投入、契約或治理構念。"}}, {"name": "bytes", "type": "bigint", "definition_en": "(NA)", "definition_verified_zh": "本機實際保存的附件回應大小，單位 bytes；MB＝bytes／1,000,000。本清單只收錄大小大於 0 的檔案；數字越大只表示儲存位元組越多，沒有高／中／低等級門檻。包含取得的 HTML 及可能的文件包裝，不含母申報檔、索引或整個 EDGAR；不是公司規模、財務金額或純文字長度。", "definition_verified_en": "Size of the saved exhibit response in bytes; MB = bytes / 1,000,000. Registered files must have a positive size. Larger values mean more stored bytes; no high/medium/low bands are defined. Includes retrieved HTML and any document wrapper, excluding parent submissions, indexes and the rest of EDGAR. It is not firm size, a financial amount or plain-text length.", "public_example": {"value": 125339, "kind": "observed", "note_en": "", "note_zh": ""}, "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "用於儲存與內容完整性檢查，不以檔案大小或雜湊值衡量公司績效或揭露品質。", "dv_reason": "文件清單的識別與描述欄位本身不衡量行銷結果；契約與每股盈餘數值尚未抽取。", "iv_reason": "文件識別與取得資訊本身不代表行銷投入、契約或治理構念。"}}, {"name": "sha256", "type": "text", "definition_en": "(NA)", "definition_verified_zh": "對下載後原始檔案 bytes 計算的 SHA-256，以 64 位十六進位字串保存；用於確認本機內容是否變動，不是 SEC 官方文件 ID，也不能單靠雜湊判斷語意或金融測量相同。", "definition_verified_en": "SHA-256 of the downloaded file bytes, stored as 64 hexadecimal characters. Checks whether saved content changes; it is not an official SEC document ID and does not establish semantic or financial-measure equivalence.", "public_example": {"value": "cb5e43e64246252a6804ed00563936507c2cf7b785b577d64556a4f0a9f73d57", "kind": "observed", "note_en": "", "note_zh": ""}, "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "用於儲存與內容完整性檢查，不以檔案大小或雜湊值衡量公司績效或揭露品質。", "dv_reason": "文件清單的識別與描述欄位本身不衡量行銷結果；契約與每股盈餘數值尚未抽取。", "iv_reason": "文件識別與取得資訊本身不代表行銷投入、契約或治理構念。"}}, {"name": "description", "type": "text", "definition_en": "(NA)", "definition_verified_zh": "母申報 DOCUMENT 區塊 DESCRIPTION 的原文。它是申報附件的簡短標籤，不是完整內文、EPS 數值或已核實的財務變數定義，需連同正式附件類型閱讀。", "definition_verified_en": "Verbatim DESCRIPTION from the parent submission's DOCUMENT block. A short exhibit label rather than full text, an EPS value or a verified definition of a financial variable; read it with the formal exhibit type.", "public_example": {"value": "COMPUTATION OF EARNINGS PER SHARE", "kind": "observed", "note_en": "", "note_zh": ""}, "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "供文件追溯、公司串接與重複檔案檢查；正式分析須另抽取內容、核對單位與期間，並決定有意義的構念。", "dv_reason": "文件清單的識別與描述欄位本身不衡量行銷結果；契約與每股盈餘數值尚未抽取。", "iv_reason": "文件識別與取得資訊本身不代表行銷投入、契約或治理構念。"}}]}], "papers": [], "research_library": {"schema_version": 1, "methods": [{"id": "bag_of_words", "title_en": "Bag-of-words", "title_zh": "詞袋表示（Bag-of-words）", "category_en": "Text representation", "category_zh": "文字表示", "purpose_en": "Convert a large text corpus into count features when word content is more important than word order.", "purpose_zh": "將大量文字轉成計數特徵，適合重視詞彙內容而非語序的任務。", "scenario_en": "To compare wording in positive and negative reviews, first turn each review into word counts.", "scenario_zh": "想比較好評與負評常用哪些詞，可先把評論轉成詞頻。", "definition_en": "Represent document \\(d\\) as \\(\\boldsymbol c_d=(c_{d1},\\ldots,c_{dp})\\in\\mathbb N^p\\), where \\(c_{dj}\\) counts occurrences of term \\(j\\). Word order is discarded; preprocessing defines what counts as the same term.", "definition_zh": "以 \\(\\boldsymbol c_d=(c_{d1},\\ldots,c_{dp})\\in\\mathbb N^p\\) 表示文件 \\(d\\)，\\(c_{dj}\\) 是詞 \\(j\\) 的出現次數。表示法忽略語序；前處理決定哪些字形視為同一個詞。", "inputs_en": "Documents, an observation/document boundary, tokenization rules and a vocabulary.", "inputs_zh": "文字文件、觀察單位與文件邊界、斷詞規則及詞彙表。", "outputs_en": "A sparse document-by-term matrix of nonnegative counts; features can distinguish the same term across predefined groups.", "outputs_zh": "稀疏的文件×詞彙非負計數矩陣；可依預先定義的組別，將同一個詞分成不同特徵。", "assumptions_en": "The chosen vocabulary and document window retain useful content. Ignoring word order can lose negation and context. No-text observations are not automatically equivalent to observations without the target condition.", "assumptions_zh": "所選詞彙與文件窗口須保留有用內容。忽略語序可能失去否定與上下文；沒有文字的觀察值不等於沒有目標狀況。", "diagnostics_en": "Suggested checks: inspect token/stem examples, empty-document rates, vocabulary sparsity, document lengths and the effect of frequency filters.", "diagnostics_zh": "建議檢查：檢視斷詞與詞幹實例、空文件比例、詞彙稀疏度、文件長度，以及頻率篩選的影響。", "variants": [{"id": "fz2026-bag-of-words", "design_id": "fz2026", "title_en": "Pre-inspection reviews split by rating group", "title_zh": "檢查前評論依星等分組", "implementation_en": "The handout pools reviews from approximately 90 days before each initial inspection, removes punctuation and numbers, applies Porter stemming, and splits counts into 1–2, 3 and 4–5 star groups. It reports 12,176 stems and 36,528 term-group features.", "implementation_zh": "講義整理：每次初次檢查合併前約90天評論，移除標點與數字、使用 Porter 詞幹化，再按1–2、3、4–5星分組。講義報告12,176個詞幹、36,528個詞×星等特徵。", "tuning_en": "The handout removes stems appearing in fewer than five reviews or more than 50% of reviews. These are this application's thresholds, not universal defaults.", "tuning_zh": "講義移除出現在少於5篇評論或超過50%評論的詞幹。這是此案例的門檻，不是通用預設值。", "interpretation_en": "A term such as 'clean' in a low-star review is distinct from the same term in a high-star review. The handout reports that about 40% of restaurants had no recent reviews by 2016; this concerns text availability, not hygiene status.", "interpretation_zh": "低星評論中的 clean 與高星評論中的 clean 是不同特徵。講義轉述：至2016年約40%餐廳沒有近期評論；這是文字可得性，不是衛生狀態。", "limitations_en": "The handout does not fully specify treatment of zero-text observations or every preprocessing edge case. The pipeline's 'roach = 1, cold = 1' document is illustrative.", "limitations_zh": "講義未完整交代零文字觀察值與所有前處理邊界情況。管線中的 roach＝1、cold＝1 文件是示意例子。", "source_locator_en": "Authored EN/ZH handouts, §3.1, method (1), and the pipeline; not independently checked against the journal article.", "source_locator_zh": "本站作者撰寫的英／中講義，§3.1 方法(1)與管線圖；尚未獨立核對期刊原文。"}]}, {"id": "mnir_dmr", "title_en": "Multinomial inverse regression and distributed multinomial regression", "title_zh": "多項式逆向迴歸與分散式多項式迴歸（MNIR／DMR）", "category_en": "Supervised text modeling", "category_zh": "監督式文字建模", "purpose_en": "Learn how word use varies with known labels, producing target-specific text weights; use distributed estimation for large vocabularies.", "purpose_zh": "學習已知標籤與用詞變化的關係，取得針對目標的文字權重；詞彙龐大時使用分散式估計。", "scenario_en": "You know which restaurants had roach violations and want to find words associated with those restaurants' reviews.", "scenario_zh": "已知哪些餐廳查出蟑螂，想找出這些餐廳的評論常用哪些詞。", "definition_en": "MNIR models word counts conditional on document length, labels and controls: \\(\\boldsymbol c_i\\mid\\boldsymbol v_i\\sim\\operatorname{MN}(m_i,\\boldsymbol q_i)\\), with word probabilities \\(q_{ij}=\\exp(\\eta_{ij})/\\sum_k\\exp(\\eta_{ik})\\). DMR fits word-specific Poisson models \\(c_{ij}\\sim\\operatorname{Pois}(\\exp(\\mu_i+\\eta_{ij}))\\) with offsets in parallel, approximating joint multinomial estimation.", "definition_zh": "MNIR在文件長度、標籤與控制變數下建模詞數：\\(\\boldsymbol c_i\\mid\\boldsymbol v_i\\sim\\operatorname{MN}(m_i,\\boldsymbol q_i)\\)，詞機率為 \\(q_{ij}=\\exp(\\eta_{ij})/\\sum_k\\exp(\\eta_{ik})\\)。DMR將含offset的逐詞Poisson模型 \\(c_{ij}\\sim\\operatorname{Pois}(\\exp(\\mu_i+\\eta_{ij}))\\) 平行估計，近似聯合多項式估計。", "inputs_en": "Document-term counts, document lengths, observed target labels and controls.", "inputs_zh": "文件詞數、文件長度、已觀察的目標標籤與控制變數。", "outputs_en": "A target-by-term coefficient matrix and other word-model coefficients; these can feed a sufficient-reduction projection.", "outputs_zh": "目標×詞彙係數矩陣及其他文字模型係數，可用於後續充分降維投影。", "assumptions_en": "The inverse word model and offsets must adequately describe conditional word use. Separate Poisson fitting with fixed offsets need not equal the joint MNIR maximum-likelihood solution. Conditional association is not a causal direction.", "assumptions_zh": "逆向文字模型與 offset 須適當描述條件用詞分布。固定 offset 的逐詞 Poisson 估計不一定等於聯合 MNIR 最大概似解；條件關聯不代表因果方向。", "diagnostics_en": "Suggested checks: held-out word-model loss, convergence, extreme or empty counts, offset construction and coefficient stability across training folds.", "diagnostics_zh": "建議檢查：保留樣本的文字模型損失、收斂、極端或空計數、offset 建構，以及不同訓練折的係數穩定度。", "variants": [{"id": "fz2026-mnir-dmr", "design_id": "fz2026", "title_en": "Violation-associated review vocabulary", "title_zh": "與衛生違規相關的評論用詞", "implementation_en": "The handout describes DMR estimation of MNIR with 20 violation indicators, violation-by-rating-group interactions, and year-month, cuisine, ZIP code and chain controls. Its account of Eq. (2) also includes rating-group effects and a word offset \\(\\log\\sum_i c_{ij}\\), alongside the document-length offset in its general explanation.", "implementation_zh": "講義以 DMR 估計 MNIR，納入20項違規指標、違規×星等組別交互作用，以及年月、料理類型、ZIP code、連鎖控制。講義對式(2)的描述另含星等組別效果與詞 offset \\(\\log\\sum_i c_{ij}\\)，一般說明則列出文件長度 offset。", "tuning_en": "Word-specific L1 penalties are selected by grouped cross-validation; see the LASSO variant. The handout does not reproduce a complete estimation implementation.", "tuning_zh": "逐詞 L1 懲罰以分組交叉驗證選擇，見 LASSO 變體。講義未提供完整估計實作。", "interpretation_en": "A positive \\(\\phi_{vj}\\) means term \\(j\\) is more frequent conditional on violation \\(v\\) and the model's controls. It does not establish that the violation caused the wording. The pipeline coefficient \\(\\widehat\\phi_{\\mathrm{04M},\\mathrm{roach}}=1.5\\) is illustrative.", "interpretation_zh": "\\(\\phi_{vj}\\) 為正表示在模型控制條件下，有違規 \\(v\\) 時詞 \\(j\\) 較常出現，不能因此認定違規造成用詞。管線中的 \\(\\widehat\\phi_{\\mathrm{04M},\\mathrm{roach}}=1.5\\) 是示意值。", "limitations_en": "The document and word offsets have different roles. Their exact joint parameterization, normalization and equivalence to the article require checking the original equation or code; the handout alone does not verify them.", "limitations_zh": "文件 offset 與詞 offset 的角色不同。精確聯合參數化、正規化及其與論文是否一致，仍須核對原式或程式，不能僅憑講義認定。", "source_locator_en": "Authored EN/ZH handouts, §3.1, method (2), referring to article Eq. (2); article equation not independently verified.", "source_locator_zh": "本站作者英／中講義，§3.1 方法(2)，指向論文式(2)；尚未獨立核對該原式。"}]}, {"id": "lasso", "title_en": "LASSO regularization", "title_zh": "LASSO 正則化", "category_en": "Regularization and feature selection", "category_zh": "正則化與特徵選擇", "purpose_en": "Control complexity and obtain sparse coefficients when many candidate features may carry little signal.", "purpose_zh": "當大量候選特徵可能只有少數帶有訊號時，控制模型複雜度並取得稀疏係數。", "scenario_en": "Your reviews contain thousands of words, but you want the model to retain only a useful subset.", "scenario_zh": "評論有上萬個詞，但你想讓模型只保留較有用的一小部分。", "definition_en": "Estimate coefficients by minimizing a loss plus an L1 penalty: \\(\\widehat{\\boldsymbol\\beta}=\\arg\\min_{\\boldsymbol\\beta}\\{\\mathcal L(\\boldsymbol\\beta)+\\lambda\\sum_k|\\beta_k|\\}\\). Larger \\(\\lambda\\) increases shrinkage and can set coefficients exactly to zero.", "definition_zh": "最小化損失加L1懲罰：\\(\\widehat{\\boldsymbol\\beta}=\\arg\\min_{\\boldsymbol\\beta}\\{\\mathcal L(\\boldsymbol\\beta)+\\lambda\\sum_k|\\beta_k|\\}\\)。\\(\\lambda\\) 越大縮減越強，部分係數可恰為零。", "inputs_en": "A specified regression loss, outcome, predictors, penalty treatment and candidate penalty strengths.", "inputs_zh": "已指定的迴歸損失、結果、預測變數、各係數懲罰方式與候選懲罰強度。", "outputs_en": "Shrunken coefficient estimates, possibly a sparse feature set, and a selected penalty parameter.", "outputs_zh": "縮減後的係數估計、可能稀疏的特徵集合及選定的懲罰參數。", "assumptions_en": "Sparsity must be useful for the prediction task, and penalty scale and feature construction matter. A selected zero is model-dependent, not evidence of no population effect; selection is not a significance test.", "assumptions_zh": "稀疏化須有助於預測任務，且懲罰尺度與特徵建構會影響結果。選出的零係數依賴模型，不是母體無效果的證據；特徵選擇也不是顯著性檢定。", "diagnostics_en": "Suggested checks: grouped held-out loss across \\(\\lambda\\) values, coefficient paths, number of retained coefficients and selection stability.", "diagnostics_zh": "建議檢查：不同 \\(\\lambda\\) 的分組保留樣本損失、係數路徑、保留係數數量及選擇穩定度。", "variants": [{"id": "fz2026-poisson-lasso", "design_id": "fz2026", "title_en": "Word-specific penalized Poisson estimation", "title_zh": "逐詞的懲罰 Poisson 估計", "implementation_en": "The handout's account of Eq. (3) penalizes each word's rating, control and violation coefficients: \\(\\lambda_j(\\lVert\\alpha_j\\rVert_1+\\lVert\\beta_j\\rVert_1+\\lVert\\phi_j\\rVert_1)\\). It says the intercept receives only a small penalty.", "implementation_zh": "講義對式(3)的整理為逐詞懲罰星等、控制及違規係數：\\(\\lambda_j(\\lVert\\alpha_j\\rVert_1+\\lVert\\beta_j\\rVert_1+\\lVert\\phi_j\\rVert_1)\\)，並指出截距僅受很小懲罰。", "tuning_en": "Each word has its own \\(\\lambda_j\\), selected using restaurant-grouped five-fold cross-validation to minimize held-out Poisson loss. The candidate grid and small intercept penalty are not numerically specified in the handout.", "tuning_zh": "每個詞有自己的 \\(\\lambda_j\\)，以依餐廳分組的5折交叉驗證，選擇保留樣本 Poisson 損失最小者。講義未列候選網格及截距小懲罰的確切數值。", "interpretation_en": "A zero word coefficient means it was not retained under this fitted penalty; a retained coefficient is still shrunk. It is neither a p-value nor a direct hygiene effect.", "interpretation_zh": "詞係數為零，表示在這次估計與懲罰下未被保留；保留的係數仍受縮減。它既不是 p 值，也不是直接衛生效果。", "limitations_en": "The exact penalty configuration is handout-reported, with an endnote-12 reference. Reproducing it requires the original specification and tuning settings.", "limitations_zh": "精確懲罰設定僅由講義轉述並指向尾註12；重現時仍需原始規格及調參設定。", "source_locator_en": "Authored EN/ZH handouts, §3.1, method (3), referring to article Eq. (3) and endnote 12; not independently checked.", "source_locator_zh": "本站作者英／中講義，§3.1 方法(3)，指向論文式(3)與尾註12；尚未獨立核對。"}]}, {"id": "sufficient_reduction", "title_en": "Sufficient-reduction projection", "title_zh": "充分降維投影（SR）", "category_en": "Supervised dimension reduction", "category_zh": "監督式降維", "purpose_en": "Compress high-dimensional text into a small set of target-specific features for subsequent prediction.", "purpose_zh": "將高維文字壓縮成少數針對目標的特徵，供後續預測使用。", "scenario_en": "You want to compress thousands of review terms into a few hygiene scores before predicting inspection results.", "scenario_zh": "想把上萬個評論詞彙壓成幾個衛生分數，再預測檢查結果。", "definition_en": "A sufficient reduction seeks \\(Z\\) retaining the target information in \\(X\\), expressed as \\(Y\\perp X\\mid Z\\). In the specified MNIR model, \\(\\boldsymbol z_i=\\Phi\\boldsymbol c_i\\) provides a reduction conditional on document length and controls; estimated weights yield a model-based approximation.", "definition_zh": "充分降維尋找保留 \\(X\\) 中目標資訊的 \\(Z\\)，可表示為 \\(Y\\perp X\\mid Z\\)。在指定MNIR模型下，\\(\\boldsymbol z_i=\\Phi\\boldsymbol c_i\\) 給出以文件長度與控制變數為條件的降維；估計權重所得是依賴模型的近似。", "inputs_en": "Document-term counts and a coefficient matrix learned from target labels on training data.", "inputs_zh": "文件詞數及使用訓練資料目標標籤學得的係數矩陣。", "outputs_en": "Low-dimensional linear scores, one per modeled target dimension; scores are not inherently bounded probabilities.", "outputs_zh": "低維線性分數，每個建模目標面向對應一個分數；分數本身不是有界機率。", "assumptions_en": "The claimed sufficiency is conditional on the inverse-model specification, document length and controls. Estimated scores may lose target information when that model is misspecified. Supervised weights must not use test labels.", "assumptions_zh": "充分性依賴逆向模型設定、文件長度與控制變數。模型錯置時，估計分數可能失去目標資訊；監督式權重不得使用測試標籤。", "diagnostics_en": "Suggested checks: score distributions and extreme values, sensitivity to document length, training/test separation and added held-out predictive performance.", "diagnostics_zh": "建議檢查：分數分布與極端值、對文件長度的敏感度、訓練／測試隔離，以及保留樣本的增額預測力。", "variants": [{"id": "fz2026-violation-sr", "design_id": "fz2026", "title_en": "Twenty violation-specific review scores", "title_zh": "20個違規面向的評論分數", "implementation_en": "The handout uses a \\(20\\times p\\) estimated weight matrix to project negative reviews from the 90 days preceding an inspection: \\(z_{iv}=\\sum_j\\widehat\\phi_{vj}c_{ij}\\). These 20 scores enter the augmented classifier. Scores also feed the later negative-hygiene-event construction.", "implementation_zh": "講義以\\(20\\times p\\)估計權重矩陣投影檢查前90天負面評論：\\(z_{iv}=\\sum_j\\widehat\\phi_{vj}c_{ij}\\)。20個分數進入加入評論資訊的分類器，也用於後續負面衛生事件建構。", "tuning_en": "There is no separately reported SR tuning grid. Its weights depend on the inverse model and LASSO tuning, and the handout requires re-estimation within training folds.", "tuning_zh": "講義未另外列出 SR 調參網格。權重取決於逆向模型與 LASSO 調參，並須在各訓練折內重估。", "interpretation_en": "A higher score means text resembles reviews associated with that violation under the learned model. Coefficients may be negative. The handout cautions that an 'approximate violation probability' label does not make the score lie in \\([0,1]\\); its 2.5 and 0.9 pipeline scores are illustrative.", "interpretation_zh": "較高分數表示依學得模型，文字較像與該違規相關的評論；係數可為負。講義提醒：稱作『近似違規機率』不保證分數落在\\([0,1]\\)；圖中2.5與0.9均為示意值。", "limitations_en": "The handout does not fully specify aggregation and normalization for every downstream score. Cross-inspection document length and the review-day event aggregation require careful replication.", "limitations_zh": "講義未完整交代所有下游分數的彙整與正規化；跨檢查的文件長度及評論日事件彙整須在重現時核對。", "source_locator_en": "Authored EN/ZH handouts, §3.1, method (4), and the pipeline step linking review scores to negative-hygiene events; not an independent replication.", "source_locator_zh": "本站作者英／中講義，§3.1 方法(4)與把評論分數連到負面衛生事件的流程段落；不是獨立重現結果。"}]}, {"id": "nested_grouped_cv", "title_en": "Nested grouped cross-validation", "title_zh": "巢狀分組交叉驗證", "category_en": "Model tuning and evaluation", "category_zh": "模型調參與評估", "purpose_en": "Separate model selection from out-of-sample evaluation while keeping related observations together.", "purpose_zh": "將模型選擇與樣本外評估分開，並把相關觀察值放在同一組。", "scenario_en": "Each restaurant has repeated inspections; you want to test whether the model predicts well for entirely new restaurants.", "scenario_zh": "同一家店有多次檢查，你想測試模型遇到新餐廳時是否仍準。", "definition_en": "Use \\(K_{\\mathrm{outer}}\\) outer folds to evaluate performance and \\(K_{\\mathrm{inner}}\\) folds within each outer training set to select hyperparameters \\(h\\). Grouped splitting keeps all observations from a group in the same fold, preventing its records from entering both training and test sets.", "definition_zh": "外層 \\(K_{\\mathrm{outer}}\\) 折評估表現；在每個外層訓練集內，再以 \\(K_{\\mathrm{inner}}\\) 折選擇超參數 \\(h\\)。分組切分讓同組觀察值留在同一折，避免同組紀錄同時進入訓練與測試。", "inputs_en": "Observations, outcomes, grouping identifiers, candidate models or hyperparameters, and a prespecified evaluation metric.", "inputs_zh": "觀察值、結果、分組識別碼、候選模型或超參數，以及預先指定的評估指標。", "outputs_en": "Tuned models and outer-fold predictions or performance estimates for previously unseen groups.", "outputs_zh": "調參後的模型，以及對未見過群組的外層預測或表現估計。", "assumptions_en": "The group definition must match the intended generalization target. All label-dependent feature learning must remain inside training folds. Generalizing to unseen groups is distinct from predicting future periods.", "assumptions_zh": "分組定義須符合欲推廣的對象。所有依賴標籤的特徵學習都須留在訓練折內；推廣至未見群組與預測未來時期是不同問題。", "diagnostics_en": "Suggested checks: no overlapping group IDs across folds, both outcome classes where AUC is computed, preprocessing fitted only on training data, and dispersion in outer-fold performance.", "diagnostics_zh": "建議檢查：各折間群組ID不重疊、計算AUC的樣本同時有兩類結果、前處理僅用訓練資料估計，以及外層表現的變動。", "variants": [{"id": "fz2026-restaurant-nested-cv", "design_id": "fz2026", "title_en": "Five-by-five folds grouped by restaurant", "title_zh": "依餐廳分組的外5折／內5折", "implementation_en": "The handout specifies five outer and five inner folds, grouping repeated inspections by restaurant. It states that both the text weight matrix and classifier are re-estimated using training folds only.", "implementation_zh": "講義指定外層5折、內層5折，將同一餐廳的多次檢查分在同組，並要求文字權重矩陣與分類器都只使用訓練折重估。", "tuning_en": "Select classifier settings by mean inner-fold AUC, then evaluate on held-out outer restaurants. The handout notes that Algorithm 1 says 'minimize AUC' and interprets this as a likely 'maximize' error; that correction has not been verified against the original article.", "tuning_zh": "依內層平均AUC選分類器設定，再評估外層保留餐廳。講義指出 Algorithm 1 寫 minimize AUC，並依上下文判斷應為 maximize；此修正尚未核對原論文。", "interpretation_en": "Outer-fold AUC describes prediction for unseen restaurants under this sampling scheme, not a causal effect or automatically a future-period forecast.", "interpretation_zh": "外層AUC描述此切分下對未見餐廳的預測表現，不是因果效果，也不自動代表未來時期預測。", "limitations_en": "The handout does not provide fold assignments, random seeds, the full hyperparameter grid or every preprocessing boundary. It supplies a procedure description rather than a reproducible fitted model.", "limitations_zh": "講義未提供分折清單、隨機種子、完整超參數網格及所有前處理邊界；它提供程序說明，不是可直接重現的已估計模型。", "source_locator_en": "Authored EN/ZH handouts, §3.1, method (5), and the classifier pipeline node; no independent algorithm verification.", "source_locator_zh": "本站作者英／中講義，§3.1 方法(5)與分類器管線節點；尚未獨立核查原演算法。"}]}, {"id": "gradient_boosted_trees", "title_en": "Gradient-boosted decision trees", "title_zh": "梯度提升決策樹（GBDT）", "category_en": "Predictive classification", "category_zh": "預測分類", "purpose_en": "Model nonlinearities and feature interactions in tabular prediction tasks.", "purpose_zh": "在表格資料的預測任務中，建模非線性及特徵交互作用。", "scenario_en": "You suspect that certain words signal risk only in low-star reviews and want a model that captures this combination.", "scenario_zh": "你懷疑低星加上特定用詞才有警訊，想讓模型捕捉這種組合。", "definition_en": "Build an additive score \\(F_M(\\boldsymbol x)=F_0+\\eta\\sum_{m=1}^{M}f_m(\\boldsymbol x)\\), adding trees that improve the current loss. For binary log loss, the negative gradient is \\(y_i-p_i^{(m-1)}\\), and \\(p=1/(1+e^{-F})\\) converts the score into a predicted probability.", "definition_zh": "建立加法分數 \\(F_M(\\boldsymbol x)=F_0+\\eta\\sum_{m=1}^{M}f_m(\\boldsymbol x)\\)，逐棵加入能改善目前損失的樹。二元log loss的負梯度為 \\(y_i-p_i^{(m-1)}\\)，再以 \\(p=1/(1+e^{-F})\\) 將分數轉為預測機率。", "inputs_en": "Tabular predictors, binary labels, a loss function and model-complexity settings.", "inputs_zh": "表格預測變數、二元標籤、損失函數與模型複雜度設定。", "outputs_en": "Fitted tree ensembles and prediction scores or probabilities.", "outputs_zh": "已估計的樹集合及預測分數或機率。", "assumptions_en": "Training examples and evaluation design must support the intended prediction population. High flexibility does not remove the need for regularization or establish causal interpretation.", "assumptions_zh": "訓練資料與評估設計須支持欲預測的母體。高度彈性仍需要正則化，也不會自動帶來因果解釋。", "diagnostics_en": "Suggested checks: nested held-out performance, overfitting across complexity settings, comparison with a simpler model, and probability calibration when probabilities are interpreted literally.", "diagnostics_zh": "建議檢查：巢狀保留樣本表現、不同複雜度的過度配適、與簡單模型的比較，以及將機率作字面解讀時的校準。", "variants": [{"id": "fz2026-lightgbm-violations", "design_id": "fz2026", "title_en": "LightGBM classifiers for individual violations", "title_zh": "各違規面向的LightGBM分類器", "implementation_en": "The handout fits one classifier per violation. The baseline uses the posted hygiene grade; the augmented model adds average stars and 20 SR scores. Its implementation label is LightGBM.", "implementation_zh": "講義針對每項違規估計一個分類器。基準模型使用張貼的衛生等級；擴充模型（在基準模型加上評論資訊）加入平均星等與20個充分降維（SR）分數。講義的實作標示為LightGBM。", "tuning_en": "Hyperparameters are selected by mean AUC inside restaurant-grouped nested cross-validation. The handout does not list the tree count, learning rate, depth or other chosen settings.", "tuning_zh": "在依餐廳分組的巢狀交叉驗證內，以平均AUC選超參數。講義未列出樹數、學習率、深度或其他最終設定。", "interpretation_en": "The output predicts whether an inspection finds a violation. The pipeline probability 0.31, grade A and average stars 3.2 are illustrative inputs/outputs, not estimates verified from the study.", "interpretation_zh": "輸出預測檢查是否查出違規。管線中的機率0.31、等級A與平均星等3.2是示意輸入／輸出，不是已核實的研究估計。", "limitations_en": "A stronger classifier shows predictive information, not the effect of review exposure. The handout reports a penalized-logistic comparator but does not supply its detailed estimates.", "limitations_zh": "分類器表現較佳表示存在預測資訊，不是評論曝光的效果。講義轉述有懲罰logistic替代模型，但未提供其詳細估計。", "source_locator_en": "Authored EN/ZH handouts, §3.1, methods (5), (6) and (6b), and the pipeline.", "source_locator_zh": "本站作者英／中講義，§3.1 方法(5)、(6)、(6b)與管線圖。"}]}, {"id": "penalized_logistic_regression", "title_en": "Penalized logistic regression", "title_zh": "懲罰logistic迴歸", "category_en": "Predictive classification", "category_zh": "預測分類", "purpose_en": "Predict a binary outcome with a regularized linear log-odds model or provide a simpler comparator to nonlinear classifiers.", "purpose_zh": "以正則化的線性log-odds模型預測二元結果，或作為非線性分類器的簡單比較模型。", "scenario_en": "You want a simpler model to predict whether a restaurant's next inspection will find a violation.", "scenario_zh": "想用一個較簡單的模型，預測餐廳下次檢查是否違規。", "definition_en": "Model \\(\\log\\{p_i/(1-p_i)\\}=\\beta_0+\\boldsymbol x_i^\\top\\boldsymbol\\beta\\) and minimize binary negative log-likelihood plus \\(\\lambda P(\\boldsymbol\\beta)\\). Common penalties are L1, \\(P(\\boldsymbol\\beta)=\\sum_k|\\beta_k|\\), and L2, \\(P(\\boldsymbol\\beta)=\\sum_k\\beta_k^2\\).", "definition_zh": "設定 \\(\\log\\{p_i/(1-p_i)\\}=\\beta_0+\\boldsymbol x_i^\\top\\boldsymbol\\beta\\)，最小化二元負對數概似加 \\(\\lambda P(\\boldsymbol\\beta)\\)。常見懲罰為L1的 \\(P(\\boldsymbol\\beta)=\\sum_k|\\beta_k|\\) 或L2的 \\(P(\\boldsymbol\\beta)=\\sum_k\\beta_k^2\\)。", "inputs_en": "Binary labels, explicitly constructed predictors and a specified penalty family and strength.", "inputs_zh": "二元標籤、明確建構的預測變數，以及指定的懲罰類型與強度。", "outputs_en": "Regularized log-odds coefficients and predicted probabilities.", "outputs_zh": "正則化的log-odds係數及預測機率。", "assumptions_en": "Log-odds are linear in the supplied features; nonlinear terms and interactions must be supplied explicitly. Regularization changes coefficient interpretation and does not confer causal identification.", "assumptions_zh": "log-odds 對輸入特徵呈線性；非線性項與交互作用須明確加入。正則化會影響係數解讀，也不提供因果識別。", "diagnostics_en": "Suggested checks: held-out AUC and calibration, sensitivity to penalty family/strength, and fair comparison using the same features and folds.", "diagnostics_zh": "建議檢查：保留樣本AUC與校準、對懲罰類型／強度的敏感度，以及使用相同特徵與分折的公平比較。", "variants": [{"id": "fz2026-logistic-comparator", "design_id": "fz2026", "title_en": "Reported alternative to the GBDT classifier", "title_zh": "講義轉述的GBDT替代分類器", "implementation_en": "Method (6b) says article footnote 16 reports similar results after replacing GBDT with penalized logistic regression. The handout does not identify whether L1, L2 or another exact implementation was used.", "implementation_zh": "方法(6b)轉述論文註16：將GBDT換為懲罰logistic迴歸後結果相近。講義未說明實際使用L1、L2或其他精確實作。", "tuning_en": "Penalty choice, \\(\\lambda\\) grid, selected values and numeric comparator results are unreported in the handout; they must remain unspecified.", "tuning_zh": "講義未報告懲罰選擇、\\(\\lambda\\)網格、選定值及比較模型數字，這些資訊保留為未指定。", "interpretation_en": "The handout interprets the reported similarity as evidence that added review information is not solely an artifact of GBDT flexibility. It does not establish identical performance or provide a quantitative robustness estimate.", "interpretation_zh": "講義將結果相近解讀為評論增額資訊並非僅來自GBDT彈性；這不代表表現完全相同，也沒有可量化的穩健性估計。", "limitations_en": "This is a reported comparator, not a locally implemented or independently verified model. Do not fill missing penalty details from the general definition.", "limitations_zh": "這是講義轉述的比較模型，不是本機已實作或獨立核對的模型；不可用一般定義補成實際採用的懲罰細節。", "source_locator_en": "Authored EN/ZH handouts, §3.1, method (6b), referring to article footnote 16; no original-article verification.", "source_locator_zh": "本站作者英／中講義，§3.1 方法(6b)，指向論文註16；尚未核對原論文。"}]}, {"id": "auc_delta_auc", "title_en": "AUC and incremental AUC", "title_zh": "AUC與增額AUC", "category_en": "Predictive evaluation", "category_zh": "預測評估", "purpose_en": "Compare ranking performance without choosing a single classification threshold, and quantify improvement over a baseline.", "purpose_zh": "不指定單一分類門檻地比較排序能力，並衡量相對基準模型的改善。", "scenario_en": "You have two violation models and want to compare which one ranks higher-risk restaurants ahead of lower-risk ones.", "scenario_zh": "有兩個違規預測模型，你想比較哪個較能把高風險餐廳排前面。", "definition_en": "\\(\\mathrm{AUC}=P(S^+\u003eS^-)+\\tfrac12P(S^+=S^-)\\), ranging from 0 to 1. Incremental AUC is \\(\\Delta\\mathrm{AUC}=\\mathrm{AUC}_1-\\mathrm{AUC}_0\\): augmented minus baseline AUC on a comparable evaluation sample.", "definition_zh": "\\(\\mathrm{AUC}=P(S^+\u003eS^-)+\\tfrac12P(S^+=S^-)\\)，範圍為0至1。增額AUC是可比較評估樣本中的 \\(\\Delta\\mathrm{AUC}=\\mathrm{AUC}_1-\\mathrm{AUC}_0\\)，即擴充模型（在基準模型加上評論資訊）減去基準模型。", "inputs_en": "Held-out scores, observed binary labels and, for incremental AUC, paired baseline/augmented predictions.", "inputs_zh": "保留樣本分數、已觀察二元標籤，以及計算增額AUC時相對應的基準／擴充模型（在基準模型加上評論資訊）預測。", "outputs_en": "A ranking-performance statistic and its change relative to the baseline.", "outputs_zh": "排序表現統計量及相對基準的變化。", "assumptions_en": "Evaluation labels and sampling must represent the intended task. AUC measures ranking rather than accuracy at a chosen threshold, calibration, business value or a causal effect.", "assumptions_zh": "評估標籤與抽樣須對應目標任務。AUC衡量排序，不是指定門檻下的正確率、校準、商業價值或因果效果。", "diagnostics_en": "Suggested checks: class counts, comparable held-out observations, uncertainty accounting for the grouping scheme, ROC curves and whether rankings are useful at operational thresholds.", "diagnostics_zh": "建議檢查：兩類樣本數、可比較的保留樣本、考量分組的不確定性、ROC曲線，以及實務門檻附近的排序用途。", "variants": [{"id": "fz2026-informative-violations", "design_id": "fz2026", "title_en": "Select informative violations using added review information", "title_zh": "以評論增額資訊挑出評論較能預測的違規項目（informative violations）", "implementation_en": "The handout compares grade-only and augmented predictions for each violation. It reports AUCs around 0.51–0.68, almost all baselines below 0.55, and selects the five largest gains: 02B hot-food temperature, 04H contaminated food, 04M live roaches, 04A supervisor certification and 02G cold-food temperature.", "implementation_zh": "講義對每項違規比較僅衛生等級與擴充模型（在基準模型加上評論資訊），轉述AUC約0.51–0.68、基準幾乎皆低於0.55，並挑出增額最大的五項：02B熱食溫度、04H食物污染、04M活蟑螂、04A主管證照、02G冷食溫度。", "tuning_en": "AUC evaluates predictions and guides inner-fold model choice; the handout's five-violation set is an application-specific selection. The diagram's \\(0.66-0.53=0.13\\) example is illustrative, not a reported violation-specific estimate.", "tuning_zh": "AUC用於評估預測及內層模型選擇；五項違規是此案例的選取結果。圖中的\\(0.66-0.53=0.13\\)是示意，不是報告的特定違規估計。", "interpretation_en": "AUC 0.5 is chance ranking; 0.68 is not 68% correct. Delta AUC measures added predictive information. The selected violations define \\(I_v\\) and contribute to the demand-event signal.", "interpretation_zh": "AUC 0.5代表隨機排序，0.68不等於68%正確。增額AUC衡量額外預測資訊；選出的違規用以定義\\(I_v\\)，也構成需求事件訊號。", "limitations_en": "Prediction gains do not identify review effects. The handout notes a tension between describing certification as difficult to predict and including 04A among the top five; the original results and selection uncertainty have not been independently checked.", "limitations_zh": "預測增益不能識別評論效果。講義指出『證照較難預測』與04A仍進前五的張力；原始結果與選取不確定性尚未獨立核對。", "source_locator_en": "Authored EN/ZH handouts, §3.1, method (7), and the step selecting violations that review information predicts better; reported figures are secondary handout accounts.", "source_locator_zh": "本站作者英／中講義，§3.1 方法(7)，以及選取評論較能預測之違規項目的流程段落；數字依講義轉述，未重新核對期刊結果。"}]}, {"id": "event_study", "title_en": "Event study", "title_zh": "事件研究", "category_en": "Longitudinal causal design", "category_zh": "縱貫因果設計", "purpose_en": "Trace outcome differences before and after an event, relative to a specified reference period.", "purpose_zh": "相對指定基準期，描繪事件發生前後的結果差異。", "scenario_en": "A negative review appears; you want to see how restaurant bookings change over the surrounding weeks.", "scenario_zh": "一篇負面評論出現後，想看看餐廳訂位在前後兩週如何變化。", "definition_en": "Regress an outcome on event-time indicators, controls and suitable fixed effects: \\(Y_{it}=\\alpha_i+\\sum_{\\tau\\ne\\tau_0}\\beta_\\tau\\mathbf1\\{t-E_i=\\tau\\}+\\boldsymbol X_{it}^\\top\\boldsymbol\\theta+\\varepsilon_{it}\\), omitting reference time \\(\\tau_0\\). Coefficients describe the event-time path; a causal reading needs additional design assumptions.", "definition_zh": "以事件相對時間指標、控制變數及適當固定效果解釋結果：\\(Y_{it}=\\alpha_i+\\sum_{\\tau\\ne\\tau_0}\\beta_\\tau\\mathbf1\\{t-E_i=\\tau\\}+\\boldsymbol X_{it}^\\top\\boldsymbol\\theta+\\varepsilon_{it}\\)，省略 \\(\\tau_0\\) 作基準。係數描繪事件路徑；因果解讀仍需額外設計假設。", "inputs_en": "Dated events, outcomes before and after the events, observation/event identifiers, a reference period and controls.", "inputs_zh": "具日期的事件、事件前後結果、觀察／事件識別碼、基準期及控制變數。", "outputs_en": "Event-time coefficients and uncertainty; optionally a pooled post-event coefficient.", "outputs_zh": "各事件相對時間的係數與不確定性，也可另估聚合的事後係數。", "assumptions_en": "Without comparison events, a causal interpretation requires event timing to be exogenous conditional on controls and no unaccounted concurrent changes. Pre-event patterns can reveal problems but cannot establish exogeneity.", "assumptions_zh": "沒有對照事件時，因果解讀要求控制條件下事件時點外生，且沒有未處理的同期變動。事件前走勢可揭露問題，但不能證明外生性。", "diagnostics_en": "Suggested checks: pre-event paths, reference-period choice, overlapping/repeated event windows, missing daily outcomes and sensitivity to window length and controls.", "diagnostics_zh": "建議檢查：事件前路徑、基準期選擇、重疊／重複事件窗口、每日結果缺漏，以及對窗口長度與控制變數的敏感度。", "variants": [{"id": "fz2026-demand-event-study", "design_id": "fz2026", "title_en": "Restaurant sell-out probability around negative hygiene reviews", "title_zh": "負面衛生評論前後的餐廳完售機率", "implementation_en": "The handout's Eq. (4) uses restaurant × review-event × relative-day observations. A treated event is a 1–3 star review day whose summed SR signal over the five informative violations lies in the worst 20%. The outcome \\(\\mathit{sold\\_out}=1\\) when no table for two is available from 6:30–7:30 pm. It is an availability measure, not observed revenue.", "implementation_zh": "講義的式(4)使用餐廳×評論事件×相對日觀察。處理事件是1–3星評論日，五項評論較能預測的違規項目（informative violations）的SR加總訊號落在最差20%。\\(\\mathit{sold\\_out}=1\\)指晚間6:30–7:30沒有兩人桌可訂；它是可訂位衡量，不是實際營收。", "tuning_en": "Use a −15 to +15 day window and event day zero as the reference. Include restaurant × event fixed effects, weekday, average stars and posted grade. The pooled After indicator covers \\(t\u003e0\\).", "tuning_zh": "使用−15至＋15天窗口，以事件當天0日為基準；納入餐廳×事件固定效果、星期、平均星等與官方等級。聚合After指標涵蓋\\(t\u003e0\\)。", "interpretation_en": "The handout reports a gradual decline with a low point around one week. Its Table 3 column 1 account gives \\(\\widehat\\beta_{\\mathrm{After}}=-0.005\\) (SE 0.0009; N = 534,459): 0.5 percentage points, about 2.6% relative to a 0.19 baseline. N is the handout's regression observation count, not the number of restaurants.", "interpretation_zh": "講義轉述完售率逐步下降、約一週最低；其Table 3規格1為\\(\\widehat\\beta_{\\mathrm{After}}=-0.005\\)（SE 0.0009；N＝534,459），即0.5個百分點，相對0.19基準約2.6%。N是講義的迴歸觀察數，不是餐廳數。", "limitations_en": "This event-study specification has no control-event group. The handout does not fully resolve the quantile reference population, review-versus-day aggregation, event-overlap rules or inference clustering; these require the original specification or code.", "limitations_zh": "此事件研究規格沒有對照事件組。講義未完全釐清分位數母體、評論與評論日彙整、事件重疊規則或推論群聚層級，須核對原始規格或程式。", "source_locator_en": "Authored EN/ZH handouts, §1 observation-unit table and §3.2 method (8), referring to Eq. (4), Figure 6 and Table 3 column 1; not independently verified.", "source_locator_zh": "本站作者英／中講義，§1觀察單位表與§3.2方法(8)，指向式(4)、Figure 6、Table 3規格1；尚未獨立核對。"}]}, {"id": "difference_in_differences", "title_en": "Difference-in-differences", "title_zh": "差異中的差異（DiD）", "category_en": "Longitudinal causal design", "category_zh": "縱貫因果設計", "purpose_en": "Estimate a treatment-related change relative to the contemporaneous change in a comparison group.", "purpose_zh": "相對對照組同期變化，估計與處理相關的結果改變。", "scenario_en": "You want to compare booking changes after hygiene complaints with changes after other low-star reviews.", "scenario_zh": "想比較衛生負評與其他低星評論出現後，訂位下降是否不同。", "definition_en": "In a two-group before/after comparison, \\(\\delta=(\\bar Y_{T,\\mathrm{post}}-\\bar Y_{T,\\mathrm{pre}})-(\\bar Y_{C,\\mathrm{post}}-\\bar Y_{C,\\mathrm{pre}})\\). A regression expresses this through a treatment-group × post interaction; event-time interactions can show a dynamic comparison.", "definition_zh": "兩組事前／事後比較為 \\(\\delta=(\\bar Y_{T,\\mathrm{post}}-\\bar Y_{T,\\mathrm{pre}})-(\\bar Y_{C,\\mathrm{post}}-\\bar Y_{C,\\mathrm{pre}})\\)。迴歸以處理組×事後交互作用表示，也可用事件時間交互作用呈現動態比較。", "inputs_en": "Treated and comparison observations, a treatment/event definition, comparable pre/post outcomes, group identifiers and controls.", "inputs_zh": "處理與對照觀察、處理／事件定義、可比較的事前事後結果、群組識別碼與控制變數。", "outputs_en": "A relative before/after effect or event-time path, conditional on the design and identifying assumptions.", "outputs_zh": "在設計與識別假設下的相對前後效果，或事件時間路徑。", "assumptions_en": "Without treatment, groups must have comparable outcome trends under the conditioning set. Anticipation, differing concurrent shocks, changing composition or spillovers can undermine this comparison. Similar pre-trends do not prove the counterfactual trend assumption.", "assumptions_zh": "在沒有處理時，兩組須在控制條件下具有可比較的結果趨勢。預期效果、不同的同期衝擊、組成改變或外溢都可能破壞比較；事前走勢相似不能證明反事實平行趨勢。", "diagnostics_en": "Suggested checks: differential pre-event paths, composition and overlap of comparison events, sensitivity to event definitions and windows, and clarity about the estimand's comparison group.", "diagnostics_zh": "建議檢查：事件前差異路徑、對照事件組成與重疊、對事件定義及窗口的敏感度，以及估計量所對應的比較組。", "variants": [{"id": "fz2026-hygiene-content-did", "design_id": "fz2026", "title_en": "Unusually bad hygiene content versus other low-star events", "title_zh": "特別差的衛生內容對照其他低星評論事件", "implementation_en": "The handout's Eq. (5) adds bad-hygiene-event × relative-day interactions to the event-study specification. Treated events are the worst-20% hygiene events; controls are other 1–3 star review events, not restaurants receiving no review.", "implementation_zh": "講義式(5)在事件研究中加入特別差衛生事件×相對日交互作用。處理組為最差20%衛生事件；對照組是其他1–3星評論事件，不是完全沒有評論的餐廳。", "tuning_en": "Retain the ±15-day framework, event-day reference and event-study controls; Table 3 pools post-event days into After. Exact event eligibility and overlap handling are not fully reproduced in the handout.", "tuning_zh": "沿用±15天架構、事件日基準及事件研究控制；Table 3將事後日聚合為After。講義未完整重現事件資格與重疊處理。", "interpretation_en": "The handout reports Table 3 column 2: N = 2,644,039, ordinary low-star \\(\\widehat\\beta_{\\mathrm{After}}=-0.002\\) (SE 0.0005), and bad-hygiene × After coefficient \\(\\widehat\\gamma=-0.003\\) (SE 0.0009). The latter is an additional 0.3 percentage-point decline, not the total effect of a review. It reports the authors' \\(\\frac{0.0032}{0.0055}\\approx58\\%\\) interpretation.", "interpretation_zh": "講義轉述Table 3規格2：N＝2,644,039，一般低星\\(\\widehat\\beta_{\\mathrm{After}}=-0.002\\)（SE 0.0005），特別差衛生×After係數 \\(\\widehat\\gamma=-0.003\\)（SE 0.0009）。後者是額外下降0.3個百分點，不是一篇評論的總效果；講義另轉述作者以\\(\\frac{0.0032}{0.0055}\\approx58\\%\\)解讀。", "limitations_en": "The comparison isolate
