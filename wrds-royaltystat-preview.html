verify effectiveness or amendment relationships.", "analysis_use": {"dv": "not_direct", "iv": "derived", "control": "derived", "note": "先界定構念與編碼規則，核對原始文件、缺失及文字生成方式；分類詞或摘要不等同完整合約或治理品質。", "dv_reason": "原始文字或摘要本身不是已驗證的行銷結果指標。", "iv_reason": "經人工或模型編碼並驗證後，可能衡量交易內容、產品或契約特徵。"}}, {"name": "licensed_territory", "type": "character varying", "definition_en": "Licensed Territory", "definition_verified_zh": "授權地理範圍文字，不是公司所在地。預覽完整標籤為 Worldwide、Cyberspace Worldwide、N/A、Cyberspace Worldwide with Exceptions、Europe United States、Puerto Rico United States；N/A 是來源字串，例外與多區域須讀合約。", "definition_verified_en": "Licensed geographic scope, not company location. The complete observed preview labels are Worldwide, Cyberspace Worldwide, N/A, Cyberspace Worldwide with Exceptions, Europe United States and Puerto Rico United States. N/A is a source string; exceptions and multiple regions require reading the agreement.", "analysis_use": {"dv": "not_direct", "iv": "derived", "control": "derived", "note": "分類可作分組或研究設計中的背景變數；先核對編碼、時間與構念意義，不將類別直接解讀為績效。", "dv_reason": "背景分類本身不直接衡量行銷或 B2B 績效。", "iv_reason": "可編碼為相關背景或異質性，但須說明其與研究機制的連結。"}}, {"name": "duration", "type": "double precision", "definition_en": "Duration [Year]", "definition_verified_zh": "單位為年；預覽完整數值為 -1、1.6、3、7、10、20、99。-1 對應文字未固定期限的紀錄，不能當負一年；99 是否特殊碼尚未核實，不自動當缺值或固定 99 年。", "definition_verified_en": "Measured in years. The complete observed preview values are -1, 1.6, 3, 7, 10, 20 and 99. Records coded -1 have text without a fixed duration; do not interpret this as negative one year. Whether 99 is a special code is unverified; do not automatically treat it as missing or a fixed 99-year term.", "analysis_use": {"dv": "conditional", "iv": "conditional", "control": "conditional", "note": "核對原始合約中的地理、產品及期間適用範圍；缺失或字串描述不能直接當成零，條件本身不代表契約績效。", "dv_reason": "若研究契約設計或談判結果，可衡量期限或排他性等契約條件。", "iv_reason": "期限與排他性可能代表治理安排，但須驗證編碼與理論構念。"}}, {"name": "exclusivity", "type": "double precision", "definition_en": "Exclusivity", "definition_verified_zh": "預覽完整碼值為 -1、0、1。逐列對照 comment，0 對應非專屬、1 對應專屬；-1 列可同時含專屬與非專屬權利，正式 -1 定義仍未提供，不能併入 0 或當強度排序。", "definition_verified_en": "The complete observed preview codes are -1, 0 and 1. Record-level comments associate 0 with nonexclusive and 1 with exclusive terms. Rows coded -1 may contain both exclusive and nonexclusive rights; its official definition is still unspecified, so do not merge it into 0 or treat the codes as an intensity scale.", "analysis_use": {"dv": "conditional", "iv": "conditional", "control": "conditional", "note": "核對原始合約中的地理、產品及期間適用範圍；缺失或字串描述不能直接當成零，條件本身不代表契約績效。", "dv_reason": "若研究契約設計或談判結果，可衡量期限或排他性等契約條件。", "iv_reason": "期限與排他性可能代表治理安排，但須驗證編碼與理論構念。"}}, {"name": "agreement_effective_date", "type": "date", "definition_en": "Agreement Effective Year", "definition_verified_zh": "本機型別是 date，值為完整生效日期，範圍 1997-05-28 至 2016-07-01；原註解卻寫 Agreement Effective Year。保留此差異，不把日期當僅有年份精度。", "definition_verified_en": "The local type is date and values are full effective dates from 1997-05-28 to 2016-07-01, although the original comment says Agreement Effective Year. Preserve this discrepancy rather than reducing date precision to years.", "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "收錄日期、申報日期與合約生效日期不同；原文 agreement_effective_date 標籤寫 Year，但本機預覽值含日期，需保留此差異並核對來源，不直接建立因果識別。", "dv_reason": "日期或期間索引本身不直接衡量行銷結果。", "iv_reason": "時間先後不自動形成處置或外生解釋變數。"}}, {"name": "high_royalty_rate", "type": "double precision", "definition_en": "High Royalty Rate", "definition_verified_zh": "費率以百分比數字儲存，例如 20 表示 20%，不是 0.20；預覽為 0.5–30。結構化 high 不保證涵蓋文字中每個條件費率，需連同 original_base、royalty_rate_details、級距與扣抵閱讀；沒有統一幣別或已實現金額。", "definition_verified_en": "Rates are stored as percentage numbers: 20 means 20%, not 0.20; the preview range is 0.5–30. Structured high does not necessarily capture every conditional rate in the text. Read original_base, royalty_rate_details, tiers and offsets together; this is neither a common currency amount nor a realized payment.", "analysis_use": {"dv": "conditional", "iv": "conditional", "control": "conditional", "note": "核對比例單位、上下限、計價基礎、級距及附帶付款；權利金率不是已實現收入、獲利或授權交易的全部價格。", "dv_reason": "可衡量授權交易的價格條件，具有行銷定價或 B2B 談判結果意義。", "iv_reason": "可代表授權成本或誘因條件；使用前須確認時序、計價基礎及內生性。"}}, {"name": "low_royalty_rate", "type": "double precision", "definition_en": "Low Royalty Rate", "definition_verified_zh": "費率以百分比數字儲存，例如 0.5 表示 0.5%；預覽為 0.5–30。結構化 low 不保證是文字全部產品／情境的最小值，不能與 high 平均後當實際支付率；須核對適用基礎與條件。", "definition_verified_en": "Rates are stored as percentage numbers: 0.5 means 0.5%; the preview range is 0.5–30. Structured low is not guaranteed to be the minimum across all products/scenarios in the text. Averaging low and high does not yield an actual paid rate; verify the base and conditions.", "analysis_use": {"dv": "conditional", "iv": "conditional", "control": "conditional", "note": "核對比例單位、上下限、計價基礎、級距及附帶付款；權利金率不是已實現收入、獲利或授權交易的全部價格。", "dv_reason": "可衡量授權交易的價格條件，具有行銷定價或 B2B 談判結果意義。", "iv_reason": "可代表授權成本或誘因條件；使用前須確認時序、計價基礎及內生性。"}}, {"name": "normal_base", "type": "character varying", "definition_en": "Normalized Base", "definition_verified_zh": "標準化計價基礎標籤；13 列皆為 Net Sales。這不證明原費率已用可核查公式換算成可比淨銷售額費率；預覽同時有零售價、毛銷售額等 original_base，須保留原基礎。", "definition_verified_en": "Normalized-base label; all 13 rows say Net Sales. This does not prove that original rates were quantitatively converted using a verifiable formula into comparable net-sales rates. The preview also has retail-price and gross-sales original bases; preserve those original bases.", "analysis_use": {"dv": "derived", "iv": "derived", "control": "derived", "note": "文本、旗標與計價基礎須分開解析；先核對幣別、期間、比例分母及是否已支付，不能直接把敘述當銷售額。", "dv_reason": "解析金額、計價基礎與級距後，才可能形成可比較的授權價格條件。", "iv_reason": "經驗證的固定付款、里程碑或級距條件可代表支付誘因與交易安排。"}}, {"name": "original_base", "type": "character varying", "definition_en": "Original Base", "definition_verified_zh": "原契約的計價基礎文字。預覽完整標籤為 Net Sales、Net Revenue、Retail Price、Revenue、Net Service Revenues、Gross Sales；各基礎扣除項與涵蓋範圍不同，不是幣別代碼，也不能直接互換。", "definition_verified_en": "Original contractual calculation-base text. The complete observed preview labels are Net Sales, Net Revenue, Retail Price, Revenue, Net Service Revenues and Gross Sales. Their deductions and scope differ; these are not currency codes or interchangeable bases.", "analysis_use": {"dv": "derived", "iv": "derived", "control": "derived", "note": "文本、旗標與計價基礎須分開解析；先核對幣別、期間、比例分母及是否已支付，不能直接把敘述當銷售額。", "dv_reason": "解析金額、計價基礎與級距後，才可能形成可比較的授權價格條件。", "iv_reason": "經驗證的固定付款、里程碑或級距條件可代表支付誘因與交易安排。"}}, {"name": "additional_payments", "type": "double precision", "definition_en": "Additional Payments", "definition_verified_zh": "附加付款指標，預覽碼值為 0、1；不是附加付款金額。官方產品說明將其列為二元特徵，但此 WRDS 版本完整碼表未提供；金額、幣別、里程碑、最低保證與是否可抵權利金須讀文字。", "definition_verified_en": "Additional-payment indicator with observed preview codes 0 and 1, not a payment amount. Vendor material describes a binary characteristic, but the full codebook for this WRDS version is unavailable. Amounts, currencies, milestones, minimum guarantees and creditability require the text.", "analysis_use": {"dv": "derived", "iv": "derived", "control": "derived", "note": "文本、旗標與計價基礎須分開解析；先核對幣別、期間、比例分母及是否已支付，不能直接把敘述當銷售額。", "dv_reason": "解析金額、計價基礎與級距後，才可能形成可比較的授權價格條件。", "iv_reason": "經驗證的固定付款、里程碑或級距條件可代表支付誘因與交易安排。"}}, {"name": "comment", "type": "character varying", "definition_en": "Comments", "definition_verified_zh": "合約條件與附加付款的文字摘要，可補充排他範圍、期限、扣抵與限制。文字可能比結構化碼更細，並非完整契約；若數字含 $，仍需確認契約幣別與適用期間。", "definition_verified_en": "Text summary of contractual conditions and additional payments, including scope of exclusivity, duration, offsets and restrictions. It may be more detailed than structured codes but is not the full agreement. A $ symbol still requires verification of contractual currency and period.", "analysis_use": {"dv": "not_direct", "iv": "derived", "control": "derived", "note": "先界定構念與編碼規則，核對原始文件、缺失及文字生成方式；分類詞或摘要不等同完整合約或治理品質。", "dv_reason": "原始文字或摘要本身不是已驗證的行銷結果指標。", "iv_reason": "經人工或模型編碼並驗證後，可能衡量交易內容、產品或契約特徵。"}}, {"name": "royalty_rate_details", "type": "character varying", "definition_en": "Royalty Rate Details", "definition_verified_zh": "費率規則文字，可同時包含百分比、每單位金額、級距、產品別、年度／累積基礎與扣抵；沒有統一單位或幣別欄。不能抽第一個數字就當全合約費率，也不能假定 high／low 已概括全部條件。", "definition_verified_en": "Rate-rule text may combine percentages, per-unit amounts, tiers, product-specific conditions, annual/cumulative bases and offsets; no single unit or currency field standardizes them. The first number is not the agreement-wide rate, and high/low need not summarize all conditions.", "analysis_use": {"dv": "derived", "iv": "derived", "control": "derived", "note": "文本、旗標與計價基礎須分開解析；先核對幣別、期間、比例分母及是否已支付，不能直接把敘述當銷售額。", "dv_reason": "解析金額、計價基礎與級距後，才可能形成可比較的授權價格條件。", "iv_reason": "經驗證的固定付款、里程碑或級距條件可代表支付誘因與交易安排。"}}, {"name": "tiered_royalty", "type": "double precision", "definition_en": "Tiered Royalty", "definition_verified_zh": "分級權利金指標，預覽完整碼值為 0、1；1 的文字有分級或複合計價。0 的紀錄也可能列多個產品／情境費率，因此 0 不代表只有單一費率；級距門檻與單位須另讀文字。", "definition_verified_en": "Tiered-royalty indicator; the complete observed preview codes are 0 and 1. Text for code 1 contains tiered or composite pricing. Records coded 0 may also list multiple product/scenario rates, so 0 does not imply a single rate. Read thresholds and their units from the text.", "analysis_use": {"dv": "derived", "iv": "derived", "control": "derived", "note": "文本、旗標與計價基礎須分開解析；先核對幣別、期間、比例分母及是否已支付，不能直接把敘述當銷售額。", "dv_reason": "解析金額、計價基礎與級距後，才可能形成可比較的授權價格條件。", "iv_reason": "經驗證的固定付款、里程碑或級距條件可代表支付誘因與交易安排。"}}, {"name": "patent", "type": "double precision", "definition_en": "Patent", "definition_verified_zh": "預覽碼值為 0、1，與 patent_count 是否大於零一致；但 patent=0 的文字仍可含專利授權。因此只能確認本機與已列專利數相連，不可把 0 解讀為契約不涉及專利；正式完整碼表待取得。", "definition_verified_en": "Observed codes are 0 and 1 and coincide with whether patent_count is positive in this preview. However, patent=0 records may still describe patent licensing. This verifies only its local association with listed patent counts, not absence of patented rights; the full official codebook remains unavailable.", "analysis_use": {"dv": "not_direct", "iv": "derived", "control": "derived", "note": "分類可作分組或研究設計中的背景變數；先核對編碼、時間與構念意義，不將類別直接解讀為績效。", "dv_reason": "背景分類本身不直接衡量行銷或 B2B 績效。", "iv_reason": "可編碼為相關背景或異質性，但須說明其與研究機制的連結。"}}, {"name": "patent_count", "type": "double precision", "definition_en": "Patent Count", "definition_verified_zh": "已列專利的計數，單位為件；預覽完整值為 0、1、5。0 不證明契約沒有專利權利，應與 patent_number_list、agreement_type 及文字核對。", "definition_verified_en": "Count of listed patents, measured in patents; the complete observed preview values are 0, 1 and 5. Zero does not prove that the agreement involves no patent rights; check patent_number_list, agreement_type and the text.", "analysis_use": {"dv": "not_direct", "iv": "derived", "control": "derived", "note": "檢查計數範圍、重複專利與缺失；需結合技術內容及時間才能判斷構念效度。", "dv_reason": "專利數不直接衡量此授權的行銷績效或實現收入。", "iv_reason": "可能代表授權組合規模；不等同技術品質或交易專屬性。"}}, {"name": "patent_number_list", "type": "character varying", "definition_en": "Patent Number", "definition_verified_zh": "專利號碼清單文字，號碼是識別碼而非計量值；拆分後須保留國別、字母與前導零，再核對重複及 patent_count，不能當成專利品質。", "definition_verified_en": "Text list of patent numbers, which are identifiers rather than measurements. Preserve jurisdiction, letters and leading zeros when parsing, then check duplicates and patent_count; these are not patent-quality scores.", "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "用於辨識申報公司、授權雙方、專利或原始文件及外部財務串接；核對多個名稱、匹配率、期間與一對多，不把名稱／代碼當成契約測量。", "dv_reason": "識別、名稱或代碼本身不衡量行銷結果。", "iv_reason": "辨識與串接資訊本身不代表契約、治理或其他實質解釋構念。"}}, {"name": "description", "type": "character varying", "definition_en": "Description (Abstract)", "definition_verified_zh": "授權內容的摘要文字，可描述技術、產品或使用範圍；不是完整條款，也沒有固定強度或相似度尺度，量化須另訂編碼規則。", "definition_verified_en": "Abstract text describing licensed technology, products or usage scope. It is not the complete terms and has no fixed intensity or similarity scale; quantification requires explicit coding rules.", "analysis_use": {"dv": "not_direct", "iv": "derived", "control": "derived", "note": "先界定構念與編碼規則，核對原始文件、缺失及文字生成方式；分類詞或摘要不等同完整合約或治理品質。", "dv_reason": "原始文字或摘要本身不是已驗證的行銷結果指標。", "iv_reason": "經人工或模型編碼並驗證後，可能衡量交易內容、產品或契約特徵。"}}, {"name": "doi_number", "type": "character varying", "definition_en": "DOI Number", "definition_verified_zh": "DOI 識別文字，保留完整標點與字串；用於定位對應資源，不是權利金數值，來源未說明可否據此取得完整合約。", "definition_verified_en": "DOI identifier text; retain punctuation and the complete string. It locates a referenced resource rather than measuring royalties. The source does not specify whether it provides access to a full agreement.", "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "用於辨識申報公司、授權雙方、專利或原始文件及外部財務串接；核對多個名稱、匹配率、期間與一對多，不把名稱／代碼當成契約測量。", "dv_reason": "識別、名稱或代碼本身不衡量行銷結果。", "iv_reason": "辨識與串接資訊本身不代表契約、治理或其他實質解釋構念。"}}]}], "papers": [{"id": "jayachandran_etal_2013_brand_licensing", "title": "Brand Licensing: What Drives Royalty Rates?", "authors": ["Jayachandran", "Kaufman", "Kumar", "Hewett"], "year": 2013, "journal": "Journal of Marketing", "doi": "10.1509/jm.11.0145", "status": "既有全文查核紀錄：同資料產品", "relationship": "既有全文查核確認授權合約資料主要來自 RoyaltyStat；文章研究樣本不等於目前本機的 13 筆 WRDS Preview，也未確認使用相同產品版本。", "question": "品牌授權合約的權利金率由哪些品牌、授權方與合約特徵解釋？", "design": "從 RoyaltyStat 取得權利金率、期限、涵蓋國家等授權合約特徵，再另外蒐集品牌聲譽與授權方能力評分。既有查核指出 RoyaltyStat 的合約來自 SEC EDGAR，因此可看出公開合約如何被整理成合約特徵，再連結品牌與公司層級的測量；完整樣本選擇與估計細節仍需精讀原文。", "replication_scope": "Preview 可練習合約欄位、權利金基礎與授權雙方的理解；13 筆預覽不是文章完整研究樣本，品牌聲譽與授權方能力評分也尚未匯入，不能直接重現文章。", "dataset_ids": ["wrds-royaltystat-preview"], "url": "https://doi.org/10.1509/jm.11.0145", "source_url": "https://doi.org/10.1509/jm.11.0145"}], "i18n": {"en": {"strings": {"職涯、人力、職缺與員工評論資料": "Career, workforce, job posting and employee review data", "由 Revelio Labs 整理 LinkedIn 等公開來源的全球職涯、招聘與員工評論資料，並提供 2008-01 至 2026-08 的公司月度人力動態資料。": "Global career, recruitment and employee review data compiled by Revelio Labs from public sources including LinkedIn, with monthly company workforce dynamics data from 2008-01 to 2026-08.", "職涯、人力、招聘廣告與員工評論資料；字典提供各表觀察單位、欄位定義、真實例子與行銷／B2B 的 DV／IV／控制變數適用性。": "Career, workforce, recruitment advertisement and employee review data; the dictionary provides each table's observation unit, field definitions, real examples and DV / IV / control suitability for marketing and B2B research.", "Compustat Segment 客戶—供應商關係與客戶銷售額": "Compustat Segment customer–supplier relationships and sales to customers", "由 WRDS 串接 Compustat Segment 的客戶揭露與公司識別資料，提供 1976-06-30 至 2026-10-19 的供應商—客戶關係與客戶銷售資訊。": "WRDS links Compustat Segment customer disclosures with company identifiers to provide supplier–customer relationships and sales-to-customer information from 1976-06-30 to 2026-10-19.", "以公司識別串接客戶—供應商關係、客戶銷售額及外部財務資料。": "Use company identifiers to link customer–supplier relationships, sales to customers and external financial data.", "WRDS 提供的 FactSet Revere 企業供應、客戶與合作關係預覽；本機資料的關係版本起始日涵蓋 2003-04-03 至 2015-05-11。": "A WRDS preview of FactSet Revere company supplier, customer and partnership relationships; relationship-version start dates in the local data span 2003-04-03 to 2015-05-11.", "WRDS 提供的 InfraClear 基礎建設合約、當事人角色、專案與條款抽取預覽；本機合約簽署日期涵蓋 1965-02-02 至 2025-03-24。": "A WRDS preview of InfraClear infrastructure contracts, party roles, projects and extracted clauses; contract signing dates in the local data span 1965-02-02 to 2025-03-24.", "WRDS 提供的 RoyaltyStat 授權合約、權利金與交易條件預覽；本機合約生效日期涵蓋 1997-05-28 至 2016-07-01。": "A WRDS preview of RoyaltyStat licensing agreements, royalties and transaction terms; agreement effective dates in the local data span 1997-05-28 to 2016-07-01.", "既有全文查核紀錄：同資料產品": "Prior full-text verification record: same data product", "授權合約與權利金預覽": "Licensing agreement and royalty preview", "一筆 RoyaltyStat 授權合約／權利金紀錄；reference 的唯一性依本機版本核查": "One RoyaltyStat licensing agreement / royalty record; verify reference uniqueness in the local version", "授權雙方、申報公司、授權範圍、契約期限、排他性、權利金率、附帶付款及相關專利資訊。": "Licensing parties, filing companies, license scope, contract duration, exclusivity, royalty rates, additional payments and related patent information.", "既有全文查核確認授權合約資料主要來自 RoyaltyStat；文章研究樣本不等於目前本機的 13 筆 WRDS Preview，也未確認使用相同產品版本。": "Prior full-text verification confirmed that licensing-agreement data primarily came from RoyaltyStat. The paper's research sample is not the current local 13-record WRDS Preview, and use of the same product version is unconfirmed.", "品牌授權合約的權利金率由哪些品牌、授權方與合約特徵解釋？": "Which brand, licensor and contract characteristics explain royalty rates in brand licensing agreements?", "從 RoyaltyStat 取得權利金率、期限、涵蓋國家等授權合約特徵，再另外蒐集品牌聲譽與授權方能力評分。既有查核指出 RoyaltyStat 的合約來自 SEC EDGAR，因此可看出公開合約如何被整理成合約特徵，再連結品牌與公司層級的測量；完整樣本選擇與估計細節仍需精讀原文。": "Obtains licensing-agreement characteristics such as royalty rates, duration and covered countries from RoyaltyStat, then separately collects ratings of brand reputation and licensor capabilities. Prior verification indicates that RoyaltyStat contracts come from SEC EDGAR, illustrating how public contracts are organized into contract characteristics and linked to brand- and company-level measures. Full sample-selection and estimation details still require close reading of the original paper.", "Preview 可練習合約欄位、權利金基礎與授權雙方的理解；13 筆預覽不是文章完整研究樣本，品牌聲譽與授權方能力評分也尚未匯入，不能直接重現文章。": "The Preview supports practice interpreting contract fields, royalty bases and licensing parties. Its 13 records are not the paper's full research sample, and brand reputation and licensor capability ratings have not been imported, so it cannot directly replicate the paper.", "日期或期間索引本身不直接衡量行銷結果。": "A date or period index itself does not directly measure marketing outcomes.", "時間先後不自動形成處置或外生解釋變數。": "Temporal ordering does not automatically establish a treatment or an exogenous explanatory variable.", "識別、名稱或代碼本身不衡量行銷結果。": "Identifiers, names or codes themselves do not measure marketing outcomes.", "辨識與串接資訊本身不代表契約、治理或其他實質解釋構念。": "Identification and linkage information itself does not represent contracts, governance or other substantive explanatory constructs.", "原始文字或摘要本身不是已驗證的行銷結果指標。": "Original text or summaries themselves are not validated marketing outcome indicators.", "經人工或模型編碼並驗證後，可能衡量交易內容、產品或契約特徵。": "After manual or model-based coding and validation, may measure transaction content, products or contract characteristics.", "先界定構念與編碼規則，核對原始文件、缺失及文字生成方式；分類詞或摘要不等同完整合約或治理品質。": "First define the construct and coding rules, and check original documents, missingness and how the text was generated; category terms or summaries are not equivalent to complete contracts or governance quality.", "背景分類本身不直接衡量行銷或 B2B 績效。": "Background classifications themselves do not directly measure marketing or B2B performance.", "可編碼為相關背景或異質性，但須說明其與研究機制的連結。": "Can be coded as relevant background or heterogeneity, but their connection to the research mechanism must be explained.", "用於辨識申報公司、授權雙方、專利或原始文件及外部財務串接；核對多個名稱、匹配率、期間與一對多，不把名稱／代碼當成契約測量。": "Used to identify filing companies, licensing parties, patents or original documents and link external financial data; check multiple names, match rates, periods and one-to-many relationships. Do not treat names or codes as contract measures.", "收錄日期、申報日期與合約生效日期不同；原文 agreement_effective_date 標籤寫 Year，但本機預覽值含日期，需保留此差異並核對來源，不直接建立因果識別。": "Collection dates, filing dates and contract effective dates differ; the original agreement_effective_date label says Year, but local preview values contain dates. Preserve this discrepancy and check the source; it does not directly establish causal identification.", "取得文件的來源不是行銷結果。": "The source through which a document was acquired is not a marketing outcome.", "來源旗標本身不測量授權治理。": "The source flag itself does not measure licensing governance.", "可檢查來源與樣本選擇差異；不得將 FOIA 旗標當作契約品質。": "Can be used to examine source and sample-selection differences; do not treat the FOIA flag as contract quality.", "分類可作分組或研究設計中的背景變數；先核對編碼、時間與構念意義，不將類別直接解讀為績效。": "Classifications can define groups or background variables in a research design; first check coding, timing and construct meaning. Do not directly interpret categories as performance.", "若研究契約設計或談判結果，可衡量期限或排他性等契約條件。": "When studying contract design or negotiation outcomes, can measure contractual terms such as duration or exclusivity.", "期限與排他性可能代表治理安排，但須驗證編碼與理論構念。": "Duration and exclusivity may represent governance arrangements, but coding and theoretical constructs require validation.", "核對原始合約中的地理、產品及期間適用範圍；缺失或字串描述不能直接當成零，條件本身不代表契約績效。": "Check the geographic, product and temporal scope of applicability in the original contract; missing values or string descriptions must not be directly treated as zero. Terms themselves do not represent contract performance.", "可衡量授權交易的價格條件，具有行銷定價或 B2B 談判結果意義。": "Can measure the pricing terms of a licensing transaction and has meaning as a marketing pricing or B2B negotiation outcome.", "可代表授權成本或誘因條件；使用前須確認時序、計價基礎及內生性。": "Can represent licensing costs or incentive terms; verify timing, the calculation basis and endogeneity before use.", "核對比例單位、上下限、計價基礎、級距及附帶付款；權利金率不是已實現收入、獲利或授權交易的全部價格。": "Check percentage units, upper and lower bounds, the calculation basis, tiers and supplementary payments; the royalty rate is not realized revenue, profit or the full price of the licensing transaction.", "解析金額、計價基礎與級距後，才可能形成可比較的授權價格條件。": "Comparable licensing price terms may be constructed only after parsing amounts, the calculation basis and tiers.", "經驗證的固定付款、里程碑或級距條件可代表支付誘因與交易安排。": "Validated fixed-payment, milestone or tiered terms can represent payment incentives and transaction arrangements.", "文本、旗標與計價基礎須分開解析；先核對幣別、期間、比例分母及是否已支付，不能直接把敘述當銷售額。": "Parse text, flags and the calculation basis separately; first check currency, periods, ratio denominators and whether payments have been made. Do not directly treat descriptions as sales.", "專利數不直接衡量此授權的行銷績效或實現收入。": "Patent count does not directly measure the marketing performance or realized revenue of this license.", "可能代表授權組合規模；不等同技術品質或交易專屬性。": "May represent the size of the licensed portfolio; not equiva       });
    }
    mountControls();
    needsReconcile = false;
  }
  function isVisible(table) {
    if (!table.isConnected || !table.getClientRects().length || table.closest('[hidden]')) return false;
    for (let parent = table.parentElement; parent; parent = parent.parentElement) {
      if (parent.tagName === 'DETAILS' && !parent.open) return false;
    }
    return getComputedStyle(table).visibility !== 'hidden';
  }
  function update() {
    frame = 0;
    if (destroyed) return;
    if (needsReconcile) reconcile();
    syncControls();
    const viewLeft = viewport?.offsetLeft || 0;
    const viewTop = viewport?.offsetTop || 0;
    const viewRight = Math.min(viewLeft + (viewport?.width || window.innerWidth), document.documentElement.clientWidth);
    let viewBottom = viewTop + (viewport?.height || window.innerHeight);
    const topbar = document.querySelector('.topbar')?.getBoundingClientRect();
    const visibleTop = topbar && topbar.top <= viewTop + 1 && topbar.bottom > viewTop ? topbar.bottom : viewTop;
    const dock = document.querySelector('.table-scroll-dock:not([hidden])');
    if (dock) viewBottom = Math.min(viewBottom, dock.getBoundingClientRect().top);
    records.forEach(record => {
      if (!isVisible(record.table)) {
        if (dragging?.record === record) finishDrag();
        record.handles.forEach(handle => { handle.hidden = true; });
        return;
      }
      const rect = record.table.getBoundingClientRect();
      const wrapRect = record.wrapper.getBoundingClientRect();
      const left = Math.max(viewLeft, wrapRect.left + record.wrapper.clientLeft);
      const right = Math.min(viewRight, wrapRect.left + record.wrapper.clientLeft + record.wrapper.clientWidth);
      const top = Math.max(visibleTop, rect.top, wrapRect.top);
      const bottom = Math.min(viewBottom, rect.bottom, wrapRect.top + record.wrapper.clientHeight);
      record.headers.forEach((header, index) => {
        const handle = record.handles[index];
        const headerRect = header.getBoundingClientRect();
        const active = dragging?.handle === handle;
        const inView = headerRect.right >= left + 4 && headerRect.right <= right + 1;
        handle.hidden = bottom - top < 12 || right - left < 20 || (!inView && !active);
        if (handle.hidden) return;
        const x = active ? Math.max(left + 5, Math.min(right - 5, headerRect.right)) : Math.min(right - 5, headerRect.right);
        writeStyle(handle, 'left', `${x - 5}px`);
        writeStyle(handle, 'top', `${top}px`);
        writeStyle(handle, 'height', `${bottom - top}px`);
        handle.setAttribute('aria-valuenow', String(Math.round(headerRect.width)));
      });
    });
  }
  function schedule() {
    if (!destroyed && !frame) frame = requestAnimationFrame(update);
  }
  const mutationObserver = new MutationObserver(changes => {
    if (changes.some(change => change.type === 'childList')) needsReconcile = true;
    schedule();
  });
  mutationObserver.observe(content, { childList: true, subtree: true, attributes: true, attributeFilter: ['open', 'hidden', 'class', 'style'] });
  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', schedule, { passive: true });
  window.addEventListener('hashchange', schedule);
  window.addEventListener('research-layout-change', schedule);
  window.addEventListener('blur', finishDrag);
  document.addEventListener('toggle', schedule, true);
  viewport?.addEventListener('resize', schedule, { passive: true });
  viewport?.addEventListener('scroll', schedule, { passive: true });

  window.ResearchColumnResize = {
    minWidth: MIN_WIDTH, maxWidth: MAX_WIDTH,
    refresh() { needsReconcile = true; schedule(); },
    setEditing,
    get editing() { return editing; },
    reset,
    destroy() {
      finishDrag();
      destroyed = true;
      if (frame) cancelAnimationFrame(frame);
      mutationObserver.disconnect();
      resizeObserver?.disconnect();
      removeControls();
      records.forEach(record => { removeRecord(record); restoreLayout(record); });
      records.clear(); observed.clear();
      window.removeEventListener('scroll', schedule);
      window.removeEventListener('resize', schedule);
      window.removeEventListener('hashchange', schedule);
      window.removeEventListener('research-layout-change', schedule);
      window.removeEventListener('blur', finishDrag);
      document.removeEventListener('toggle', schedule, true);
      viewport?.removeEventListener('resize', schedule);
      viewport?.removeEventListener('scroll', schedule);
      layer.remove();
      document.body.classList.remove('is-resizing-column');
    }
  };
  schedule();
})();
</script>
</body>
