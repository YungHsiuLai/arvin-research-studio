cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\phi_{vj}\u0026gt;0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 表示違規 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ev\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 發生時詞 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ej\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ej\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 較常出現，這是條件關聯，建模方向（文字 given 違規）不代表因果方向。\u003c/p\u003e\n\u003ch4 id=\"fz2026-zh-lasso\"\u003e(3) LASSO\u003c/h4\u003e\n\u003ch5 id=\"fz2026-zh-def-1\"\u003eDef\u003c/h5\u003e\n\u003cp\u003e在迴歸的損失函數上加上「係數絕對值總和」的懲罰項，避免過度配適，並把不重要的係數壓成剛好 0：\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmover\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜷\u003c/mi\u003e\u003cmo accent=\"true\"\u003ê\u003c/mo\u003e\u003c/mover\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003earg\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003emin\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜷\u003c/mi\u003e\u003c/msub\u003e\u003cmspace width=\"0.222em\"\u003e\u003c/mspace\u003e\u003cmi mathvariant=\"script\"\u003eℒ\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜷\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eλ\u003c/mi\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e|\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e|\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\widehat{\\boldsymbol\\beta}=\\arg\\min_{\\boldsymbol\\beta}\\ \\mathcal L(\\boldsymbol\\beta)+\\lambda\\sum_k\\lvert\\beta_k\\rvert\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eλ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\lambda\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 越大懲罰越重。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-when-to-use-2\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003e係數遠多於有效訊號、需要稀疏與避免過度配適時。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-use-2\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e式（3）在每個詞的 Poisson loss 上加 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eλ\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmo stretchy=\"true\" form=\"prefix\"\u003e‖\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eα\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"true\" form=\"postfix\"\u003e‖\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmo stretchy=\"true\" form=\"prefix\"\u003e‖\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"true\" form=\"postfix\"\u003e‖\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmo stretchy=\"true\" form=\"prefix\"\u003e‖\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eϕ\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"true\" form=\"postfix\"\u003e‖\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\lambda_j(\\lVert\\alpha_j\\rVert_1+\\lVert\\beta_j\\rVert_1+\\lVert\\phi_j\\rVert_1)\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e（截距只加很小的懲罰，見論文尾註 12），每個詞有自己的 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eλ\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\lambda_j\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，用依餐廳分組的 5 折 CV 選 held-out loss（用沒參與估計的那一折資料算出的誤差）最小者。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-read-2\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e係數為 0 只代表「此模型與懲罰下沒被保留」，不是真實效果為 0，也不是 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ep\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 值，非零係數會被縮小。\u003c/p\u003e\n\u003ch4 id=\"fz2026-zh-sr-投影sufficient-reduction\"\u003e(4) SR 投影（sufficient reduction）\u003c/h4\u003e\n\u003ch5 id=\"fz2026-zh-def-2\"\u003eDef\u003c/h5\u003e\n\u003cp\u003e把上萬個詞的次數壓縮成少數幾個分數，同時盡量保留和目標有關的資訊：找低維 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003eZ\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 使 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmo\u003e⟂\u003c/mo\u003e\u003cmi\u003eX\u003c/mi\u003e\u003cmo\u003e∣\u003c/mo\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eY\\perp X\\mid Z\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e。在 MNIR 中 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒛\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003eΦ\u003c/mi\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒄\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\boldsymbol z_i=\\Phi\\boldsymbol c_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 對 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒗\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\boldsymbol v_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 為充分統計量（給定文件長度與控制變數）。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-when-to-use-3\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003e要把高維文字濃縮成少數「針對目標」的分數，再放進預測模型。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-use-3\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmover\u003e\u003cmi mathvariant=\"normal\"\u003eΦ\u003c/mi\u003e\u003cmo accent=\"true\"\u003ê\u003c/mo\u003e\u003c/mover\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\widehat\\Phi\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 為 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e20\u003c/mn\u003e\u003cmo\u003e×\u003c/mo\u003e\u003cmi\u003ep\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e20\\times p\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，把檢查前 90 天的負面評論投影成 20 個分數 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ez\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmover\u003e\u003cmi\u003eϕ\u003c/mi\u003e\u003cmo accent=\"true\"\u003ê\u003c/mo\u003e\u003c/mover\u003e\u003cmrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003ez_{iv}=\\sum_j\\widehat\\phi_{vj}c_{ij}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，作為分類器特徵。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-read-3\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003ez\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003ez_{iv}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 越大，文字越像有違規 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ev\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 的評論，是線性分數，權重可正可負，方向由違規標籤學出（不同於 PCA）。原文說它近似違規機率，但不保證落在 0 到 1 之間。\u003c/p\u003e\n\u003ch4 id=\"fz2026-zh-nested-cross-validation依餐廳分組\"\u003e(5) Nested cross-validation（依餐廳分組）\u003c/h4\u003e\n\u003ch5 id=\"fz2026-zh-def-3\"\u003eDef\u003c/h5\u003e\n\u003cp\u003e用兩層交叉驗證，內層挑模型設定、外層評估表現，避免同一份資料又拿來調參又拿來打分數：外層 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eK\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003eK\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 折估計樣本外表現，在每個外層訓練集內再做內層 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eK\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003eK\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 折，選超參數 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eh\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003eh\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，分組 CV 讓同一群組的觀察值都在同一折。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-when-to-use-4\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003e同時要調參與誠實評估，且資料有群組結構（同一餐廳多次檢查）會造成資訊洩漏時。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-use-4\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e外層 5 折、內層 5 折，以平均 AUC 選 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eh\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003eh\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，每次只用訓練折重估 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmover\u003e\u003cmi mathvariant=\"normal\"\u003eΦ\u003c/mi\u003e\u003cmo accent=\"true\"\u003ê\u003c/mo\u003e\u003c/mover\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\widehat\\Phi\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 與分類器，測試折的違規答案不進入特徵。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-read-4\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e報告的 AUC 是對「沒見過的餐廳」的樣本外表現，原文 Algorithm 1 寫 minimize AUC，依上下文應為 maximize。\u003c/p\u003e\n\u003ch4 id=\"fz2026-zh-梯度提升樹gbdtlightgbm\"\u003e(6) 梯度提升樹（GBDT，LightGBM）\u003c/h4\u003e\n\u003ch5 id=\"fz2026-zh-def-4\"\u003eDef\u003c/h5\u003e\n\u003cp\u003e一棵接一棵地加小決策樹，每棵新樹專門修正前面還預測錯的地方：\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmi\u003eM\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒙\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmsubsup\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cmi\u003eM\u003c/mi\u003e\u003c/msubsup\u003e\u003cmsub\u003e\u003cmi\u003ef\u003c/mi\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒙\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eF_M(\\boldsymbol x)=F_0+\\eta\\sum_{m=1}^{M}f_m(\\boldsymbol x)\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，第 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003em\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003em\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 棵樹擬合 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eF_{m-1}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 處 log loss 的負梯度 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ey\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msubsup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003ey_i-p_i^{(m-1)}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，機率為 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmi\u003e/\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003ee\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmi\u003eF\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003ep=1/(1+e^{-F})\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-when-to-use-5\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003e表格資料、特徵之間有非線性與交互作用、重視預測準確度時。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-use-5\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e每項違規一個分類器，baseline 只放官方等級，augmented 再加平均星等與 20 個 SR。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-read-5\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e輸出是違規機率的預測，不是因果效果，作者說改用 penalized logistic regression 結果類似（見下一項）。\u003c/p\u003e\n\u003ch4 id=\"fz2026-zh-b-penalized-logistic-regressiongbdt-的替代模型\"\u003e(6b) Penalized logistic regression（GBDT 的替代模型）\u003c/h4\u003e\n\u003ch5 id=\"fz2026-zh-def-5\"\u003eDef\u003c/h5\u003e\n\u003cp\u003e用 logistic 迴歸預測二元結果，同時加懲罰項避免過度配適：\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmfrac\u003e\u003cmsub\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/mfrac\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒙\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003e⊤\u003c/mi\u003e\u003c/msubsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜷\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\log\\frac{p_i}{1-p_i}=\\beta_0+\\boldsymbol x_i^{\\top}\\boldsymbol\\beta\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，估計時 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003emin\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜷\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmspace width=\"0.222em\"\u003e\u003c/mspace\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo minsize=\"120%\" maxsize=\"120%\" stretchy=\"true\" form=\"prefix\"\u003e[\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ey\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmsub\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ey\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo minsize=\"120%\" maxsize=\"120%\" stretchy=\"true\" form=\"postfix\"\u003e]\u003c/mo\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eλ\u003c/mi\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜷\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\min_{\\beta_0,\\boldsymbol\\beta}\\ -\\sum_i\\big[y_i\\log p_i+(1-y_i)\\log(1-p_i)\\big]+\\lambda P(\\boldsymbol\\beta)\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e， \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜷\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e|\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e|\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eP(\\boldsymbol\\beta)=\\sum_k\\lvert\\beta_k\\rvert\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e（L1，LASSO）或 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmsubsup\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003ek\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msubsup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\sum_k\\beta_k^2\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e（L2，ridge）。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-when-to-use-6\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003e二元結果、要線性可解釋又不過度配適的模型時，也可檢查非線性模型的結論是否只來自模型選擇。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-use-6\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e原文只在註 16 說換成此模型結果相近，沒寫 L1 或 L2，也沒報告數字。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-read-6\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003elog-odds 對特徵是線性的，不自動抓交互作用。結果和 GBDT 相近，表示 Yelp 的增量資訊不是靠 GBDT 的彈性才出現。\u003c/p\u003e\n\u003ch4 id=\"fz2026-zh-auc-與-deltamathrmauc\"\u003e(7) AUC 與 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eA\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eU\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eC\u003c/mi\u003e\u003c/mrow\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\Delta\\mathrm{AUC}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/h4\u003e\n\u003ch5 id=\"fz2026-zh-def-6\"\u003eDef\u003c/h5\u003e\n\u003cp\u003e衡量模型的「排序」能力：隨機抽一個有違規、一個沒違規的檢查，模型把有違規那個排在前面的機率，\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eA\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eU\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eC\u003c/mi\u003e\u003c/mrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003eS\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003c/msup\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003eS\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003c/msup\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmstyle displaystyle=\"false\"\u003e\u003cmfrac\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/mfrac\u003e\u003c/mstyle\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003eS\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003c/msup\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003eS\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003c/msup\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\mathrm{AUC}=P(S^+\u0026gt;S^-)+\\tfrac12P(S^+=S^-)\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，範圍 0–1。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-when-to-use-7\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003e比較不同模型的排序能力，不想選定單一門檻，或正負類不平衡時。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-use-7\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eA\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eU\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eC\u003c/mi\u003e\u003c/mrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eA\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eU\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eC\u003c/mi\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eA\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eU\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eC\u003c/mi\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmn\u003e0\u003c/mn\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\Delta\\mathrm{AUC}_v=\\mathrm{AUC}_{1,v}-\\mathrm{AUC}_{0,v}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e（augmented 減 baseline）定義 Yelp 對違規 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ev\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 的資訊性。各違規 AUC 約 0.51–0.68，baseline 幾乎都 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e\u0026lt;\u003c/mo\u003e\u003cmn\u003e0.55\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\u0026lt;0.55\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，增量多來自文字。Informative 五項：02B 熱食溫度、04H 食物污染、04M 活蟑螂、04A 主管未持有食品保護證書、02G 冷食溫度。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-read-7\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e0.5 等於亂猜，0.68 不是「68% 正確」，也不是效果大小或因果證據。評論對看得到、吃得出來的面向有資訊，其他面向幾乎沒有。原文把證照類列為較難預測，但 04A 仍進入前五名。\u003c/p\u003e\n\u003ch3 id=\"fz2026-zh-因果部分需求端與供給端\"\u003e3.2 因果部分：需求端與供給端\u003c/h3\u003e\n\u003ch4 id=\"fz2026-zh-event-study\"\u003e(8) Event study\u003c/h4\u003e\n\u003ch5 id=\"fz2026-zh-def-7\"\u003eDef\u003c/h5\u003e\n\u003cp\u003e以事件發生日為基準，逐日比較事件前後結果的變化：\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eα\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmrow\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cmo\u003e≠\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003c/msub\u003e\u003cmn mathvariant=\"bold\"\u003e𝟏\u003c/mn\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e{\u003c/mo\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eE\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e}\u003c/mo\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝑿\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003cmi\u003e⊤\u003c/mi\u003e\u003c/msubsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜽\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eε\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eY_{it}=\\alpha_i+\\sum_{\\tau\\neq\\tau_0}\\beta_\\tau\\mathbf 1\\{t-E_i=\\tau\\}+\\boldsymbol X_{it}^{\\top}\\boldsymbol\\theta+\\varepsilon_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eE\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eE_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 為事件日，\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\beta_\\tau\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 是相對事件時間 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\tau\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 與基準期 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\tau_0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 的差。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-when-to-use-8\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003e想看效果隨事件前後時間的變化，並檢查事件前有沒有異常趨勢。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-use-8\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e式（4）。事件：餐廳當天收到 1–3 星評論，且當天衛生訊號 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eH\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ed\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003er\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cmo\u003e∈\u003c/mo\u003e\u003cmsub\u003e\u003cmi mathvariant=\"script\"\u003e𝒱\u003c/mi\u003e\u003cmn\u003e5\u003c/mn\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003ez\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003er\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eH_{id}=\\sum_r\\sum_{v\\in\\mathcal V_5}z_{rv}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 在所有低星評論中屬最差 20%。窗口 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e15\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-15\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 到 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e+\u003c/mi\u003e\u003cmn\u003e15\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e+15\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 天，基準是事件當天（\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\beta_0=0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e），控制餐廳 × 事件 FE、星期、平均星等、官方等級。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-read-8\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\beta_\\tau\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 是相對日 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\tau\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 與事件當天相比的完售機率差，Figure 6 顯示下降漸進、約一週附近最低。事後聚合成一個 After 時（Table 3 規格 1）為 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e0.005\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.005\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e（SE 0.0009），N = 534,459：完售機率下降 0.5 個百分點，不是 0.5%，以基準完售率 0.19 換算，相對約 2.6%。沒有對照組，識別假設是「控制後負評出現的時點外生」。\u003c/p\u003e\n\u003ch4 id=\"fz2026-zh-difference-in-differencesdid\"\u003e(9) Difference-in-differences（DiD）\u003c/h4\u003e\n\u003ch5 id=\"fz2026-zh-def-8\"\u003eDef\u003c/h5\u003e\n\u003cp\u003e比較處理組和對照組「從事前到事後的變化」差多少，扣掉兩組共同的趨勢：\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003ea\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eb\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eδ\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eε\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eY_{it}=a+bT_i+cP_t+\\delta T_iP_t+\\varepsilon_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eδ\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmover\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmo accent=\"true\"\u003e‾\u003c/mo\u003e\u003c/mover\u003e\u003cmrow\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmtext mathvariant=\"normal\"\u003epost\u003c/mtext\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmover\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmo accent=\"true\"\u003e‾\u003c/mo\u003e\u003c/mover\u003e\u003cmrow\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmtext mathvariant=\"normal\"\u003epre\u003c/mtext\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmover\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmo accent=\"true\"\u003e‾\u003c/mo\u003e\u003c/mover\u003e\u003cmrow\u003e\u003cmi\u003eC\u003c/mi\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmtext mathvariant=\"normal\"\u003epost\u003c/mtext\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmover\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmo accent=\"true\"\u003e‾\u003c/mo\u003e\u003c/mover\u003e\u003cmrow\u003e\u003cmi\u003eC\u003c/mi\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmtext mathvariant=\"normal\"\u003epre\u003c/mtext\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\delta=(\\bar Y_{T,\\text{post}}-\\bar Y_{T,\\text{pre}})-(\\bar Y_{C,\\text{post}}-\\bar Y_{C,\\text{pre}})\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，核心假設是平行趨勢（如果沒有處理，處理組與對照組在事件前後原本就會有相同的變化趨勢）。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-when-to-use-9\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003e有處理組與對照組、處理前後都有觀察，且平行趨勢合理時。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-use-9\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e式（5）在式（4）加入 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmrow\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cmo\u003e≠\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eB\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmn mathvariant=\"bold\"\u003e𝟏\u003c/mn\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e{\u003c/mo\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e}\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\sum_{\\tau\\neq0}\\gamma_\\tau B_{ij}\\mathbf 1\\{t=\\tau\\}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，處理組 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eB\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eB_{ij}=1\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 是最差 20% 衛生事件，\u003cstrong\u003e對照組是其他 1–3 星評論事件\u003c/strong\u003e。Table 3 把事後各日聚合成 After（\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003et\u0026gt;0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e）。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-read-9\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\gamma\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 是「衛生內容特別差」的額外效果，不是一篇負評的總效果。Table 3 規格 2（N = 2,644,039）：After \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e0.002\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=-0.002\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e（0.0005）是一般低星事件的下降，Bad Hygiene × After \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e0.003\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=-0.003\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e（0.0009）是特別差的衛生事件再多降的 0.3 個百分點，作者以 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e0.0032\u003c/mn\u003e\u003cmi\u003e/\u003c/mi\u003e\u003cmn\u003e0.0055\u003c/mn\u003e\u003cmo\u003e≈\u003c/mo\u003e\u003cmn\u003e58\u003c/mn\u003e\u003cmi\u003e%\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e0.0032/0.0055\\approx58\\%\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 解讀為約一半的下降與衛生資訊有關。\u003c/p\u003e\n\u003ch4 id=\"fz2026-zh-交互作用迴歸與高維固定效果供給端式-6\"\u003e(10) 交互作用迴歸與高維固定效果（供給端式 6）\u003c/h4\u003e\n\u003ch5 id=\"fz2026-zh-def-9\"\u003eDef\u003c/h5\u003e\n\u003cp\u003e先用固定效果扣掉不隨某個維度變動的差異，再看處理效果在不同類型之間差多少：\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eV\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eρ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eκ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eε\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eV_{vit}=\\rho_{it}+\\kappa_{iv}+\\gamma R_{it}I_v+\\varepsilon_{vit}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\gamma\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 是兩類之間的效果差。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-when-to-use-10\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003e處理在「餐廳 × 檢查」層級變動、效果只預期出現在某些面向時，在同一次檢查內比較不同面向。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-use-10\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e三組規格：無 FE，檢查 FE＋違規代碼 FE，檢查 FE＋餐廳 × 違規 FE。\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eρ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rho_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 吸收當次檢查的共同因素（努力、檢查員、季節），\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eκ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\kappa_{iv}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 吸收餐廳在該面向的持續差異。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-read-10\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\gamma\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 是差異中的差異：\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e\u0026lt;\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\gamma\u0026lt;0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 表示有近期評論的餐廳，informative 面向\u003cstrong\u003e相對於其他面向\u003c/strong\u003e的違規差距比沒有近期評論的餐廳小，不能推論其他面向沒改善。OLS 為 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmsup\u003e\u003cmn\u003e0.005\u003c/mn\u003e\u003cmrow\u003e\u003cmi\u003e*\u003c/mi\u003e\u003cmo\u003e*\u003c/mo\u003e\u003cmi\u003e*\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.005^{***}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e、\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmsup\u003e\u003cmn\u003e0.005\u003c/mn\u003e\u003cmrow\u003e\u003cmi\u003e*\u003c/mi\u003e\u003cmo\u003e*\u003c/mo\u003e\u003cmi\u003e*\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.005^{***}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e、\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e0.002\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.002\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e（SE 均 0.001），最嚴格規格不顯著。\u003c/p\u003e\n\u003ch4 id=\"fz2026-zh-工具變數iv2sls\"\u003e(11) 工具變數（IV／2SLS）\u003c/h4\u003e\n\u003ch5 id=\"fz2026-zh-def-10\"\u003eDef\u003c/h5\u003e\n\u003cp\u003e找一個只透過內生變數影響結果的外生變數（工具），只用它帶來的變動估計因果效果：第一階段 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eD\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eπ\u003c/mi\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝑾\u003c/mi\u003e\u003cmi\u003e⊤\u003c/mi\u003e\u003c/msup\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝝅\u003c/mi\u003e\u003cmi\u003eW\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eu\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eD=\\pi Z+\\boldsymbol W^{\\top}\\boldsymbol\\pi_W+u\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，第二階段 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmover\u003e\u003cmi\u003eD\u003c/mi\u003e\u003cmo accent=\"true\"\u003ê\u003c/mo\u003e\u003c/mover\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝑾\u003c/mi\u003e\u003cmi\u003e⊤\u003c/mi\u003e\u003c/msup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒅\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eε\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eY=\\theta\\widehat D+\\boldsymbol W^{\\top}\\boldsymbol d+\\varepsilon\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，需要相關性（控制 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝑾\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\boldsymbol W\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 後仍相關）與排除限制 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eCov\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmi\u003eε\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\operatorname{Cov}(Z,\\varepsilon)=0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-when-to-use-11\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003e關鍵自變數內生（反向因果、遺漏變數、測量誤差）時。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-use-11\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eR_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 內生：廣告與整理門面會同時帶來評論與衛生改善，也可能先改善衛生才吸引評論。工具是檢查 90 天前已評論過這家店的「舊評論者」在 Yelp 的平均其他評論數 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eP_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，取 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eZ_{it}=\\log(1+P_{it})\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e（例：A 有 8 篇、B 有 0 篇，\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e4\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eP=4\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e5\u003c/mn\u003e\u003cmo\u003e≈\u003c/mo\u003e\u003cmn\u003e1.609\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eZ=\\log5\\approx1.609\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e）。內生變數為 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eR_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e、\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eR_{it}I_v\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，第一階段見附錄 Table A7，作者以 Kleibergen–Paap F\u003ca href=\"#fz2026-zh-fn2\" class=\"footnote-ref\" id=\"fz2026-zh-fnref2\" role=\"doc-noteref\"\u003e\u003csup\u003e2\u003c/sup\u003e\u003c/a\u003e支持非弱工具\u003ca href=\"#fz2026-zh-fn3\" class=\"footnote-ref\" id=\"fz2026-zh-fnref3\" role=\"doc-noteref\"\u003e\u003csup\u003e3\u003c/sup\u003e\u003c/a\u003e。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-read-11\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003eTable 4 IV 為 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmsup\u003e\u003cmn\u003e0.012\u003c/mn\u003e\u003cmrow\u003e\u003cmi\u003e*\u003c/mi\u003e\u003cmo\u003e*\u003c/mo\u003e\u003cmi\u003e*\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.012^{***}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 到 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmsup\u003e\u003cmn\u003e0.015\u003c/mn\u003e\u003cmrow\u003e\u003cmi\u003e*\u003c/mi\u003e\u003cmo\u003e*\u003c/mo\u003e\u003cmi\u003e*\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.015^{***}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e：有近期評論的餐廳，informative 面向的相對違規差距縮小 1.2 到 1.5 個百分點（約基準 0.176 的 7% 到 8.5%）。最嚴格 OLS 不顯著、IV 才顯著，所以因果結論依賴排除限制。最嚴格規格的第一階段主要靠「No Previous Reviewers」列（\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e0.494\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.494\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e）撐起，\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eZ_{it}I_v\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 本身不顯著（\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e0.002\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.002\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e）。\u003c/p\u003e\n\u003csection id=\"fz2026-zh-footnotes\" class=\"footnotes footnotes-end-of-document\" role=\"doc-endnotes\"\u003e\n\u003chr /\u003e\n\u003col\u003e\n\u003cli id=\"fz2026-zh-fn1\"\u003e\u003cp\u003ePorter stemming（Porter 1980）：以固定的去字尾規則把同一個字的不同字形併成同一個詞幹，例如 cleaned、cleaning \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmo\u003e→\u003c/mo\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\to\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e clean。\u003ca href=\"#fz2026-zh-fnref1\" class=\"footnote-back\" role=\"doc-backlink\"\u003e↩︎\u003c/a\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli id=\"fz2026-zh-fn2\"\u003e\u003cp\u003eKleibergen–Paap rk Wald F：衡量第一階段工具解釋內生變數能力的 F 統計量，允許異質變異、群聚標準誤與多個內生變數，越大越不擔心弱工具，Stock–Yogo 臨界值或 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmn\u003e10\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eF\u0026gt;10\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 在群聚、多內生變數下只是粗略參考。\u003ca href=\"#fz2026-zh-fnref2\" class=\"footnote-back\" role=\"doc-backlink\"\u003e↩︎\u003c/a\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli id=\"fz2026-zh-fn3\"\u003e\u003cp\u003e弱工具：工具和內生變數的相關很弱，2SLS 估計會偏向 OLS，標準誤和檢定也不可靠。\u003ca href=\"#fz2026-zh-fnref3\" class=\"footnote-back\" role=\"doc-backlink\"\u003e↩︎\u003c/a\u003e\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/section\u003e\n", "pipeline": {"note_en": "Arrows preserve the handout's computational dependencies and the two causal branches, not causal arrows between real-world variables. Nested CV governs training/refitting of the text model, SR and classifier, although it is shown at the classifier node; (6b) is an alternative classifier. Prediction and the bridge constructions do not establish identification: demand needs timing and comparison-trend assumptions; supply IV additionally needs relevance and exclusion. The precise quantile reference population, event overlap rules and instrument activity window require the original article/code.", "note_zh": "箭頭保留手稿的運算依賴與兩條因果分析分支，不是現實變數間的因果箭頭。巢狀CV雖標在分類器節點，實際約束文字模型、SR與分類器的訓練重估；(6b)是替代分類器。預測與橋接建構不會建立識別：需求端仍需時點及對照趨勢假設；供給工具變數另需相關性與排除限制。分位數母體、事件重疊規則及工具活動窗口仍待原文／程式核對。", "nodes": [{"id": "bow", "group": "prediction", "title_en": "(1) Bag-of-words", "title_zh": "(1) 詞袋表示", "inputs_en": "Reviews pooled around each inspection and their star groups.", "inputs_zh": "每次檢查對應的評論及星等組別。", "outputs_en": "36,528 term-group count features (handout-reported); \\(\\text{roach}=1,\\ \\text{cold}=1\\) is an illustrative document.", "outputs_zh": "36,528個詞×星等計數特徵（手稿轉述）；\\(\\text{roach}=1,\\ \\text{cold}=1\\)為示意文件。", "method_ids": ["bag_of_words"]}, {"id": "mnir", "group": "prediction", "title_en": "(2) MNIR/DMR + (3) LASSO", "title_zh": "(2) MNIR／DMR＋(3) LASSO", "inputs_en": "Count matrix, 20 violation labels, rating groups and controls.", "inputs_zh": "詞數矩陣、20項違規標籤、星等組別與控制。", "outputs_en": "Estimated target-by-term weight matrix; \\(\\widehat\\phi_{\\mathrm{04M},\\mathrm{roach}}=1.5\\) is illustrative.", "outputs_zh": "估計的目標×詞彙權重矩陣；\\(\\widehat\\phi_{\\mathrm{04M},\\mathrm{roach}}=1.5\\)是示意值。", "method_ids": ["mnir_dmr", "lasso"]}, {"id": "sr", "group": "prediction", "title_en": "(4) SR projection", "title_zh": "(4) SR投影", "inputs_en": "Review counts and the training-fitted weight matrix.", "inputs_zh": "評論詞數與訓練資料估計的權重矩陣。", "outputs_en": "20 violation-specific scores; \\({z}_{\\mathrm{04M}}=2.5,\\ {z}_{\\mathrm{02B}}=0.9\\) are illustrative and are not probabilities.", "outputs_zh": "20個違規面向分數；\\({z}_{\\mathrm{04M}}=2.5,\\ {z}_{\\mathrm{02B}}=0.9\\)是示意值，不是機率。", "method_ids": ["sufficient_reduction"]}, {"id": "classifier", "group": "prediction", "title_en": "(6) GBDT within (5) nested CV; (6b) comparator", "title_zh": "(5) 巢狀CV內的(6) GBDT；(6b)比較模型", "inputs_en": "Baseline: posted grade. Augmented: grade, average stars and 20 SR scores. The text model and classifier are refitted inside training folds.", "inputs_zh": "基準：官方等級；增額：等級、平均星等與20個SR分數。文字模型與分類器皆在訓練折內重估。", "outputs_en": "Held-out violation predictions; \\(\\widehat p_{\\mathrm{04M}}=0.31\\) is illustrative. Penalized logistic regression is a reported alternative, not another sequential transformation.", "outputs_zh": "保留樣本的違規預測；\\(\\widehat p_{\\mathrm{04M}}=0.31\\)為示意。懲罰logistic是手稿轉述的替代模型，不是接續的轉換步驟。", "method_ids": ["nested_grouped_cv", "gradient_boosted_trees", "penalized_logistic_regression"]}, {"id": "auc", "group": "prediction", "title_en": "(7) AUC and added predictive information", "title_zh": "(7) AUC與增額預測資訊", "inputs_en": "Held-out baseline/augmented scores and observed violation labels.", "inputs_zh": "保留樣本的基準／增額分數及已觀察違規標籤。", "outputs_en": "AUC by violation and Delta AUC; \\(0.66-0.53=0.13\\) is illustrative.", "outputs_zh": "各違規AUC與增額AUC；\\(0.66-0.53=0.13\\)為示意。", "method_ids": ["auc_delta_auc"]}, {"id": "informative", "group": "bridge", "title_en": "Select informative violation dimensions", "title_zh": "選取informative違規面向", "inputs_en": "Incremental AUC rankings across the 20 violations.", "inputs_zh": "20項違規的增額AUC排序。", "outputs_en": "\\(I_v=1\\) for 02B, 04H, 04M, 04A and 02G, the top five according to the handout.", "outputs_zh": "依手稿，前五項02B、04H、04M、04A、02G標為\\(I_v=1\\)。", "method_ids": ["auc_delta_auc"]}, {"id": "hygiene_event", "group": "bridge", "title_en": "Construct negative hygiene review events", "title_zh": "建構負面衛生評論事件", "inputs_en": "SR scores on the five informative dimensions, for all 1–3 star reviews a restaurant receives on a day.", "inputs_zh": "餐廳某日所有1–3星評論，在五項informative面向的SR分數。", "outputs_en": "Sum \\(H_{id}=\\sum_r\\sum_{v\\in\\mathcal V_5}z_{rv}\\); \\(B_{ij}=1\\) for worst-20% hygiene events and \\(B_{ij}=0\\) for other low-star events. \\(H=1.1\\) is illustrative.", "outputs_zh": "加總 \\(H_{id}=\\sum_r\\sum_{v\\in\\mathcal V_5}z_{rv}\\)；最差20%衛生事件 \\(B_{ij}=1\\)，其他低星事件 \\(B_{ij}=0\\)。\\(H=1.1\\)為示意值。", "method_ids": ["sufficient_reduction", "auc_delta_auc"]}, {"id": "event_study", "group": "demand", "title_en": "(8) Event study", "title_zh": "(8) 事件研究", "inputs_en": "Daily \\(\\mathit{sold\\_out}\\) in ±15-day windows around \\(B_{ij}=1\\) events, with event-day reference and controls.", "inputs_zh": "\\(B_{ij}=1\\)事件前後±15日的每日\\(\\mathit{sold\\_out}\\)，以事件日為基準並加入控制。", "outputs_en": "Relative-day path; pooled \\(\\widehat\\beta_{\\mathrm{After}}=-0.005\\) in the handout's report, a 0.5 percentage-point change.", "outputs_zh": "相對日路徑；手稿轉述聚合\\(\\widehat\\beta_{\\mathrm{After}}=-0.005\\)，即0.5個百分點的變化。", "method_ids": ["event_study"]}, {"id": "did", "group": "demand", "title_en": "(9) Difference-in-differences", "title_zh": "(9) 差異中的差異", "inputs_en": "Treated-event windows plus comparison windows around other low-star events, \\(B_{ij}=0\\).", "inputs_zh": "處理事件窗口，加上其他低星事件\\(B_{ij}=0\\)的對照窗口。", "outputs_en": "Extra hygiene-content contrast; the handout reports interaction −0.003, an additional 0.3 percentage-point decline.", "outputs_zh": "衛生內容的額外對比；手稿轉述交互係數−0.003，即額外下降0.3個百分點。", "method_ids": ["difference_in_differences"]}, {"id": "fe", "group": "supply", "title_en": "(10) Fixed-effects interaction", "title_zh": "(10) 固定效果交互作用", "inputs_en": "Restaurant-inspection-violation outcomes, recent-review indicator \\(R_{it}\\), informative indicator \\(I_v\\) and fixed effects.", "inputs_zh": "餐廳×檢查×違規結果、近期評論指標\\(R_{it}\\)、informative指標\\(I_v\\)與固定效果。", "outputs_en": "Relative dimension-gap coefficient; the handout reports strict-specification OLS −0.002, statistically insignificant.", "outputs_zh": "相對面向差距係數；手稿轉述最嚴格OLS為−0.002，未達顯著。", "method_ids": ["fixed_effects_interaction"]}, {"id": "iv", "group": "supply", "title_en": "(11) Instrumental variables / 2SLS", "title_zh": "(11) 工具變數／2SLS", "inputs_en": "The supply specification and old-reviewer activity instruments, including interactions and the no-prior-reviewer indicator. \\(\\log(1+4)\\approx1.61\\) is illustrative.", "inputs_zh": "供給規格與舊評論者活動工具，包含交互及無舊評論者指標。\\(\\log(1+4)\\approx1.61\\)為示意。", "outputs_en": "Instrumented relative gap; the handout reports the strict coefficient −0.015, a 1.5 percentage-point relative difference, conditional on identification assumptions.", "outputs_zh": "工具變數估計的相對差距；手稿轉述最嚴格係數−0.015，即1.5個百分點的相對差異，解讀須依識別假設。", "method_ids": ["instrumental_variables_2sls"]}], "edges": [{"from": "bow", "to": "mnir"}, {"from": "mnir", "to": "sr"}, {"from": "sr", "to": "classifier"}, {"from": "classifier", "to": "auc"}, {"from": "auc", "to": "informative"}, {"from": "sr", "to": "hygiene_event"}, {"from": "informative", "to": "hygiene_event"}, {"from": "hygiene_event", "to": "event_study"}, {"from": "event_study", "to": "did"}, {"from": "informative", "to": "fe"}, {"from": "fe", "to": "iv"}]}}], "math_fragments": {"0.66-0.53=0.13": "\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e0.66\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e0.53\u003c/mn\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0.13\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e0.66-0.53=0.13\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e", "20\\times p": "\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e20\u003c/mn\u003e\u003cmo\u003e×\u003c/mo\u003e\u003cmi\u003ep\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e20\\times p\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e", "B_{ij}=0": "\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eB\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eB_{ij}=0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e", "B_{ij}=1": "\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eB\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eB_{ij} i\u003e\u003cannotation encoding=\"application/x-tex\"\u003ev\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e", "y_i-p_i^{(m-1)}": "\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ey\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msubsup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003ey_i-p_i^{(m-1)}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e", "z_{iv}=\\sum_j\\widehat\\phi_{vj}c_{ij}": "\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ez\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmover\u003e\u003cmi\u003eϕ\u003c/mi\u003e\u003cmo accent=\"true\"\u003ê\u003c/mo\u003e\u003c/mover\u003e\u003cmrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003ez_{iv}=\\sum_j\\widehat\\phi_{vj}c_{ij}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e", "{z}_{\\mathrm{04M}}=2.5,\\ {z}_{\\mathrm{02B}}=0.9": "\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ez\u003c/mi\u003e\u003cmrow\u003e\u003cmn mathvariant=\"normal\"\u003e04\u003c/mn\u003e\u003cmi mathvariant=\"normal\"\u003eM\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e2.5\u003c/mn\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmspace width=\"0.222em\"\u003e\u003c/mspace\u003e\u003cmsub\u003e\u003cmi\u003ez\u003c/mi\u003e\u003cmrow\u003e\u003cmn mathvariant=\"normal\"\u003e02\u003c/mn\u003e\u003cmi mathvariant=\"normal\"\u003eB\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0.9\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e{z}_{\\mathrm{04M}}=2.5,\\ {z}_{\\mathrm{02B}}=0.9\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e"}}, "analyses": [], "i18n": {"en": {"strings": {"職涯、人力、職缺與員工評論資料": "Career, workforce, job posting and employee review data", "由 Revelio Labs 整理 LinkedIn 等公開來源的全球職涯、招聘與員工評論資料，並提供 2008-01 至 2026-08 的公司月度人力動態資料。": "Global career, recruitment and employee review data compiled by Revelio Labs from public sources including LinkedIn, with monthly company workforce dynamics data from 2008-01 to 2026-08.", "職涯、人力、招聘廣告與員工評論資料；字典提供各表觀察單位、欄位定義、真實例子與行銷／B2B 的 DV／IV／控制變數適用性。": "Career, workforce, recruitment advertisement and employee review data; the dictionary provides each table's observation unit, field definitions, real examples and DV / IV / control suitability for marketing and B2B research.", "Compustat Segment 客戶—供應商關係與客戶銷售額": "Compustat Segment customer–supplier relationships and sales to customers", "以公司識別串接客戶—供應商關係、客戶銷售額及外部財務資料。": "Use company identifiers to link customer–supplier relationships, sales to customers and external financial data.", "WRDS 提供的 FactSet Revere 企業供應、客戶與合作關係預覽；本機資料的關係版本起始日涵蓋 2003-04-03 至 2015-05-11。": "A WRDS preview of FactSet Revere company supplier, customer and partnership relationships; relationship-version start dates in the local data span 2003-04-03 to 2015-05-11.", "WRDS 提供的 InfraClear 基礎建設合約、當事人角色、專案與條款抽取預覽；本機合約簽署日期涵蓋 1965-02-02 至 2025-03-24。": "A WRDS preview of InfraClear infrastructure contracts, party roles, projects and extracted clauses; contract signing dates in the local data span 1965-02-02 to 2025-03-24.", "WRDS 提供的 RoyaltyStat 授權合約、權利金與交易條件預覽；本機合約生效日期涵蓋 1997-05-28 至 2016-07-01。": "A WRDS preview of RoyaltyStat licensing agreements, royalties and transaction terms; agreement effective dates in the local data span 1997-05-28 to 2016-07-01.", "企業關係版本預覽": "Company relationship version preview", "一筆企業關係的版本紀錄；同一配對可有多種類型及跨期版本": "One version record of a company relationship; a pair may have multiple types and versions over time", "企業關係類型、公司對照、版本日期、關係文字與部分營收占比；不是完整交易或合約清單。": "Company relationship types, company mappings, version dates, relationship text and selected revenue shares; not a complete list of transactions or contracts.", "既有全文查核紀錄：同資料產品": "Prior full-text verification record: same data product", "既有全文查核確認使用 FactSet Revere 建立公司—供應商配對；未確認文章使用 WRDS 免費樣本庫，不能視為使用目前的 Preview 或相同擷取版本。": "Prior full-text verification confirmed the use of FactSet Revere to construct company–supplier pairs. Use of the free WRDS sample database was not confirmed; this cannot be treated as use of the current Preview or the same extract version.", "焦點公司的數位化與其供應商的環境績效有何關係？": "How is a focal firm's digitalization related to its suppliers' environmental performance?", "Revere 提供焦點公司與供應商的配對，讓研究將雙方連結到數位化與環境績效測量。既有查核紀錄未保存外部指標的資料庫名稱、識別碼對應與完整估計設計，這些細節仍需回到原文確認。": "Revere provides focal firm–supplier pairs, allowing the study to link both parties to digitalization and environmental performance measures. The prior verification record did not retain the names of external indicator databases, identifier mappings or the full estimation design; those details still require checking against the original paper.", "Preview 可練習關係方向、公司識別與配對結構；沒有文章的完整 Revere 樣本及外部績效、數位化指標，不能直接重現研究結果。": "The Preview supports practice with relationship direction, company identifiers and pair structures. Without the paper's full Revere sample and external performance and digitalization indicators, it cannot directly replicate the results.", "由 WRDS 串接 Compustat Segment 的客戶揭露與公司識別資料，已核對主表涵蓋 1976-06-30 至 2026-07-31 的供應商—客戶關係與客戶銷售資訊。": "WRDS links Compustat Segment customer disclosures with company identifiers; the verified main table covers supplier-customer relationships and sales-to-customer information from 1976-06-30 to 2026-07-31.", "日期或期間索引本身不直接衡量行銷結果。": "A date or period index itself does not directly measure marketing outcomes.", "時間先後不自動形成處置或外生解釋變數。": "Temporal ordering does not automatically establish a treatment or an exogenous explanatory variable.", "本機 WRDS 預覽未附這兩欄的原文註解；不可直接視為實際合約起訖。end_ 含 4000-01-01，須先釐清特殊值與版本紀錄機制，不能用作正常資料涵蓋終點。": "The local WRDS preview does not include original comments for these two columns; do not directly treat them as actual contract start and end dates. end_ contains 4000-01-01; first clarify special values and the version-recording mechanism. It cannot serve as a normal endpoint of data coverage.", "識別、名稱或代碼本身不衡量行銷結果。": "Identifiers, names or codes themselves do not measure marketing outcomes.", "辨識與串接資訊本身不代表契約、治理或其他實質解釋構念。": "Identification and linkage information itself does not represent contracts, governance or other substantive explanatory constructs.", "用於公司配對、實體辨識或版本核查；子公司與多重代碼欄可能是一對多，不直接代表契約條款。": "Used for company matching, entity identification or version checks; subsidiary and multiple-code fields may be one-to-many and do not directly represent contract terms.", "需先驗證跨期辨識與紀錄機制，才能衍生關係形成或轉換等 B2B 結果。": "Cross-period identification and the recording mechanism must first be validated before deriving B2B outcomes such as relationship formation or transitions.", "可區分供應、客戶、競爭或合作等關係背景；類型不直接測量治理品質。": "Can distinguish supply, customer, competitor or collaboration relationship contexts; the type does not directly measure governance quality.", "不同類型的 source／target 方向需逐一核對；同一配對可有多種關係及版本，不能把每列當一筆交易或獨立合約。": "Verify source/target direction separately for each type; the same pair may have multiple relationships and versions. Do not treat every row as a transaction or an independent contract.", "在釐清方向與分母後，可衡量特定商業關係的營收重要性或依賴結果。": "After clarifying direction and the denominator, can measure the revenue importance of a specific business relationship or dependence outcomes.", "既有營收占比可能代表交易依賴；不是契約條款或治理安排的直接測量。": "An existing revenue share may represent transaction dependence; it does not directly measure contract terms or governance arrangements.", "依 rel_type 與來源文件確認哪一方營收、期間、比例口徑及是否估計；本機研究曾比對個別案例，不能外推每列方向均已驗證。": "Use rel_type and source documents to confirm whose revenue is measured, the period, the ratio convention and whether it is estimated. Local research has compared individual cases; this does not establish that direction has been verified for every row.", "是否估計是測量來源資訊，不是行銷結果。": "Whether a value is estimated is measurement-source information, not a marketing outcome.", "旗標不直接代表商業機制或治理構念。": "The flag does not directly represent a business mechanism or governance construct.", "用於測量品質分層或敏感度分析；核對旗標編碼及估計方法，不把估計值當已揭露實值。": "Used for measurement-quality stratification or sensitivity analysis; check flag coding and the estimation method. Do not treat estimated values as disclosed actual values.", "原始文字或摘要本身不是已驗證的行銷結果指標。": "Original text or summaries themselves are not validated marketing outcome indicators.", "經人工或模型編碼並驗證後，可能衡量交易內容、產品或契約特徵。": "After manual or model-based coding and validation, may measure transaction content, products or contract characteristics.", "先界定構念與編碼規則，核對原始文件、缺失及文字生成方式；分類詞或摘要不等同完整合約或治理品質。": "First define the construct and coding rules, and check original documents, missingness and how the text was generated; category terms or summaries are not equivalent to complete contracts or governance quality.", "從 SEC EDGAR 選取並下載申報於 2001-08-13 至 2018-12-26 的 EX-10 技術授權契約與 EX-11 每股盈餘計算附件。":
