\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmover\u003e\u003cmi\u003eϕ\u003c/mi\u003e\u003cmo accent=\"true\"\u003ê\u003c/mo\u003e\u003c/mover\u003e\u003cmrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003ez_{iv}=\\sum_j\\widehat\\phi_{vj}c_{ij}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, used as classifier features.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read-3\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003eLarger \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003ez\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003ez_{iv}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e: text looks more like reviews of places with violation \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ev\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e. It is a linear score, weights can be negative, and the direction is learned from labels (unlike PCA). The paper calls it an approximate violation probability, though it is not bounded in \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e[\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e]\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e[0,1]\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e.\u003c/p\u003e\n\u003ch4 id=\"fz2026-en-nested-cross-validation-grouped-by-restaurant\"\u003e(5) Nested cross-validation (grouped by restaurant)\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def-3\"\u003eDef\u003c/h5\u003e\n\u003cp\u003eTwo layers of cross-validation, the inner one to pick settings and the outer one to score them, so the same data are not used for both: outer \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eK\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003eK\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e folds estimate out-of-sample performance, inner \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eK\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003eK\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e folds within each outer training set choose hyperparameters \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eh\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003eh\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, and grouped CV keeps a group’s observations in one fold.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use-4\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eTuning plus honest evaluation with grouped data (many inspections per restaurant) that could leak.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use-4\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e5 outer and 5 inner folds, \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eh\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003eh\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e chosen by mean AUC, and \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmover\u003e\u003cmi mathvariant=\"normal\"\u003eΦ\u003c/mi\u003e\u003cmo accent=\"true\"\u003ê\u003c/mo\u003e\u003c/mover\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\widehat\\Phi\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e and the classifier are refit on training folds only, so test labels never enter features.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read-4\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003eAUC is out-of-sample on unseen restaurants. Algorithm 1 says “minimize AUC”, but from context it should be “maximize”.\u003c/p\u003e\n\u003ch4 id=\"fz2026-en-gradient-boosted-decision-trees-gbdt-lightgbm\"\u003e(6) Gradient-boosted decision trees (GBDT, LightGBM)\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def-4\"\u003eDef\u003c/h5\u003e\n\u003cp\u003eAdds small decision trees one at a time, each fixing what the earlier trees still get wrong: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmi\u003eM\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒙\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmsubsup\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cmi\u003eM\u003c/mi\u003e\u003c/msubsup\u003e\u003cmsub\u003e\u003cmi\u003ef\u003c/mi\u003e\u003cmi\u003em\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒙\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eF_M(\\boldsymbol x)=F_0+\\eta\\sum_{m=1}^{M}f_m(\\boldsymbol x)\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, where tree \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003em\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003em\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e fits the negative log-loss gradient at \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eF_{m-1}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ey\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003c/msubsup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003ey_i-p_i^{(m-1)}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, and \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmi\u003e/\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003ee\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmi\u003eF\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003ep=1/(1+e^{-F})\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use-5\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eTabular data with nonlinearities and interactions where accuracy matters.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use-5\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003eOne classifier per violation. The baseline uses the posted grade only, augmented adds average stars and the 20 SR scores.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read-5\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003eOutput is a predicted violation probability, not a causal effect. Results are similar with penalized logistic regression (next item).\u003c/p\u003e\n\u003ch4 id=\"fz2026-en-b-penalized-logistic-regression-alternative-to-gbdt\"\u003e(6b) Penalized logistic regression (alternative to GBDT)\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def-5\"\u003eDef\u003c/h5\u003e\n\u003cp\u003eA logistic regression for a binary outcome with a penalty against overfitting: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmfrac\u003e\u003cmsub\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/mfrac\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒙\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003e⊤\u003c/mi\u003e\u003c/msubsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜷\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\log\\frac{p_i}{1-p_i}=\\beta_0+\\boldsymbol x_i^{\\top}\\boldsymbol\\beta\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, fit by \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003emin\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜷\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo minsize=\"120%\" maxsize=\"120%\" stretchy=\"true\" form=\"prefix\"\u003e[\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ey\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmsub\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ey\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo minsize=\"120%\" maxsize=\"120%\" stretchy=\"true\" form=\"postfix\"\u003e]\u003c/mo\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eλ\u003c/mi\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜷\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\min_{\\beta_0,\\boldsymbol\\beta}-\\sum_i\\big[y_i\\log p_i+(1-y_i)\\log(1-p_i)\\big]+\\lambda P(\\boldsymbol\\beta)\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, with \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e|\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e|\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eP=\\sum_k\\lvert\\beta_k\\rvert\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e (L1, LASSO) or \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmsubsup\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003ek\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msubsup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\sum_k\\beta_k^2\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e (L2, ridge).\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use-6\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eBinary outcomes needing a linear, interpretable, regularized model, or to check that nonlinear results are not an artifact.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use-6\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003eMentioned only in footnote 16 (similar results). L1 vs. L2 and the numbers are not reported.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read-6\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003eLog-odds are linear in the features, with no automatic interactions. Similar results mean Yelp’s added information does not rely on GBDT’s flexibility.\u003c/p\u003e\n\u003ch4 id=\"fz2026-en-auc-and-deltamathrmauc\"\u003e(7) AUC and \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eA\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eU\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eC\u003c/mi\u003e\u003c/mrow\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\Delta\\mathrm{AUC}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def-6\"\u003eDef\u003c/h5\u003e\n\u003cp\u003eMeasures ranking ability: draw one inspection with a violation and one without, and AUC is the chance the model ranks the violating one higher, \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eA\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eU\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eC\u003c/mi\u003e\u003c/mrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003eS\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003c/msup\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003eS\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003c/msup\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmstyle displaystyle=\"false\"\u003e\u003cmfrac\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/mfrac\u003e\u003c/mstyle\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003eS\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003c/msup\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003eS\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003c/msup\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\mathrm{AUC}=P(S^+\u0026gt;S^-)+\\tfrac12P(S^+=S^-)\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, with range 0–1.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use-7\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eComparing ranking ability across models without a threshold, or with imbalanced classes.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use-7\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eΔ\u003c/mi\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eA\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eU\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eC\u003c/mi\u003e\u003c/mrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eA\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eU\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eC\u003c/mi\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eA\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eU\u003c/mi\u003e\u003cmi mathvariant=\"normal\"\u003eC\u003c/mi\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmn\u003e0\u003c/mn\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\Delta\\mathrm{AUC}_v=\\mathrm{AUC}_{1,v}-\\mathrm{AUC}_{0,v}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e (augmented minus baseline) measures Yelp’s informativeness about \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ev\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e. AUCs are about 0.51–0.68, baselines almost all \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e\u0026lt;\u003c/mo\u003e\u003cmn\u003e0.55\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\u0026lt;0.55\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, and most gains come from text. Informative five: 02B hot food temperature, 04H contaminated food, 04M live roaches, 04A supervisor lacks a Food Protection Certificate, 02G cold food temperature.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read-7\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e0.5 is random, and 0.68 is not “68% correct”, nor an effect size or causal evidence. Reviews inform about what customers can see or taste and little else. The paper calls certifications hard to predict, yet 04A makes the top five.\u003c/p\u003e\n\u003ch3 id=\"fz2026-en-causal-inference-demand-side-and-supply-side\"\u003e3.2 Causal inference: demand side and supply side\u003c/h3\u003e\n\u003ch4 id=\"fz2026-en-event-study\"\u003e(8) Event study\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def-7\"\u003eDef\u003c/h5\u003e\n\u003cp\u003eCompares outcomes day by day before and after an event, relative to a reference day: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eα\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmrow\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cmo\u003e≠\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003c/msub\u003e\u003cmn mathvariant=\"bold\"\u003e𝟏\u003c/mn\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e{\u003c/mo\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eE\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e}\u003c/mo\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝑿\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003cmi\u003e⊤\u003c/mi\u003e\u003c/msubsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜽\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eε\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eY_{it}=\\alpha_i+\\sum_{\\tau\\neq\\tau_0}\\beta_\\tau\\mathbf 1\\{t-E_i=\\tau\\}+\\boldsymbol X_{it}^{\\top}\\boldsymbol\\theta+\\varepsilon_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, where \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eE\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eE_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e is the event date and \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\beta_\\tau\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e compares relative time \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\tau\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e with reference \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\tau_0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use-8\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eTo trace an effect before and after an event and check pre-event trends.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use-8\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003eEq. (4). Event: a 1–3 star review day whose hygiene signal \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eH\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ed\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003er\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cmo\u003e∈\u003c/mo\u003e\u003cmsub\u003e\u003cmi mathvariant=\"script\"\u003e𝒱\u003c/mi\u003e\u003cmn\u003e5\u003c/mn\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003ez\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003er\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eH_{id}=\\sum_r\\sum_{v\\in\\mathcal V_5}z_{rv}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e is among the worst 20% of all low-star reviews. Window \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e±\u003c/mi\u003e\u003cmn\u003e15\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\pm15\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e days, event day as reference (\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\beta_0=0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e). Controls: restaurant \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003e×\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\times\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e event FE, day of week, average stars, grade.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read-8\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\beta_\\tau\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e: sell-out probability on day \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\tau\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e vs. the event day. Figure 6 shows a gradual decline, lowest around one week. Pooled After (Table 3, col. 1): \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e0.005\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.005\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e (SE 0.0009), N = 534,459, i.e., 0.5 percentage points, not 0.5%, or about 2.6% of the 0.19 base. With no control group, it assumes review timing is exogenous given controls.\u003c/p\u003e\n\u003ch4 id=\"fz2026-en-difference-in-differences-did\"\u003e(9) Difference-in-differences (DiD)\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def-8\"\u003eDef\u003c/h5\u003e\n\u003cp\u003eCompares how much the treated group changes from before to after with how much the control group changes, removing the shared trend: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003ea\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eb\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eδ\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eε\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eY_{it}=a+bT_i+cP_t+\\delta T_iP_t+\\varepsilon_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eδ\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmover\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmo accent=\"true\"\u003e‾\u003c/mo\u003e\u003c/mover\u003e\u003cmrow\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmtext mathvariant=\"normal\"\u003epost\u003c/mtext\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmover\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmo accent=\"true\"\u003e‾\u003c/mo\u003e\u003c/mover\u003e\u003cmrow\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmtext mathvariant=\"normal\"\u003epre\u003c/mtext\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmover\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmo accent=\"true\"\u003e‾\u003c/mo\u003e\u003c/mover\u003e\u003cmrow\u003e\u003cmi\u003eC\u003c/mi\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmtext mathvariant=\"normal\"\u003epost\u003c/mtext\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmsub\u003e\u003cmover\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmo accent=\"true\"\u003e‾\u003c/mo\u003e\u003c/mover\u003e\u003cmrow\u003e\u003cmi\u003eC\u003c/mi\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmtext mathvariant=\"normal\"\u003epre\u003c/mtext\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\delta=(\\bar Y_{T,\\text{post}}-\\bar Y_{T,\\text{pre}})-(\\bar Y_{C,\\text{post}}-\\bar Y_{C,\\text{pre}})\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e. Key assumption: parallel trends (absent treatment, treated and control groups would share the same trend around the event).\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use-9\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eTreated and control groups observed before and after treatment, with plausible parallel trends.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use-9\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003eEq. (5) adds \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmrow\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cmo\u003e≠\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eB\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmn mathvariant=\"bold\"\u003e𝟏\u003c/mn\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e{\u003c/mo\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eτ\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e}\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\sum_{\\tau\\neq0}\\gamma_\\tau B_{ij}\\mathbf 1\\{t=\\tau\\}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e to Eq. (4). Treated: worst-20% hygiene events (\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eB\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eB_{ij}=1\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e). \u003cstrong\u003eControls: other 1–3 star review events\u003c/strong\u003e. Table 3 pools post days into After (\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003et\u0026gt;0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e).\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read-9\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\gamma\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e is the extra effect of unusually bad hygiene content, not a review’s total effect. Table 3, col. 2 (N = 2,644,039): After \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e0.002\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=-0.002\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e (0.0005) for ordinary low-star events, and Bad Hygiene \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003e×\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\times\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e After \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e0.003\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=-0.003\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e (0.0009), an extra 0.3 percentage points drop. The authors read \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e0.0032\u003c/mn\u003e\u003cmi\u003e/\u003c/mi\u003e\u003cmn\u003e0.0055\u003c/mn\u003e\u003cmo\u003e≈\u003c/mo\u003e\u003cmn\u003e58\u003c/mn\u003e\u003cmi\u003e%\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e0.0032/0.0055\\approx58\\%\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e as about half the decline being due to hygiene information.\u003c/p\u003e\n\u003ch4 id=\"fz2026-en-interaction-regression-with-high-dimensional-fixed-effects-supply-side-eq.-6\"\u003e(10) Interaction regression with high-dimensional fixed effects (supply side, Eq. 6)\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def-9\"\u003eDef\u003c/h5\u003e\n\u003cp\u003eFirst removes differences that do not vary along a dimension with fixed effects, then asks how the treatment effect differs between two types: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eV\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eρ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eκ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eε\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eV_{vit}=\\rho_{it}+\\kappa_{iv}+\\gamma R_{it}I_v+\\varepsilon_{vit}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, where \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\gamma\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e is the difference between the types.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use-10\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eTreatment varies at the restaurant \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003e×\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\times\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e inspection level but should matter only for some dimensions, so dimensions are compared within an inspection.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use-10\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003eThree specifications: no FE, inspection + violation-code FE, and inspection + restaurant \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003e×\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\times\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e violation FE. \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eρ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rho_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e absorbs inspection-wide factors (effort, inspector, season), and \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eκ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\kappa_{iv}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e absorbs persistent restaurant-dimension differences.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read-10\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\gamma\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e is a difference-in-differences: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cmo\u003e\u0026lt;\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\gamma\u0026lt;0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e means that, recently reviewed restaurants, versus others, have a smaller violation gap in informative dimensions \u003cstrong\u003erelative to other dimensions\u003c/strong\u003e, not proof that others did not improve. OLS: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmsup\u003e\u003cmn\u003e0.005\u003c/mn\u003e\u003cmrow\u003e\u003cmi\u003e*\u003c/mi\u003e\u003cmo\u003e*\u003c/mo\u003e\u003cmi\u003e*\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.005^{***}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmsup\u003e\u003cmn\u003e0.005\u003c/mn\u003e\u003cmrow\u003e\u003cmi\u003e*\u003c/mi\u003e\u003cmo\u003e*\u003c/mo\u003e\u003cmi\u003e*\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.005^{***}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e0.002\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.002\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e (SE 0.001 each), insignificant in the strictest specification.\u003c/p\u003e\n\u003ch4 id=\"fz2026-en-instrumental-variables-iv2sls\"\u003e(11) Instrumental variables (IV/2SLS)\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def-10\"\u003eDef\u003c/h5\u003e\n\u003cp\u003eUses an outside variable (the instrument) that affects the outcome only through the endogenous variable, and estimates the causal effect from the variation it creates: first stage \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eD\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eπ\u003c/mi\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝑾\u003c/mi\u003e\u003cmi\u003e⊤\u003c/mi\u003e\u003c/msup\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝝅\u003c/mi\u003e\u003cmi\u003eW\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eu\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eD=\\pi Z+\\boldsymbol W^{\\top}\\boldsymbol\\pi_W+u\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, second stage \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi\u003eθ\u003c/mi\u003e\u003cmover\u003e\u003cmi\u003eD\u003c/mi\u003e\u003cmo accent=\"true\"\u003ê\u003c/mo\u003e\u003c/mover\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝑾\u003c/mi\u003e\u003cmi\u003e⊤\u003c/mi\u003e\u003c/msup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒅\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eε\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eY=\\theta\\widehat D+\\boldsymbol W^{\\top}\\boldsymbol d+\\varepsilon\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e. It needs relevance (correlation with \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eD\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003eD\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e after controlling for \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝑾\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\boldsymbol W\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e) and exclusion \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eCov\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmi\u003eε\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\operatorname{Cov}(Z,\\varepsilon)=0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use-11\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eA key regressor is endogenous (reverse causality, omitted variables, measurement error).\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use-11\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eR_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e is endogenous: advertising and a tidy storefront bring both reviews and better hygiene, and hygiene may attract reviews. Instrument: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eP_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, the mean number of other Yelp reviews by “old reviewers” who reviewed the restaurant over 90 days before the inspection, as \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eZ_{it}=\\log(1+P_{it})\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e (e.g., A wrote 8, B wrote 0: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eP\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e4\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eP=4\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e5\u003c/mn\u003e\u003cmo\u003e≈\u003c/mo\u003e\u003cmn\u003e1.609\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eZ=\\log5\\approx1.609\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e). Endogenous: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eR_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e and \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eR_{it}I_v\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e. The first stage is in appendix Table A7, and the Kleibergen–Paap F\u003ca href=\"#fz2026-en-fn2\" class=\"footnote-ref\" id=\"fz2026-en-fnref2\" role=\"doc-noteref\"\u003e\u003csup\u003e2\u003c/sup\u003e\u003c/a\u003e indicates the instruments are not weak\u003ca href=\"#fz2026-en-fn3\" class=\"footnote-ref\" id=\"fz2026-en-fnref3\" role=\"doc-noteref\"\u003e\u003csup\u003e3\u003c/sup\u003e\u003c/a\u003e.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read-11\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003eTable 4 IV: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmsup\u003e\u003cmn\u003e0.012\u003c/mn\u003e\u003cmrow\u003e\u003cmi\u003e*\u003c/mi\u003e\u003cmo\u003e*\u003c/mo\u003e\u003cmi\u003e*\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.012^{***}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e to \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmsup\u003e\u003cmn\u003e0.015\u003c/mn\u003e\u003cmrow\u003e\u003cmi\u003e*\u003c/mi\u003e\u003cmo\u003e*\u003c/mo\u003e\u003cmi\u003e*\u003c/mi\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.015^{***}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e. Recently reviewed restaurants have a 1.2 to 1.5 percentage points smaller relative violation gap in informative dimensions (about 7% to 8.5% of the 0.176 base). The strictest OLS is insignificant but the IV is significant, so the causal claim rests on the exclusion restriction. In the strictest first stage, the “No Previous Reviewers” row (\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e0.494\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.494\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e) carries the instrument, while \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eZ_{it}I_v\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e itself is insignificant (\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e0.002\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e-0.002\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e).\u003c/p\u003e\n\u003csection id=\"fz2026-en-footnotes\" class=\"footnotes footnotes-end-of-document\" role=\"doc-endnotes\"\u003e\n\u003chr /\u003e\n\u003col\u003e\n\u003cli id=\"fz2026-en-fn1\"\u003e\u003cp\u003ePorter stemming (Porter 1980): fixed suffix-stripping rules that map forms of a word to one stem, e.g., cleaned, cleaning \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmo\u003e→\u003c/mo\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\to\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e clean.\u003ca href=\"#fz2026-en-fnref1\" class=\"footnote-back\" role=\"doc-backlink\"\u003e↩︎\u003c/a\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli id=\"fz2026-en-fn2\"\u003e\u003cp\u003eKleibergen–Paap rk Wald F: first-stage F statistic for how well the instruments explain the endogenous variables, robust to heteroskedasticity and clustering and valid with several endogenous variables. Larger values mean less weak-instrument concern, and Stock–Yogo values or \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eF\u003c/mi\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmn\u003e10\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eF\u0026gt;10\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e are only rough references here.\u003ca href=\"#fz2026-en-fnref2\" class=\"footnote-back\" role=\"doc-backlink\"\u003e↩︎\u003c/a\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli id=\"fz2026-en-fn3\"\u003e\u003cp\u003eWeak instruments: weakly correlated with the endogenous variable, biasing 2SLS toward OLS and making standard errors and tests unreliable.\u003ca href=\"#fz2026-en-fnref3\" class=\"footnote-back\" role=\"doc-backlink\"\u003e↩︎\u003c/a\u003e\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/section\u003e\n", "handout_zh": "\u003cp\u003e\u003cspan\u003e\u003cstrong\u003eFarronato \u0026amp; Zervas (2026) 方法論重點摘要\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch2 id=\"fz2026-zh-研究問題與架構\"\u003e1. 研究問題與架構\u003c/h2\u003e\n\u003cp\u003e紐約市餐廳已受衛生局（DoH）檢查並張貼 A／B／C 等級，Yelp 評論還能多提供衛生資訊嗎？全文分成性質不同的兩部分：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003e第一部分是預測（prediction）\u003c/strong\u003e：問「評論文字能不能預測某項違規」。目標是樣本外預測力（AUC），不涉及因果，結果用來找出評論有資訊的五項違規（informative violations），並建構負面衛生事件。\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003e第二部分是因果推論（causal inference）\u003c/strong\u003e：問「評論資訊是否造成需求下降」（需求端）以及「被評論監督是否促使餐廳改善衛生」（供給端）。需求端靠事件時點與對照事件識別，供給端靠固定效果與工具變數識別。\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cdiv class=\"handout-table-scroll\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth style=\"text-align: left;\"\u003e分析\u003c/th\u003e\n\u003cth style=\"text-align: left;\"\u003e性質\u003c/th\u003e\n\u003cth style=\"text-align: left;\"\u003e觀察單位\u003c/th\u003e\n\u003cth style=\"text-align: left;\"\u003eIV（自變數）\u003c/th\u003e\n\u003cth style=\"text-align: left;\"\u003eDV（依變數）\u003c/th\u003e\n\u003cth style=\"text-align: left;\"\u003e工具變數\u003c/th\u003e\n\u003cth style=\"text-align: left;\"\u003e估計方法\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003e文字模型\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e預測的前一步\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e初次檢查＋前 90 天評論文件\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e(1) 20 個違規指標 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒗\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\boldsymbol v_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003cbr /\u003e\n(2) 違規 × 星等組別\u003cbr /\u003e\n(3) 控制：年月、料理、zipcode、連鎖\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cstrong\u003e計數\u003c/strong\u003e（非負整數）：詞 × 星等組別的次數 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003ec_{ij}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，例：roach 出現 2 次\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e無\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eMNIR／DMR＋LASSO\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003e違規預測（Sec. 4）\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e預測\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e檢查 × 欲預測的違規 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ev\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e(1) 官方等級（baseline）\u003cbr /\u003e\n(2) 平均星等\u003cbr /\u003e\n(3) 20 個 SR，(2)(3) 為 augmented\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cstrong\u003e二元\u003c/strong\u003e（是／否）：\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003ey\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003ey_{iv}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，例：查出 04M \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=1\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e、沒有 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e無\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eGBDT＋nested CV，AUC\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003e需求（Sec. 5.1，式 4–5）\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e因果\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e餐廳 × 評論事件 × 相對日 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmo\u003e∈\u003c/mo\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e[\u003c/mo\u003e\u003cmi\u003e−\u003c/mi\u003e\u003cmn\u003e15\u003c/mn\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmn\u003e15\u003c/mn\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e]\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003et\\in[-15,15]\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e(1) 相對日 dummies\u003cbr /\u003e\n(2) DiD：\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eB\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eB_{ij}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e × 相對日\u003cbr /\u003e\n(3) 控制：星期、平均星等、等級\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cstrong\u003e二元\u003c/strong\u003e（是／否）：\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi mathvariant=\"italic\"\u003e𝑠\u003c/mi\u003e\u003cmi mathvariant=\"italic\"\u003e𝑜\u003c/mi\u003e\u003cmi mathvariant=\"italic\"\u003e𝑙\u003c/mi\u003e\u003cmi mathvariant=\"italic\"\u003e𝑑\u003c/mi\u003e\u003cmi mathvariant=\"italic\"\u003e_\u003c/mi\u003e\u003cmi mathvariant=\"italic\"\u003e𝑜\u003c/mi\u003e\u003cmi mathvariant=\"italic\"\u003e𝑢\u003c/mi\u003e\u003cmi mathvariant=\"italic\"\u003e𝑡\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\mathit{sold\\_out}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，晚餐 6:30–7:30 無兩人桌，例：訂滿 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=1\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e、有位 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e無（假設負評時點外生）\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eLPM，餐廳 × 事件 FE\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003e供給（Sec. 5.2，式 6）\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e因果\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e餐廳 × 初次檢查 × 違規代碼\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e(1) \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eR_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e：前 90 天有評論\u003cbr /\u003e\n(2) \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eI_v\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e：informative 違規\u003cbr /\u003e\n(3) \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eR_{it}I_v\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e（關鍵係數 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\gamma\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e）\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cstrong\u003e二元\u003c/strong\u003e（是／否）：\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eV\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eV_{vit}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，例：查出 02B \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=1\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e、沒有 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eZ_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e、\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eZ_{it}I_v\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e、無舊評論者 dummy 及交互\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eOLS、IV，檢查 FE、餐廳 × 違規 FE\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"fz2026-zh-data-availability\"\u003e2. Data availability\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003e紐約市衛生局（DoH）檢查資料\u003c/strong\u003e：透過 NYC OpenRecords 依紐約州 FOIL 申請（近三年資料可直接從 NYC Open Data 下載）。\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eYelp 評論\u003c/strong\u003e：Yelp 網站上的公開評論。\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eOpenTable 可訂位\u003c/strong\u003e：在 OpenTable 網站逐日查詢並自行記錄。\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"fz2026-zh-methods\"\u003e3. Methods\u003c/h2\u003e\n\u003ch3 id=\"fz2026-zh-pipeline每個方法的輸入輸出與順序前一步的輸出就是下一步的輸入\"\u003ePipeline：每個方法的輸入、輸出與順序（前一步的輸出就是下一步的輸入）\u003c/h3\u003e\n\u003cdiv class=\"center\"\u003e\n\u003cdiv class=\"handout-pipeline-slot\"\u003e\u003c/div\u003e\n\u003cp\u003e\u003cspan\u003e註：標「原文」的是論文報告的數字，其他數字是為了說明輸入與輸出而舉的例子。\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003ch3 id=\"fz2026-zh-預測部分把評論文字變成違規預測\"\u003e3.1 預測部分：把評論文字變成違規預測\u003c/h3\u003e\n\u003ch4 id=\"fz2026-zh-bag-of-words\"\u003e(1) Bag-of-words\u003c/h4\u003e\n\u003ch5 id=\"fz2026-zh-def\"\u003eDef\u003c/h5\u003e\n\u003cp\u003e把一段文字只看成「每個詞出現幾次」的清單，不管詞的順序：文件 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ed\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 表示成詞數向量 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒄\u003c/mi\u003e\u003cmi\u003ed\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmi\u003e…\u003c/mi\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmi\u003ep\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo\u003e∈\u003c/mo\u003e\u003cmsup\u003e\u003cmi mathvariant=\"double-struck\"\u003eℕ\u003c/mi\u003e\u003cmi\u003ep\u003c/mi\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\boldsymbol c_d=(c_{d1},\\ldots,c_{dp})\\in\\mathbb N^p\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003ec_{dj}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 是詞 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ej\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ej\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 的出現次數。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-when-to-use\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003e文字量大、關心「講了什麼」而不是語序時。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-use\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e每次初次檢查合併檢查前約 90 天的評論，去標點數字、Porter 詞幹\u003ca href=\"#fz2026-zh-fn1\" class=\"footnote-ref\" id=\"fz2026-zh-fnref1\" role=\"doc-noteref\"\u003e\u003csup\u003e1\u003c/sup\u003e\u003c/a\u003e、刪過少（\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e\u0026lt;\u003c/mo\u003e\u003cmn\u003e5\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\u0026lt;5\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 篇）與過多（\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmn\u003e50\u003c/mn\u003e\u003cmi\u003e%\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\u0026gt;50\\%\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e）的詞，留 12,176 個詞幹，再依評論星等分 1–2、3、4–5 星三組，共 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e12\u003c/mn\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmn\u003e176\u003c/mn\u003e\u003cmo\u003e×\u003c/mo\u003e\u003cmn\u003e3\u003c/mn\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e36\u003c/mn\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmn\u003e528\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e12{,}176\\times3=36{,}528\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 個特徵。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-read\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e低星的 clean 與高星的 clean 是不同特徵，至 2016 年約 40% 的餐廳沒有近期評論，拿不到文字訊號。\u003c/p\u003e\n\u003ch4 id=\"fz2026-zh-mnirmultinomial-inverse-regression與-dmrdistributed-multinomial-regression\"\u003e(2) MNIR（multinomial inverse regression）與 DMR（distributed multinomial regression）\u003c/h4\u003e\n\u003ch5 id=\"fz2026-zh-defmnir\"\u003eDef（MNIR）\u003c/h5\u003e\n\u003cp\u003e反過來問「已知有某項違規時，評論用詞會怎麼變」，用 multinomial 模型描述每個詞出現的機率： \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒄\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e∣\u003c/mo\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒗\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e∼\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eMN\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒒\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\boldsymbol c_i\\mid\\boldsymbol v_i\\sim\\operatorname{MN}(m_i,\\boldsymbol q_i)\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e， \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eq\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003ee\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/msup\u003e\u003cmi\u003e/\u003c/mi\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmsup\u003e\u003cmi\u003ee\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eq_{ij}=e^{\\eta_{ij}}/\\sum_k e^{\\eta_{ik}}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e， \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ea\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝝓\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003cmi\u003e⊤\u003c/mi\u003e\u003c/msubsup\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒗\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒃\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003cmi\u003e⊤\u003c/mi\u003e\u003c/msubsup\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒘\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\eta_{ij}=a_j+\\boldsymbol\\phi_j^{\\top}\\boldsymbol v_i+\\boldsymbol b_j^{\\top}\\boldsymbol w_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e， \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003em_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 是文件總詞數。所有詞共用同一個分母 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmsup\u003e\u003cmi\u003ee\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\sum_k e^{\\eta_{ik}}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，所以全部詞的係數要一起估計。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-defdmr\"\u003eDef（DMR）\u003c/h5\u003e\n\u003cp\u003e把 MNIR 拆成「每個詞各跑一條 Poisson 迴歸」，詞再多也能平行估計： \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e∼\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003ePois\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmo minsize=\"120%\" maxsize=\"120%\" stretchy=\"true\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003ee\u003c/mi\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eμ\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003cmo minsize=\"120%\" maxsize=\"120%\" stretchy=\"true\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003ec_{ij}\\sim\\operatorname{Pois}\\big(e^{\\mu_i+\\eta_{ij}}\\big)\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，用 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eμ\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmsub\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\mu_i=\\log m_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 代替共同分母， 給定總詞數時，獨立 Poisson 就是 multinomial，因此每個詞可以分開、平行估計（是近似，不完全等於 MNIR 的最大概似）。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-when-to-use-1\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003e詞彙上萬、想知道「某個已知標籤出現時文字怎麼變」，並把文字壓成低維訊號，詞太多、MNIR 無法一次估計時改用 DMR。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-use-1\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e本文用 DMR 估計 MNIR：每個詞一條 Poisson 迴歸。原文式（2）另含星等組別主效果 \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eα\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003er\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\alpha_jr_j\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 與詞的 offset \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eμ\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\mu_j=\\log\\sum_ic_{ij}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e，\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒗\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\boldsymbol v_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e 是 20 項違規指標（與星等組別交互），控制為年月、料理類型、zipcode、連鎖。\u003c/p\u003e\n\u003ch5 id=\"fz2026-zh-how-to-read-1\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eϕ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003
