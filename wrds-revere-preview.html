of a product or clause.", "public_example": {"value": "Polycom CX5000", "kind": "observed", "note_en": "", "note_zh": ""}, "analysis_use": {"dv": "not_direct", "iv": "derived", "control": "derived", "note": "先界定構念與編碼規則，核對原始文件、缺失及文字生成方式；分類詞或摘要不等同完整合約或治理品質。", "dv_reason": "原始文字或摘要本身不是已驗證的行銷結果指標。", "iv_reason": "經人工或模型編碼並驗證後，可能衡量交易內容、產品或契約特徵。"}}]}], "papers": [{"id": "zhang_etal_2026_digitalization_supplier_environment", "title": "Digitalization and supplier environmental performance: An institutional perspective", "authors": ["Zhang", "Lee", "Liang", "Zhu", "Yeung", "Cheng"], "year": 2026, "journal": "Journal of Business Research", "doi": "10.1016/j.jbusres.2026.116098", "status": "既有全文查核紀錄：同資料產品", "relationship": "既有全文查核確認使用 FactSet Revere 建立公司—供應商配對；未確認文章使用 WRDS 免費樣本庫，不能視為使用目前的 Preview 或相同擷取版本。", "question": "焦點公司的數位化與其供應商的環境績效有何關係？", "design": "Revere 提供焦點公司與供應商的配對，讓研究將雙方連結到數位化與環境績效測量。既有查核紀錄未保存外部指標的資料庫名稱、識別碼對應與完整估計設計，這些細節仍需回到原文確認。", "replication_scope": "Preview 可練習關係方向、公司識別與配對結構；沒有文章的完整 Revere 樣本及外部績效、數位化指標，不能直接重現研究結果。", "dataset_ids": ["wrds-revere-preview"], "url": "https://doi.org/10.1016/j.jbusres.2026.116098", "source_url": "https://doi.org/10.1016/j.jbusres.2026.116098"}], "research_library": {"schema_version": 1, "methods": [{"id": "bag_of_words", "title_en": "Bag-of-words", "title_zh": "詞袋表示（Bag-of-words）", "category_en": "Text representation", "category_zh": "文字表示", "purpose_en": "Convert a large text corpus into count features when word content is more important than word order.", "purpose_zh": "將大量文字轉成計數特徵，適合重視詞彙內容而非語序的任務。", "scenario_en": "To compare wording in positive and negative reviews, first turn each review into word counts.", "scenario_zh": "想比較好評與負評常用哪些詞，可先把評論轉成詞頻。", "definition_en": "Represent document \\(d\\) as \\(\\boldsymbol c_d=(c_{d1},\\ldots,c_{dp})\\in\\mathbb N^p\\), where \\(c_{dj}\\) counts occurrences of term \\(j\\). Word order is discarded; preprocessing defines what counts as the same term.", "definition_zh": "以 \\(\\boldsymbol c_d=(c_{d1},\\ldots,c_{dp})\\in\\mathbb N^p\\) 表示文件 \\(d\\)，\\(c_{dj}\\) 是詞 \\(j\\) 的出現次數。表示法忽略語序；前處理決定哪些字形視為同一個詞。", "inputs_en": "Documents, an observation/document boundary, tokenization rules and a vocabulary.", "inputs_zh": "文字文件、觀察單位與文件邊界、斷詞規則及詞彙表。", "outputs_en": "A sparse document-by-term matrix of nonnegative counts; features can distinguish the same term across predefined groups.", "outputs_zh": "稀疏的文件×詞彙非負計數矩陣；可依預先定義的組別，將同一個詞分成不同特徵。", "assumptions_en": "The chosen vocabulary and document window retain useful content. Ignoring word order can lose negation and context. No-text observations are not automatically equivalent to observations without the target condition.", "assumptions_zh": "所選詞彙與文件窗口須保留有用內容。忽略語序可能失去否定與上下文；沒有文字的觀察值不等於沒有目標狀況。", "diagnostics_en": "Suggested checks: inspect token/stem examples, empty-document rates, vocabulary sparsity, document lengths and the effect of frequency filters.", "diagnostics_zh": "建議檢查：檢視斷詞與詞幹實例、空文件比例、詞彙稀疏度、文件長度，以及頻率篩選的影響。", "variants": [{"id": "fz2026-bag-of-words", "design_id": "fz2026", "title_en": "Pre-inspection reviews split by rating group", "title_zh": "檢查前評論依星等分組", "implementation_en": "The handout pools reviews from approximately 90 days before each initial inspection, removes punctuation and numbers, applies Porter stemming, and splits counts into 1–2, 3 and 4–5 star groups. It reports 12,176 stems and 36,528 term-group features.", "implementation_zh": "手稿整理：每次初次檢查合併前約90天評論，移除標點與數字、使用 Porter 詞幹化，再按1–2、3、4–5星分組。手稿報告12,176個詞幹、36,528個詞×星等特徵。", "tuning_en": "The handout removes stems appearing in fewer than five reviews or more than 50% of reviews. These are this application's thresholds, not universal defaults.", "tuning_zh": "手稿移除出現在少於5篇評論或超過50%評論的詞幹。這是此案例的門檻，不是通用預設值。", "interpretation_en": "A term such as 'clean' in a low-star review is distinct from the same term in a high-star review. The handout reports that about 40% of restaurants had no recent reviews by 2016; this concerns text availability, not hygiene status.", "interpretation_zh": "低星評論中的 clean 與高星評論中的 clean 是不同特徵。手稿轉述：至2016年約40%餐廳沒有近期評論；這是文字可得性，不是衛生狀態。", "limitations_en": "The handout does not fully specify treatment of zero-text observations or every preprocessing edge case. The pipeline's 'roach = 1, cold = 1' document is illustrative.", "limitations_zh": "手稿未完整交代零文字觀察值與所有前處理邊界情況。管線中的 roach＝1、cold＝1 文件是示意例子。", "source_locator_en": "Authored EN/ZH handouts, §3.1, method (1), and the pipeline; not independently checked against the journal article.", "source_locator_zh": "使用者撰寫的英／中手稿，§3.1 方法(1)與管線圖；尚未獨立核對期刊原文。"}]}, {"id": "mnir_dmr", "title_en": "Multinomial inverse regression and distributed multinomial regression", "title_zh": "多項式逆向迴歸與分散式多項式迴歸（MNIR／DMR）", "category_en": "Supervised text modeling", "category_zh": "監督式文字建模", "purpose_en": "Learn how word use varies with known labels, producing target-specific text weights; use distributed estimation for large vocabularies.", "purpose_zh": "學習已知標籤與用詞變化的關係，取得針對目標的文字權重；詞彙龐大時使用分散式估計。", "scenario_en": "You know which restaurants had roach violations and want to find words associated with those restaurants' reviews.", "scenario_zh": "已知哪些餐廳查出蟑螂，想找出這些餐廳的評論常用哪些詞。", "definition_en": "MNIR models word counts conditional on document length, labels and controls: \\(\\boldsymbol c_i\\mid\\boldsymbol v_i\\sim\\operatorname{MN}(m_i,\\boldsymbol q_i)\\), with word probabilities \\(q_{ij}=\\exp(\\eta_{ij})/\\sum_k\\exp(\\eta_{ik})\\). DMR fits word-specific Poisson models \\(c_{ij}\\sim\\operatorname{Pois}(\\exp(\\mu_i+\\eta_{ij}))\\) with offsets in parallel, approximating joint multinomial estimation.", "definition_zh": "MNIR在文件長度、標籤與控制變數下建模詞數：\\(\\boldsymbol c_i\\mid\\boldsymbol v_i\\sim\\operatorname{MN}(m_i,\\boldsymbol q_i)\\)，詞機率為 \\(q_{ij}=\\exp(\\eta_{ij})/\\sum_k\\exp(\\eta_{ik})\\)。DMR將含offset的逐詞Poisson模型 \\(c_{ij}\\sim\\operatorname{Pois}(\\exp(\\mu_i+\\eta_{ij}))\\) 平行估計，近似聯合多項式估計。", "inputs_en": "Document-term counts, document lengths, observed target labels and controls.", "inputs_zh": "文件詞數、文件長度、已觀察的目標標籤與控制變數。", "outputs_en": "A target-by-term coefficient matrix and other word-model coefficients; these can feed a sufficient-reduction projection.", "outputs_zh": "目標×詞彙係數矩陣及其他文字模型係數，可用於後續充分降維投影。", "assumptions_en": "The inverse word model and offsets must adequately describe conditional word use. Separate Poisson fitting with fixed offsets need not equal the joint MNIR maximum-likelihood solution. Conditional association is not a causal direction.", "assumptions_zh": "逆向文字模型與 offset 須適當描述條件用詞分布。固定 offset 的逐詞 Poisson 估計不一定等於聯合 MNIR 最大概似解；條件關聯不代表因果方向。", "diagnostics_en": "Suggested checks: held-out word-model loss, convergence, extreme or empty counts, offset construction and coefficient stability across training folds.", "diagnostics_zh": "建議檢查：保留樣本的文字模型損失、收斂、極端或空計數、offset 建構，以及不同訓練折的係數穩定度。", "variants": [{"id": "fz2026-mnir-dmr", "design_id": "fz2026", "title_en": "Violation-associated review vocabulary", "title_zh": "與衛生違規相關的評論用詞", "implementation_en": "The handout describes DMR estimation of MNIR with 20 violation indicators, violation-by-rating-group interactions, and year-month, cuisine, ZIP code and chain controls. Its account of Eq. (2) also includes rating-group effects and a word offset \\(\\log\\sum_i c_{ij}\\), alongside the document-length offset in its general explanation.", "implementation_zh": "手稿以 DMR 估計 MNIR，納入20項違規指標、違規×星等組別交互作用，以及年月、料理類型、ZIP code、連鎖控制。手稿對式(2)的描述另含星等組別效果與詞 offset \\(\\log\\sum_i c_{ij}\\)，一般說明則列出文件長度 offset。", "tuning_en": "Word-specific L1 penalties are selected by grouped cross-validation; see the LASSO variant. The handout does not reproduce a complete estimation implementation.", "tuning_zh": "逐詞 L1 懲罰以分組交叉驗證選擇，見 LASSO 變體。手稿未提供完整估計實作。", "interpretation_en": "A positive \\(\\phi_{vj}\\) means term \\(j\\) is more frequent conditional on violation \\(v\\) and the model's controls. It does not establish that the violation caused the wording. The pipeline coefficient \\(\\widehat\\phi_{\\mathrm{04M},\\mathrm{roach}}=1.5\\) is illustrative.", "interpretation_zh": "\\(\\phi_{vj}\\) 為正表示在模型控制條件下，有違規 \\(v\\) 時詞 \\(j\\) 較常出現，不能因此認定違規造成用詞。管線中的 \\(\\widehat\\phi_{\\mathrm{04M},\\mathrm{roach}}=1.5\\) 是示意值。", "limitations_en": "The document and word offsets have different roles. Their exact joint parameterization, normalization and equivalence to the article require checking the original equation or code; the handout alone does not verify them.", "limitations_zh": "文件 offset 與詞 offset 的角色不同。精確聯合參數化、正規化及其與論文是否一致，仍須核對原式或程式，不能僅憑手稿認定。", "source_locator_en": "Authored EN/ZH handouts, §3.1, method (2), referring to article Eq. (2); article equation not independently verified.", "source_locator_zh": "使用者英／中手稿，§3.1 方法(2)，指向論文式(2)；尚未獨立核對該原式。"}]}, {"id": "lasso", "title_en": "LASSO regularization", "title_zh": "LASSO 正則化", "category_en": "Regularization and feature selection", "category_zh": "正則化與特徵選擇", "purpose_en": "Control complexity and obtain sparse coefficients when many candidate features may carry little signal.", "purpose_zh": "當大量候選特徵可能只有少數帶有訊號時，控制模型複雜度並取得稀疏係數。", "scenario_en": "Your reviews contain thousands of words, but you want the model to retain only a useful subset.", "scenario_zh": "評論有上萬個詞，但你想讓模型只保留較有用的一小部分。", "definition_en": "Estimate coefficients by minimizing a loss plus an L1 penalty: \\(\\widehat{\\boldsymbol\\beta}=\\arg\\min_{\\boldsymbol\\beta}\\{\\mathcal L(\\boldsymbol\\beta)+\\lambda\\sum_k|\\beta_k|\\}\\). Larger \\(\\lambda\\) increases shrinkage and can set coefficients exactly to zero.", "definition_zh": "最小化損失加L1懲罰：\\(\\widehat{\\boldsymbol\\beta}=\\arg\\min_{\\boldsymbol\\beta}\\{\\mathcal L(\\boldsymbol\\beta)+\\lambda\\sum_k|\\beta_k|\\}\\)。\\(\\lambda\\) 越大縮減越強，部分係數可恰為零。", "inputs_en": "A specified regression loss, outcome, predictors, penalty treatment and candidate penalty strengths.", "inputs_zh": "已指定的迴歸損失、結果、預測變數、各係數懲罰方式與候選懲罰強度。", "outputs_en": "Shrunken coefficient estimates, possibly a sparse feature set, and a selected penalty parameter.", "outputs_zh": "縮減後的係數估計、可能稀疏的特徵集合及選定的懲罰參數。", "assumptions_en": "Sparsity must be useful for the prediction task, and penalty scale and feature construction matter. A selected zero is model-dependent, not evidence of no population effect; selection is not a significance test.", "assumptions_zh": "稀疏化須有助於預測任務，且懲罰尺度與特徵建構會影響結果。選出的零係數依賴模型，不是母體無效果的證據；特徵選擇也不是顯著性檢定。", "diagnostics_en": "Suggested checks: grouped held-out loss across \\(\\lambda\\) values, coefficient paths, number of retained coefficients and selection stability.", "diagnostics_zh": "建議檢查：不同 \\(\\lambda\\) 的分組保留樣本損失、係數路徑、保留係數數量及選擇穩定度。", "variants": [{"id": "fz2026-poisson-lasso", "design_id": "fz2026", "title_en": "Word-specific penalized Poisson estimation", "title_zh": "逐詞的懲罰 Poisson 估計", "implementation_en": "The handout's account of Eq. (3) penalizes each word's rating, control and violation coefficients: \\(\\lambda_j(\\lVert\\alpha_j\\rVert_1+\\lVert\\beta_j\\rVert_1+\\lVert\\phi_j\\rVert_1)\\). It says the intercept receives only a small penalty.", "implementation_zh": "手稿對式(3)的整理為逐詞懲罰星等、控制及違規係數：\\(\\lambda_j(\\lVert\\alpha_j\\rVert_1+\\lVert\\beta_j\\rVert_1+\\lVert\\phi_j\\rVert_1)\\)，並指出截距僅受很小懲罰。", "tuning_en": "Each word has its own \\(\\lambda_j\\), selected using restaurant-grouped five-fold cross-validation to minimize held-out Poisson loss. The candidate grid and small intercept penalty are not numerically specified in the handout.", "tuning_zh": "每個詞有自己的 \\(\\lambda_j\\)，以依餐廳分組的5折交叉驗證，選擇保留樣本 Poisson 損失最小者。手稿未列候選網格及截距小懲罰的確切數值。", "interpretation_en": "A zero word coefficient means it was not retained under this fitted penalty; a retained coefficient is still shrunk. It is neither a p-value nor a direct hygiene effect.", "interpretation_zh": "詞係數為零，表示在這次估計與懲罰下未被保留；保留的係數仍受縮減。它既不是 p 值，也不是直接衛生效果。", "limitations_en": "The exact penalty configuration is handout-reported, with an endnote-12 reference. Reproducing it requires the original specification and tuning settings.", "limitations_zh": "精確懲罰設定僅由手稿轉述並指向尾註12；重現時仍需原始規格及調參設定。", "source_locator_en": "Authored EN/ZH handouts, §3.1, method (3), referring to article Eq. (3) and endnote 12; not independently checked.", "source_locator_zh": "使用者英／中手稿，§3.1 方法(3)，指向論文式(3)與尾註12；尚未獨立核對。"}]}, {"id": "sufficient_reduction", "title_en": "Sufficient-reduction projection", "title_zh": "充分降維投影（SR）", "category_en": "Supervised dimension reduction", "category_zh": "監督式降維", "purpose_en": "Compress high-dimensional text into a small set of target-specific features for subsequent prediction.", "purpose_zh": "將高維文字壓縮成少數針對目標的特徵，供後續預測使用。", "scenario_en": "You want to compress thousands of review terms into a few hygiene scores before predicting inspection results.", "scenario_zh": "想把上萬個評論詞彙壓成幾個衛生分數，再預測檢查結果。", "definition_en": "A sufficient reduction seeks \\(Z\\) retaining the target information in \\(X\\), expressed as \\(Y\\perp X\\mid Z\\). In the specified MNIR model, \\(\\boldsymbol z_i=\\Phi\\boldsymbol c_i\\) provides a reduction conditional on document length and controls; estimated weights yield a model-based approximation.", "definition_zh": "充分降維尋找保留 \\(X\\) 中目標資訊的 \\(Z\\)，可表示為 \\(Y\\perp X\\mid Z\\)。在指定MNIR模型下，\\(\\boldsymbol z_i=\\Phi\\boldsymbol c_i\\) 給出以文件長度與控制變數為條件的降維；估計權重所得是依賴模型的近似。", "inputs_en": "Document-term counts and a coefficient matrix learned from target labels on training data.", "inputs_zh": "文件詞數及使用訓練資料目標標籤學得的係數矩陣。", "outputs_en": "Low-dimensional linear scores, one per modeled target dimension; scores are not inherently bounded probabilities.", "outputs_zh": "低維線性分數，每個建模目標面向對應一個分數；分數本身不是有界機率。", "assumptions_en": "The claimed sufficiency is conditional on the inverse-model specification, document length and controls. Estimated scores may lose target information when that model is misspecified. Supervised weights must not use test labels.", "assumptions_zh": "充分性依賴逆向模型設定、文件長度與控制變數。模型錯置時，估計分數可能失去目標資訊；監督式權重不得使用測試標籤。", "diagnostics_en": "Suggested checks: score distributions and extreme values, sensitivity to document length, training/test separation and added held-out predictive performance.", "diagnostics_zh": "建議檢查：分數分布與極端值、對文件長度的敏感度、訓練／測試隔離，以及保留樣本的增額預測力。", "variants": [{"id": "fz2026-violation-sr", "design_id": "fz2026", "title_en": "Twenty violation-specific review scores", "title_zh": "20個違規面向的評論分數", "implementation_en": "The handout uses a \\(20\\times p\\) estimated weight matrix to project negative reviews from the 90 days preceding an inspection: \\(z_{iv}=\\sum_j\\widehat\\phi_{vj}c_{ij}\\). These 20 scores enter the augmented classifier. Scores also feed the later negative-hygiene-event construction.", "implementation_zh": "手稿以\\(20\\times p\\)估計權重矩陣投影檢查前90天負面評論：\\(z_{iv}=\\sum_j\\widehat\\phi_{vj}c_{ij}\\)。20個分數進入增額分類器，也用於後續負面衛生事件建構。", "tuning_en": "There is no separately reported SR tuning grid. Its weights depend on the inverse model and LASSO tuning, and the handout requires re-estimation within training folds.", "tuning_zh": "手稿未另外列出 SR 調參網格。權重取決於逆向模型與 LASSO 調參，並須在各訓練折內重估。", "interpretation_en": "A higher score means text resembles reviews associated with that violation under the learned model. Coefficients may be negative. The handout cautions that an 'approximate violation probability' label does not make the score lie in \\([0,1]\\); its 2.5 and 0.9 pipeline scores are illustrative.", "interpretation_zh": "較高分數表示依學得模型，文字較像與該違規相關的評論；係數可為負。手稿提醒：稱作『近似違規機率』不保證分數落在\\([0,1]\\)；圖中2.5與0.9均為示意值。", "limitations_en": "The handout does not fully specify aggregation and normalization for every downstream score. Cross-inspection document length and the review-day event aggregation require careful replication.", "limitations_zh": "手稿未完整交代所有下游分數的彙整與正規化；跨檢查的文件長度及評論日事件彙整須在重現時核對。", "source_locator_en": "Authored EN/ZH handouts, §3.1, method (4), and the negative-hygiene-event pipeline bridge; not an independent replication.", "source_locator_zh": "使用者英／中手稿，§3.1 方法(4)與負面衛生事件管線橋接；不是獨立重現結果。"}]}, {"id": "nested_grouped_cv", "title_en": "Nested grouped cross-validation", "title_zh": "巢狀分組交叉驗證", "category_en": "Model tuning and evaluation", "category_zh": "模型調參與評估", "purpose_en": "Separate model selection from out-of-sample evaluation while keeping related observations together.", "purpose_zh": "將模型選擇與樣本外評估分開，並把相關觀察值放在同一組。", "scenario_en": "Each restaurant has repeated inspections; you want to test whether the model predicts well for entirely new restaurants.", "scenario_zh": "同一家店有多次檢查，你想測試模型遇到新餐廳時是否仍準。", "definition_en": "Use \\(K_{\\mathrm{outer}}\\) outer folds to evaluate performance and \\(K_{\\mathrm{inner}}\\) folds within each outer training set to select hyperparameters \\(h\\). Grouped splitting keeps all observations from a group in the same fold, preventing its records from entering both training and test sets.", "definition_zh": "外層 \\(K_{\\mathrm{outer}}\\) 折評估表現；在每個外層訓練集內，再以 \\(K_{\\mathrm{inner}}\\) 折選擇超參數 \\(h\\)。分組切分讓同組觀察值留在同一折，避免同組紀錄同時進入訓練與測試。", "inputs_en": "Observations, outcomes, grouping identifiers, candidate models or hyperparameters, and a prespecified evaluation metric.", "inputs_zh": "觀察值、結果、分組識別碼、候選模型或超參數，以及預先指定的評估指標。", "outputs_en": "Tuned models and outer-fold predictions or performance estimates for previously unseen groups.", "outputs_zh": "調參後的模型，以及對未見過群組的外層預測或表現估計。", "assumptions_en": "The group definition must match the intended generalization target. All label-dependent feature learning must remain inside training folds. Generalizing to unseen groups is distinct from predicting future periods.", "assumptions_zh": "分組定義須符合欲推廣的對象。所有依賴標籤的特徵學習都須留在訓練折內；推廣至未見群組與預測未來時期是不同問題。", "diagnostics_en": "Suggested checks: no overlapping group IDs across folds, both outcome classes where AUC is computed, preprocessing fitted only on training data, and dispersion in outer-fold performance.", "diagnostics_zh": "建議檢查：各折間群組ID不重疊、計算AUC的樣本同時有兩類結果、前處理僅用訓練資料估計，以及外層表現的變動。", "variants": [{"id": "fz2026-restaurant-nested-cv", "design_id": "fz2026", "title_en": "Five-by-five folds grouped by restaurant", "title_zh": "依餐廳分組的外5折／內5折", "implementation_en": "The handout specifies five outer and five inner folds, grouping repeated inspections by restaurant. It states that both the text weight matrix and classifier are re-estimated using training folds only.", "implementation_zh": "手稿指定外層5折、內層5折，將同一餐廳的多次檢查分在同組，並要求文字權重矩陣與分類器都只使用訓練折重估。", "tuning_en": "Select classifier settings by mean inner-fold AUC, then evaluate on held-out outer restaurants. The handout notes that Algorithm 1 says 'minimize AUC' and interprets this as a likely 'maximize' error; that correction has not been verified against the original article.", "tuning_zh": "依內層平均AUC選分類器設定，再評估外層保留餐廳。手稿指出 Algorithm 1 寫 minimize AUC，並依上下文判斷應為 maximize；此修正尚未核對原論文。", "interpretation_en": "Outer-fold AUC describes prediction for unseen restaurants under this sampling scheme, not a causal effect or automatically a future-period forecast.", "interpretation_zh": "外層AUC描述此切分下對未見餐廳的預測表現，不是因果效果，也不自動代表未來時期預測。", "limitations_en": "The handout does not provide fold assignments, random seeds, the full hyperparameter grid or every preprocessing boundary. It supplies a procedure description rather than a reproducible fitted model.", "limitations_zh": "手稿未提供分折清單、隨機種子、完整超參數網格及所有前處理邊界；它提供程序說明，不是可直接重現的已估計模型。", "source_locator_en": "Authored EN/ZH handouts, §3.1, method (5), and the classifier pipeline node; no independent algorithm verification.", "source_locator_zh": "使用者英／中手稿，§3.1 方法(5)與分類器管線節點；尚未獨立核查原演算法。"}]}, {"id": "gradient_boosted_trees", "title_en": "Gradient-boosted decision trees", "title_zh": "梯度提升決策樹（GBDT）", "category_en": "Predictive classification", "category_zh": "預測分類", "purpose_en": "Model nonlinearities and feature interactions in tabular prediction tasks.", "purpose_zh": "在表格資料的預測任務中，建模非線性及特徵交互作用。", "scenario_en": "You suspect that certain words signal risk only in low-star reviews and want a model that captures this combination.", "scenario_zh": "你懷疑低星加上特定用詞才有警訊，想讓模型捕捉這種組合。", "definition_en": "Build an additive score \\(F_M(\\boldsymbol x)=F_0+\\eta\\sum_{m=1}^{M}f_m(\\boldsymbol x)\\), adding trees that improve the current loss. For binary log loss, the negative gradient is \\(y_i-p_i^{(m-1)}\\), and \\(p=1/(1+e^{-F})\\) converts the score into a predicted probability.", "definition_zh": "建立加法分數 \\(F_M(\\boldsymbol x)=F_0+\\eta\\sum_{m=1}^{M}f_m(\\boldsymbol x)\\)，逐棵加入能改善目前損失的樹。二元log loss的負梯度為 \\(y_i-p_i^{(m-1)}\\)，再以 \\(p=1/(1+e^{-F})\\) 將分數轉為預測機率。", "inputs_en": "Tabular predictors, binary labels, a loss function and model-complexity settings.", "inputs_zh": "表格預測變數、二元標籤、損失函數與模型複雜度設定。", "outputs_en": "Fitted tree ensembles and prediction scores or probabilities.", "outputs_zh": "已估計的樹集合及預測分數或機率。", "assumptions_en": "Training examples and evaluation design must support the intended prediction population. High flexibility does not remove the need for regularization or establish causal interpretation.", "assumptions_zh": "訓練資料與評估設計須支持欲預測的母體。高度彈性仍需要正則化，也不會自動帶來因果解釋。", "diagnostics_en": "Suggested checks: nested held-out performance, overfitting across complexity settings, comparison with a simpler model, and probability calibration when probabilities are interpreted literally.", "diagnostics_zh": "建議檢查：巢狀保留樣本表現、不同複雜度的過度配適、與簡單模型的比較，以及將機率作字面解讀時的校準。", "variants": [{"id": "fz2026-lightgbm-violations", "design_id": "fz2026", "title_en": "LightGBM classifiers for individual violations", "title_zh": "各違規面向的LightGBM分類器", "implementation_en": "The handout fits one classifier per violation. The baseline uses the posted hygiene grade; the augmented model adds average stars and 20 SR scores. Its implementation label is LightGBM.", "implementation_zh": "手稿針對每項違規估計一個分類器。基準模型使用張貼的衛生等級；增額模型加入平均星等與20個SR分數。手稿的實作標示為LightGBM。", "tuning_en": "Hyperparameters are selected by mean AUC inside restaurant-grouped nested cross-validation. The handout does not list the tree count, learning rate, depth or other chosen settings.", "tuning_zh": "在依餐廳分組的巢狀交叉驗證內，以平均AUC選超參數。手稿未列出樹數、學習率、深度或其他最終設定。", "interpretation_en": "The output predicts whether an inspection finds a violation. The pipeline probability 0.31, grade A and average stars 3.2 are illustrative inputs/outputs, not estimates verified from the study.", "interpretation_zh": "輸出預測檢查是否查出違規。管線中的機率0.31、等級A與平均星等3.2是示意輸入／輸出，不是已核實的研究估計。", "limitations_en": "A stronger classifier shows predictive information, not the effect of review exposure. The handout reports a penalized-logistic comparator but does not supply its detailed estimates.", "limitations_zh": "分類器表現較佳表示存在預測資訊，不是評論曝光的效果。手稿轉述有懲罰logistic替代模型，但未提供其詳細估計。", "source_locator_en": "Authored EN/ZH handouts, §3.1, methods (5), (6) and (6b), and the pipeline.", "source_locator_zh": "使用者英／中手稿，§3.1 方法(5)、(6)、(6b)與管線圖。"}]}, {"id": "penalized_logistic_regression", "title_en": "Penalized logistic regression", "title_zh": "懲罰logistic迴歸", "category_en": "Predictive classification", "category_zh": "預測分類", "purpose_en": "Predict a binary outcome with a regularized linear log-odds model or provide a simpler comparator to nonlinear classifiers.", "purpose_zh": "以正則化的線性log-odds模型預測二元結果，或作為非線性分類器的簡單比較模型。", "scenario_en": "You want a simpler model to predict whether a restaurant's next inspection will find a violation.", "scenario_zh": "想用一個較簡單的模型，預測餐廳下次檢查是否違規。", "definition_en": "Model \\(\\log\\{p_i/(1-p_i)\\}=\\beta_0+\\boldsymbol x_i^\\top\\boldsymbol\\beta\\) and minimize binary negative log-likelihood plus \\(\\lambda P(\\boldsymbol\\beta)\\). Common penalties are L1, \\(P(\\boldsymbol\\beta)=\\sum_k|\\beta_k|\\), and L2, \\(P(\\boldsymbol\\beta)=\\sum_k\\beta_k^2\\).", "definition_zh": "設定 \\(\\log\\{p_i/(1-p_i)\\}=\\beta_0+\\boldsymbol x_i^\\top\\boldsymbol\\beta\\)，最小化二元負對數概似加 \\(\\lambda P(\\boldsymbol\\beta)\\)。常見懲罰為L1的 \\(P(\\boldsymbol\\beta)=\\sum_k|\\beta_k|\\) 或L2的 \\(P(\\boldsymbol\\beta)=\\sum_k\\beta_k^2\\)。", "inputs_en": "Binary labels, explicitly constructed predictors and a specified penalty family and strength.", "inputs_zh": "二元標籤、明確建構的預測變數，以及指定的懲罰類型與強度。", "outputs_en": "Regularized log-odds coefficients and predicted probabilities.", "outputs_zh": "正則化的log-odds係數及預測機率。", "assumptions_en": "Log-odds are linear in the supplied features; nonlinear terms and interactions must be supplied explicitly. Regularization changes coefficient interpretation and does not confer causal identification.", "assumptions_zh": "log-odds 對輸入特徵呈線性；非線性項與交互作用須明確加入。正則化會影響係數解讀，也不提供因果識別。", "diagnostics_en": "Suggested checks: held-out AUC and calibration, sensitivity to penalty family/strength, and fair comparison using the same features and folds.", "diagnostics_zh": "建議檢查：保留樣本AUC與校準、對懲罰類型／強度的敏感度，以及使用相同特徵與分折的公平比較。", "variants": [{"id": "fz2026-logistic-comparator", "design_id": "fz2026", "title_en": "Reported alternative to the GBDT classifier", "title_zh": "手稿轉述的GBDT替代分類器", "implementation_en": "Method (6b) says article footnote 16 reports similar results after replacing GBDT with penalized logistic regression. The handout does not identify whether L1, L2 or another exact implementation was used.", "implementation_zh": "方法(6b)轉述論文註16：將GBDT換為懲罰logistic迴歸後結果相近。手稿未說明實際使用L1、L2或其他精確實作。", "tuning_en": "Penalty choice, \\(\\lambda\\) grid, selected values and numeric comparator results are unreported in the handout; they must remain unspecified.", "tuning_zh": "手稿未報告懲罰選擇、\\(\\lambda\\)網格、選定值及比較模型數字，這些資訊保留為未指定。", "interpretation_en": "The handout interprets the reported similarity as evidence that added review information is not solely an artifact of GBDT flexibility. It does not establish identical performance or provide a quantitative robustness estimate.", "interpretation_zh": "手稿將結果相近解讀為評論增額資訊並非僅來自GBDT彈性；這不代表表現完全相同，也沒有可量化的穩健性估計。", "limitations_en": "This is a reported comparator, not a locally implemented or independently verified model. Do not fill missing penalty details from the general definition.", "limitations_zh": "這是手稿轉述的比較模型，不是本機已實作或獨立核對的模型；不可用一般定義補成實際採用的懲罰細節。", "source_locator_en": "Authored EN/ZH handouts, §3.1, method (6b), referring to article footnote 16; no original-article verification.", "source_locator_zh": "使用者英／中手稿，§3.1 方法(6b)，指向論文註16；尚未核對原論文。"}]}, {"id": "auc_delta_auc", "title_en": "AUC and incremental AUC", "title_zh": "AUC與增額AUC", "category_en": "Predictive evaluation", "category_zh": "預測評估", "purpose_en": "Compare ranking performance without choosing a single classification threshold, and quantify improvement over a baseline.", "purpose_zh": "不指定單一分類門檻地比較排序能力，並衡量相對基準模型的改善。", "scenario_en": "You have two violation models and want to compare which one ranks higher-risk restaurants ahead of lower-risk ones.", "scenario_zh": "有兩個違規預測模型，你想比較哪個較能把高風險餐廳排前面。", "definition_en": "\\(\\mathrm{AUC}=P(S^+\u003eS^-)+\\tfrac12P(S^+=S^-)\\), ranging from 0 to 1. Incremental AUC is \\(\\Delta\\mathrm{AUC}=\\mathrm{AUC}_1-\\mathrm{AUC}_0\\): augmented minus baseline AUC on a comparable evaluation sample.", "definition_zh": "\\(\\mathrm{AUC}=P(S^+\u003eS^-)+\\tfrac12P(S^+=S^-)\\)，範圍為0至1。增額AUC是可比較評估樣本中的 \\(\\Delta\\mathrm{AUC}=\\mathrm{AUC}_1-\\mathrm{AUC}_0\\)，即增額模型減去基準模型。", "inputs_en": "Held-out scores, observed binary labels and, for incremental AUC, paired baseline/augmented predictions.", "inputs_zh": "保留樣本分數、已觀察二元標籤，以及計算增額AUC時相對應的基準／增額模型預測。", "outputs_en": "A ranking-performance statistic and its change relative to the baseline.", "outputs_zh": "排序表現統計量及相對基準的變化。", "assumptions_en": "Evaluation labels and sampling must represent the intended task. AUC measures ranking rather than accuracy at a chosen threshold, calibration, business value or a causal effect.", "assumptions_zh": "評估標籤與抽樣須對應目標任務。AUC衡量排序，不是指定門檻下的正確率、校準、商業價值或因果效果。", "diagnostics_en": "Suggested checks: class counts, comparable held-out observations, uncertainty accounting for the grouping scheme, ROC curves and whether rankings are useful at operational thresholds.", "diagnostics_zh": "建議檢查：兩類樣本數、可比較的保留樣本、考量分組的不確定性、ROC曲線，以及實務門檻附近的排序用途。", "variants": [{"id": "fz2026-informative-violations", "design_id": "fz2026", "title_en": "Select informative violations using added review information", "title_zh": "以評論增額資訊挑出informative違規", "implementation_en": "The handout compares grade-only and augmented predictions for each violation. It reports AUCs around 0.51–0.68, almost all baselines below 0.55, and selects the five largest gains: 02B hot-food temperature, 04H contaminated food, 04M live roaches, 04A supervisor certification and 02G cold-food temperature.", "implementation_zh": "手稿對每項違規比較僅衛生等級與增額模型，轉述AUC約0.51–0.68、基準幾乎皆低於0.55，並挑出增額最大的五項：02B熱食溫度、04H食物污染、04M活蟑螂、04A主管證照、02G冷食溫度。", "tuning_en": "AUC evaluates predictions and guides inner-fold model choice; the handout's five-violation set is an application-specific selection. The diagram's \\(0.66-0.53=0.13\\) example is illustrative, not a reported violation-specific estimate.", "tuning_zh": "AUC用於評估預測及內層模型選擇；五項違規是此案例的選取結果。圖中的\\(0.66-0.53=0.13\\)是示意，不是報告的特定違規估計。", "interpretation_en": "AUC 0.5 is chance ranking; 0.68 is not 68% correct. Delta AUC measures added predictive information. The selected violations define \\(I_v\\) and contribute to the demand-event signal.", "interpretation_zh": "AUC 0.5代表隨機排序，0.68不等於68%正確。增額AUC衡量額外預測資訊；選出的違規用以定義\\(I_v\\)，也構成需求事件訊號。", "limitations_en": "Prediction gains do not identify review effects. The handout notes a tension between describing certification as difficult to predict and including 04A among the top five; the original results and selection uncertainty have not been independently checked.", "limitations_zh": "預測增益不能識別評論效果。手稿指出『證照較難預測』與04A仍進前五的張力；原始結果與選取不確定性尚未獨立核對。", "source_locator_en": "Authored EN/ZH handouts, §3.1, method (7), and the informative-violation bridge; reported figures are secondary handout accounts.", "source_locator_zh": "使用者英／中手稿，§3.1 方法(7)與informative違規橋接；報告數字屬手稿的二手整理。"}]}, {"id": "event_study", "title_en": "Event study", "title_zh": "事件研究", "category_en": "Longitudinal causal design", "category_zh": "縱貫因果設計", "purpose_en": "Trace outcome differences before and after an event, relative to a specified reference period.", "purpose_zh": "相對指定基準期，描繪事件發生前後的結果差異。", "scenario_en": "A negative review appears; you want to see how restaurant bookings change over the surrounding weeks.", "scenario_zh": "一篇負面評論出現後，想看看餐廳訂位在前後兩週如何變化。", "definition_en": "Regress an outcome on event-time indicators, controls and suitable fixed effects: \\(Y_{it}=\\alpha_i+\\sum_{\\tau\\ne\\tau_0}\\beta_\\tau\\mathbf1\\{t-E_i=\\tau\\}+\\boldsymbol X_{it}^\\top\\boldsymbol\\theta+\\varepsilon_{it}\\), omitting reference time \\(\\tau_0\\). Coefficients describe the event-time path; a causal reading needs additional design assumptions.", "definition_zh": "以事件相對時間指標、控制變數及適當固定效果解釋結果：\\(Y_{it}=\\alpha_i+\\sum_{\\tau\\ne\\tau_0}\\beta_\\tau\\mathbf1\\{t-E_i=\\tau\\}+\\boldsymbol X_{it}^\\top\\boldsymbol\\theta+\\varepsilon_{it}\\)，省略 \\(\\tau_0\\) 作基準。係數描繪事件路徑；因果解讀仍需額外設計假設。", "inputs_en": "Dated events, outcomes before and after the events, observation/event identifiers, a reference period and controls.", "inputs_zh": "具日期的事件、事件前後結果、觀察／事件識別碼、基準期及控制變數。", "outputs_en": "Event-time coefficients and uncertainty; optionally a pooled post-event coefficient.", "outputs_zh": "各事件相對時間的係數與不確定性，也可另估聚合的事後係數。", "assumptions_en": "Without comparison events, a causal interpretation requires event timing to be exogenous conditional on controls and no unaccounted concurrent changes. Pre-event patterns can reveal problems but cannot establish exogeneity.", "assumptions_zh": "沒有對照事件時，因果解讀要求控制條件下事件時點外生，且沒有未處理的同期變動。事件前走勢可揭露問題，但不能證明外生性。", "diagnostics_en": "Suggested checks: pre-event paths, reference-period choice, overlapping/repeated event windows, missing daily outcomes and sensitivity to window length and controls.", "diagnostics_zh": "建議檢查：事件前路徑、基準期選擇、重疊／重複事件窗口、每日結果缺漏，以及對窗口長度與控制變數的敏感度。", "variants": [{"id": "fz2026-demand-event-study", "design_id": "fz2026", "title_en": "Restaurant sell-out probability around negative hygiene reviews", "title_zh": "負面衛生評論前後的餐廳完售機率", "implementation_en": "The handout's Eq. (4) uses restaurant × review-event × relative-day observations. A treated event is a 1–3 star review day whose summed SR signal over the five informative violations lies in the worst 20%. The outcome \\(\\mathit{sold\\_out}=1\\) when no table for two is available from 6:30–7:30 pm. It is an availability measure, not observed revenue.", "implementation_zh": "手稿的式(4)使用餐廳×評論事件×相對日觀察。處理事件是1–3星評論日，五項informative違規的SR加總訊號落在最差20%。\\(\\mathit{sold\\_out}=1\\)指晚間6:30–7:30沒有兩人桌可訂；它是可訂位衡量，不是實際營收。", "tuning_en": "Use a −15 to +15 day window and event day zero as the reference. Include restaurant × event fixed effects, weekday, average stars and posted grade. The pooled After indicator covers \\(t\u003e0\\).", "tuning_zh": "使用−15至＋15天窗口，以事件當天0日為基準；納入餐廳×事件固定效果、星期、平均星等與官方等級。聚合After指標涵蓋\\(t\u003e0\\)。", "interpretation_en": "The handout reports a gradual decline with a low point around one week. Its Table 3 column 1 account gives \\(\\widehat\\beta_{\\mathrm{After}}=-0.005\\) (SE 0.0009; N = 534,459): 0.5 percentage points, about 2.6% relative to a 0.19 baseline. N is the handout's regression observation count, not the number of restaurants.", "interpretation_zh": "手稿轉述完售率逐步下降、約一週最低；其Table 3規格1為\\(\\widehat\\beta_{\\mathrm{After}}=-0.005\\)（SE 0.0009；N＝534,459），即0.5個百分點，相對0.19基準約2.6%。N是手稿的迴歸觀察數，不是餐廳數。", "limitations_en": "This event-study specification has no control-event group. The handout does not fully resolve the quantile reference population, review-versus-day aggregation, event-overlap rules or inference clustering; these require the original specification or code.", "limitations_zh": "此事件研究規格沒有對照事件組。手稿未完全釐清分位數母體、評論與評論日彙整、事件重疊規則或推論群聚層級，須核對原始規格或程式。", "source_locator_en": "Authored EN/ZH handouts, §1 observation-unit table and §3.2 method (8), referring to Eq. (4), Figure 6 and Table 3 column 1; not independently verified.", "source_locator_zh": "使用者英／中手稿，§1觀察單位表與§3.2方法(8)，指向式(4)、Figure 6、Table 3規格1；尚未獨立核對。"}]}, {"id": "difference_in_differences", "title_en": "Difference-in-differences", "title_zh": "差異中的差異（DiD）", "category_en": "Longitudinal causal design", "category_zh": "縱貫因果設計", "purpose_en": "Estimate a treatment-related change relative to the contemporaneous change in a comparison group.", "purpose_zh": "相對對照組同期變化，估計與處理相關的結果改變。", "scenario_en": "You want to compare booking changes after hygiene complaints with changes after other low-star reviews.", "scenario_zh": "想比較衛生負評與其他低星評論出現後，訂位下降是否不同。", "definition_en": "In a two-group before/after comparison, \\(\\delta=(\\bar Y_{T,\\mathrm{post}}-\\bar Y_{T,\\mathrm{pre}})-(\\bar Y_{C,\\mathrm{post}}-\\bar Y_{C,\\mathrm{pre}})\\). A regression expresses this through a treatment-group × post interaction; event-time interactions can show a dynamic comparison.", "definition_zh": "兩組事前／事後比較為 \\(\\delta=(\\bar Y_{T,\\mathrm{post}}-\\bar Y_{T,\\mathrm{pre}})-(\\bar Y_{C,\\mathrm{post}}-\\bar Y_{C,\\mathrm{pre}})\\)。迴歸以處理組×事後交互作用表示，也可用事件時間交互作用呈現動態比較。", "inputs_en": "Treated and comparison observations, a treatment/event definition, comparable pre/post outcomes, group identifiers and controls.", "inputs_zh": "處理與對照觀察、處理／事件定義、可比較的事前事後結果、群組識別碼與控制變數。", "outputs_en": "A relative before/after effect or event-time path, conditional on the design and identifying assumptions.", "outputs_zh": "在設計與識別假設下的相對前後效果，或事件時間路徑。", "assumptions_en": "Without treatment, groups must have comparable outcome trends under the conditioning set. Anticipation, differing concurrent shocks, changing composition or spillovers can undermine this comparison. Similar pre-trends do not prove the counterfactual trend assumption.", "assumptions_zh": "在沒有處理時，兩組須在控制條件下具有可比較的結果趨勢。預期效果、不同的同期衝擊、組成改變或外溢都可能破壞比較；事前走勢相似不能證明反事實平行趨勢。", "diagnostics_en": "Suggested checks: differential pre-event paths, composition and overlap of comparison events, sensitivity to event definitions and windows, and clarity about the estimand's comparison group.", "diagnostics_zh": "建議檢查：事件前差異路徑、對照事件組成與重疊、對事件定義及窗口的敏感度，以及估計量所對應的比較組。", "variants": [{"id": "fz2026-hygiene-content-did", "design_id": "fz2026", "title_en": "Unusually bad hygiene content versus other low-star events", "title_zh": "特別差的衛生內容對照其他低星評論事件", "implementation_en": "The handout's Eq. (5) adds bad-hygiene-event × relative-day interactions to the event-study specification. Treated events are the worst-20% hygiene events; controls are other 1–3 star review events, not restaurants receiving no review.", "implementation_zh": "手稿式(5)在事件研究中加入特別差衛生事件×相對日交互作用。處理組為最差20%衛生事件；對照組是其他1–3星評論事件，不是完全沒有評論的餐廳。", "tuning_en": "Retain the ±15-day framework, event-day reference and event-study controls; Table 3 pools post-event days into After. Exact event eligibility and overlap handling are not fully reproduced in the handout.", "tuning_zh": "沿用±15天架構、事件日基準及事件研究控制；Table 3將事後日聚合為After。手稿未完整重現事件資格與重疊處理。", "interpretation_en": "The handout reports Table 3 column 2: N = 2,644,039, ordinary low-star \\(\\widehat\\beta_{\\mathrm{After}}=-0.002\\) (SE 0.0005), and bad-hygiene × After coefficient \\(\\widehat\\gamma=-0.003\\) (SE 0.0009). The latter is an additional 0.3 percentage-point decline, not the total effect of a review. It reports the authors' \\(\\frac{0.0032}{0.0055}\\approx58\\%\\) interpretation.", "interpretation_zh": "手稿轉述Table 3規格2：N＝2,644,039，一般低星\\(\\widehat\\beta_{\\mathrm{After}}=-0.002\\)（SE 0.0005），特別差衛生×After係數 \\(\\widehat\\gamma=-0.003\\)（SE 0.0009）。後者是額外下降0.3個百分點，不是一篇評論的總效果；手稿另轉述作者以\\(\\frac{0.0032}{0.0055}\\approx58\\%\\)解讀。", "limitations_en": "The comparison isolates a difference between kinds of negative-review events only under parallel-trend and timing assumptions. Text-derived event selection and unobserved differences between event types remain identification issues, not solved by predictive AUC.", "limitations_zh": "只有在平行趨勢與時點假設下，這個比較才識別不同負評事件的差異。文字衍生的事件選擇與事件類型間不可觀察差異仍是識別問題，不能靠預測AUC解決。", "source_locator_en": "Authored EN/ZH handouts, §3.2, method (9), referring to Eq. (5) and Table 3 column 2; figures are handout-reported.", "source_locator_zh": "使用者英／中手稿，§3.2 方法(9)，指向式(5)與Table 3規格2；數字僅由手稿轉述。"}]}, {"id": "fixed_effects_interaction", "title_en": "Interaction regression with high-dimensional fixed effects", "title_zh": "交互作用迴歸與高維固定效果", "category_en": "Panel regression and comparative effects", "category_zh": "追蹤資料迴歸與比較效果", "purpose_en": "Compare treatment associations across outcome dimensions while absorbing shared observation-level factors and persistent entity-dimension differences.", "purpose_zh": "吸收同次觀察的共同因素及持續的實體×面向差異，再比較不同結果面向的處理關聯。", "scenario_en": "Within inspections, you want to compare hygiene-dimension gaps between recently reviewed restaurants and other restaurants.", "scenario_zh": "想在同一次檢查內，比較有近期評論餐廳在不同衛生面向的差距。", "definition_en": "A dimension-specific specification can take the form \\(V_{vit}=\\rho_{it}+\\kappa_{iv}+\\gamma R_{it}I_v+\\varepsilon_{vit}\\). Observation fixed effects \\(\\rho_{it}\\) remove common factors; entity-dimension effects \\(\\kappa_{iv}\\) remove persistent dimension differences. The interaction coefficient is a relative contrast.", "definition_zh": "面向別規格可寫成 \\(V_{vit}=\\rho_{it}+\\kappa_{iv}+\\gamma R_{it}I_v+\\varepsilon_{vit}\\)。觀察固定效果 \\(\\rho_{it}\\) 吸收共同因素，實體×面向效果 \\(\\kappa_{iv}\\) 吸收持續差異；交互係數是相對比較。", "inputs_en": "Repeated entity-observation-dimension outcomes, an observation-level exposure, a dimension indicator and fixed-effect identifiers.", "inputs_zh": "重複的實體×觀察×面向結果、觀察層級暴露、面向指標及固定效果識別碼。", "outputs_en": "An interaction coefficient measuring a difference in dimension gaps, plus uncertainty and specification comparisons.", "outputs_zh": "衡量不同面向差距之差的交互係數、不確定性與規格比較。", "assumptions_en": "The interaction must retain variation after fixed effects. Fixed effects remove only the variation they span; remaining endogenous exposure or time-varying dimension-specific confounding prevents an automatic causal interpretation.", "assumptions_zh": "交互項在扣除固定效果後須仍有變異。固定效果只消除其涵蓋的變動；若暴露仍內生或存在隨時間改變的面向別混淆，不能自動作因果解讀。", "diagnostics_en": "Suggested checks: residualized variation and collinearity, which main effects are absorbed, changes across fixed-effect specifications and plausible remaining dimension-specific shocks.", "diagnostics_zh": "建議檢查：殘差化後變異與共線性、哪些主效果被吸收、不同固定效果規格的變化，以及可能殘留的面向別衝擊。", "variants": [{"id": "fz2026-supply-fe-interaction", "design_id": "fz2026", "title_en": "Recent reviews and relative hygiene-violation gaps", "title_zh": "近期評論與相對衛生違規差距", "implementation_en": "The unit is restaurant × initial inspection × violation code. \\(V_{vit}\\) indicates a detected violation, \\(R_{it}\\) indicates a review in the previous 90 days, and \\(I_v\\) marks one of the five informative violations. The handout compares no fixed effects; inspection plus violation-code effects; and inspection plus restaurant × violation effects.", "implementation_zh": "單位為餐廳×初次檢查×違規代碼。\\(V_{vit}\\)表示查出違規，\\(R_{it}\\)表示前90天有評論，\\(I_v\\)標示五項informative違規。手稿比較無固定效果、檢查＋違規代碼效果、檢查＋餐廳×違規效果。", "tuning_en": "These are specification choices rather than predictive hyperparameter tuning. The strongest specification absorbs common inspection factors and persistent restaurant-dimension differences.", "tuning_zh": "這是規格選擇，不是預測超參數調整。最嚴格規格吸收共同檢查因素及持續的餐廳×面向差異。", "interpretation_en": "The handout reports OLS interactions −0.005, −0.005 and −0.002 (SE 0.001 each), with the strictest estimate insignificant. A negative interaction means reviewed restaurants have a smaller informative-versus-other violation gap than other restaurants; it does not establish that other dimensions did not improve.", "interpretation_zh": "手稿轉述OLS交互係數為−0.005、−0.005、−0.002（SE皆0.001），最嚴格估計不顯著。負交互項表示有評論餐廳的informative相對其他面向違規差距較小，不能推論其他面向沒有改善。", "limitations_en": "\\(R_{it}\\) may be endogenous. Inspection fixed effects absorb its inspection-level main effect, so the estimable interaction contrast must be distinguished from a standalone review effect. Fixed effects alone do not resolve this endogeneity.", "limitations_zh": "\\(R_{it}\\)可能內生。檢查固定效果吸收其檢查層級主效果，因此可估計的交互對比須與單獨評論效果區分；固定效果本身無法解決這項內生性。", "source_locator_en": "Authored EN/ZH handouts, §1 observation-unit table and §3.2 method (10), referring to supply Eq. (6) and Table 4; not independently verified.", "source_locator_zh": "使用者英／中手稿，§1觀察單位表與§3.2方法(10)，指向供給式(6)及Table 4；尚未獨立核對。"}]}, {"id": "instrumental_variables_2sls", "title_en": "Instrumental variables and two-stage least squares", "title_zh": "工具變數與兩階段最小平方法（IV／2SLS）", "category_en": "Causal identification with endogenous regressors", "category_zh": "內生解釋變數的因果識別", "purpose_en": "Use externally induced variation to estimate a structural relationship when a regressor is endogenous.", "purpose_zh": "當解釋變數內生時，利用外生來源引發的變異估計結構關係。", "scenario_en": "Hygiene and reviews may affect each other; you seek an outside source that changes review exposure without directly changing hygiene.", "scenario_zh": "衛生與評論可能互相影響，你想找只改變評論機會的外生來源。", "definition_en": "First project the endogenous regressor on instruments and controls: \\(D=\\pi Z+\\boldsymbol W^\\top\\boldsymbol\\pi_W+u\\). The second stage uses its fitted component: \\(Y=\\theta\\widehat D+\\boldsymbol W^\\top\\boldsymbol d+\\varepsilon\\). With several endogenous terms, instruments must identify the relevant system. Here IV means instrumental variables, unlike the independent-variable label in data dictionaries.", "definition_zh": "第一階段 \\(D=\\pi Z+\\boldsymbol W^\\top\\boldsymbol\\pi_W+u\\) 將內生解釋變數投影至工具與控制，第二階段 \\(Y=\\theta\\widehat D+\\boldsymbol W^\\top\\boldsymbol d+\\varepsilon\\) 以擬合部分及相同控制解釋結果。多個內生項時，工具集合須能識別相關系統。此處IV指工具變數，與資料字典中的IV（解釋變數）不同。", "inputs_en": "Outcome, endogenous regressors, proposed instruments, controls and fixed effects, with an identification argument.", "inputs_zh": "結果、內生解釋變數、候選工具、控制與固定效果，以及識別論證。", "outputs_en": "First-stage estimates and diagnostics, and a second-stage coefficient whose causal interpretation depends on instrument validity and the structural assumptions.", "outputs_zh": "第一階段估計與診斷，以及因果解釋取決於工具有效性與結構假設的第二階段係數。", "assumptions_en": "Instruments must predict the endogenous terms after controls and satisfy the required rank condition. They must be exogenous to the structural error and affect the outcome only through the modeled endogenous channel. Strong first stages do not establish exclusion.", "assumptions_zh": "控制後工具須能預測內生項並滿足所需秩條件；工具須與結構誤差外生，且只透過模型中的內生管道影響結果。第一階段強不代表排除限制成立。", "diagnostics_en": "Suggested checks: the full first-stage system, weak-instrument diagnostics appropriate for clustering and multiple endogenous terms, the variation contributed by each instrument, and substantive threats to exclusion.", "diagnostics_zh": "建議檢查：完整第一階段系統、適合群聚與多內生項的弱工具診斷、各工具貢獻的變異，以及實質的排除限制威脅。", "variants": [{"id": "fz2026-reviewer-activity-iv", "design_id": "fz2026", "title_en": "Old reviewers' other Yelp activity as an instrument", "title_zh": "以舊評論者的其他Yelp活動作工具", "implementation_en": "The handout defines old reviewers as people who reviewed the restaurant more than 90 days before an inspection. \\(P_{it}\\) is their mean number of other Yelp reviews and \\(Z_{it}=\\log(1+P_{it})\\). Its overview lists \\(Z_{it}\\), \\(Z_{it}I_v\\), a no-prior-reviewer indicator and that indicator's interaction, for the endogenous review terms \\(R_{it}\\) and \\(R_{it}I_v\\).", "implementation_zh": "手稿將舊評論者定義為檢查90天以前已評論過該餐廳的人，\\(P_{it}\\)為其平均其他Yelp評論數，\\(Z_{it}=\\log(1+P_{it})\\)。總覽列出\\(Z_{it}\\)、\\(Z_{it}I_v\\)、無舊評論者指標及其交互，對應內生評論項\\(R_{it}\\)與\\(R_{it}I_v\\)。", "tuning_en": "The \\(\\log(1+P)\\) transformation and instrument set are design choices. The example of reviewer counts 8 and 0, giving \\(P=4\\) and \\(Z\\approx1.609\\), is illustrative. Exact activity windows and the fixed-effect-residualized first-stage matrix are not fully reproduced.", "tuning_zh": "\\(\\log(1+P)\\)轉換與工具集合屬設計選擇。評論數8與0、得到\\(P=4\\)及\\(Z\\approx1.609\\)是示意例子。手稿未完整重現活動時間窗與扣除固定效果後的第一階段矩陣。", "interpretation_en": "The handout reports Table 4 IV coefficients from −0.012 to −0.015: a 1.2–1.5 percentage-point smaller relative violation gap, about 7–8.5% of a 0.176 baseline. It says Appendix Table A7 supports relevance, but notes a −0.494 no-prior-reviewer coefficient and an insignificant −0.002 \\(Z_{it}I_v\\) coefficient in the strictest first stage.", "interpretation_zh": "手稿轉述Table 4工具變數係數−0.012至−0.015，表示相對違規差距縮小1.2–1.5個百分點，約為0.176基準的7–8.5%。手稿稱附錄Table A7支持相關性，但指出最嚴格第一階段的無舊評論者係數為−0.494，\\(Z_{it}I_v\\)係數−0.002不顯著。", "limitations_en": "The handout reports a Kleibergen–Paap statistic without reproducing its numeric value. It cautions that \\(F\u003e10\\) or Stock–Yogo comparisons are only rough guides in this clustered, multi-endogenous setting. The causal claim rests on exclusion, particularly given the role of the no-prior-reviewer indicator; significance alone does not validate it.", "limitations_zh": "手稿提到Kleibergen–Paap統計量，但未列確切數值，並提醒此群聚、多內生項情境下\\(F\u003e10\\)或Stock–Yogo比較僅能作粗略參考。尤其無舊評論者指標扮演重要角色時，因果結論仍依賴排除限制，不能以顯著性驗證。", "source_locator_en": "Authored EN/ZH handouts, §1 instrument table and §3.2 method (11), referring to Table 4 and Appendix Table A7; no original-article or first-stage replication.", "source_locator_zh": "使用者英／中手稿，§1工具表與§3.2方法(11)，指向Table 4與附錄Table A7；尚未核對原論文或重現第一階段。"}]}], "designs": [{"id": "fz2026", "reference_text": "Farronato, C., \u0026 Zervas, G. (2026). Consumer Reviews and Regulation: Evidence from New York City Restaurants. Marketing Science, 45(4), 752–772.", "reference_url": "https://doi.org/10.1287/mksc.2023.0088", "title_en": "Farronato \u0026 Zervas (2026): review information and restaurant hygiene", "title_zh": "Farronato與Zervas（2026）：評論資訊與餐廳衛生", "study_type_en": "Predictive text measurement followed by separate demand-side and supply-side causal analyses", "study_type_zh": "先以文字預測建立測量，再分別進行需求端與供給端因果分析", "question_en": "When restaurants already display government hygiene grades, do Yelp reviews add information about specific violations, change demand, and encourage hygiene improvement?", "question_zh": "當餐廳已張貼官方衛生等級，Yelp評論是否仍提供特定違規的增額資訊、改變需求，並促使衛生改善？", "source_note_en": "Seeded only from the user's authored English and Traditional Chinese methods handouts. 'Reported' numbers mean figures attributed to the article by those handouts; the original journal article and code have not been independently checked here. Pipeline examples marked illustrative are not empirical estimates. General diagnostics are proposed learning checks, not claims that the article performed them.", "source_note_zh": "僅依使用者撰寫的英文與繁體中文方法手稿建立。『報告』數字指手稿歸於論文的數值，本次尚未獨立核對期刊原文與程式；標為示意的管線例子不是實證估計。一般診斷是建議學習檢查，不宣稱論文已執行。", "handout_en": "\u003cp\u003e\u003cspan\u003e\u003cstrong\u003eFarronato \u0026amp; Zervas (2026): Methods Summary\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch2 id=\"fz2026-en-research-question-and-structure\"\u003e1. Research question and structure\u003c/h2\u003e\n\u003cp\u003eNYC restaurants are already inspected by the Department of Health (DoH) and must post an A/B/C grade. Do Yelp reviews add hygiene information beyond that? The paper has two parts of a different nature:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePart 1 is prediction\u003c/strong\u003e: can review text predict a specific violation? The target is out-of-sample predictive power (AUC), with no causal claim. The results identify the five violations on which reviews are informative and are used to build negative hygiene events.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePart 2 is causal inference\u003c/strong\u003e: does review information lower demand (demand side), and does being monitored by reviews make restaurants improve hygiene (supply side)? Demand is identified by event timing and comparison events, and supply by fixed effects and an instrumental variable.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cdiv class=\"handout-table-scroll\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth style=\"text-align: left;\"\u003eAnalysis\u003c/th\u003e\n\u003cth style=\"text-align: left;\"\u003eType\u003c/th\u003e\n\u003cth style=\"t e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eNone (review timing assumed exogenous)\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eLPM with restaurant \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003e×\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\times\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e event FE\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"text-align: left;\"\u003eSupply (Sec. 5.2, Eq. 6)\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eCausal\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eRestaurant \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003e×\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\times\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e initial inspection \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003e×\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\times\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e violation code\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e(1) \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eR_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e: reviewed in prior 90 days\u003cbr /\u003e\n(2) \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eI_v\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e: informative violation\u003cbr /\u003e\n(3) \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eR_{it}I_v\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e (key coefficient \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eγ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\gamma\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e)\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cstrong\u003eBinary\u003c/strong\u003e (yes/no): \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eV\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eV_{vit}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, e.g., 02B found \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=1\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, not found \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e=0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eZ_{it}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eZ_{it}I_v\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, no-prior-reviewer dummy and its interaction with \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmi\u003ev\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003eI_v\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/td\u003e\n\u003ctd style=\"text-align: left;\"\u003eOLS, IV with inspection and restaurant \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003e×\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\times\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e violation FE\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"fz2026-en-data-availability\"\u003e2. Data availability\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eNYC DoH inspection records\u003c/strong\u003e: request through NYC OpenRecords under New York State FOIL (the most recent three years can be downloaded directly from NYC Open Data).\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eYelp reviews\u003c/strong\u003e: public reviews on the Yelp website.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eOpenTable availability\u003c/strong\u003e: query the OpenTable website every day and record the results yourself.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"fz2026-en-methods\"\u003e3. Methods\u003c/h2\u003e\n\u003ch3 id=\"fz2026-en-pipeline-inputs-outputs-and-order-of-each-method-each-steps-output-is-the-next-steps-input\"\u003ePipeline: inputs, outputs, and order of each method (each step’s output is the next step’s input)\u003c/h3\u003e\n\u003cdiv class=\"handout-pipeline-slot\"\u003e\u003c/div\u003e\n\u003cp\u003e\u003cspan\u003eNote: numbers marked “paper” are reported in the article, and all other numbers are illustrative examples of inputs and outputs.\u003c/span\u003e\u003c/p\u003e\n\u003ch3 id=\"fz2026-en-prediction-turning-review-text-into-violation-predictions\"\u003e3.1 Prediction: turning review text into violation predictions\u003c/h3\u003e\n\u003ch4 id=\"fz2026-en-bag-of-words\"\u003e(1) Bag-of-words\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def\"\u003eDef\u003c/h5\u003e\n\u003cp\u003eTreats text as a list of how often each word appears, ignoring word order: document \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ed\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e becomes a count vector \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒄\u003c/mi\u003e\u003cmi\u003ed\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmi\u003e…\u003c/mi\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmi\u003ep\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo\u003e∈\u003c/mo\u003e\u003cmsup\u003e\u003cmi mathvariant=\"double-struck\"\u003eℕ\u003c/mi\u003e\u003cmi\u003ep\u003c/mi\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\boldsymbol c_d=(c_{d1},\\ldots,c_{dp})\\in\\mathbb N^p\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, where \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003ec_{dj}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e counts word \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ej\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ej\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e and word order is discarded.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eLarge text corpora where content matters more than word order.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003ePool reviews from about 90 days before each initial inspection, remove punctuation and numbers, Porter-stem\u003ca href=\"#fz2026-en-fn1\" class=\"footnote-ref\" id=\"fz2026-en-fnref1\" role=\"doc-noteref\"\u003e\u003csup\u003e1\u003c/sup\u003e\u003c/a\u003e, drop stems in \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e\u0026lt;\u003c/mo\u003e\u003cmn\u003e5\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\u0026lt;5\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e or \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmn\u003e50\u003c/mn\u003e\u003cmi\u003e%\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\u0026gt;50\\%\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e of reviews, leaving 12,176 stems, and split by rating (1–2, 3, 4–5 stars): \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e12\u003c/mn\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmn\u003e176\u003c/mn\u003e\u003cmo\u003e×\u003c/mo\u003e\u003cmn\u003e3\u003c/mn\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e36\u003c/mn\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmn\u003e528\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e12{,}176\\times3=36{,}528\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e features.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e“Clean” in low- and high-star reviews are different features. As of 2016 about 40% of restaurants have no recent reviews, hence no text signal.\u003c/p\u003e\n\u003ch4 id=\"fz2026-en-mnir-multinomial-inverse-regression-and-dmr-distributed-multinomial-regression\"\u003e(2) MNIR (multinomial inverse regression) and DMR (distributed multinomial regression)\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def-mnir\"\u003eDef (MNIR)\u003c/h5\u003e\n\u003cp\u003eAsks the reverse question, how word use changes when a violation is present, with a multinomial model of word probabilities: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒄\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e∣\u003c/mo\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒗\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e∼\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003eMN\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒒\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\boldsymbol c_i\\mid\\boldsymbol v_i\\sim\\operatorname{MN}(m_i,\\boldsymbol q_i)\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eq\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003ee\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/msup\u003e\u003cmi\u003e/\u003c/mi\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmsup\u003e\u003cmi\u003ee\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eq_{ij}=e^{\\eta_{ij}}/\\sum_k e^{\\eta_{ik}}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003ea\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝝓\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003cmi\u003e⊤\u003c/mi\u003e\u003c/msubsup\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒗\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒃\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003cmi\u003e⊤\u003c/mi\u003e\u003c/msubsup\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒘\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\eta_{ij}=a_j+\\boldsymbol\\phi_j^{\\top}\\boldsymbol v_i+\\boldsymbol b_j^{\\top}\\boldsymbol w_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, with \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003em_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e the total word count. All words share the denominator, so all coefficients are estimated jointly.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-def-dmr\"\u003eDef (DMR)\u003c/h5\u003e\n\u003cp\u003eSplits MNIR into one Poisson regression per word so that huge vocabularies can be fit in parallel: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e∼\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003ePois\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmo minsize=\"120%\" maxsize=\"120%\" stretchy=\"true\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsup\u003e\u003cmi\u003ee\u003c/mi\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eμ\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eη\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/msup\u003e\u003cmo minsize=\"120%\" maxsize=\"120%\" stretchy=\"true\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003ec_{ij}\\sim\\operatorname{Pois}\\big(e^{\\mu_i+\\eta_{ij}}\\big)\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, with \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eμ\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmsub\u003e\u003cmi\u003em\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\mu_i=\\log m_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e replacing the shared denominator. Given the total, independent Poissons are multinomial, so words are fit separately in parallel (approximating the MNIR MLE).\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use-1\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eHuge vocabularies, to learn how text shifts with a known label and build a low-dimensional signal (DMR when MNIR is too large to fit).\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use-1\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003eMNIR estimated by DMR, one Poisson regression per word. The paper’s Eq. (2) also has a rating-group main effect \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eα\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003er\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\alpha_jr_j\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e and a word offset \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eμ\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003elog\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmsub\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ei\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\mu_j=\\log\\sum_ic_{ij}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e. \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒗\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\boldsymbol v_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e: 20 violation indicators (interacted with star groups), controls: year-month, cuisine, zip code, chain.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read-1\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eϕ\u003c/mi\u003e\u003cmrow\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/mrow\u003e\u003c/msub\u003e\u003cmo\u003e\u0026gt;\u003c/mo\u003e\u003cmn\u003e0\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\phi_{vj}\u0026gt;0\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e: word \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ej\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ej\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e is more frequent when violation \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ev\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ev\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e occurs. This is a conditional association, and modeling text given violations implies no causality.\u003c/p\u003e\n\u003ch4 id=\"fz2026-en-lasso\"\u003e(3) LASSO\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def-1\"\u003eDef\u003c/h5\u003e\n\u003cp\u003eAdds a penalty on the sum of absolute coefficients to a regression’s loss, which prevents overfitting and sets unimportant coefficients exactly to 0: \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmover\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜷\u003c/mi\u003e\u003cmo accent=\"true\"\u003ê\u003c/mo\u003e\u003c/mover\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003earg\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmi mathvariant=\"normal\"\u003emin\u003c/mi\u003e\u003cmo\u003e\u0026#8289;\u003c/mo\u003e\u003c/mrow\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜷\u003c/mi\u003e\u003c/msub\u003e\u003cmspace width=\"0.222em\"\u003e\u003c/mspace\u003e\u003cmi mathvariant=\"script\"\u003eℒ\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝜷\u003c/mi\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmi\u003eλ\u003c/mi\u003e\u003cmsub\u003e\u003cmo\u003e∑\u003c/mo\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e|\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e|\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\widehat{\\boldsymbol\\beta}=\\arg\\min_{\\boldsymbol\\beta}\\ \\mathcal L(\\boldsymbol\\beta)+\\lambda\\sum_k\\lvert\\beta_k\\rvert\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, with a larger \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eλ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\lambda\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e meaning a heavier penalty.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use-2\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eMany more coefficients than real signals, when sparsity and protection against overfitting are needed.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use-2\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003eEq. (3) adds \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eλ\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"prefix\"\u003e(\u003c/mo\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmo stretchy=\"true\" form=\"prefix\"\u003e‖\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eα\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"true\" form=\"postfix\"\u003e‖\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmo stretchy=\"true\" form=\"prefix\"\u003e‖\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"true\" form=\"postfix\"\u003e‖\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmrow\u003e\u003cmo stretchy=\"true\" form=\"prefix\"\u003e‖\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eϕ\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cmo stretchy=\"true\" form=\"postfix\"\u003e‖\u003c/mo\u003e\u003c/mrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003cmo stretchy=\"false\" form=\"postfix\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\lambda_j(\\lVert\\alpha_j\\rVert_1+\\lVert\\beta_j\\rVert_1+\\lVert\\phi_j\\rVert_1)\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e to each word’s Poisson loss (the intercept gets only a small penalty, see the paper’s endnote 12), and each \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi\u003eλ\u003c/mi\u003e\u003cmi\u003ej\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\lambda_j\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e is chosen by restaurant-grouped 5-fold CV to minimize held-out loss (error on the fold not used for estimation).\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-read-2\"\u003eHow to read\u003c/h5\u003e\n\u003cp\u003eZero means “not kept under this model and penalty”, not a true zero effect or a \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003ep\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e-value. Nonzero coefficients are shrunk.\u003c/p\u003e\n\u003ch4 id=\"fz2026-en-sr-projection-sufficient-reduction\"\u003e(4) SR projection (sufficient reduction)\u003c/h4\u003e\n\u003ch5 id=\"fz2026-en-def-2\"\u003eDef\u003c/h5\u003e\n\u003cp\u003eCompresses tens of thousands of word counts into a few scores while keeping the information relevant to the target: find low-dimensional \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003cannotation encoding=\"application/x-tex\"\u003eZ\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e with \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eY\u003c/mi\u003e\u003cmo\u003e⟂\u003c/mo\u003e\u003cmi\u003eX\u003c/mi\u003e\u003cmo\u003e∣\u003c/mo\u003e\u003cmi\u003eZ\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003eY\\perp X\\mid Z\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e. In MNIR, \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒛\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmi mathvariant=\"normal\"\u003eΦ\u003c/mi\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒄\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\boldsymbol z_i=\\Phi\\boldsymbol c_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e is sufficient for \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmsub\u003e\u003cmi mathvariant=\"bold-italic\"\u003e𝒗\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\boldsymbol v_i\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e given document length and controls.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-when-to-use-3\"\u003eWhen to use\u003c/h5\u003e\n\u003cp\u003eTo compress high-dimensional text into a few target-specific scores for a prediction model.\u003c/p\u003e\n\u003ch5 id=\"fz2026-en-how-to-use-3\"\u003eHow to use\u003c/h5\u003e\n\u003cp\u003e\u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmover\u003e\u003cmi mathvariant=\"normal\"\u003eΦ\u003c/mi\u003e\u003cmo accent=\"true\"\u003ê\u003c/mo\u003e\u003c/mover\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\widehat\\Phi\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e is \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmn\u003e20\u003c/mn\u003e\u003cmo\u003e×\u003c/mo\u003e\u003cmi\u003ep\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e20\\times p\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e, projecting the negative reviews from the 90 days before the inspection onto 20 scores \u003cmath display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003ez\u003c/mi\u003e\u003cmrow\u003e
