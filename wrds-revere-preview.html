    if (dragging && (!key || dragging.record.key === key)) finishDrag();
    records.forEach(record => {
      if (!key || record.key === key) restoreLayout(record);
    });
    if (key) savedWidths.delete(key); else savedWidths.clear();
    persist();
    notifyLayout();
  }
  function finishDrag(cancel = false) {
    if (!dragging) return;
    const current = dragging;
    dragging = null;
    current.handle.classList.remove('is-dragging');
    document.body.classList.remove('is-resizing-column');
    if (current.handle.hasPointerCapture(current.pointerId)) current.handle.releasePointerCapture(current.pointerId);
    if (cancel === true) {
      if (current.previousWidths) setWidths(current.record, current.previousWidths);
      else {
        restoreLayout(current.record);
        savedWidths.delete(current.record.key);
        notifyLayout();
      }
    }
    persist();
    schedule();
  }
  function onPointerDown(event) {
    if (event.button !== 0 || !event.isPrimary || dragging) return;
    const handle = event.currentTarget;
    const record = records.get(handle._resizeTable);
    if (!record || handle.hidden) return;
    event.preventDefault();
    handle.focus({ preventScroll: true });
    dragging = {
      record, handle, pointerId: event.pointerId, startX: event.clientX,
      index: Number(handle.dataset.columnIndex), widths: widthsOf(record),
      previousWidths: record.widths ? [...record.widths] : null
    };
    handle.classList.add('is-dragging');
    document.body.classList.add('is-resizing-column');
    handle.setPointerCapture(event.pointerId);
  }
  function onPointerMove(event) {
    if (!dragging || event.pointerId !== dragging.pointerId) return;
    const widths = [...dragging.widths];
    widths[dragging.index] = clamp(widths[dragging.index] + event.clientX - dragging.startX);
    setWidths(dragging.record, widths);
  }
  function onPointerUp(event) {
    if (dragging?.pointerId === event.pointerId) finishDrag();
  }
  function onPointerCancel(event) {
    if (dragging?.pointerId === event.pointerId) finishDrag(true);
  }
  function onKeyDown(event) {
    if (event.key === 'Escape' && dragging) { event.preventDefault(); finishDrag(true); return; }
    const handle = event.currentTarget;
    const record = records.get(handle._resizeTable);
    if (!record) return;
    const widths = widthsOf(record);
    const index = Number(handle.dataset.columnIndex);
    const step = event.shiftKey ? 48 : 16;
    if (event.key === 'ArrowLeft') widths[index] -= step;
    else if (event.key === 'ArrowRight') widths[index] += step;
    else if (event.key === 'Home') widths[index] = MIN_WIDTH;
    else if (event.key === 'End') widths[index] = MAX_WIDTH;
    else return;
    event.preventDefault();
    setWidths(record, widths);
    persist();
  }
  function onDoubleClick(event) { reset(event.currentTarget.dataset.tableId); }
  function removeRecord(record) {
    if (dragging?.record === record) finishDrag();
    record.wrapper.removeEventListener('scroll', schedule);
    record.handles.forEach(handle => {
      handle.removeEventListener('pointerdown', onPointerDown);
      handle.removeEventListener('pointermove', onPointerMove);
      handle.removeEventListener('pointerup', onPointerUp);
      handle.removeEventListener('pointercancel', onPointerCancel);
      handle.removeEventListener('lostpointercapture', onPointerUp);
      handle.removeEventListener('keydown', onKeyDown);
      handle.removeEventListener('dblclick', onDoubleClick);
      handle.remove();
    });
  }
  function reconcile() {
    const tables = new Set(content.querySelectorAll('.table-scroll > .column-table'));
    records.forEach((record, table) => {
      if (!tables.has(table)) { removeRecord(record); records.delete(table); }
    });
    tables.forEach(table => {
      if (records.has(table)) return;
      const headers = [...(table.tHead?.rows[0]?.cells || [])];
      if (!headers.length) return;
      const wrapper = table.closest('.table-scroll');
      const key = table.closest('[data-table-id]')?.dataset.tableId || `table-${records.size}`;
      if (!table.id) {
        do { table.id = `research-resizable-table-${++sequence}`; } while (document.querySelectorAll(`#${table.id}`).length > 1);
      }
      const record = { table, wrapper, key, headers, handles: [], widths: null, colgroup: null, originalWidth: table.style.width, originalMinWidth: table.style.minWidth };
      records.set(table, record);
      headers.forEach((header, index) => {
        const handle = document.createElement('div');
        handle.className = 'column-resize-handle';
        handle.hidden = true;
        handle.tabIndex = 0;
        handle.dataset.tableId = key;
        handle.dataset.columnIndex = String(index);
        handle._resizeTable = table;
        handle.setAttribute('role', 'separator');
        handle.setAttribute('aria-orientation', 'vertical');
        handle.setAttribute('aria-controls', table.id);
        handle.setAttribute('aria-label', `調整「${sourceText(header)}」欄寬`);
        handle.setAttribute('aria-valuemin', String(MIN_WIDTH));
        handle.setAttribute('aria-valuemax', String(MAX_WIDTH));
        handle.title = '拖曳調整欄寬；左右鍵微調，Home／End 最小／最大；連按兩下還原表格';
        handle.addEventListener('pointerdown', onPointerDown);
        handle.addEventListener('pointermove', onPointerMove);
        handle.addEventListener('pointerup', onPointerUp);
        handle.addEventListener('pointercancel', onPointerCancel);
        handle.addEventListener('lostpointercapture', onPointerUp);
        handle.addEventListener('keydown', onKeyDown);
        handle.addEventListener('dblclick', onDoubleClick);
        layer.append(handle);
        record.handles.push(handle);
      });
      wrapper.addEventListener('scroll', schedule, { passive: true });
      const saved = savedWidths.get(key);
      if (saved?.length === headers.length) setWidths(record, saved, false);
    });
    if (resizeObserver) {
      const targets = new Set([content, document.body]);
      const topbar = document.querySelector('.topbar');
      if (topbar) targets.add(topbar);
      records.forEach(record => { targets.add(record.table); targets.add(record.wrapper); });
      observed.forEach(element => {
        if (!targets.has(element)) { resizeObserver.unobserve(element); observed.delete(element); }
      });
      targets.forEach(element => {
        if (!observed.has(element)) { resizeObserver.observe(element); observed.add(element); }
      });
    }
    mountControls();
    needsReconcile = false;
  }
  function isVisible(table) {
    if (!table.isConnected || !table.getClientRects().length || table.closest('[hidden]')) return false;
    for (let parent = table.parentElement; parent; parent = parent.parentElement) {
      if (parent.tagName === 'DETAILS' && !parent.open) return false;
    }
    return getComputedStyle(table).visibility !== 'hidden';
  }
  function update() {
    frame = 0;
    if (destroyed) return;
    if (needsReconcile) reconcile();
    syncControls();
    const viewLeft = viewport?.offsetLeft || 0;
    const viewTop = viewport?.offsetTop || 0;
    const viewRight = Math.min(viewLeft + (viewport?.width || window.innerWidth), document.documentElement.clientWidth);
    let viewBottom = viewTop + (viewport?.height || window.innerHeight);
    const topbar = document.querySelector('.topbar')?.getBoundingClientRect();
    const visibleTop = topbar && topbar.top <= viewTop + 1 && topbar.bottom > viewTop ? topbar.bottom : viewTop;
    const dock = document.querySelector('.table-scroll-dock:not([hidden])');
    if (dock) viewBottom = Math.min(viewBottom, dock.getBoundingClientRect().top);
    records.forEach(record => {
      if (!isVisible(record.table)) {
        if (dragging?.record === record) finishDrag();
        record.handles.forEach(handle => { handle.hidden = true; });
        return;
      }
      const rect = record.table.getBoundingClientRect();
      const wrapRect = record.wrapper.getBoundingClientRect();
      const left = Math.max(viewLeft, wrapRect.left + record.wrapper.clientLeft);
      const right = Math.min(viewRight, wrapRect.left + record.wrapper.clientLeft + record.wrapper.clientWidth);
      const top = Math.max(visibleTop, rect.top, wrapRect.top);
      const bottom = Math.min(viewBottom, rect.bottom, wrapRect.top + record.wrapper.clientHeight);
      record.headers.forEach((header, index) => {
        const handle = record.handles[index];
        const headerRect = header.getBoundingClientRect();
        const active = dragging?.handle === handle;
        const inView = headerRect.right >= left + 4 && headerRect.right <= right + 1;
        handle.hidden = bottom - top < 12 || right - left < 20 || (!inView && !active);
        if (handle.hidden) return;
        const x = active ? Math.max(left + 5, Math.min(right - 5, headerRect.right)) : Math.min(right - 5, headerRect.right);
        writeStyle(handle, 'left', `${x - 5}px`);
        writeStyle(handle, 'top', `${top}px`);
        writeStyle(handle, 'height', `${bottom - top}px`);
        handle.setAttribute('aria-valuenow', String(Math.round(headerRect.width)));
      });
    });
  }
  function schedule() {
    if (!destroyed && !frame) frame = requestAnimationFrame(update);
  }
  const mutationObserver = new MutationObserver(changes => {
    if (changes.some(change => change.type === 'childList')) needsReconcile = true;
    schedule();
  });
  mutationObserver.observe(content, { childList: true, subtree: true, attributes: true, attributeFilter: ['open', 'hidden', 'class', 'style'] });
  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', schedule, { passive: true });
  window.addEventListener('hashchange', schedule);
  window.addEventListener('research-layout-change', schedule);
  window.addEventListener('blur', finishDrag);
  document.addEventListener('toggle', schedule, true);
  viewport?.addEventListener('resize', schedule, { passive: true });
  viewport?.addEventListener('scroll', schedule, { passive: true });

  window.ResearchColumnResize = {
    minWidth: MIN_WIDTH, maxWidth: MAX_WIDTH,
    refresh() { needsReconcile = true; schedule(); },
    setEditing,
    get editing() { return editing; },
    reset,
    destroy() {
      finishDrag();
      destroyed = true;
      if (frame) cancelAnimationFrame(frame);
      mutationObserver.disconnect();
      resizeObserver?.disconnect();
      removeControls();
      records.forEach(record => { removeRecord(record); restoreLayout(record); });
      records.clear(); observed.clear();
      window.removeEventListener('scroll', schedule);
      window.removeEventListener('resize', schedule);
      window.removeEventListener('hashchange', schedule);
      window.removeEventListener('research-layout-change', schedule);
      window.removeEventListener('blur', finishDrag);
      document.removeEventListener('toggle', schedule, true);
      viewport?.removeEventListener('resize', schedule);
      viewport?.removeEventListener('scroll', schedule);
      layer.remove();
      document.body.classList.remove('is-resizing-column');
    }
  };
  schedule();
})();
</script>
</body>
</html>
