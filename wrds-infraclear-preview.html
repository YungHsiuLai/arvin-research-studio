mer–supplier relationships and sales to customers", "以公司識別串接客戶—供應商關係、客戶銷售額及外部財務資料。": "Use company identifiers to link customer–supplier relationships, sales to customers and external financial data.", "WRDS 提供的 FactSet Revere 企業供應、客戶與合作關係預覽；本機資料的關係版本起始日涵蓋 2003-04-03 至 2015-05-11。": "A WRDS preview of FactSet Revere company supplier, customer and partnership relationships; relationship-version start dates in the local data span 2003-04-03 to 2015-05-11.", "WRDS 提供的 InfraClear 基礎建設合約、當事人角色、專案與條款抽取預覽；本機合約簽署日期涵蓋 1965-02-02 至 2025-03-24。": "A WRDS preview of InfraClear infrastructure contracts, party roles, projects and extracted clauses; contract signing dates in the local data span 1965-02-02 to 2025-03-24.", "WRDS 提供的 RoyaltyStat 授權合約、權利金與交易條件預覽；本機合約生效日期涵蓋 1997-05-28 至 2016-07-01。": "A WRDS preview of RoyaltyStat licensing agreements, royalties and transaction terms; agreement effective dates in the local data span 1997-05-28 to 2016-07-01.", "基礎建設合約預覽": "Infrastructure contract preview", "一筆合約文件紀錄": "One contract document record", "合約識別、簽署與發布日期、文件類型、摘要與專案連結；不含合約全文。": "Contract identifiers, signing and publication dates, document types, summaries and project links; no full contract text.", "合約當事人與角色預覽": "Contract party and role preview", "一筆合約 × 組織 × 角色關聯紀錄": "One contract × organization × role relationship record", "連接合約與組織，記錄當事人角色；預覽組織鍵值不保證能在組織預覽找到。": "Links contracts to organizations and records party roles; organization keys in the preview are not guaranteed to appear in the organization preview.", "合約關鍵詞與條款抽取預覽": "Contract keyword and clause extraction preview", "一筆從合約抽取的詞或片段；同一合約可有多筆及重複": "One term or fragment extracted from a contract; a contract may have multiple and duplicate entries", "抽出值、類型、標籤與 AI 生成描述；沒有完整條款上下文或位置。": "Extracted values, types, labels and AI-generated descriptions; no complete clause context or locations.", "組織識別預覽": "Organization identifier preview", "一筆組織或實體識別紀錄；來源也可能包含自然人": "One organization or entity identification record; the source may also include natural persons", "名稱、標準化名稱、外部識別碼與國家資訊；不直接提供組織績效。": "Names, standardized names, external identifiers and country information; no direct organization performance measures.", "基礎建設專案預覽": "Infrastructure project preview", "一筆專案紀錄": "One project record", "專案名稱、摘要、開始年份、地理位置、產業與資料品質排序；品質排序不是專案績效。": "Project names, summaries, start years, locations, industries and data quality rankings; the quality ranking is not project performance.", "由 WRDS 串接 Compustat Segment 的客戶揭露與公司識別資料，已核對主表涵蓋 1976-06-30 至 2026-07-31 的供應商—客戶關係與客戶銷售資訊。": "WRDS links Compustat Segment customer disclosures with company identifiers; the verified main table covers supplier-customer relationships and sales-to-customer information from 1976-06-30 to 2026-07-31.", "日期或期間索引本身不直接衡量行銷結果。": "A date or period index itself does not directly measure marketing outcomes.", "時間先後不自動形成處置或外生解釋變數。": "Temporal ordering does not automatically establish a treatment or an exogenous explanatory variable.", "識別、名稱或代碼本身不衡量行銷結果。": "Identifiers, names or codes themselves do not measure marketing outcomes.", "辨識與串接資訊本身不代表契約、治理或其他實質解釋構念。": "Identification and linkage information itself does not represent contracts, governance or other substantive explanatory constructs.", "原始文字或摘要本身不是已驗證的行銷結果指標。": "Original text or summaries themselves are not validated marketing outcome indicators.", "經人工或模型編碼並驗證後，可能衡量交易內容、產品或契約特徵。": "After manual or model-based coding and validation, may measure transaction content, products or contract characteristics.", "先界定構念與編碼規則，核對原始文件、缺失及文字生成方式；分類詞或摘要不等同完整合約或治理品質。": "First define the construct and coding rules, and check original documents, missingness and how the text was generated; category terms or summaries are not equivalent to complete contracts or governance quality.", "背景分類本身不直接衡量行銷或 B2B 績效。": "Background classifications themselves do not directly measure marketing or B2B performance.", "可編碼為相關背景或異質性，但須說明其與研究機制的連結。": "Can be coded as relevant background or heterogeneity, but their connection to the research mechanism must be explained.", "分類與角色名稱可提供背景；角色不等同權利義務條款。先核對官方碼表、觀察單位與適用層級，再依研究設計編碼。": "Classifications and role names can provide context; roles are not equivalent to terms specifying rights and obligations. First check the official codebook, observation unit and applicable level, then code according to the research design.", "用於契約、當事人、組織、專案及外部代碼串接；本機預覽部分表的鍵值無重疊，不以無法匹配推論真實世界沒有關係，名稱也不直接衡量品牌或治理。": "Used to link contracts, parties, organizations, projects and external codes; some tables in the local preview have no overlapping key values. Failure to match does not imply that no real-world relationship exists, and names do not directly measure brands or governance.", "簽約、首次發布與專案開始各有不同意義；核對時間精度、缺失與觀察選擇，不能直接當處置或績效。": "Contract signing, first publication and project start have different meanings; check time precision, missingness and observation selection. Do not directly treat them as treatments or performance.", "頁數本身不衡量履約、銷售或關係績效。": "Page count itself does not measure fulfillment, sales or relationship performance.", "經文體、附件與篇幅差異校正後，可能作契約複雜度的粗略代理。": "After adjusting for differences in writing style, appendices and length, may serve as a rough proxy for contract complexity.", "頁數不等於條款數、治理完整性或詳細程度；需原件核查並排除附件與文件類型影響。": "Page count is not the number of clauses, governance completeness or level of detail; check original documents and rule out effects of appendices and document type.", "核對原件並建構構念後，才可能衡量價格、期限或契約設計結果；抽出詞不是履約結果。": "Only after checking the originals and operationalizing the construct might these measure outcomes relating to price, duration or contract design; extracted terms are not fulfillment outcomes.", "可能用於治理條款的編碼，但須驗證上下文、方向、缺失與抽取品質。": "May be used to code governance clauses, but context, direction, missingness and extraction quality require validation.", "term_description 的原文明示 AI 生成；可能重複、誤分類或只剩遮蔽後片段。預覽沒有合約全文或條款位置，不將抽出詞直接當完整治理指標。": "The original definition of term_description explicitly states that it is AI-generated; it may contain duplicates, misclassifications or only fragments remaining after masking. The preview has neither full contract text nor clause locations; do not directly treat extracted terms as complete governance indicators.", "抽取類型及標籤是文字處理結果，需回查原文與 term_value；不是契約完整性、治理品質或績效的直接測量。": "Extraction types and labels are text-processing outputs that require checking against the original text and term_value; they do not directly measure contract completeness, governance quality or performance.", "原文指資料品質，不能當專案績效或治理品質。": "The original definition refers to data quality; do not treat it as project performance or governance quality.", "資料品質排序本身不是實質商業解釋構念。": "The data quality ranking itself is not a substantive business explanatory construct.", "原文為數值越小品質越好；可用於資料品質分層或敏感度分析，不能倒置為公司或專案表現。": "The original definition states that smaller values indicate better quality; can be used for data-quality stratification or sensitivity analysis. Do not reinterpret it as company or project performance.", "地理座標本身不是行銷或履約結果。": "Geographic coordinates themselves are neither marketing nor fulfillment outcomes.", "可衍生距離或地理背景；需額外說明其與交易機制的連結。": "Can be used to derive distance or geographic background; requires a separate explanation of the connection to the transaction mechanism.", "核對座標精度、缺失與位置意義；距離須用可驗證的對照位置計算，不將座標值大小直接作商業解釋。": "Check coordinate precision, missingness and the meaning of the location; calculate distances using verifiable reference locations. Do not directly give business interpretations to the magnitude of coordinate values.", "跳到主要內容": "Skip to main content", "展開主要導覽": "Open main navigation", "移到左邊界或點按以展開導覽": "Move to the left edge or click to open navigation", "主要導覽": "Main navigation", "收合主要導覽": "Close main navigation", "Arvin Research Studio 資料集首頁": "Arvin Research Studio dataset home", "研究工作台": "RESEARCH WORKSPACE", "所有資料集": "All datasets", "切換資料集": "Switch dataset", "資料 · 文獻 · 方法 · 判斷": "Data · Literature · Methods · Judgment", "資料快照": "Data snapshot", "Research Studio · 個人研究練習": "Rese   'use strict';
  const STORAGE_KEY = 'research-studio-language';
  const selector = document.getElementById('language-select');

    if (!event.target.matches('.column-width-range')) return;
    const record = selectedRecord();
    if (!record || !isVisible(record.table)) return;
    const widths = widthsOf(record);
    widths[Number(event.target.dataset.columnIndex)] = Number(event.target.value);
    setWidths(record, widths);
    persist();
  }
  function onControlsKey(event) {
    if (event.key === 'Escape' && editing) {
      event.preventDefault();
      setEditing(false);
      controls.toggle.focus({ preventScroll: true });
    }
  }
  function removeControls() {
    if (!controls) return;
    controls.host.removeEventListener('click', onControlsClick);
    controls.host.removeEventListener('change', onControlsChange);
    controls.host.removeEventListener('input', onControlsInput);
    controls.host.removeEventListener('keydown', onControlsKey);
    controls.host.replaceChildren();
    controls = null;
  }
  function mountControls() {
    const host = content.querySelector('#column-width-controls');
    if (host === controls?.host) return;
    removeControls();
    if (!host) { setEditing(false); return; }
    const actions = element('div', 'column-width-actions');
    const toggle = element('button', 'button small column-width-toggle', '調整欄寬');
    toggle.type = 'button';
    toggle.setAttribute('aria-controls', 'column-width-panel');
    const resetButton = element('button', 'button small column-width-reset', '還原所有欄寬');
    resetButton.type = 'button';
    resetButton.title = '還原此資料集所有資料表的預設欄寬';
    actions.append(toggle, resetButton);
    const panel = element('div', 'column-width-panel');
    panel.id = 'column-width-panel';
    panel.setAttribute('role', 'region');
    panel.setAttribute('aria-label', '資料表欄寬調整');
    const tableLabel = element('label', 'column-width-table-label');
    tableLabel.append(element('span', '', '調整資料表'));
    const select = element('select', 'column-width-table-select');
    tableLabel.append(select);
    const hint = element('p', 'column-width-hint');
    const sliders = element('div', 'column-width-sliders');
    panel.append(tableLabel, hint, sliders);
    host.append(actions, panel);
    controls = { host, toggle, reset: resetButton, panel, select, hint, sliders, optionsSignature: '', rowsSignature: '', table: null, rows: [] };
    host.addEventListener('click', onControlsClick);
    host.addEventListener('change', onControlsChange);
    host.addEventListener('input', onControlsInput);
    host.addEventListener('keydown', onControlsKey);
  }
  function syncControls() {
    if (!controls) return;
    const items = [...records.values()];
    if (!items.some(record => record.key === selectedKey)) {
      selectedKey = items.find(record => record.wrapper === window.ResearchTableScroll?.activeTable)?.key
        || items.find(record => isVisible(record.table))?.key || items[0]?.key || null;
    }
    const optionsSignature = items.map(record => record.key).join('\n');
    if (controls.optionsSignature !== optionsSignature) {
      controls.select.replaceChildren(...items.map(record => {
        const title = sourceText(record.table.closest('[data-table-id]')?.querySelector('h2')) || record.key;
        const option = element('option', '', title);
        option.value = record.key;
        return option;
      }));
      controls.optionsSignature = optionsSignature;
    }
    if (controls.select.value !== selectedKey) controls.select.value = selectedKey || '';
    controls.select.disabled = !items.length;
    controls.toggle.disabled = !items.length;
    controls.toggle.setAttribute('aria-pressed', String(editing));
    controls.toggle.setAttribute('aria-expanded', String(editing));
    setText(controls.toggle, editing ? '完成調整' : '調整欄寬');
    controls.reset.disabled = !savedWidths.size;
    if (controls.panel.hidden === editing) controls.panel.hidden = !editing;
    const record = selectedRecord();
    const labels = record?.headers.map(sourceText) || [];
    const rowsSignature = labels.join('\n');
    if (controls.table !== record?.table || controls.rowsSignature !== rowsSignature) {
      controls.rows = labels.map((label, index) => {
        const row = element('label', 'column-width-slider-row');
        const caption = element('span', 'column-width-caption', label);
        const value = element('output', 'column-width-value');
        const input = element('input', 'column-width-range');
        input.type = 'range'; input.min = String(MIN_WIDTH); input.max = String(MAX_WIDTH); input.step = '1';
        input.id = `column-width-range-${index}`;
        input.dataset.columnIndex = String(index);
        input.setAttribute('aria-label', `「${label}」欄寬`);
        value.htmlFor = input.id;
        row.append(caption, value, input);
        return { row, input, value };
      });
      controls.sliders.replaceChildren(...controls.rows.map(row => row.row));
      controls.table = record?.table;
      controls.rowsSignature = rowsSignature;
    }
    const usable = record && isVisible(record.table);
    setText(controls.hint, !record ? '目前沒有符合的資料表。' : usable ? '拖曳下方滑桿或表格邊界，分別調整每一欄。' : '請先展開這張資料表，再調整欄寬。');
    const widths = record ? widthsOf(record) : [];
    controls.rows.forEach(({ input, value }, index) => {
      const width = Math.round(widths[index]);
      input.disabled = !usable;
      if (input.value !== String(width)) input.value = String(width);
      input.setAttribute('aria-valuetext', `${width} 像素`);
      setText(value, usable || record.widths ? `${width} px` : '—');
    });
  }
  function widthsOf(record) {
    return record.widths ? [...record.widths] : record.headers.map(header => clamp(header.getBoundingClientRect().width));
  }
  function notifyLayout() {
    window.dispatchEvent(new CustomEvent('research-layout-change'));
    schedule();
  }
  function setWidths(record, widths, save = true) {
    record.widths = widths.map(width => Math.round(clamp(width) * 100) / 100);
    if (!record.colgroup) {
      record.colgroup = document.createElement('colgroup');
      record.colgroup.className = 'column-resize-widths';
      record.headers.forEach(() => record.colgroup.append(document.createElement('col')));
      record.table.prepend(record.colgroup);
      record.table.classList.add('column-widths-custom');
    }
    [...record.colgroup.children].forEach((col, index) => writeStyle(col, 'width', `${record.widths[index]}px`));
    writeStyle(record.table, 'width', `${record.widths.reduce((sum, width) => sum + width, 0)}px`);
    writeStyle(record.table, 'minWidth', '0px');
    record.handles.forEach((handle, index) => handle.setAttribute('aria-valuenow', String(Math.round(record.widths[index]))));
    if (save) savedWidths.set(record.key, [...record.widths]);
    notifyLayout();
  }
  function restoreLayout(record) {
    record.widths = null;
    record.colgroup?.remove();
    record.colgroup = null;
    record.table.classList.remove('column-widths-custom');
    writeStyle(record.table, 'width', record.originalWidth);
    writeStyle(record.table, 'minWidth', record.originalMinWidth);
  }
  function reset(key) {
    if (dragging && (!key || dragging.record.key === key)) finishDrag();
    records.forEach(record => {
      if (!key || record.key === key) restoreLayout(record);
    });
    if (key) savedWidths.delete(key); else savedWidths.clear();
    persist();
    notifyLayout();
  }
  function finishDrag(cancel = false) {
    if (!dragging) return;
    const current = dragging;
    dragging = null;
    current.handle.classList.remove('is-dragging');
    document.body.classList.remove('is-resizing-column');
    if (current.handle.hasPointerCapture(current.pointerId)) current.handle.releasePointerCapture(current.pointerId);
    if (cancel === true) {
      if (current.previousWidths) setWidths(current.record, current.previousWidths);
      else {
        restoreLayout(current.record);
        savedWidths.delete(current.record.key);
        notifyLayout();
      }
    }
    persist();
    schedule();
  }
  function onPointerDown(event) {
    if (event.button !== 0 || !event.isPrimary || dragging) return;
    const handle = event.currentTarget;
    const record = records.get(handle._resizeTable);
    if (!record || handle.hidden) return;
    event.preventDefault();
    handle.focus({ preventScroll: true });
    dragging = {
      record, handle, pointerId: event.pointerId, startX: event.clientX,
      index: Number(handle.dataset.columnIndex), widths: widthsOf(record),
      previousWidths: record.widths ? [...record.widths] : null
    };
    handle.classList.add('is-dragging');
    document.body.classList.add('is-resizing-column');
    handle.setPointerCapture(event.pointerId);
  }
  function onPointerMove(event) {
    if (!dragging || event.pointerId !== dragging.pointerId) return;
    const widths = [...dragging.widths];
    widths[dragging.index] = clamp(widths[dragging.index] + event.clientX - dragging.startX);
    setWidths(dragging.record, widths);
  }
  function onPointerUp(event) {
    if (dragging?.pointerId === event.pointerId) finishDrag();
  }
  function onPointerCancel(event) {
    if (dragging?.pointerId === event.pointerId) finishDrag(true);
  }
  function onKeyDown(event) {
    if (event.key === 'Escape' && dragging) { event.preventDefault(); finishDrag(true); return; }
    const handle = event.currentTarget;
    const record = records.get(handle._resizeTable);
    if (!record) return;
    const widths = widthsOf(record);
    const index = Number(handle.dataset.columnIndex);
    const step = event.shiftKey ? 48 : 16;
    if (event.key === 'ArrowLeft') widths[index] -= step;
    else if (event.key === 'ArrowRight') widths[index] += step;
    else if (event.key === 'Home') widths[index] = MIN_WIDTH;
    else if (event.key === 'End') widths[index] = MAX_WIDTH;
    else return;
    event.preventDefault();
    setWidths(record, widths);
    persist();
  }
  function onDoubleClick(event) { reset(event.currentTarget.dataset.tableId); }
  function removeRecord(record) {
    if (dragging?.record === record) finishDrag();
    record.wrapper.removeEventListener('scroll', schedule);
    record.handles.forEach(handle => {
      handle.removeEventListener('pointerdown', onPointerDown);
      handle.removeEventListener('pointermove', onPointerMove);
      handle.removeEventListener('pointerup', onPointerUp);
      handle.removeEventListener('pointercancel', onPointerCancel);
      handle.removeEventListener('lostpointercapture', onPointerUp);
      handle.removeEventListener('keydown', onKeyDown);
      handle.removeEventListener('dblclick', onDoubleClick);
      handle.remove();
    });
  }
  function reconcile() {
    const tables = new Set(content.querySelectorAll('.table-scroll > .column-table'));
    records.forEach((record, table) => {
      if (!tables.has(table)) { removeRecord(record); records.delete(table); }
    });
    tables.forEach(table => {
      if (records.has(table)) return;
      const headers = [...(table.tHead?.rows[0]?.cells || [])];
      if (!headers.length) return;
      const wrapper = table.closest('.table-scroll');
      const key = table.closest('[data-table-id]')?.dataset.tableId || `table-${records.size}`;
      if (!table.id) {
        do { table.id = `research-resizable-table-${++sequence}`; } while (document.querySelectorAll(`#${table.id}`).length > 1);
      }
      const record = { table, wrapper, key, headers, handles: [], widths: null, colgroup: null, originalWidth: table.style.width, originalMinWidth: table.style.minWidth };
      records.set(table, record);
      headers.forEach((header, index) => {
        const handle = document.createElement('div');
        handle.className = 'column-resize-handle';
        handle.hidden = true;
        handle.tabIndex = 0;
        handle.dataset.tableId = key;
        handle.dataset.columnIndex = String(index);
        handle._resizeTable = table;
        handle.setAttribute('role', 'separator');
        handle.setAttribute('aria-orientation', 'vertical');
        handle.setAttribute('aria-controls', table.id);
        handle.setAttribute('aria-label', `調整「${sourceText(header)}」欄寬`);
        handle.setAttribute('aria-valuemin', String(MIN_WIDTH));
        handle.setAttribute('aria-valuemax', String(MAX_WIDTH));
        handle.title = '拖曳調整欄寬；左右鍵微調，Home／End 最小／最大；連按兩下還原表格';
        handle.addEventListener('pointerdown', onPointerDown);
        handle.addEventListener('pointermove', onPointerMove);
        handle.addEventListener('pointerup', onPointerUp);
        handle.addEventListener('pointercancel', onPointerCancel);
        handle.addEventListener('lostpointercapture', onPointerUp);
        handle.addEventListener('keydown', onKeyDown);
        handle.addEventListener('dblclick', onDoubleClick);
        layer.append(handle);
        record.handles.push(handle);
      });
      wrapper.addEventListener('scroll', schedule, { passive: true });
      const saved = savedWidths.get(key);
      if (saved?.length === headers.length) setWidths(record, saved, false);
    });
    if (resizeObserver) {
      const targets = new Set([content, document.body]);
      const topbar = document.querySelector('.topbar');
      if (topbar) targets.add(topbar);
      records.forEach(record => { targets.add(record.table); targets.add(record.wrapper); });
      observed.forEach(element => {
        if (!targets.has(element)) { resizeObserver.unobserve(element); observed.delete(element); }
      });
      targets.forEach(element => {
        if (!observed.has(element)) { resizeObserver.observe(element); observed.add(element); }
      });
    }
    mountControls();
    needsReconcile = false;
  }
  function isVisible(table) {
    if (!table.isConnected || !table.getClientRects().length || table.closest('[hidden]')) return false;
    for (let parent = table.parentElement; parent; parent = parent.parentElement) {
      if (parent.tagName === 'DETAILS' && !parent.open) return false;
    }
    return getComputedStyle(table).visibility !== 'hidden';
  }
  function update() {
    frame = 0;
    if (destroyed) return;
    if (needsReconcile) reconcile();
    syncControls();
    const viewLeft = viewport?.offsetLeft || 0;
    const viewTop = viewport?.offsetTop || 0;
    const viewRight = Math.min(viewLeft + (viewport?.width || window.innerWidth), document.documentElement.clientWidth);
    let viewBottom = viewTop + (viewport?.height || window.innerHeight);
    const topbar = document.querySelector('.topbar')?.getBoundingClientRect();
    const visibleTop = topbar && topbar.top <= viewTop + 1 && topbar.bottom > viewTop ? topbar.bottom : viewTop;
    const dock = document.querySelector('.table-scroll-dock:not([hidden])');
    if (dock) viewBottom = Math.min(viewBottom, dock.getBoundingClientRect().top);
    records.forEach(record => {
      if (!isVisible(record.table)) {
        if (dragging?.record === record) finishDrag();
        record.handles.forEach(handle => { handle.hidden = true; });
        return;
      }
      const rect = record.table.getBoundingClientRect();
      const wrapRect = record.wrapper.getBoundingClientRect();
      const left = Math.max(viewLeft, wrapRect.left + record.wrapper.clientLeft);
      const right = Math.min(viewRight, wrapRect.left + record.wrapper.clientLeft + record.wrapper.clientWidth);
      const top = Math.max(visibleTop, rect.top, wrapRect.top);
      const bottom = Math.min(viewBottom, rect.bottom, wrapRect.top + record.wrapper.clientHeight);
      record.headers.forEach((header, index) => {
        const handle = record.handles[index];
        const headerRect = header.getBoundingClientRect();
        const active = dragging?.handle === handle;
        const inView = headerRect.right >= left + 4 && headerRect.right <= right + 1;
        handle.hidden = bottom - top < 12 || right - left < 20 || (!inView && !active);
        if (handle.hidden) return;
        const x = active ? Math.max(left + 5, Math.min(right - 5, headerRect.right)) : Math.min(right - 5, headerRect.right);
        writeStyle(handle, 'left', `${x - 5}px`);
        writeStyle(handle, 'top', `${top}px`);
        writeStyle(handle, 'height', `${bottom - top}px`);
        handle.setAttribute('aria-valuenow', String(Math.round(headerRect.width)));
      });
    });
  }
  function schedule() {
    if (!destroyed && !frame) frame = requestAnimationFrame(update);
  }
  const mutationObserver = new MutationObserver(changes => {
    if (changes.some(change => change.type === 'childList')) needsReconcile = true;
    schedule();
  });
  mutationObserver.observe(content, { childList: true, subtree: true, attributes: true, attributeFilter: ['open', 'hidden', 'class', 'style'] });
  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', schedule, { passive: true });
  window.addEventListener('hashchange', schedule);
  window.addEventListener('research-layout-change', schedule);
  window.addEventListener('blur', finishDrag);
  document.addEventListener('toggle', schedule, true);
  viewport?.addEventListener('resize', schedule, { passive: true });
  viewport?.addEventListener('scroll', schedule, { passive: true });

  window.ResearchColumnResize = {
    minWidth: MIN_WIDTH, maxWidth: MAX_WIDTH,
    refresh() { needsReconcile = true; schedule(); },
    setEditing,
    get editing() { return editing; },
    reset,
    destroy() {
      finishDrag();
      destroyed = true;
      if (frame) cancelAnimationFrame(frame);
      mutationObserver.disconnect();
      resizeObserver?.disconnect();
      removeControls();
      records.forEach(record => { removeRecord(record); restoreLayout(record); });
      records.clear(); observed.clear();
      window.removeEventListener('scroll', schedule);
      window.removeEventListener('resize', schedule);
      window.removeEventListener('hashchange', schedule);
      window.removeEventListener('research-layout-change', schedule);
      window.removeEventListener('blur', finishDrag);
      document.removeEventListener('toggle', schedule, true);
      viewport?.removeEventListener('resize', schedule);
      viewport?.removeEventListener('scroll', schedule);
      layer.remove();
      document.body.classList.remove('is-resizing-column');
    }
  };
  schedule();
})();
</script>
</body>
</html>
