rdized current name. Underlying customer data can also describe unnamed customers or customer groups.", "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "優先核對穩定識別碼；名稱用於匹配覆核與分組，留意更名、縮寫及 cconm 的目前名稱口徑。", "dv_reason": "公司名稱不測量行銷結果。", "iv_reason": "名稱不測量品牌認知、契約條款或治理。"}}, {"name": "srcdate", "type": "date", "definition_en": "Source Date - Segment Customer", "definition_verified_zh": "Segment Customer 的來源日期。底層文件區分來源會計年月與資料年月；不能直接當成公告日、交易日或合約日期。現行日期轉換規則仍待核實。", "definition_verified_en": "The Segment Customer source date. Underlying documentation distinguishes source fiscal timing from data timing; it is not directly an announcement, transaction or contract date. Current date-conversion rules remain unverified.", "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "須與原始 Segment 資料及財報會計期間對齊；公司年度的觀察缺口可能來自揭露、匹配或樣本範圍。", "dv_reason": "來源日期本身不測量行銷結果；連續出現與否也不直接等同關係存續或終止。", "iv_reason": "不能直接當合約事件或外生處置時點。"}}, {"name": "cid", "type": "integer", "definition_en": "Customer Identifier", "definition_verified_zh": "報告公司內的客戶識別碼，不是客戶數或全域公司識別碼。不能只用 cid 跨供應商串接；未查得固定數值範圍或逐碼對照表。", "definition_verified_en": "A customer identifier within the reporting company, not a customer count or global company identifier. Do not join across suppliers using cid alone; no fixed numerical range or enumerated codebook was found.", "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "用於辨識供應商—客戶雙方與外部串接；先檢查匹配率、重複、方向、期間及一對多，不把識別碼大小當測量。", "dv_reason": "識別碼本身不是銷售或關係績效。", "iv_reason": "串接鍵本身不測量契約、治理或其他實質 B2B 解釋構念。"}}, {"name": "sid", "type": "integer", "definition_en": "Customer Segment Identifier Link", "definition_verified_zh": "客戶對應的分部識別連結；底層文件描述為四位數代碼，不是數量。同碼跨公司沒有相同實體意義；客戶可能對應多個分部。現表以整數儲存，不能由顯示位數推定原始代碼寬度。", "definition_verified_en": "Links a customer to a segment; the underlying documentation describes a four-digit code, not a quantity. Identical codes across companies do not identify the same entity, and a c ": "srcdate", "type": "date", "definition_en": "Source Date - Segment Customer", "definition_verified_zh": "Segment Customer 的來源日期。底層文件區分來源會計年月與資料年月；不能直接當成公告日、交易日或合約日期。現行日期轉換規則仍待核實。", "definition_verified_en": "The Segment Customer source date. Underlying documentation distinguishes source fiscal timing from data timing; it is not directly an announcement, transaction or contract date. Current date-conversion rules remain unverified.", "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "須與原始 Segment 資料及財報會計期間對齊；公司年度的觀察缺口可能來自揭露、匹配或樣本範圍。", "dv_reason": "來源日期本身不測量行銷結果；連續出現與否也不直接等同關係存續或終止。", "iv_reason": "不能直接當合約事件或外生處置時點。"}}, {"name": "cid", "type": "integer", "definition_en": "Customer Identifier", "definition_verified_zh": "報告公司內的客戶識別碼，不是客戶數或全域公司識別碼。不能只用 cid 跨供應商串接；未查得固定數值範圍或逐碼對照表。", "definition_verified_en": "A customer identifier within the reporting company, not a customer count or global company identifier. Do not join across suppliers using cid alone; no fixed numerical range or enumerated codebook was found.", "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "用於辨識供應商—客戶雙方與外部串接；先檢查匹配率、重複、方向、期間及一對多，不把識別碼大小當測量。", "dv_reason": "識別碼本身不是銷售或關係績效。", "iv_reason": "串接鍵本身不測量契約、治理或其他實質 B2B 解釋構念。"}}, {"name": "sid", "type": "integer", "definition_en": "Customer Segment Identifier Link", "definition_verified_zh": "客戶對應的分部識別連結；底層文件描述為四位數代碼，不是數量。同碼跨公司沒有相同實體意義；客戶可能對應多個分部。現表以整數儲存，不能由顯示位數推定原始代碼寬度。", "definition_verified_en": "Links a customer to a segment; the underlying documentation describes a four-digit code, not a quantity. Identical codes across companies do not identify the same entity, and a customer may link to several segments. Integer storage here does not preserve the original displayed code width.", "analysis_use": {"dv": "not_direct", "iv": "not_direct", "control": "derived", "note": "用於辨識供應商—客戶雙方與外部串接；先檢查匹配率、重複、方向、期間及一對多，不把識別碼大小當測量。", "dv_reason": "識別碼本身不是銷售或關係績效。", "iv_reason": "串接鍵本身不測量契約、治理或其他實質 B2B 解釋構念。"}}, {"name": "ctype", "type": "character varying(8)", "definition_en": "Customer Type", "definition_verified_zh": "類別碼：COMPANY＝公司名稱、未揭露客戶或客戶數量群組；GEOREG＝地區；MARKET＝市場；GOVSTATE＝州政府；GOVLOC＝地方政府；GOVDOM＝本國政府；GOVFRN＝外國政府。COMPANY 不保證是已辨識的單一公司。", "definition_verified_en": "Categories: COMPANY covers named or unnamed customers and customer-count groups; GEOREG geographic grouping; MARKET market grouping; GOVSTATE state government; GOVLOC local government; GOVDOM domestic government; GOVFRN foreign government. COMPANY does not guarantee an identified individual company.", "analysis_use": {"dv": "not_direct", "iv": "derived", "control": "derived", "note": "先核對類別定義、未知值及來源覆蓋；分類碼不能當成連續數值，控制仍依研究設計選取。", "dv_reason": "客戶類型是關係背景，不能直接當成行銷成效。", "iv_reason": "編碼後可代表客戶類型差異；須驗證與 B2B 機制的連結，不能視為治理品質。"}}, {"name": "salecs", "type": "numeric(17,4)", "definition_en": "Customer Sales", "definition_verified_zh": "供應商對該客戶的銷售金額，不是百分比或客戶公司總營收。歷史 Compustat Customer Revenues（CSALE）文件列百萬單位；現行 salecs 的幣別、換算方式與精確期間仍待核實，本表沒有幣別欄。缺失不能當零，歷史缺失碼也不能直接套用。", "definition_verified_en": "The supplier's sales amount to this customer, not a percentage or the customer's total revenue. Historical Compustat Customer Revenues (CSALE) documentation uses a million-unit scale. The current salecs currency, conversion rules and precise period remain unverified; this table has no currency field. Missing is not zero, and historical missing-value codes must not be applied automatically.", "analysis_use": {"dv": "conditional", "iv": "conditional", "control": "conditional", "note": "先核對幣別、單位與會計期間；本表未附完整口徑。揭露客戶不等於所有客戶，缺失不補零；作 IV／控制須確認時序與內生性，銷售額不直接測量契約條款或治理。", "dv_reason": "可衡量供應商對特定客戶的銷售表現，具實質 B2B 結果意義。", "iv_reason": "可建構既有交易規模／客戶依賴程度；比例須另接同口徑供應商總銷售額。"}}]}], "papers": [{"id": "liu_etal_2025_invisible_threats", "title": "Invisible threats: The impact of perceived political risk misalignment on firm’s operational resilience", "authors": "Yang Liu; Mengjie Xi; Yi Zhou; Taiwen Feng; Wei Fang; Wenxuan Wang", "year": 2025, "journal": "Transportation Research Part E: Logistics and Transportation Review", "doi": "10.1016/j.tre.2025.104186", "status": "已核查：同 WRDS 產品；版本待核對", "relationship": "全文明列 WRDS Supply Chain with IDs（Compustat Segment）；未核對文章擷取版本與現行 seglink 完全相同。", "question": "買方與供應商的政治風險感知差異，如何對應買方的營運韌性？", "design": "以雙方 GVKEY 建立供應商 × 買方 × 年度，再接 Compustat 財務與 Economic Policy Uncertainty 的公司政治風險資料。外接資料建構風險差異與營運韌性；供應鏈表提供配對及網絡。", "replication_scope": "可比較配對與串接流程；尚未擷取文章所需財務、政治風險及完整研究樣本，不能僅用本機欄位實例重現。", "dataset_ids": ["wrds-supplychain"], "url": "https://doi.org/10.1016/j.tre.2025.104186", "source_url": "https://researchmgt.monash.edu/ws/portalfiles/portal/711468517/700204388-oa.pdf"}, {"id": "saboo_kumar_anand_2017_customer_concentration", "title": "Assessing the Impact of Customer Concentration on Initial Public Offering and Balance Sheet–Based Outcomes", "authors": "Alok R. Saboo; V. Kumar; Ankit Anand", "year": 2017, "journal": "Journal of Marketing", "doi": "10.1509/jm.16.0457", "status": "已核查：相關 Compustat／10-K 測量", "relationship": "附錄確認使用 COMPUSTAT 與 10-K 客戶營收資訊；未確認使用 WRDS seglink 或相同串接程序。", "question": "客戶集中度與 IPO 估值、上市後獲利之間有何關係？", "design": "以公司為單位，將 COMPUSTAT／10-K 的客戶營收占比建構集中度，搭配 SDC 的 IPO 市值與 Compustat 的 ROA。呈現客戶組合測量如何連到資本市場與公司年度結果。", "replication_scope": "先比較客戶集中度與外接 DV 的測量；本機連結表不包含 IPO 市值、ROA 或完整 10-K 揭露，尚不能重現研究。", "dataset_ids": ["wrds-supplychain"], "url": "https://doi.org/10.1509/jm.16.0457", "source_url": "https://journals.sagepub.com/doi/10.1509/jm.16.0457"}, {"id": "cohen_frazzini_2008_economic_links", "title": "Economic Links and Predictable Returns", "authors": "Lauren Cohen; Andrea Frazzini", "year": 2008, "journal": "The Journal of Finance", "doi": "10.1111/j.1540-6261.2008.01379.x", "status": "已核查：同基礎來源；自建配對", "relationship": "使用 Compustat segment 客戶資料；作者以字串候選與人工核對連到 CRSP PERMNO，不能視為使用現行 WRDS seglink。", "question": "主要客戶的報酬資訊能否預測供應商後續股票報酬？", "design": "將公司年度客戶關係接到 CRSP 股票月報酬及 Compustat 財務；以落後客戶報酬形成供應商投資組合。財報年度與報酬間留六個月，避免使用尚未公開的關係資訊。", "replication_scope": "可比較識別碼配對與資訊時間；仍需 CRSP 報酬、財務及歷史樣本。此例是金融結果，不自動等同直接行銷成效。", "dataset_ids": ["wrds-supplychain"], "url": "https://doi.org/10.1111/j.1540-6261.2008.01379.x", "source_url": "https://pages.stern.nyu.edu/~afrazzin/pdf/Economic%20Links%20and%20Predictable%20Returns%20-%20Cohen%20and%20Frazzini.pdf"}], "i18n": {"en": {"strings": {"職涯、人力、職缺與員工評論資料": "Career, workforce, job posting and employee review data", "由 Revelio Labs 整理 LinkedIn 等公開來源的全球職涯、招聘與員工評論資料，並提供 2008-01 至 2026-08 的公司月度人力動態資料。": "Global career, recruitment and employee review data compiled by Revelio Labs from public sources including LinkedIn, with monthly company workforce dynamics data from 2008-01 to 2026-08.", "職涯、人力、招聘廣告與員工評論資料；字典提供各表觀察單位、欄位定義、真實例子與行銷／B2B 的 DV／IV／控制變數適用性。": "Career, workforce, recruitment advertisement and employee review data; the dictionary provides each table's observation unit, field definitions, real examples and DV / IV / control suitability for marketing and B2B research.", "Compustat Segment 客戶—供應商關係與客戶銷售額": "Compustat Segment customer–supplier relationships and sales to customers", "以公司識別串接客戶—供應商關係、客戶銷售額及外部財務資料。": "Use company identifiers to link customer–supplier relationships, sales to customers and external financial data.", "WRDS 提供的 FactSet Revere 企業供應、客戶與合作關係預覽；本機資料的關係版本起始日涵蓋 2003-04-03 至 2015-05-11。": "A WRDS preview of FactSet Revere company supplier, customer and partnership relationships; relationship-version start dates in the local data span 2003-04-03 to 2015-05-11.", "WRDS 提供的 InfraClear 基礎建設合約、當事人角色、專案與條款抽取預覽；本機合約簽署日期涵蓋 1965-02-02 至 2025-03-24。": "A WRDS preview of InfraClear infrastructure contracts, party roles, projects and extracted clauses; contract signing dates in the local data span 1965-02-02 to 2025-03-24.", "WRDS 提供的 RoyaltyStat 授權合約、權利金與交易條件預覽；本機合約生效日期涵蓋 1997-05-28 至 2016-07-01。": "A WRDS preview of RoyaltyStat licensing agreements, royalties and transaction terms; agreement effective dates in the local data span 1997-05-28 to 2016-07-01.", "供應商—客戶關係與銷售額": "Supplier–customer relationships and sales", "供應商 × 客戶／Segment 識別 × 來源日期的記錄；組合鍵唯一性須用研究樣本核查": "A supplier × customer / Segment identifier × source-date record; composite-key uniqueness must be checked in the research sample", "WRDS 將 Compustat Segment 客戶名稱對應公司識別，提供供應商、客戶與對該客戶的銷售額。需依來源日期確認會計期間，不是逐筆交易、合約內容或完整客戶名單。": "WRDS maps Compustat Segment customer names to company identifiers, providing suppliers, customers and sales to those customers. Confirm accounting periods using source dates; these are not individual transactions, contract contents or a complete customer list.", "日期命名輔助表（版本用途待核對）": "Date-named auxiliary table (version purpose pending verification)", "現行 schema 中可讀的 seed_20180418 表；名稱含日期，但與 seglink 的版本／建置關係未核實。僅作參照，不與主表合併加總。": "The seed_20180418 table is readable in the current schema. Its name includes a date, but its version / build relationship with seglink has not been verified. Use it as a reference only; do not combine and aggregate it with the main table.", "已核查：同 WRDS 產品；版本待核對": "Verified: same WRDS product; version check pending", "全文明列 WRDS Supply Chain with IDs（Compustat Segment）；未核對文章擷取版本與現行 seglink 完全相同。": "The full text explicitly lists WRDS Supply Chain with IDs (Compustat Segment); the paper's extract version has not been verified as identical to the current seglink.", "買方與供應商的政治風險感知差異，如何對應買方的營運韌性？": "How do differences in perceived political risk between buyers and suppliers relate to buyers' operational resilience?", "以雙方 GVKEY 建立供應商 × 買方 × 年度，再接 Compustat 財務與 Economic Policy Uncertainty 的公司政治風險資料。外接資料建構風險差異與營運韌性；供應鏈表提供配對及網絡。": "Uses both parties' GVKEYs to construct supplier × buyer × year records, then links Compustat financials and firm-level political risk data from Economic Policy Uncertainty. External data construct risk differences and operational resilience; the supply chain table supplies the pairs and network.", "可比較配對與串接流程；尚未擷取文章所需財務、政治風險及完整研究樣本，不能僅用本機欄位實例重現。": "Supports comparison of pairing and linkage procedures. The financial data, political risk data and full research sample required by the paper have not been extracted; local field examples alone cannot replicate it.", "已核查：相關 Compustat／10-K 測量": "Verified: related Compustat / 10-K measures", "附錄確認使用 COMPUSTAT 與 10-K 客戶營收資訊；未確認使用 WRDS seglink 或相同串接程序。": "The appendix confirms the use of COMPUSTAT and 10-K customer revenue information; use of WRDS seglink or the same linkage procedure is unconfirmed.", "客戶集中度與 IPO 估值、上市後獲利之間有何關係？": "How is customer concentration related to IPO valuation and post-IPO profitability?", "以公司為單位，將 COMPUSTAT／10-K 的客戶營收占比建構集中度，搭配 SDC 的 IPO 市值與 Compustat 的 ROA。呈現客戶組合測量如何連到資本市場與公司年度結果。": "At the company level, constructs concentration from customer revenue shares in COMPUSTAT / 10-Ks and combines it with IPO market value from SDC and ROA from Compustat. Shows how customer portfolio measures connect to capital-market and company-year outcomes.", "先比較客戶集中度與外接 DV 的測量；本機連結表不包含 IPO 市值、ROA 或完整 10-K 揭露，尚不能重現研究。": "First compare the measurement of customer concentration and externally linked DVs. The local linking table contains neither IPO market values, ROA nor complete 10-K disclosures, so it cannot yet replicate the research.", "已核查：同基礎來源；自建配對": "Verified: same underlying source; author-built pairs", "使用 Compustat segment 客戶資料；作者以字串候選與人工核對連到 CRSP PERMNO，不能視為使用現行 WRDS seglink。": "Uses Compustat segment customer data. The authors link to CRSP PERMNO using string-based candidate matches and manual checks; this cannot be treated as use of the current WRDS seglink.", "主要客戶的報酬資訊能否預測供應商後續股票報酬？": "Can major customers' return information predict suppliers' subsequent stock returns?", "將公司年度客戶關係接到 CRSP 股票月報酬及 Compustat 財務；以落後客戶報酬形成供應商投資組合。財報年度與報酬間留六個月，避免使用尚未公開的關係資訊。": "Links company-year customer relationships to CRSP monthly stock returns and Compustat financials; forms supplier portfolios using lagged customer returns. Leaves six months between the financial reporting year and returns to avoid using relationship information not yet publicly available.", "可比較識別碼配對與資訊時間；仍需 CRSP 報酬、財務及歷史樣本。此例是金融結果，不自動等同直接行銷成效。": "Supports comparison of identifier matching and information timing; CRSP returns, financials and the historical sample are still needed. This example concerns financial outcomes, which are not automatically direct marketing performance measures.", "由 WRDS 串接 Compustat Segment 的客戶揭露與公司識別資料，已核對主表涵蓋 1976-06-30 至 2026-07-31 的供應商—客戶關係與客戶銷售資訊。": "WRDS links Compustat Segment customer disclosures with company identifiers; the verified main table covers supplier-customer relationships and sales-to-customer information from 1976-06-30 to 2026-07-31.", "識別碼本身不是銷售或關係績效。": "Identifiers themselves are neither sales nor relationship performance.", "串接鍵本身不測量契約、治理或其他實質 B2B 解釋構念。": "The linkage key itself does not measure contracts, governance or other substantive B2B explanatory constructs.", "用於辨識供應商—客戶雙方與外部串接；先檢查匹配率、重複、方向、期間及一對多，不把識別碼大小當測量。 GVKEY 可連 Compustat 財務資料；連 SEC 需另有有效的 CIK 對照，本表沒有 CIK。": "Used to identify suppliers and customers and link external sources; first check match rates, duplicates, direction, periods and one-to-many relationships. Do not treat the magnitude of an identifier as a measure. GVKEY can link to Compustat financial data; linking to SEC requires a separate valid CIK crosswalk, and this table has no CIK.", "公司名稱不測量行銷結果。": "Company names do not measure marketing outcomes.", "名稱不測量品牌認知、契約條款或治理。": "Names do not measure brand perceptions, contract terms or governance.", "優先核對穩定識別碼；名稱用於匹配覆核與分組，留意更名、縮寫及 cconm 的目前名稱口徑。": "Prioritize verification of stable identifiers; use names for match review and grouping. Watch for name changes, abbreviations and the current-name convention used by cconm.", "來源日期本身不測量行銷結果；連續出現與否也不直接等同關係存續或終止。": "The source date itself does not measure marketing outcomes; consecutive presence or absence also does not directly establish relationship continuation or termination.", "不能直接當合約事件或外生處置時點。": "Cannot directly serve as a contract event or the timing of an exogenous treatment.", "須與原始 Segment 資料及財報會計期間對齊；公司年度的觀察缺口可能來自揭露、匹配或樣本範圍。": "Align with the original Segment data and financial-statement fiscal periods; gaps in company-year observations may arise from disclosure, matching or sample scope.", "用於辨識供應商—客戶雙方與外部串接；先檢查匹配率、重複、方向、期間及一對多，不把識別碼大小當測量。": "Used to identify suppliers and customers and link external sources; first check match rates, duplicates, direction, periods and one-to-many relationships. Do not treat the magnitude of an identifier as a measure.", "客戶類型是關係背景，不能直接當成行銷成效。": "Customer type describes relationship background and cannot directly serve as marketing performance.", "編碼後可代表客戶類型差異；須驗證與 B2B 機制的連結，不能視為治理品質。": "After coding, can represent differences in customer type; validate its connection to the B2B mechanism. Do not treat it as governance quality.", "先核對類別定義、未知值及來源覆蓋；分類碼不能當成連續數值，控制仍依研究設計選取。": "First check category definitions, unknown values and source coverage; classification codes must not be treated as continuous values. Select controls according to the research design.", "可衡量供應商對特定客戶的銷售表現，具實質 B2B 結果意義。": "Can measure a supplier's sales performance with a specific customer and has substantive meaning as a B2B outcome.", "可建構既有交易規模／客戶依賴程度；比例須另接同口徑供應商總銷售額。": "Can construct existing transaction scale or customer dependence; ratios require separately linked supplier total sales measured on the same basis.", "先核對幣別、單位與會計期間；本表未附完整口徑。揭露客戶不等於所有客戶，缺失不補零；作 IV／控制須確認時序與內生性，銷售額不直接測量契約條款或治理。": "First check currency, units and fiscal periods; this table does not provide complete measurement conventions. Disclosed customers are not all customers, and missing values must not be replaced with zero. Verify timing and endogeneity for use as an IV or control; sales do not directly measure contract terms or governance.", "跳到主要內容": "Skip to main content", "展開主要導覽": "Open main navigation", "移到左邊界或點按以展開導覽": "Move to the left edge or click to open navigation", "主要導覽": "Main navigation", "收合主要導覽": "Close main navigation   'use strict';

  const selector = document.getElementById('language-select');

  const attributeSources = new WeakMap();

  try { stored = localStorage.getItem(STORAGE_KEY); } catch (_) {}
  let language = normalize(new URL(location.href).searchParams.get('lang') || stored || 'en');

  function translate(value, depth = 0) {
    const source = String(value ?? '');
    if (language !== 'en' || !source || depth > 6) return source;
    if (Object.prototype.hasOwnProperty.call(strings, source)) return strings[source];
    const trimmed = source.trim();
    if (trimmed !== source) return source.slice(0, source.indexOf(trimmed)) + translate(trimmed, depth + 1) + source.slice(source.indexOf(trimmed) + trimmed.length);
    for (const { regex, replacement } of patterns) {
      const match = regex.exec(source);

    controls.select.disabled = !items.length;
    controls.toggle.disabled = !items.length;
    controls.toggle.setAttribute('aria-pressed', String(editing));
    controls.toggle.setAttribute('aria-expanded', String(editing));
    setText(controls.toggle, editing ? '完成調整' : '調整欄寬');
    controls.reset.disabled = !savedWidths.size;
    if (controls.panel.hidden === editing) controls.panel.hidden = !editing;
    const record = selectedRecord();
    const labels = record?.headers.map(sourceText) || [];
    const rowsSignature = labels.join('\n');
    if (controls.table !== record?.table || controls.rowsSignature !== rowsSignature) {
      controls.rows = labels.map((label, index) => {
        const row = element('label', 'column-width-slider-row');
        const caption = element('span', 'column-width-caption', label);
        const value = element('output', 'column-width-value');
        const input = element('input', 'column-width-range');
        input.type = 'range'; input.min = String(MIN_WIDTH); input.max = String(MAX_WIDTH); input.step = '1';
        input.id = `column-width-range-${index}`;
        input.dataset.columnIndex = String(index);
        input.setAttribute('aria-label', `「${label}」欄寬`);
        value.htmlFor = input.id;
        row.append(caption, value, input);
        return { row, input, value };
      });
      controls.sliders.replaceChildren(...controls.rows.map(row => row.row));
      controls.table = record?.table;
      controls.rowsSignature = rowsSignature;
    }
    const usable = record && isVisible(record.table);
    setText(controls.hint, !record ? '目前沒有符合的資料表。' : usable ? '拖曳下方滑桿或表格邊界，分別調整每一欄。' : '請先展開這張資料表，再調整欄寬。');
    const widths = record ? widthsOf(record) : [];
    controls.rows.forEach(({ input, value }, index) => {
      const width = Math.round(widths[index]);
      input.disabled = !usable;
      if (input.value !== String(width)) input.value = String(width);
      input.setAttribute('aria-valuetext', `${width} 像素`);
      setText(value, usable || record.widths ? `${width} px` : '—');
    });
  }
  function widthsOf(record) {
    return record.widths ? [...record.widths] : record.headers.map(header => clamp(header.getBoundingClientRect().width));
  }
  function notifyLayout() {
    window.dispatchEvent(new CustomEvent('research-layout-change'));
    schedule();
  }
  function setWidths(record, widths, save = true) {
    record.widths = widths.map(width => Math.round(clamp(width) * 100) / 100);
    if (!record.colgroup) {
      record.colgroup = document.createElement('colgroup');
      record.colgroup.className = 'column-resize-widths';
      record.headers.forEach(() => record.colgroup.append(document.createElement('col')));
      record.table.prepend(record.colgroup);
      record.table.classList.add('column-widths-custom');
    }
    [...record.colgroup.children].forEach((col, index) => writeStyle(col, 'width', `${record.widths[index]}px`));
    writeStyle(record.table, 'width', `${record.widths.reduce((sum, width) => sum + width, 0)}px`);
    writeStyle(record.table, 'minWidth', '0px');
    record.handles.forEach((handle, index) => handle.setAttribute('aria-valuenow', String(Math.round(record.widths[index]))));
    if (save) savedWidths.set(record.key, [...record.widths]);
    notifyLayout();
  }
  function restoreLayout(record) {
    record.widths = null;
    record.colgroup?.remove();
    record.colgroup = null;
    record.table.classList.remove('column-widths-custom');
    writeStyle(record.table, 'width', record.originalWidth);
    writeStyle(record.table, 'minWidth', record.originalMinWidth);
  }
  function reset(key) {
    if (dragging && (!key || dragging.record.key === key)) finishDrag();
    records.forEach(record => {
      if (!key || record.key === key) restoreLayout(record);
    });
    if (key) savedWidths.delete(key); else savedWidths.clear();
    persist();
    notifyLayout();
  }
  function finishDrag(cancel = false) {
    if (!dragging) return;
    const current = dragging;
    dragging = null;
    current.handle.classList.remove('is-dragging');
    document.body.classList.remove('is-resizing-column');
    if (current.handle.hasPointerCapture(current.pointerId)) current.handle.releasePointerCapture(current.pointerId);
    if (cancel === true) {
      if (current.previousWidths) setWidths(current.record, current.previousWidths);
      else {
        restoreLayout(current.record);
        savedWidths.delete(current.record.key);
        notifyLayout();
      }
    }
    persist();
    schedule();
  }
  function onPointerDown(event) {
    if (event.button !== 0 || !event.isPrimary || dragging) return;
    const handle = event.currentTarget;
    const record = records.get(handle._resizeTable);
    if (!record || handle.hidden) return;
    event.preventDefault();
    handle.focus({ preventScroll: true });
    dragging = {
      record, handle, pointerId: event.pointerId, startX: event.clientX,
      index: Number(handle.dataset.columnIndex), widths: widthsOf(record),
      previousWidths: record.widths ? [...record.widths] : null
    };
    handle.classList.add('is-dragging');
    document.body.classList.add('is-resizing-column');
    handle.setPointerCapture(event.pointerId);
  }
  function onPointerMove(event) {
    if (!dragging || event.pointerId !== dragging.pointerId) return;
    const widths = [...dragging.widths];
    widths[dragging.index] = clamp(widths[dragging.index] + event.clientX - dragging.startX);
    setWidths(dragging.record, widths);
  }
  function onPointerUp(event) {
    if (dragging?.pointerId === event.pointerId) finishDrag();
  }
  function onPointerCancel(event) {
    if (dragging?.pointerId === event.pointerId) finishDrag(true);
  }
  function onKeyDown(event) {
    if (event.key === 'Escape' && dragging) { event.preventDefault(); finishDrag(true); return; }
    const handle = event.currentTarget;
    const record = records.get(handle._resizeTable);
    if (!record) return;
    const widths = widthsOf(record);
    const index = Number(handle.dataset.columnIndex);
    const step = event.shiftKey ? 48 : 16;
    if (event.key === 'ArrowLeft') widths[index] -= step;
    else if (event.key === 'ArrowRight') widths[index] += step;
    else if (event.key === 'Home') widths[index] = MIN_WIDTH;
    else if (event.key === 'End') widths[index] = MAX_WIDTH;
    else return;
    event.preventDefault();
    setWidths(record, widths);
    persist();
  }
  function onDoubleClick(event) { reset(event.currentTarget.dataset.tableId); }
  function removeRecord(record) {
    if (dragging?.record === record) finishDrag();
    record.wrapper.removeEventListener('scroll', schedule);
    record.handles.forEach(handle => {
      handle.removeEventListener('pointerdown', onPointerDown);
      handle.removeEventListener('pointermove', onPointerMove);
      handle.removeEventListener('pointerup', onPointerUp);
      handle.removeEventListener('pointercancel', onPointerCancel);
      handle.removeEventListener('lostpointercapture', onPointerUp);
      handle.removeEventListener('keydown', onKeyDown);
      handle.removeEventListener('dblclick', onDoubleClick);
      handle.remove();
    });
  }
  function reconcile() {
    const tables = new Set(content.querySelectorAll('.table-scroll > .column-table'));
    records.forEach((record, table) => {
      if (!tables.has(table)) { removeRecord(record); records.delete(table); }
    });
    tables.forEach(table => {
      if (records.has(table)) return;
      const headers = [...(table.tHead?.rows[0]?.cells || [])];
      if (!headers.length) return;
      const wrapper = table.closest('.table-scroll');
      const key = table.closest('[data-table-id]')?.dataset.tableId || `table-${records.size}`;
      if (!table.id) {
        do { table.id = `research-resizable-table-${++sequence}`; } while (document.querySelectorAll(`#${table.id}`).length > 1);
      }
      const record = { table, wrapper, key, headers, handles: [], widths: null, colgroup: null, originalWidth: table.style.width, originalMinWidth: table.style.minWidth };
      records.set(table, record);
      headers.forEach((header, index) => {
        const handle = document.createElement('div');
        handle.className = 'column-resize-handle';
        handle.hidden = true;
        handle.tabIndex = 0;
        handle.dataset.tableId = key;
        handle.dataset.columnIndex = String(index);
        handle._resizeTable = table;
        handle.setAttribute('role', 'separator');
        handle.setAttribute('aria-orientation', 'vertical');
        handle.setAttribute('aria-controls', table.id);
        handle.setAttribute('aria-label', `調整「${sourceText(header)}」欄寬`);
        handle.setAttribute('aria-valuemin', String(MIN_WIDTH));
        handle.setAttribute('aria-valuemax', String(MAX_WIDTH));
        handle.title = '拖曳調整欄寬；左右鍵微調，Home／End 最小／最大；連按兩下還原表格';
        handle.addEventListener('pointerdown', onPointerDown);
        handle.addEventListener('pointermove', onPointerMove);
        handle.addEventListener('pointerup', onPointerUp);
        handle.addEventListener('pointercancel', onPointerCancel);
        handle.addEventListener('lostpointercapture', onPointerUp);
        handle.addEventListener('keydown', onKeyDown);
        handle.addEventListener('dblclick', onDoubleClick);
        layer.append(handle);
        record.handles.push(handle);
      });
      wrapper.addEventListener('scroll', schedule, { passive: true });
      const saved = savedWidths.get(key);
      if (saved?.length === headers.length) setWidths(record, saved, false);
    });
    if (resizeObserver) {
      const targets = new Set([content, document.body]);
      const topbar = document.querySelector('.topbar');
      if (topbar) targets.add(topbar);
      records.forEach(record => { targets.add(record.table); targets.add(record.wrapper); });
      observed.forEach(element => {
        if (!targets.has(element)) { resizeObserver.unobserve(element); observed.delete(element); }
      });
      targets.forEach(element => {
        if (!observed.has(element)) { resizeObserver.observe(element); observed.add(element); }
      });
    }
    mountControls();
    needsReconcile = false;
  }
  function isVisible(table) {
    if (!table.isConnected || !table.getClientRects().length || table.closest('[hidden]')) return false;
    for (let parent = table.parentElement; parent; parent = parent.parentElement) {
      if (parent.tagName === 'DETAILS' && !parent.open) return false;
    }
    return getComputedStyle(table).visibility !== 'hidden';
  }
  function update() {
    frame = 0;
    if (destroyed) return;
    if (needsReconcile) reconcile();
    syncControls();
    const viewLeft = viewport?.offsetLeft || 0;
    const viewTop = viewport?.offsetTop || 0;
    const viewRight = Math.min(viewLeft + (viewport?.width || window.innerWidth), document.documentElement.clientWidth);
    let viewBottom = viewTop + (viewport?.height || window.innerHeight);
    const topbar = document.querySelector('.topbar')?.getBoundingClientRect();
    const visibleTop = topbar && topbar.top <= viewTop + 1 && topbar.bottom > viewTop ? topbar.bottom : viewTop;
    const dock = document.querySelector('.table-scroll-dock:not([hidden])');
    if (dock) viewBottom = Math.min(viewBottom, dock.getBoundingClientRect().top);
    records.forEach(record => {
      if (!isVisible(record.table)) {
        if (dragging?.record === record) finishDrag();
        record.handles.forEach(handle => { handle.hidden = true; });
        return;
      }
      const rect = record.table.getBoundingClientRect();
      const wrapRect = record.wrapper.getBoundingClientRect();
      const left = Math.max(viewLeft, wrapRect.left + record.wrapper.clientLeft);
      const right = Math.min(viewRight, wrapRect.left + record.wrapper.clientLeft + record.wrapper.clientWidth);
      const top = Math.max(visibleTop, rect.top, wrapRect.top);
      const bottom = Math.min(viewBottom, rect.bottom, wrapRect.top + record.wrapper.clientHeight);
      record.headers.forEach((header, index) => {
        const handle = record.handles[index];
        const headerRect = header.getBoundingClientRect();
        const active = dragging?.handle === handle;
        const inView = headerRect.right >= left + 4 && headerRect.right <= right + 1;
        handle.hidden = bottom - top < 12 || right - left < 20 || (!inView && !active);
        if (handle.hidden) return;
        const x = active ? Math.max(left + 5, Math.min(right - 5, headerRect.right)) : Math.min(right - 5, headerRect.right);
        writeStyle(handle, 'left', `${x - 5}px`);
        writeStyle(handle, 'top', `${top}px`);
        writeStyle(handle, 'height', `${bottom - top}px`);
        handle.setAttribute('aria-valuenow', String(Math.round(headerRect.width)));
      });
    });
  }
  function schedule() {
    if (!destroyed && !frame) frame = requestAnimationFrame(update);
  }
  const mutationObserver = new MutationObserver(changes => {
    if (changes.some(change => change.type === 'childList')) needsReconcile = true;
    schedule();
  });
  mutationObserver.observe(content, { childList: true, subtree: true, attributes: true, attributeFilter: ['open', 'hidden', 'class', 'style'] });
  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', schedule, { passive: true });
  window.addEventListener('hashchange', schedule);
  window.addEventListener('research-layout-change', schedule);
  window.addEventListener('blur', finishDrag);
  document.addEventListener('toggle', schedule, true);
  viewport?.addEventListener('resize', schedule, { passive: true });
  viewport?.addEventListener('scroll', schedule, { passive: true });

  window.ResearchColumnResize = {
    minWidth: MIN_WIDTH, maxWidth: MAX_WIDTH,
    refresh() { needsReconcile = true; schedule(); },
    setEditing,
    get editing() { return editing; },
    reset,
    destroy() {
      finishDrag();
      destroyed = true;
      if (frame) cancelAnimationFrame(frame);
      mutationObserver.disconnect();
      resizeObserver?.disconnect();
      removeControls();
      records.forEach(record => { removeRecord(record); restoreLayout(record); });
      records.clear(); observed.clear();
      window.removeEventListener('scroll', schedule);
      window.removeEventListener('resize', schedule);
      window.removeEventListener('hashchange', schedule);
      window.removeEventListener('research-layout-change', schedule);
      window.removeEventListener('blur', finishDrag);
      document.removeEventListener('toggle', schedule, true);
      viewport?.removeEventListener('resize', schedule);
      viewport?.removeEventListener('scroll', schedule);
      layer.remove();
      document.body.classList.remove('is-resizing-column');
    }
  };
  schedule();
})();
</script>
</body>
</html>
